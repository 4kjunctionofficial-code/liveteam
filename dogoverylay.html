<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Racing Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
/* Positioned to the LEFT side for OBS stream */
body { background: transparent; margin: 0; padding: 20px; display: flex; justify-content: flex-start; align-items: flex-start; height: 100vh; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }

/* Grid layout matching reference layout */
.overlay-grid { display: grid; grid-template-columns: auto auto; gap: 8px; align-items: center; font-weight: 900; }

.left-stack { display: flex; flex-direction: column; gap: 6px; width: 145px; }
.right-stack { display: flex; flex-direction: column; gap: 6px; width: 440px; }

/* Shift & Race boxes with ultra bold text */
.badge-box { background: linear-gradient(to bottom, #0044aa, #002266); border: 2px solid #ffffff; border-radius: 12px; color: white; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 21px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,0.8); box-shadow: 0 3px 6px rgba(0,0,0,0.5); height: 50px; box-sizing: border-box; }
.badge-box.race-main-title { background: linear-gradient(to bottom, #0044aa, #002266); justify-content: center; font-size: 26px; font-weight: 900; letter-spacing: 1px; padding: 10px; border-radius: 12px; height: 50px; box-sizing: border-box; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }

.value-box { background: #ffffff; color: #000000; padding: 2px 8px; border-radius: 6px; font-size: 23px; font-weight: 900; min-width: 32px; text-align: center; text-shadow: none; }

.dogs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* Dog Name Boxes with ultra bold text and text-shadow */
.dog-name-box { border: 2px solid #ffffff; border-radius: 12px; color: white; text-align: center; padding: 10px 8px; font-size: 27px; font-weight: 900; text-transform: uppercase; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); box-shadow: 0 3px 6px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
.dog-name-box.red { background: linear-gradient(to bottom, #cc0000, #990000); }
.dog-name-box.blue { background: linear-gradient(to bottom, #0044cc, #002288); }
.dog-name-box.white { background: linear-gradient(to bottom, #ffffff, #eaeaea); color: #000000; text-shadow: none; }

/* Winner tag */
.winner-tag { background: linear-gradient(to bottom, #ffcc00, #cc9900); color: black; border: 2px solid #ffffff; border-radius: 8px; text-align: center; padding: 6px; font-size: 23px; font-weight: 900; text-transform: uppercase; text-shadow: none; box-shadow: 0 3px 6px rgba(0,0,0,0.4); animation: pulse-glow 1s infinite alternate; margin-top: 4px; }

@keyframes pulse-glow { 0% { box-shadow: 0 0 4px #ffcc00; } 100% { box-shadow: 0 0 12px #ffcc00; } }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="overlay-grid" id="mainOverlayContainer">
    <!-- Left Column Stack: Shift & Race Boxes -->
    <div class="left-stack">
        <div class="badge-box">
            <span>Shift</span>
            <span class="value-box" id="dispRound">1</span>
        </div>
        <div class="badge-box" style="background: linear-gradient(to bottom, #003388, #001144);">
            <span>Race</span>
            <span class="value-box" id="dispRace">27</span>
        </div>
    </div>
    
    <!-- Right Column Stack: Current Race Banner & Dog Name Boxes -->
    <div class="right-stack">
        <div class="badge-box race-main-title">
            <span>Current Race</span>
        </div>
        <div class="dogs-row" id="dogsRowContainer">
            <!-- Dog A -->
            <div style="display: flex; flex-direction: column;">
                <div class="dog-name-box red" id="dispDogAName">JADUGAR</div>
                <div class="winner-tag hidden" id="winnerTagA">🏆 WINNER</div>
            </div>
            <!-- Dog B -->
            <div style="display: flex; flex-direction: column;">
                <div class="dog-name-box white" id="dispDogBName">WHITE POND</div>
                <div class="winner-tag hidden" id="winnerTagB">🏆 WINNER</div>
            </div>
        </div>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("dogRaceData/match1");

let hideTimeout = null;

db.on("value", (snapshot) => {
    let data = snapshot.val();
    if(data) {
        document.getElementById('dispRound').innerText = data.round || "1";
        document.getElementById('dispRace').innerText = data.race || "27";
        
        let dogAEl = document.getElementById('dispDogAName');
        let dogBEl = document.getElementById('dispDogBName');
        let tagA = document.getElementById('winnerTagA');
        let tagB = document.getElementById('winnerTagB');
        let dogsRow = document.getElementById('dogsRowContainer');

        let currentTime = Date.now();
        let timestamp = data.timestamp || 0;
        
        if(data.showWinner && (currentTime - timestamp < 15000)) {
            if(data.dogAName) dogAEl.innerText = data.dogAName;
            dogAEl.className = `dog-name-box ${data.dogAColor || 'red'}`;
            dogAEl.classList.remove('hidden');

            if(data.dogBName) dogBEl.innerText = data.dogBName;
            dogBEl.className = `dog-name-box ${data.dogBColor || 'white'}`;
            dogBEl.classList.remove('hidden');

            dogsRow.classList.remove('hidden');

            if(data.winnerSide === 'A') {
                tagA.classList.remove('hidden');
                tagB.classList.add('hidden');
            } else if(data.winnerSide === 'B') {
                tagB.classList.remove('hidden');
                tagA.classList.add('hidden');
            }

            if(hideTimeout) clearTimeout(hideTimeout);
            let remainingTime = 15000 - (currentTime - timestamp);
            hideTimeout = setTimeout(() => {
                dogsRow.classList.add('hidden');
                tagA.classList.add('hidden');
                tagB.classList.add('hidden');
                db.update({ showWinner: false, resultText: "", timestamp: 0 });
            }, remainingTime);
        } else {
            tagA.classList.add('hidden');
            tagB.classList.add('hidden');
            
            if((!data.dogAName || data.dogAName.trim() === "") && (!data.dogBName || data.dogBName.trim() === "")) {
                dogsRow.classList.add('hidden');
            } else {
                dogsRow.classList.remove('hidden');
                
                if(data.dogAName) {
                    dogAEl.innerText = data.dogAName;
                    dogAEl.classList.remove('hidden');
                }
                dogAEl.className = `dog-name-box ${data.dogAColor || 'red'}`;

                if(data.dogBName) {
                    dogBEl.innerText = data.dogBName;
                    dogBEl.classList.remove('hidden');
                }
                dogBEl.className = `dog-name-box ${data.dogBColor || 'white'}`;
            }
        }
    }
});
</script>
</body>
</html>
