<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Client Master Panel (With Expiry)</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-panel { display: flex; width: 100%; flex-direction: column; align-items: center; }
        .card { background: white; width: 100%; max-width: 500px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); overflow: hidden; margin-bottom: 20px; box-sizing: border-box; position: relative;}
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-size: 16px; font-weight: bold; text-transform: uppercase; }
        .client-section { padding: 15px; background: #e8f0fe; border-bottom: 2px solid #1a73e8; box-sizing: border-box; width: 100%; display: flex; flex-direction: column; gap: 5px; }
        .teams-container { display: flex; padding: 15px; gap: 10px; border-bottom: 2px solid #eee; }
        .team-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .team-input { width: 95%; padding: 8px; border: 2px solid #ddd; border-radius: 6px; font-size: 15px; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .score-val { font-size: 50px; font-weight: 900; color: #333; margin: 5px 0; }
        .btn-pm { border: none; color: white; padding: 12px; border-radius: 6px; font-size: 24px; font-weight: bold; cursor: pointer; flex: 1; margin: 0 4px; }
        .btn-plus { background: #28a745; } .btn-minus { background: #dc3545; }
        .settings-section { padding: 15px; background: #fafafa; box-sizing: border-box; }
        .label { font-size: 12px; font-weight: bold; color: #555; margin-bottom: 5px; display: block; text-transform: uppercase; }
        textarea, .std-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 12px; resize: none; box-sizing: border-box; font-family: inherit; }
        .controls { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .btn-full { border: none; color: white; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 5px; width: 100%; box-sizing: border-box;}
        .btn-blue { background: #1a73e8; } .btn-yellow { background: #fbbc05; color: #000; } .btn-red { background: #ea4335; } .btn-dark { background: #333; }
        button:active { transform: scale(0.98); }
        .url-box { font-size: 11px; color: #555; word-break: break-all; background: #eee; padding: 8px; border-radius: 4px; margin-top: 5px; }
        
        /* EXPIRED OVERLAY FOR PANEL */
        .expired-lock { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; color: white; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; border-radius: 15px; }
        .expired-lock h2 { color: #ff4d4d; margin-bottom: 10px; }
        .expired-lock p { font-size: 16px; margin-bottom: 15px; }
        .expired-lock .hl-num { font-size: 22px; font-weight: bold; color: #ffcc00; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="main-panel">
    <!-- CLIENT ID SELECTOR -->
    <div class="card">
        <div class="header" style="background: #333;">Client Account Manager</div>
        <div class="client-section">
            <span class="label">Enter Client ID</span>
            <input type="text" id="clientIdInp" class="std-input" value="client1" style="margin-bottom:5px; font-weight:bold; text-align:center; text-transform:lowercase;" onchange="switchClient()">
            <div class="url-box"><strong>Overlay URL:</strong> <span id="overlayUrl">Loading...</span></div>
            
            <!-- ADMIN ONLY: SET EXPIRY & HELPLINE -->
            <div style="margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc;">
                <span class="label" style="color: #444;">Admin Controls (Set Expiry)</span>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="expDateInp" class="std-input" style="margin-bottom:0; padding:5px;">
                    <input type="text" id="helplineInp" class="std-input" placeholder="Helpline No." style="margin-bottom:0; padding:5px;">
                    <button class="btn-blue" style="border:none; color:white; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px;" onclick="updateExpiryDetails()">SAVE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LIVE SCORE PANEL -->
    <div class="card" id="scoreCard">
        <div class="expired-lock" id="lockA">
            <h2>PLAN EXPIRED</h2>
            <p>Your access has been suspended. Please renew your package.</p>
            <div class="hl-num" id="lockHlA">Helpline: -</div>
        </div>
        <div class="header">Live Score Board</div>
        <div class="teams-container">
            <div class="team-box">
                <input type="text" id="nameA" class="team-input" placeholder="TEAM 1" oninput="updateDB()">
                <div class="score-val" id="dispA">0</div>
                <div style="display:flex; width:100%;">
                    <button class="btn-pm btn-minus" onclick="changeScore('scoreA', -1)">-</button>
                    <button class="btn-pm btn-plus" onclick="changeScore('scoreA', 1)">+</button>
                </div>
            </div>
            <div style="display:flex; align-items:center; font-weight:bold; color:#aaa;">VS</div>
            <div class="team-box">
                <input type="text" id="nameB" class="team-input" placeholder="TEAM 2" oninput="updateDB()">
                <div class="score-val" id="dispB">0</div>
                <div style="display:flex; width:100%;">
                    <button class="btn-pm btn-minus" onclick="changeScore('scoreB', -1)">-</button>
                    <button class="btn-pm btn-plus" onclick="changeScore('scoreB', 1)">+</button>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">Show/Hide Scoreboard</button>
            <button class="btn-full btn-yellow" onclick="swapTeams()">Swap Teams</button>
            <button class="btn-full btn-red" style="background:#777;" onclick="resetScores()">Reset Scores</button>
            <input type="text" id="roundInp" class="std-input" style="text-align:center; margin-bottom:0;" placeholder="ROUND" oninput="updateDB()">
        </div>
    </div>

    <!-- TICKER & BRANDING -->
    <div class="card" id="tickerCard">
        <div class="expired-lock" id="lockB">
            <h2>PLAN EXPIRED</h2>
            <p>Please contact management to unlock.</p>
            <div class="hl-num" id="lockHlB">Helpline: -</div>
        </div>
        <div class="header">Ticker & Branding</div>
        <div class="settings-section">
            <textarea id="row1Inp" rows="2" placeholder="Title Line 1" oninput="updateDB()"></textarea>
            <textarea id="row2Inp" rows="2" placeholder="Title Line 2" oninput="updateDB()"></textarea>
            <textarea id="row3Inp" rows="2" placeholder="Title Line 3" oninput="updateDB()"></textarea>
            <button id="tickVisBtn" class="btn-full btn-blue" onclick="toggleVis('tickerVisible')">Show/Hide Ticker</button>
            <input type="text" id="watermarkInp" class="std-input" placeholder="Channel Name" oninput="updateDB()">
            <button id="logoBtn" class="btn-full btn-dark" onclick="toggleVis('logoVisible')">Show/Hide Logo</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    
    let db;
    let curClient = "client1";
    let curA = 0, curB = 0, sVis = true, tVis = true, lVis = true;
    let isExpired = false;

    function switchClient() {
        if(db) db.off();
        
        curClient = document.getElementById('clientIdInp').value.trim().toLowerCase() || "client1";
        db = firebase.database().ref("matchData/" + curClient);
        
        let currentUrl = window.location.href.split('?')[0];
        let path = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + "/overlay.html?id=" + curClient;
        document.getElementById('overlayUrl').innerText = path;

        db.on("value", (snap) => {
            const data = snap.val();
            if(data) {
                // Expiry Check Logic
                checkExpiry(data.expiryDate, data.helpline || "98765-XXXXX");

                curA = parseFloat(data.scoreA) || 0; 
                curB = parseFloat(data.scoreB) || 0;
                sVis = data.scoreVisible !== false; 
                tVis = data.tickerVisible !== false; 
                lVis = data.logoVisible !== false;
                
                document.getElementById('dispA').innerText = curA;
                document.getElementById('dispB').innerText = curB;
                document.getElementById('nameA').value = data.nameA || "";
                document.getElementById('nameB').value = data.nameB || "";
                document.getElementById('roundInp').value = data.round || "";
                document.getElementById('row1Inp').value = data.row1Txt || "";
                document.getElementById('row2Inp').value = data.row2Txt || "";
                document.getElementById('row3Inp').value = data.row3Txt || "";
                document.getElementById('watermarkInp').value = data.watermarkTxt || "";
                document.getElementById('expDateInp').value = data.expiryDate || "";
                document.getElementById('helplineInp').value = data.helpline || "";
                
                updateBtnUI('visBtn', sVis, "Scoreboard");
                updateBtnUI('tickVisBtn', tVis, "Ticker");
                updateBtnUI('logoBtn', lVis, "Logo");
            } else {
                resetFormToDefault();
                checkExpiry("", "98765-XXXXX");
            }
        });
    }

    function checkExpiry(expiryDateStr, helpline) {
        if(!expiryDateStr) {
            // ਜੇਕਰ ਕੋਈ ਤਾਰੀਖ਼ ਨਹੀਂ ਹੈ, ਤਾਂ ਸੁਰੱਖਿਆ ਲਈ ਲਾਕ ਕਰੋ
            setLockState(true, helpline);
            return;
        }
        const today = new Date();
        today.setHours(0,0,0,0);
        const expDate = new Date(expiryDateStr);
        expDate.setHours(0,0,0,0);

        if(today > expDate) {
            setLockState(true, helpline);
        } else {
            setLockState(false, helpline);
        }
    }

    function setLockState(expired, helpline) {
        isExpired = expired;
        const displayVal = expired ? "flex" : "none";
        document.getElementById('lockA').style.display = displayVal;
        document.getElementById('lockB').style.display = displayVal;
        document.getElementById('lockHlA').innerText = "Helpline: " + helpline;
        document.getElementById('lockHlB').innerText = "Helpline: " + helpline;
    }

    function updateExpiryDetails() {
        const exp = document.getElementById('expDateInp').value;
        const hl = document.getElementById('helplineInp').value;
        if(!exp) { alert("Please select an expiry date!"); return; }
        db.update({ expiryDate: exp, helpline: hl });
        alert("Client settings updated successfully!");
    }

    function resetFormToDefault() {
        document.getElementById('dispA').innerText = "0";
        document.getElementById('dispB').innerText = "0";
        document.getElementById('nameA').value = "";
        document.getElementById('nameB').value = "";
        document.getElementById('roundInp').value = "";
        document.getElementById('row1Inp').value = "";
        document.getElementById('row2Inp').value = "";
        document.getElementById('row3Inp').value = "";
        document.getElementById('watermarkInp').value = "";
        document.getElementById('expDateInp').value = "";
        document.getElementById('helplineInp').value = "";
        curA = 0; curB = 0; sVis = true; tVis = true; lVis = true;
        updateBtnUI('visBtn', true, "Scoreboard");
        updateBtnUI('tickVisBtn', true, "Ticker");
        updateBtnUI('logoBtn', true, "Logo");
    }

    function updateBtnUI(id, val, text) {
        const btn = document.getElementById(id);
        if(btn) {
            btn.innerText = val ? "Hide " + text : "Show " + text;
            btn.style.background = val ? (id==='logoBtn'?'#333':'#dc3545') : "#28a745";
        }
    }

    function changeScore(team, val) {
        if(isExpired) return;
        let current = (team === 'scoreA' ? curA : curB);
        let newVal;
        if (val > 0) {
            if (curA === 0 && curB === 0) newVal = 1.5;
            else newVal = current + 1;
        } else {
            if (current === 1.5) newVal = 0;
            else newVal = current - 1;
            if (newVal < 0) newVal = 0;
        }
        db.update({ [team]: newVal });
    }

    function updateDB() {
        if(isExpired) return;
        db.update({
            nameA: document.getElementById('nameA').value,
            nameB: document.getElementById('nameB').value,
            round: document.getElementById('roundInp').value,
            row1Txt: document.getElementById('row1Inp').value,
            row2Txt: document.getElementById('row2Inp').value,
            row3Txt: document.getElementById('row3Inp').value,
            watermarkTxt: document.getElementById('watermarkInp').value
        });
    }

    function toggleVis(field) {
        if(isExpired) return;
        let val = (field === 'scoreVisible') ? sVis : (field === 'tickerVisible' ? tVis : lVis);
        db.child(field).set(!val);
    }

    function swapTeams() {
        if(isExpired) return;
        db.update({ nameA: document.getElementById('nameB').value, nameB: document.getElementById('nameA').value, scoreA: curB, scoreB: curA });
    }

    function resetScores() {
        if(isExpired) return;
        if(confirm("Reset Match Scores?")) db.update({ scoreA: 0, scoreB: 0 });
    }

    switchClient();
</script>
</body>
</html>
