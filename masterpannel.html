<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Control Panel - Kabaddi Live</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0d0f; color: white; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: auto; background: #161b22; padding: 25px; border-radius: 15px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #f39c12; text-align: center; text-transform: uppercase; margin-bottom: 25px; font-size: 24px; letter-spacing: 1px; }
        h3 { color: #58a6ff; margin-top: 30px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        
        .add-card { background: #0d1117; padding: 20px; border-radius: 10px; margin-bottom: 30px; border-left: 5px solid #f39c12; }
        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        
        label { display: block; margin-bottom: 6px; color: #8b949e; font-size: 13px; font-weight: bold; }
        input, select { padding: 12px; background: #161b22; border: 1px solid #30363d; color: white; border-radius: 8px; width: 100%; box-sizing: border-box; }
        input:focus, select:focus { border-color: #f39c12; outline: none; }
        
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-add { background: #f39c12; color: black; margin-top: 15px; width: 100%; font-size: 15px; }
        .btn-add:hover { background: #dd850e; }
        
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: #0d1117; text-align: left; }
        th { background: #30363d; color: #f39c12; padding: 15px; font-size: 14px; }
        td { padding: 15px; border-bottom: 1px solid #30363d; font-size: 14px; vertical-align: middle; }
        
        .btn-save { background: #238636; color: white; margin-right: 5px; font-size: 12px; padding: 8px 12px; }
        .btn-save:hover { background: #2ea043; }
        .btn-del { background: #da3633; color: white; font-size: 12px; padding: 8px 12px; }
        .btn-del:hover { background: #f85149; }
        
        .link-group { display: flex; flex-direction: column; gap: 5px; }
        .link-btn { color: #58a6ff; text-decoration: none; font-size: 12px; font-weight: bold; }
        .link-btn:hover { text-decoration: underline; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 5px; }
        .status-active { background: #238636; color: white; }
        .status-expired { background: #da3633; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 ਕਬੱਡੀ ਲਾਈਵ - ਮਾਸਟਰ ਕੰਟਰੋਲ ਪੈਨਲ</h2>
    
    <div class="add-card">
        <div class="grid-inputs">
            <div>
                <label>ਕਲਾਇੰਟ ID (User ID)</label>
                <input type="text" id="cID" placeholder="e.g. mudki">
            </div>
            <div>
                <label>ਪਾਸਵਰਡ (Password)</label>
                <input type="text" id="cPass" placeholder="Password">
            </div>
            <div>
                <label>ਪਲਾਨ ਸਟੇਟਸ (Plan Status)</label>
                <select id="cStatus">
                    <option value="false">🟢 Active (ਚਾਲੂ)</option>
                    <option value="true">🛑 Expired / Locked (ਬੰਦ)</option>
                </select>
            </div>
        </div>
        <button class="btn-add" onclick="createClient()">ਨਵਾਂ ਕਬੱਡੀ ਕਲਾਇੰਟ ਐਡ ਕਰੋ</button>
    </div>

    <h3>ਐਕਟਿਵ ਕਲਾਇੰਟ ਲਿਸਟ</h3>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>ਕਲਾਇੰਟ ID / ਪਾਸਵਰਡ</th>
                    <th>ਪਲਾਨ ਸਟੇਟਸ (Status)</th>
                    <th>ਲਾਈਵ ਪੈਨਲ ਲਿੰਕਸ</th>
                    <th>ਐਕਸ਼ਨ</th>
                </tr>
            </thead>
            <tbody id="clientTable"></tbody>
        </table>
    </div>
</div>

<script>
    // 🔗 ਤੁਹਾਡਾ ਨਵਾਂ ਫਾਇਰਬੇਸ ਲਿੰਕ ਇੱਥੇ ਸੈੱਟ ਕਰ ਦਿੱਤਾ ਹੈ
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. ਨਵਾਂ ਕਲਾਇੰਟ ਬਣਾਉਣਾ (ਸਕੋਰਬੋਰਡ ਅਤੇ ਲੌਕ ਸਿਸਟਮ ਦੋਵਾਂ ਦੇ ਮੁਤਾਬਕ)
    function createClient() {
        const id = document.getElementById('cID').value.trim().toLowerCase();
        const pass = document.getElementById('cPass').value.trim();
        const isExpired = document.getElementById('cStatus').value === "true";

        if(!id || !pass) return alert("ਕਿਰਪਾ ਕਰਕੇ ID ਅਤੇ ਪਾਸਵਰਡ ਭਰੋ!");

        db.ref('users/' + id).set({
            password: pass,
            planStatus: isExpired, // overlay.html ਇਸੇ ਵੈਲਯੂ ਨੂੰ ਰੀਡ ਕਰਕੇ ਸਕ੍ਰੀਨ ਲੌਕ ਕਰੇਗੀ
            matchData: {
                nameA: "TEAM 1",
                nameB: "TEAM 2",
                scoreA: 0,
                scoreB: 0,
                round: "LIVE MATCH",
                row1Txt: "WELCOME TO LIVE KABADDI",
                row2Txt: "SUBSCRIBE OUR CHANNEL",
                row3Txt: "LIKE & SHARE",
                watermarkTxt: "M LIVE",
                scoreVisible: true,
                tickerVisible: true,
                logoVisible: true
            }
        }).then(() => {
            alert("ਕਬੱਡੀ ਕਲਾਇੰਟ ਸਫ਼ਲਤਾਪੂਰਵਕ ਬਣ ਗਿਆ ਹੈ!");
            document.getElementById('cID').value = "";
            document.getElementById('cPass').value = "";
            document.getElementById('cStatus').value = "false";
        }).catch((error) => {
            alert("ਐਰਰ: " + error.message);
        });
    }

    // 2. ਲਿਸਟ ਲੋਡ ਕਰਨਾ ਅਤੇ ਰੀਅਲ-ਟਾਈਮ ਅਪਡੇਟ ਦਿਖਾਉਣਾ
    function loadList() {
        db.ref('users').on('value', (snapshot) => {
            const data = snapshot.val();
            const tbody = document.getElementById('clientTable');
            tbody.innerHTML = "";

            if (!data) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#8b949e;">ਕੋਈ ਐਕਟਿਵ ਕਲਾਇੰਟ ਨਹੀਂ ਮਿਲਿਆ।</td></tr>`;
                return;
            }

            let currentUrl = window.location.href;
            let baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/')) + '/';

            for (let id in data) {
                const adminL = baseUrl + "admin.html?id=" + id;
                const overL = baseUrl + "overlay.html?id=" + id;
                const currentStatus = data[id].planStatus === true;

                tbody.innerHTML += `
                    <tr>
                        <td>
                            <b style="color: #58a6ff; font-size: 16px;">${id}</b>
                            <div style="font-size:12px; color:#8b949e; margin-top:4px;">Chabi: <b>${data[id].password || 'No Pass'}</b></div>
                        </td>
                        <td>
                            <select id="updateStat-${id}" style="padding:6px; font-size:12px; width:auto; border-color:#30363d;">
                                <option value="false" ${!currentStatus ? 'selected' : ''}>🟢 Active</option>
                                <option value="true" ${currentStatus ? 'selected' : ''}>🛑 Expired</option>
                            </select>
                            <br>
                            <span class="status-badge ${currentStatus ? 'status-expired' : 'status-active'}">
                                ${currentStatus ? 'LOCKED' : 'RUNNING'}
                            </span>
                        </td>
                        <td>
                            <div class="link-group">
                                <a class="link-btn" href="${adminL}" target="_blank">💻 ADMIN PANEL</a>
                                <a class="link-btn" href="${overL}" target="_blank">📺 OVERLAY LINK</a>
                            </div>
                        </td>
                        <td>
                            <button class="btn-save" onclick="updateClient('${id}')">SAVE</button>
                            <button class="btn-del" onclick="deleteClient('${id}')">DEL</button>
                        </td>
                    </tr>
                `;
            }
        });
    }

    // 3. ਪਲਾਨ ਸਟੇਟਸ (ਚਾਲੂ/ਬੰਦ) ਅਪਡੇਟ ਕਰਨਾ
    function updateClient(id) {
        const selectEl = document.getElementById('updateStat-' + id);
        const nextStatus = selectEl.value === "true";
        
        db.ref('users/' + id).update({ planStatus: nextStatus })
          .then(() => alert("ਕਲਾਇੰਟ " + id + " ਦਾ ਪਲਾਨ ਸਟੇਟਸ ਸਫ਼ਲਤਾਪੂਰਵਕ ਅਪਡੇਟ ਹੋ ਗਿਆ ਹੈ!"));
    }

    // 4. ਕਲਾਇੰਟ ਡਲੀਟ ਕਰਨਾ
    function deleteClient(id) {
        if(confirm("ਕੀ ਤੁਸੀਂ ਕਲਾਇੰਟ '" + id + "' ਨੂੰ ਡਲੀਟ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ? ਇਸ ਨਾਲ ਕਲਾਇੰਟ ਦਾ ਪੂਰਾ ਕਬੱਡੀ ਡਾਟਾ ਖਤਮ ਹੋ ਜਾਵੇਗਾ।")) {
            db.ref('users/' + id).remove()
              .then(() => alert("ਕਲਾਇੰਟ ਸਫ਼ਲਤਾਪੂਰਵਕ ਡਲੀਟ ਕਰ ਦਿੱਤਾ ਗਿਆ।"));
        }
    }

    loadList();
</script>
</body>
</html>
