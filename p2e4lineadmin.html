<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:8px;
}

#main-panel{
    width:100%;
    max-width:760px;
    margin:auto;
}

.card{
    background:white;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    overflow:hidden;
    margin-bottom:15px;
}

.header{
    background:#1a73e8;
    color:white;
    padding:10px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
}

.teams-container{
    display:flex;
    gap:10px;
    padding:12px;
    align-items:center;
}

.team-box{
    flex:1;
}

.vs-text{
    font-size:24px;
    font-weight:bold;
    color:#999;
}

select,
input,
textarea{
    width:100%;
    padding:10px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    box-sizing:border-box;
    margin-bottom:8px;
}

textarea {
    resize: none;
    overflow: hidden;
    min-height: 42px;
}

.team-top{
    display:flex;
    gap:6px;
    align-items: stretch;
}

.team-inputs-wrap {
    display:flex;
    flex-direction:column;
    gap:5px;
    flex:1;
}

.team-input-row {
    display:flex;
    gap:5px;
}

.team-input{
    flex:1;
    margin-bottom: 0 !important;
}

.trans-btn {
    background:#fbbc05;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    padding:0 10px;
    font-size:15px;
    color:black;
}

.set-btn{
    width:60px;
    border:none;
    background:#1a73e8;
    color:white;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.score-val{
    text-align:center;
    font-size:52px;
    font-weight:900;
    margin:6px 0;
}

.pm-wrap{
    display:flex;
    gap:6px;
}

.btn-pm{
    flex:1;
    border:none;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.btn-plus{
    background:#28a745;
}

.btn-minus{
    background:#dc3545;
}

.controls{
    padding:12px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
}

.btn-full{
    border:none;
    color:white;
    height:70px;
    min-height:70px;
    padding:10px;
    border-radius:12px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    line-height:1.2;
    overflow:hidden;
    word-break:break-word;
}

/* MATCH LIST STYLES */
.match-item {
    background: #fff;
    border: 2px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.match-title {
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    color: #333;
}
.match-actions {
    display: flex;
    gap: 5px;
    justify-content: center;
}
.btn-sm {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
.btn-start { background: #1a73e8; }
.btn-walkover { background: #fd7e14; }
.btn-delete { background: #dc3545; max-width: 40px; }

/* MOBILE */
@media(max-width:768px){
.controls{
    grid-template-columns:repeat(2,1fr);
}
.btn-full{
    font-size:16px;
    height:68px;
}
.teams-container {
    flex-direction: column;
}
.vs-text {
    padding: 10px 0;
}
}

/* VERY SMALL MOBILE */
@media(max-width:480px){
.controls{
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}
.btn-full{
    font-size:15px;
    height:64px;
    padding:8px;
}
.match-actions {
    flex-wrap: wrap;
}
.btn-sm { font-size: 12px; }
}

.btn-green{background:#28a745;}
.btn-red{background:#ea4335;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-dark{background:#333;}
.btn-blue{background:#1a73e8;}

.settings-section{
    padding:12px;
}

.result-box{
    background:#111;
    color:white;
    border-radius:10px;
    padding:18px;
    text-align:center;
}

.result-title{
    font-size:28px;
    font-weight:900;
    color:#fbbc05;
}

.result-text{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div id="main-panel">

<!-- TRANSLATION SETTINGS -->
<div class="card">
    <div class="header" style="background:#fbbc05; color:black;">LANGUAGE TRANSLATION SETTINGS</div>
    <div class="settings-section" style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:bold; font-size:16px;">Translate to:</span>
        <select id="targetLang" style="margin-bottom:0; border: 2px solid #fbbc05;">
            <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="en">English</option>
            <option value="ur">Urdu (اردو)</option>
        </select>
    </div>
</div>

<!-- SCOREBOARD -->
<div class="card">

<div class="header">
LIVE SCORE BOARD
</div>

<div class="teams-container" id="teamWrap">

<!-- TEAM A -->
<div class="team-box">
<select id="teamSelectA" onchange="selectTeamA(this.value)">
<option value="">Select Team A</option>
</select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameA" class="team-input" placeholder="Team 1 (Input)">
            <button class="trans-btn" onclick="translateText('nameA', 'nameA_pa')" title="Translate">⇄</button>
        </div>
        <input type="text" id="nameA_pa" class="team-input" placeholder="Team 1 (Translated)">
    </div>
    <button class="set-btn" onclick="updateTeamA()">SET</button>
</div>
<div class="score-val" id="dispA">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button>
</div>
</div>

<div class="vs-text">VS</div>

<!-- TEAM B -->
<div class="team-box">
<select id="teamSelectB" onchange="selectTeamB(this.value)">
<option value="">Select Team B</option>
</select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameB" class="team-input" placeholder="Team 2 (Input)">
            <button class="trans-btn" onclick="translateText('nameB', 'nameB_pa')" title="Translate">⇄</button>
        </div>
        <input type="text" id="nameB_pa" class="team-input" placeholder="Team 2 (Translated)">
    </div>
    <button class="set-btn" onclick="updateTeamB()">SET</button>
</div>
<div class="score-val" id="dispB">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button>
</div>
</div>

</div>

<!-- BUTTONS -->
<div class="controls">

<button class="btn-full btn-green" onclick="showResultLayer()">
RESULT
</button>

<button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">
Hide Scoreboard
</button>

<button class="btn-full btn-yellow" onclick="swapTeams()">
SWAP
</button>

<button class="btn-full btn-dark" id="camBtn" onclick="toggleCameraView()">
Camera View
</button>

<button class="btn-full" style="background:#777;" onclick="resetScores()">
RESET SCORES
</button>

</div>

<div class="settings-section">

<input type="text" id="roundInp" placeholder="ROUND">

<!-- NEXT MATCH SETUP WITH DYNAMIC LIST -->
<div class="header" style="margin-bottom:10px;">
NEXT MATCH LIST & SETUP
</div>

<select id="nextTeamA">
<option value="">Select Next Match Team 1</option>
</select>

<select id="nextTeamB">
<option value="">Select Next Match Team 2</option>
</select>

<button class="btn-full btn-green" onclick="addNextMatch()" style="width:100%;margin-bottom:12px;">
ADD TO LIST
</button>

<!-- MATCH LIST CONTAINER -->
<div id="nextMatchContainer"></div>

</div>

</div>

<!-- QUICK TRANSLATOR TOOL -->
<div class="card">
<div class="header">QUICK TRANSLATOR TOOL</div>
<div class="settings-section">
    <div style="display:flex; gap:10px; margin-bottom:10px;">
        <input type="text" id="quickEng" placeholder="Type here in any language..." style="margin-bottom:0;">
        <button class="btn-full btn-yellow" onclick="translateText('quickEng', 'quickPa')" style="height:auto; min-height:42px; width:100px;">⇄ TRANS</button>
    </div>
    <input type="text" id="quickPa" placeholder="Translated output..." readonly style="background:#eee;">
</div>
</div>

<!-- TEAM MANAGER -->
<div class="card">
<div class="header">TOURNAMENT TEAM MANAGER</div>
<div class="settings-section">

<textarea id="newTeamInp" rows="3" placeholder="Mudki, Faridkot, Talwandi, Firozpur"></textarea>
<button class="btn-full btn-green" onclick="addTeam()" style="width:100%;margin-bottom:8px;">ADD TEAM</button>

<textarea id="allTeamsInp" rows="6" placeholder="All Participating Teams"></textarea>
<button class="btn-full btn-blue" onclick="saveAllTeams()" style="width:100%;margin-bottom:8px;">SAVE TEAM LIST</button>

<textarea id="winnerTeamsInp" rows="4" placeholder="Qualified Teams"></textarea>
<textarea id="loserTeamsInp" rows="4" placeholder="Eliminated Teams"></textarea>

</div>
</div>

<button class="btn-full btn-red" onclick="clearAllTeams()" style="width:100%;margin-bottom:15px;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer;background:#ea4335;color:white;">
RESET ALL TEAMS
</button>

<!-- TICKER -->
<div class="card">
    <div class="header">Ticker & Branding</div>
    <div class="settings-section">
        <textarea id="row1Inp" rows="1" placeholder="Title Line 1" oninput="autoResize(this); updateTicker();"></textarea>
        <textarea id="row2Inp" rows="1" placeholder="Title Line 2" oninput="autoResize(this); updateTicker();"></textarea>
        <textarea id="row3Inp" rows="1" placeholder="Title Line 3" oninput="autoResize(this); updateTicker();"></textarea>
        <textarea id="row4Inp" rows="1" placeholder="Title Line 4" oninput="autoResize(this); updateTicker();"></textarea>
        <input type="text" id="watermarkInp" placeholder="Channel Name">

        <button class="btn-full btn-blue" onclick="updateTicker()" style="width:100%;margin-bottom:8px;">
        UPDATE TICKER
        </button>

        <button id="tickVisBtn" class="btn-full btn-red" onclick="toggleVis('tickerVisible')" style="width:100%;">
        HIDE TICKER
        </button>
    </div>
</div>

<!-- RESULT -->
<div class="card">
<div class="header">MATCH RESULT</div>
<div class="settings-section">
<div class="result-box">
<div class="result-title">RESULT</div>
<div class="result-text" id="resultText">No Result Yet</div>
</div>
</div>
</div>

</div>

<script>
const firebaseConfig = {
    databaseURL:"https://my-scorebord-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);

const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id') || 'defaultMatch';
const db = firebase.database().ref("matchData/" + matchId);

let curA=0;
let curB=0;
let camOpposite=false;
let allTeams=[];
let nextMatches=[];

/* MULTI-LANGUAGE TRANSLATION API FUNCTION */
async function translateText(sourceId, targetId) {
    const text = document.getElementById(sourceId).value;
    const targetLang = document.getElementById("targetLang").value; // Grab language from dropdown
    
    if(!text) return;
    try {
        // sl=auto (Detects Input Language Automatically)
        // tl=targetLang (Translates to the Selected Language)
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        document.getElementById(targetId).value = data[0][0][0];
    } catch(e) {
        alert("Translation error! Please check internet connection.");
    }
}

/* LIVE DB */
db.on("value",(snap)=>{
    const data=snap.val();
    if(data){
        curA=parseFloat(data.scoreA)||0;
        curB=parseFloat(data.scoreB)||0;
        allTeams=data.allTeams || [];
        nextMatches=data.nextMatches || [];

        document.getElementById("dispA").innerText=curA;
        document.getElementById("dispB").innerText=curB;
        
        document.getElementById("nameA").value=data.nameA||"";
        document.getElementById("nameA_pa").value=data.nameA_pa||"";
        
        document.getElementById("nameB").value=data.nameB||"";
        document.getElementById("nameB_pa").value=data.nameB_pa||"";
        
        document.getElementById("roundInp").value=data.round||"";

        document.getElementById("row1Inp").value = data.row1Txt || "";
        document.getElementById("row2Inp").value = data.row2Txt || "";
        document.getElementById("row3Inp").value = data.row3Txt || "";
        document.getElementById("row4Inp").value = data.row4Txt || "";
        document.getElementById("watermarkInp").value = data.watermarkTxt || "";

        setTimeout(() => {
            autoResize(document.getElementById("row1Inp"));
            autoResize(document.getElementById("row2Inp"));
            autoResize(document.getElementById("row3Inp"));
            autoResize(document.getElementById("row4Inp"));
        }, 10);

        document.getElementById("winnerTeamsInp").value = data.qualifiedTeams || "";
        document.getElementById("loserTeamsInp").value = data.eliminatedTeams || "";
        document.getElementById("allTeamsInp").value = allTeams.join("\n");
        document.getElementById("resultText").innerText = data.resultText || "No Result Yet";

        renderNextMatches(); 

        const sVis = data.scoreVisible !== false;
        document.getElementById("visBtn").innerText = sVis ? "Hide Scoreboard" : "Show Scoreboard";

        const tVis = data.tickerVisible !== false;
        document.getElementById("tickVisBtn").innerText = tVis ? "Hide Ticker" : "Show Ticker";

        camOpposite=data.cameraOpposite||false;
        document.getElementById("teamWrap").style.flexDirection = camOpposite ? "row-reverse" : "row";
        document.getElementById("camBtn").innerText = camOpposite ? "Camera Oppo View" : "Camera View";

        updateDropdowns();
    }
});

/* NEXT MATCH RENDERER */
function renderNextMatches() {
    const container = document.getElementById("nextMatchContainer");
    container.innerHTML = ""; 
    
    if(nextMatches.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding:10px; color:#999; font-weight:bold;">No Upcoming Matches</div>`;
        return;
    }

    nextMatches.forEach((matchStr, index) => {
        let div = document.createElement("div");
        div.className = "match-item";
        div.innerHTML = `
            <div class="match-title">${matchStr}</div>
            <div class="match-actions">
                <button class="btn-sm btn-start" onclick="startSpecificMatch(${index})">START</button>
                <button class="btn-sm btn-walkover" onclick="walkOverSpecificMatch(${index})">WALKOVER</button>
                <button class="btn-sm btn-delete" onclick="deleteSpecificMatch(${index})">X</button>
            </div>
        `;
        container.appendChild(div);
    });
}

/* START SPECIFIC MATCH */
function startSpecificMatch(index) {
    let matchStr = nextMatches[index];
    let teams = matchStr.split(" VS ");
    let t1 = teams[0] ? teams[0].trim() : "";
    let t2 = teams[1] ? teams[1].trim() : "";

    nextMatches.splice(index, 1);

    db.update({
        nameA: t1,
        nameA_pa: "", 
        nameB: t2,
        nameB_pa: "",
        scoreA: 0,
        scoreB: 0,
        nextMatches: nextMatches,
        scoreVisible: true, 
        resultText: "No Result Yet"
    });
}

/* WALKOVER SPECIFIC MATCH */
function walkOverSpecificMatch(index) {
    let matchStr = nextMatches[index];
    let teams = matchStr.split(" VS ");
    let t1 = teams[0] ? teams[0].trim() : "";
    let t2 = teams[1] ? teams[1].trim() : "";

    let winnerNum = prompt(`Walkover kisnu ditta jana hai?\n1 = ${t1}\n2 = ${t2}\n\n1 ya 2 likho:`);
    
    let winner = "";
    let loser = "";

    if(winnerNum === "1"){
        winner = t1;
        loser = t2;
    } else if (winnerNum === "2"){
        winner = t2;
        loser = t1;
    } else {
        return; 
    }

    let winners = document.getElementById("winnerTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    winners.push(winner + " (WALKOVER)");

    let losers = document.getElementById("loserTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    losers.push(loser);
    
    let resultText = winner + " WON BY WALKOVER vs " + loser;
    
    allTeams = allTeams.filter(t=>t!==loser);
    nextMatches.splice(index, 1);

    db.update({
        resultText: resultText,
        qualifiedTeams: winners.join("\n"),
        eliminatedTeams: losers.join("\n"),
        allTeams: allTeams,
        nextMatches: nextMatches
    });
}

/* DELETE SPECIFIC MATCH */
function deleteSpecificMatch(index) {
    if(confirm("Are you sure you want to delete this match?")) {
        nextMatches.splice(index, 1);
        db.update({ nextMatches: nextMatches });
    }
}


/* DROPDOWNS */
function updateDropdowns(){
    const a=document.getElementById("teamSelectA");
    const b=document.getElementById("teamSelectB");
    const na=document.getElementById("nextTeamA");
    const nb=document.getElementById("nextTeamB");

    a.innerHTML='<option value="">Select Team A</option>';
    b.innerHTML='<option value="">Select Team B</option>';
    na.innerHTML='<option value="">Select Next Match Team 1</option>';
    nb.innerHTML='<option value="">Select Next Match Team 2</option>';

    allTeams.forEach(team=>{
        a.innerHTML += `<option value="${team}">${team}</option>`;
        b.innerHTML += `<option value="${team}">${team}</option>`;
        na.innerHTML += `<option value="${team}">${team}</option>`;
        nb.innerHTML += `<option value="${team}">${team}</option>`;
    });
}

function addTeam(){
    const teamsText = document.getElementById("newTeamInp").value;
    const newTeams = teamsText.split(",").map(t=>t.trim()).filter(t=>t!=='');
    newTeams.forEach(team=>{
        if(!allTeams.includes(team)){
            allTeams.push(team);
        }
    });
    document.getElementById("allTeamsInp").value = allTeams.join("\n");
    db.update({ allTeams:allTeams });
    updateDropdowns();
    document.getElementById("newTeamInp").value="";
}

function saveAllTeams(){
    allTeams= document.getElementById("allTeamsInp").value.split("\n").map(t=>t.trim()).filter(t=>t!=='');
    db.update({ allTeams:allTeams });
    updateDropdowns();
}

function selectTeamA(team){ document.getElementById("nameA").value=team; }
function selectTeamB(team){ document.getElementById("nameB").value=team; }

function updateTeamA(){ 
    db.update({ 
        nameA:document.getElementById("nameA").value,
        nameA_pa:document.getElementById("nameA_pa").value
    }); 
}

function updateTeamB(){ 
    db.update({ 
        nameB:document.getElementById("nameB").value,
        nameB_pa:document.getElementById("nameB_pa").value 
    }); 
}

function changeScore(team,val){
    let current=(team==="scoreA")?curA:curB;
    let newVal;
    if(val>0){
        if(curA===0 && curB===0) newVal=1.5;
        else newVal=current+1;
    }else{
        if(current===1.5) newVal=0;
        else newVal=current-1;
        if(newVal<0) newVal=0;
    }
    db.update({ [team]:newVal });
}

function updateTicker(){
    db.update({
        round: document.getElementById("roundInp").value,
        row1Txt: document.getElementById("row1Inp").value,
        row2Txt: document.getElementById("row2Inp").value,
        row3Txt: document.getElementById("row3Inp").value,
        row4Txt: document.getElementById("row4Inp").value,
        watermarkTxt: document.getElementById("watermarkInp").value
    });
}

function autoResize(el){
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
}

function toggleVis(field){
    db.child(field).once("value",snap=>{
        const current = snap.val();
        db.update({ [field]: current === false ? true : false });
    });
}

function swapTeams(){
    db.update({
        nameA: document.getElementById("nameB").value,
        nameA_pa: document.getElementById("nameB_pa").value,
        nameB: document.getElementById("nameA").value,
        nameB_pa: document.getElementById("nameA_pa").value,
        scoreA: curB,
        scoreB: curA
    });
}

function resetScores(){
    if(confirm("Reset Scores?")){
        db.update({ scoreA:0, scoreB:0 });
    }
}

function toggleCameraView(){
    db.update({ cameraOpposite: !camOpposite });
}

/* RESULT LOGIC */
function showResultLayer(){
    
    if(curA === 0 && curB === 0){
        alert("Score pehlan ton hi 0-0 hai. Result update nahi hovega.");
        return; 
    }

    if(!confirm("Ki tuc sach vich result update karna chahunde ho? Result banan ton baad score 0 ho javega.")){
        return; 
    }

    const teamA = document.getElementById("nameA").value;
    const teamB = document.getElementById("nameB").value;

    let winner="";
    let loser="";

    if(curA>curB){
        winner=teamA;
        loser=teamB;
    }else if(curB>curA){
        winner=teamB;
        loser=teamA;
    } else {
        winner="TIE"; 
    }

    let winners = document.getElementById("winnerTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    if(winner !== "TIE") winners.push(winner + " (WIN)");

    let losers = document.getElementById("loserTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    if(winner !== "TIE") losers.push(loser);

    document.getElementById("winnerTeamsInp").value = winners.join("\n");
    document.getElementById("loserTeamsInp").value = losers.join("\n");

    const resultText = winner !== "TIE" 
        ? winner + " WIN vs " + loser + " (" + curA + " - " + curB + ")"
        : "MATCH TIED (" + curA + " - " + curB + ")";

    document.getElementById("resultText").innerText = resultText;

    if(loser !== ""){
        allTeams = allTeams.filter(t=>t!==loser);
    }

    nextMatches = nextMatches.filter(match=>{
        const m = match.toLowerCase();
        const t1 = teamA.toLowerCase();
        const t2 = teamB.toLowerCase();
        return !(m.includes(t1) && m.includes(t2));
    });

    db.update({
        resultText: resultText,
        qualifiedTeams: winners.join("\n"),
        eliminatedTeams: losers.join("\n"),
        allTeams: allTeams,
        nextMatches: nextMatches,
        scoreA: 0, 
        scoreB: 0,
        nameA: "", 
        nameA_pa: "",
        nameB: "",
        nameB_pa: ""
    });

    updateDropdowns();
}

function addNextMatch(){
    const a= document.getElementById("nextTeamA").value;
    const b= document.getElementById("nextTeamB").value;
    if(a==="" || b==="") return;
    
    nextMatches.push(a + " VS " + b);
    
    document.getElementById("nextTeamA").value = "";
    document.getElementById("nextTeamB").value = "";
    
    db.update({ nextMatches:nextMatches });
}

function clearAllTeams(){
    if(confirm("Delete All Teams?")){
        allTeams=[];
        db.update({
            allTeams:[],
            qualifiedTeams:"",
            eliminatedTeams:"",
            nextMatches:[],
            resultText:"No Result Yet",
            scoreA:0,
            scoreB:0,
            nameA:"",
            nameA_pa:"",
            nameB:"",
            nameB_pa:""
        });
        document.getElementById("allTeamsInp").value="";
        document.getElementById("winnerTeamsInp").value="";
        document.getElementById("loserTeamsInp").value="";
        document.getElementById("resultText").innerText="No Result Yet";
        document.getElementById("dispA").innerText="0";
        document.getElementById("dispB").innerText="0";
        document.getElementById("nameA").value="";
        document.getElementById("nameA_pa").value="";
        document.getElementById("nameB").value="";
        document.getElementById("nameB_pa").value="";
        curA=0; curB=0;
        updateDropdowns();
    }
}
</script>
