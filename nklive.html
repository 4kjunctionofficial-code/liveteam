<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    margin:0;
    padding:0;
    width:1920px;
    height:1080px;
    background:transparent;
    overflow:hidden;
    font-family:Arial,sans-serif;
    position:relative;
}

/* ================= LOGO ================= */
#logo-container{
    position:absolute;
    top:30px;
    left:40px;
    z-index:9999;
    transition:.5s;
}
#logo-container.hidden{
    opacity:0;
    transform:scale(0);
}
#main-logo{
    height:100px;
    width:auto;
}

/* ================= WATERMARK ================= */
#single-wm{
    position:absolute;
    color:rgba(255,255,255,.55);
    font-size:35px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:1;
}

/* ================= SCOREBOARD ================= */
#scoreboard{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:.5s;
}
#scoreboard.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(-100px);
}

.match-title{
    background:linear-gradient(to bottom,#111,#000);
    color:white;
    font-size:42px;
    font-weight:900;
    padding:8px 60px;
    border:4px solid #d4a017;
    border-bottom:none;
    border-radius:18px 18px 0 0;
    text-transform:uppercase;
    text-shadow:2px 2px 4px #000;
}

.gold-board{
    display:flex;
    align-items:center;
    height:120px;
    background:linear-gradient(
        to right,
        #000 0%,
        #111 30%,
        #d4a017 50%,
        #111 70%,
        #000 100%
    );
    border:6px solid #d4a017;
    border-radius:18px;
    padding:0 20px;
}

.team-box{
    width:320px;
    color:#f3c300;
    font-size:46px;
    font-weight:900;
    text-align:center;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-shadow:2px 2px 4px #000;
}

.score-box{
    width:120px;
    height:90px;
    background:#111;
    border:3px solid #d4a017;
    border-radius:18px;
    color:white;
    font-size:70px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', monospace;
}

.vs-arrow{
    width:90px;
    text-align:center;
    color:black;
    font-size:70px;
    font-weight:900;
}

.team-scroller{
    display:inline-block;
    padding-left:100%;
    animation:team-scroll 8s linear infinite;
}
@keyframes team-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
}

/* ================= TICKER ================= */
#ticker-wrap{
    position:absolute;
    bottom:0;
    left:0;
    width:1920px;
    height:95px;
    display:flex;
    z-index:9998;
    transition:.5s;
}
#ticker-wrap.hidden{
    opacity:0;
    transform:translateY(100px);
}

/* LEFT LIVE STREAM */
.live-box{
    width:190px;
    background:linear-gradient(to right,#111,#000);
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:900;
    line-height:1;
    position:relative;
    clip-path:polygon(0 0,100% 0,82% 100%,0 100%);
    border-top:4px solid #f3c300;
    border-bottom:4px solid #f3c300;
    border-left:4px solid #f3c300;
    padding-right:25px;
    box-sizing:border-box;
}
.live-top{
    font-size:34px;
    color:#f3c300;
    text-shadow:2px 2px 3px #000;
}
.live-bottom{
    font-size:28px;
    color:white;
    text-shadow:2px 2px 3px #000;
}

/* CENTER */
.ticker-center{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-top:12px;
}

/* top village badge */
.top-strip{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    min-width:520px;
    max-width:900px;
    height:28px;
    background:#f3c300;
    color:#000;
    border:2px solid #000;
    border-radius:8px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:5;
}

/* middle black */
.main-strip{
    height:42px;
    background:#000;
    color:white;
    display:flex;
    align-items:center;
    overflow:hidden;
    margin-top:12px;
}

/* bottom yellow */
.bottom-strip{
    height:33px;
    background:#f3c300;
    color:black;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding-left:20px;
}

/* right phone */
.phone-box{
    width:270px;
    background:linear-gradient(to left,#111,#000);
    color:#f3c300;
    font-size:26px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);
    border-top:4px solid #f3c300;
    border-bottom:4px solid #f3c300;
    border-right:4px solid #f3c300;
    padding-left:25px;
    box-sizing:border-box;
    text-shadow:1px 1px 2px #000;
}

.row-text{
    white-space:nowrap;
    overflow:hidden;
    font-size:24px;
    font-weight:800;
    flex:1;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#f3c300;
    margin:0 12px;
    flex-shrink:0;
}

.scroller{
    display:inline-block;
    white-space:nowrap;
    position:relative;
    will-change:transform;
}
</style>
</head>
<body>

<!-- LOGO -->
<div id="logo-container" class="hidden">
    <img id="main-logo" src="">
</div>

<!-- WATERMARK -->
<div id="single-wm">M LIVE</div>

<!-- SCOREBOARD -->
<div id="scoreboard">
    <div class="match-title" id="round-display">LIVE MATCH</div>
    <div class="gold-board">
        <div class="team-box" id="nA-container">TEAM 1</div>
        <div class="score-box" id="sA">0</div>
        <div class="vs-arrow">↔</div>
        <div class="score-box" id="sB">0</div>
        <div class="team-box" id="nB-container">TEAM 2</div>
    </div>
</div>

<!-- TICKER -->
<div id="ticker-wrap">

    <div class="live-box">
        <div class="live-top">LIVE</div>
        <div class="live-bottom">STREAM</div>
    </div>

    <div class="ticker-center">

        <div class="top-strip">
            <div class="row-text" id="villageTicker">
                PIND - MUKANDWALI | MITI - 3 MAY 2026
            </div>
        </div>

        <div class="main-strip">
            <div class="dot"></div>
            <div class="row-text" id="c1">
                WELCOME TO LIVE KABADDI
            </div>
            <div class="dot"></div>
        </div>

        <div class="bottom-strip">
            <div class="row-text" id="c2">
                SUBSCRIBE OUR CHANNEL
            </div>
        </div>

    </div>

    <div class="phone-box">
        ☎ 7355300784
    </div>

</div>

<script>
const firebaseConfig={
  databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const urlParams=new URLSearchParams(window.location.search);
const matchId=urlParams.get('id') || 'defaultMatch';
const db=firebase.database().ref("matchData/"+matchId);

const clientLogos={
 "test":"https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png"
};

let tickerInitialized=false;

db.on("value",(snap)=>{
    const data=snap.val() || {};
    const currentId=matchId.trim().toLowerCase();

    /* logo */
    const logoCont=document.getElementById('logo-container');
    if(clientLogos[currentId] && data.logoVisible!==false){
        document.getElementById('main-logo').src=clientLogos[currentId];
        logoCont.classList.remove('hidden');
    }else{
        logoCont.classList.add('hidden');
    }

    /* visibility */
    document.getElementById('scoreboard')
      .classList.toggle('hidden',data.scoreVisible===false);

    document.getElementById('ticker-wrap')
      .classList.toggle('hidden',data.tickerVisible===false);

    /* scores */
    document.getElementById('sA').innerText=data.scoreA ?? "0";
    document.getElementById('sB').innerText=data.scoreB ?? "0";

    /* names */
    setTeamName('nA-container',data.nameA || "TEAM 1");
    setTeamName('nB-container',data.nameB || "TEAM 2");

    /* round */
    document.getElementById('round-display').innerText=
      data.round || "LIVE MATCH";

    /* watermark */
    document.getElementById('single-wm').innerText=
      data.watermarkTxt || "M LIVE";

    /* ticker */
    updateTickerContent(
      'villageTicker',
      data.village || "PIND - MUKANDWALI | MITI - 3 MAY 2026"
    );

    updateTickerContent(
      'c1',
      data.row1Txt || "WELCOME TO LIVE KABADDI"
    );

    updateTickerContent(
      'c2',
      data.row2Txt || "SUBSCRIBE OUR CHANNEL"
    );

    if(!tickerInitialized){
        startTicker('villageTicker',1.2);
        startTicker('c1',1.5);
        startTicker('c2',1.3);
        tickerInitialized=true;
    }
});

/* team scroll */
function setTeamName(id,txt){
    const el=document.getElementById(id);

    if(txt.length>12){
        el.innerHTML=
        `<div class="team-scroller">${txt}</div>`;
    }else{
        el.innerHTML=txt;
    }
}

/* ticker text update */
function updateTickerContent(id,txt){
    const el=document.getElementById(id);
    const scroller=el.querySelector('.scroller');

    if(scroller){
        scroller.innerHTML=
          `${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}`;
    }else{
        el.innerHTML=
          `<div class="scroller">${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}</div>`;
    }
}

/* ticker move */
function startTicker(id,speed){
    const el=document.getElementById(id);
    const scroller=el.querySelector('.scroller');
    let x=el.offsetWidth;

    function animate(){
        x-=speed;

        if(x < -scroller.offsetWidth){
            x=el.offsetWidth;
        }

        scroller.style.transform=
          `translateX(${x}px)`;

        requestAnimationFrame(animate);
    }
    animate();
}

/* watermark move */
const wmEl=document.getElementById('single-wm');

function moveWM(){
    wmEl.style.left=(Math.random()*1400+100)+'px';
    wmEl.style.top=(Math.random()*600+150)+'px';
}
moveWM();
setInterval(moveWM,6000);
</script>

</body>
</html>
