<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        #ticker-container {
            position: absolute;
            bottom: 40px;
            left: 20px;
            width: 1880px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #row1-display { 
            background: #ffcc00; color: black; padding: 5px 30px; font-weight: 900; font-size: 28px; 
            border-radius: 10px 10px 0 0; width: fit-content; text-transform: uppercase;
            min-height: 30px;
        }

        .row-mid { 
            background: #000; color: white; display: flex; align-items: center; width: 100%; height: 70px; 
            border: 3px solid #ffcc00; border-radius: 10px; overflow: hidden;
        }
        .live-tag { 
            background: #ffcc00; color: black; padding: 0 25px; font-weight: 900; font-size: 35px; 
            height: 100%; display: flex; align-items: center;
        }
        #row2-display { flex: 1; padding: 0 20px; font-size: 30px; font-weight: bold; white-space: nowrap; }

        .row-bot { 
            background: #ffcc00; color: black; width: 100%; display: flex; align-items: center; 
            padding: 10px 20px; border-radius: 0 0 10px 10px; font-weight: bold; font-size: 26px; 
            justify-content: space-between; box-sizing: border-box; min-height: 40px;
        }
        .phone-box { 
            background: #000; color: #ffcc00; padding: 5px 25px; border-radius: 5px; font-weight: 900; font-size: 32px; 
        }
    </style>
</head>
<body>

<div id="ticker-container">
    <div id="row1-display"></div>
    
    <div class="row-mid">
        <div class="live-tag">LIVE 📡</div>
        <div id="row2-display"></div>
    </div>
    
    <div class="row-bot">
        <div id="row3-display"></div>
        <div class="phone-box">📞 <span id="phone-display"></span></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("matchData/defaultMatch");

    db.on("value", (snap) => {
        const data = snap.val() || {};
        
        // ਸਿਰਫ ਉਹੀ ਦਿਖਾਓ ਜੋ Admin Panel ਤੋਂ ਆਵੇਗਾ
        document.getElementById('row1-display').innerText = data.row1Txt || "";
        document.getElementById('row2-display').innerText = data.row2Txt || "";
        document.getElementById('row3-display').innerText = data.row3Txt || "";
        document.getElementById('phone-display').innerText = data.phoneNum || "";
        
        // ਜੇ ਕੋਈ ਡਾਟਾ ਨਹੀਂ ਹੈ ਤਾਂ ਬੈਕਗ੍ਰਾਉਂਡ ਖਾਲੀ ਰੱਖਣ ਲਈ
        document.getElementById('row1-display').style.display = data.row1Txt ? "block" : "none";
    });
</script>
</body>
</html>
