<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    margin:0;
    padding:0;
    width:1920px;
    height:1080px;
    overflow:hidden;
    background:transparent;
    font-family:Arial,sans-serif;
    position:relative;
}

/* =======================
   LOGO
======================= */

#logo-container{
    position:absolute;
    top:30px;
    left:40px;
    z-index:9999;
    transition:.5s;
}

#logo-container.hidden{
    opacity:0;
    transform:scale(0);
}

#main-logo{
    height:100px;
}

/* =======================
   WATERMARK
======================= */

#single-wm{
    position:absolute;
    color:rgba(255,255,255,.6);
    font-size:35px;
    font-weight:bold;
    text-shadow:2px 2px 5px #000;
    z-index:1;
}

/* =======================
   SCOREBOARD
======================= */

#scoreboard{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:.5s;
}

#scoreboard.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(-100px);
}

.match-title{
    background:linear-gradient(to bottom,#111,#000);
    color:white;
    font-size:42px;
    font-weight:900;
    padding:8px 60px;
    border:4px solid #d4a017;
    border-bottom:none;
    border-radius:18px 18px 0 0;
    text-transform:uppercase;
    text-shadow:2px 2px 4px #000;
}

.gold-board{
    display:flex;
    align-items:center;
    height:120px;
    background:linear-gradient(
        to right,
        #000 0%,
        #111 30%,
        #d4a017 50%,
        #111 70%,
        #000 100%
    );
    border:6px solid #d4a017;
    border-radius:18px;
    padding:0 20px;
}

.team-box{
    width:320px;
    color:#f3c300;
    font-size:46px;
    font-weight:900;
    text-align:center;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-shadow:2px 2px 4px #000;
}

.score-box{
    width:120px;
    height:90px;
    background:#111;
    border:3px solid #d4a017;
    border-radius:18px;
    color:white;
    font-size:70px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Courier New', monospace;
}

.vs-arrow{
    width:90px;
    text-align:center;
    color:black;
    font-size:70px;
    font-weight:900;
}

.team-scroller{
    display:inline-block;
    padding-left:100%;
    animation:team-scroll 8s linear infinite;
}

@keyframes team-scroll{
    0%{transform:translateX(0);}
    100%{transform:translateX(-100%);}
}

/* =======================
   TICKER
======================= */

#ticker-wrap{
    position:absolute;
    bottom:0;
    left:0;
    width:1920px;
    height:100px;
    display:flex;
    z-index:9998;
    transition:.5s;
}

#ticker-wrap.hidden{
    opacity:0;
    transform:translateY(100px);
}

.live-box{
    width:180px;
    background:#111;
    color:white;
    border-top:4px solid #f3c300;
    border-bottom:4px solid #f3c300;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:900;
}

.live-top{
    font-size:34px;
}

.live-bottom{
    font-size:28px;
}

.ticker-center{
    flex:1;
    display:flex;
    flex-direction:column;
}

.top-strip{
    height:25px;
    background:#f3c300;
    color:black;
    font-size:18px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
}

.main-strip{
    height:42px;
    background:black;
    color:white;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.bottom-strip{
    height:33px;
    background:#f3c300;
    color:black;
    font-size:18px;
    font-weight:bold;
    display:flex;
    align-items:center;
    padding-left:20px;
}

.phone-box{
    width:250px;
    background:#f3c300;
    color:black;
    font-size:28px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:#f3c300;
    margin:0 12px;
}

.row-text{
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    font-size:26px;
    font-weight:800;
}

.scroller{
    display:inline-block;
    white-space:nowrap;
    position:relative;
}
</style>
</head>

<body>

<!-- LOGO -->
<div id="logo-container" class="hidden">
    <img id="main-logo" src="">
</div>

<!-- WATERMARK -->
<div id="single-wm">M LIVE</div>

<!-- SCOREBOARD -->
<div id="scoreboard">

    <div class="match-title" id="round-display">
        LIVE MATCH
    </div>

    <div class="gold-board">

        <div class="team-box" id="nA-container">
            TEAM 1
        </div>

        <div class="score-box" id="sA">0</div>

        <div class="vs-arrow">↔</div>

        <div class="score-box" id="sB">0</div>

        <div class="team-box" id="nB-container">
            TEAM 2
        </div>

    </div>
</div>

<!-- TICKER -->
<div id="ticker-wrap">

    <div class="live-box">
        <div class="live-top">LIVE</div>
        <div class="live-bottom">STREAM</div>
    </div>

    <div class="ticker-center">

        <div class="top-strip" id="round-strip">
            LIVE TOURNAMENT
        </div>

        <div class="main-strip">
            <div class="dot"></div>
            <div class="row-text" id="c1">WELCOME TO LIVE KABADDI</div>

            <div class="dot"></div>
            <div class="row-text" id="c2">SUBSCRIBE OUR CHANNEL</div>

            <div class="dot"></div>
            <div class="row-text" id="c3">LIKE & SHARE</div>
        </div>

        <div class="bottom-strip">
            <span id="bottom-info">
                CONTACT FOR LIVE STREAM
            </span>
        </div>

    </div>

    <div class="phone-box">
        ☎ 74007 35730
    </div>
</div>

<script>
const firebaseConfig = {
 databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const urlParams=new URLSearchParams(window.location.search);
const matchId=urlParams.get('id') || 'defaultMatch';

const db=firebase.database().ref("matchData/"+matchId);

const clientLogos={
 "test":"https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png"
};

let tickerInitialized=false;

db.on("value",(snap)=>{

const data=snap.val() || {};

const currentId=matchId.trim().toLowerCase();

const logoCont=document.getElementById('logo-container');

if(clientLogos[currentId] && data.logoVisible!==false){
document.getElementById('main-logo').src=clientLogos[currentId];
logoCont.classList.remove('hidden');
}else{
logoCont.classList.add('hidden');
}

document.getElementById('scoreboard')
.classList.toggle('hidden',data.scoreVisible===false);

document.getElementById('ticker-wrap')
.classList.toggle('hidden',data.tickerVisible===false);

document.getElementById('sA').innerText=data.scoreA ?? "0";
document.getElementById('sB').innerText=data.scoreB ?? "0";

setTeamName('nA-container',data.nameA || "TEAM 1");
setTeamName('nB-container',data.nameB || "TEAM 2");

document.getElementById('round-display').innerText=
data.round || "LIVE MATCH";

document.getElementById('round-strip').innerText=
data.round || "LIVE MATCH";

document.getElementById('single-wm').innerText=
data.watermarkTxt || "M LIVE";

updateTickerContent('c1',
data.row1Txt || "WELCOME TO LIVE KABADDI");

updateTickerContent('c2',
data.row2Txt || "SUBSCRIBE OUR CHANNEL");

updateTickerContent('c3',
data.row3Txt || "LIKE & SHARE");

document.getElementById('bottom-info').innerText=
data.row3Txt || "CONTACT FOR LIVE STREAM";

if(!tickerInitialized){
startTicker('c1',1.4);
startTicker('c2',2.0);
startTicker('c3',1.7);
tickerInitialized=true;
}
});

function setTeamName(id,txt){
const el=document.getElementById(id);

if(txt.length>12){
el.innerHTML=
`<div class="team-scroller">${txt}</div>`;
}else{
el.innerHTML=txt;
}
}

function updateTickerContent(id,txt){
const el=document.getElementById(id);

const scroller=el.querySelector('.scroller');

if(scroller){
scroller.innerHTML=
`${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}`;
}else{
el.innerHTML=
`<div class="scroller">${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}</div>`;
}
}

function startTicker(id,speed){

const el=document.getElementById(id);
const scroller=el.querySelector('.scroller');

let x=el.offsetWidth;

function animate(){
x-=speed;

if(x < -scroller.offsetWidth){
x=el.offsetWidth;
}

scroller.style.transform=
`translateX(${x}px)`;

requestAnimationFrame(animate);
}

animate();
}

/* watermark move */

const wmEl=document.getElementById('single-wm');

function moveWM(){
wmEl.style.left=
(Math.random()*1400+100)+'px';

wmEl.style.top=
(Math.random()*600+150)+'px';
}

moveWM();
setInterval(moveWM,6000);

</script>

</body>
</html>
