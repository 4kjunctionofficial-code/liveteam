<style>
/* ================= TICKER CSS ================= */

#ticker-wrap{
    position:absolute;
    bottom:0;
    left:0;
    width:1920px;
    height:95px;
    display:flex;
    z-index:9998;
    transition:.5s;
}

#ticker-wrap.hidden{
    opacity:0;
    transform:translateY(100px);
}

/* LEFT LIVE */
.live-box{
    width:180px;
    background:#111;
    color:white;
    border-top:4px solid #f3c300;
    border-bottom:4px solid #f3c300;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:900;
    line-height:1;
}

.live-top{
    font-size:34px;
}

.live-bottom{
    font-size:28px;
}

/* CENTER */
.ticker-center{
    flex:1;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-top:12px;
}

/* TOP SMALL BADGE */
.top-strip{
    position:absolute;
    top:-8px;
    left:50%;
    transform:translateX(-50%);
    min-width:520px;
    max-width:900px;
    height:28px;
    background:#f3c300;
    color:#000;
    border:2px solid #000;
    border-radius:8px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:5;
}

/* BLACK STRIP */
.main-strip{
    height:42px;
    background:#000;
    color:white;
    display:flex;
    align-items:center;
    overflow:hidden;
    margin-top:12px;
}

/* BOTTOM YELLOW */
.bottom-strip{
    height:33px;
    background:#f3c300;
    color:black;
    display:flex;
    align-items:center;
    overflow:hidden;
    padding-left:20px;
}

/* RIGHT PHONE */
.phone-box{
    width:250px;
    background:#f3c300;
    color:black;
    font-size:28px;
    font-weight:900;
    display:flex;
    align-items:center;
    justify-content:center;
    border-left:3px solid #000;
}

/* TEXT */
.row-text{
    white-space:nowrap;
    overflow:hidden;
    font-size:24px;
    font-weight:800;
    flex:1;
}

/* DOTS */
.dot{
    width:14px;
    height:14px;
    border-radius:50%;

}

.scroller{

    position:relative;

}
