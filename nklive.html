<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        /* ਸਕੋਰਬੋਰਡ (Left Corner) */
        #scoreboard { position: absolute; top: 40px; left: 40px; z-index: 9999; }
        .main-bar { display: flex; align-items: center; background: linear-gradient(145deg, #d4af37, #8b6914); border: 4px solid #000; border-radius: 10px; padding: 5px 15px; height: 90px; }
        .s-box { background: #000; color: #fff; font-size: 55px; font-weight: 900; width: 110px; height: 75px; display: flex; align-items: center; justify-content: center; border: 2px solid #ffcc00; border-radius: 5px; margin: 0 10px; }
        .name-area { font-size: 35px; font-weight: 900; color: #fff; text-transform: uppercase; width: 250px; text-align: center; }

        /* ਟਿੱਕਰ ਡਿਜ਼ਾਈਨ (Bottom) */
        #ticker-wrap { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 1800px; height: 120px; display: flex; align-items: center; background: #000; border: 3px solid #ffcc00; z-index: 9998; }
        .live-box { width: 250px; background: #e60000; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; height: 100%; }
        .center-wrap { flex: 1; display: flex; flex-direction: column; padding: 5px; }
        .row-text { height: 35px; color: #ffcc00; font-size: 28px; font-weight: bold; display: flex; align-items: center; padding-left: 15px; white-space: nowrap; overflow: hidden; }
        .contact-box { width: 350px; background: #ffcc00; color: #000; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; height: 100%; }
        .scroller { display: inline-block; animation: scroll 15s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="main-bar">
        <div class="name-area" id="nA">TEAM A</div>
        <div class="s-box" id="sA">0</div>
        <div class="s-box" id="sB">0</div>
        <div class="name-area" id="nB">TEAM B</div>
    </div>
</div>

<div id="ticker-wrap">
    <div class="live-box">LIVE STREAM</div>
    <div class="center-wrap">
        <div class="row-text"><div class="scroller" id="c1">WELCOME TO LIVE KABADDI MATCH</div></div>
        <div class="row-text"><div class="scroller" id="c2">MATCH DETAILS WILL BE UPDATED HERE</div></div>
        <div class="row-text"><div class="scroller" id="c3">NK SPORTS LIVE - SUBSCRIBE NOW</div></div>
    </div>
    <div class="contact-box" id="c4">7355300784</div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("matchData/defaultMatch");

    db.on("value", (snap) => {
        const data = snap.val() || {};
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('nA').innerText = data.nameA ?? "TEAM A";
        document.getElementById('nB').innerText = data.nameB ?? "TEAM B";
        
        // ਟਿੱਕਰ ਦੀਆਂ ਲਾਈਨਾਂ ਅਪਡੇਟ ਕਰਨ ਲਈ
        if(data.row1) document.getElementById('c1').innerText = data.row1;
        if(data.row2) document.getElementById('c2').innerText = data.row2;
        if(data.row3) document.getElementById('c3').innerText = data.row3;
    });
</script>
</body>
</html>
