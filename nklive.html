<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        /* Ticker (ਉੱਪਰ ਵਾਲੀ ਪੀਲੀ ਪੱਟੀ) */
        #ticker-wrap { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 1800px; height: 80px; background: #ffcc00; display: flex; align-items: center; border-radius: 5px; z-index: 9998; padding: 0 10px; border: 2px solid #000; }
        .live-strip { background: #000; color: #fff; padding: 10px 20px; font-weight: 900; font-size: 30px; }
        .ticker-content { flex: 1; overflow: hidden; color: #000; font-size: 32px; font-weight: bold; white-space: nowrap; margin-left: 20px; }
        
        /* Scoreboard (ਹੇਠਾਂ ਵਾਲਾ ਡਿਜ਼ਾਈਨ) */
        #scoreboard-main { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 1400px; height: 180px; background: linear-gradient(to bottom, #d4af37, #8b6914); border: 4px solid #000; border-radius: 10px; display: flex; flex-direction: column; align-items: center; z-index: 9999; }
        .match-title { color: #fff; font-size: 40px; font-weight: 900; margin-top: 10px; text-transform: uppercase; }
        .score-row { display: flex; align-items: center; gap: 50px; margin-top: 20px; }
        .team-name { color: #fff; font-size: 50px; font-weight: 900; width: 350px; text-align: center; }
        .score-val { background: #000; color: #fff; padding: 10px 30px; font-size: 80px; font-weight: 900; border: 3px solid #ffcc00; border-radius: 10px; }
        .vs-icon { font-size: 60px; font-weight: 900; color: #000; }
    </style>
</head>
<body>

    <div id="ticker-wrap">
        <div class="live-strip">LIVE STREAM</div>
        <div class="ticker-content" id="ticker-text">NK SPORTS LIVE - ਕਬੱਡੀ, ਫੁੱਟਬਾਲ, ਹੋਰ ਖੇਡਾਂ ਲਈ ਸੰਪਰਕ ਕਰੋ 7355300784</div>
    </div>

    <div id="scoreboard-main">
        <div class="match-title" id="mTitle">FINAL MATCH</div>
        <div class="score-row">
            <div class="team-name" id="nA">TEAM 1</div>
            <div class="score-val" id="sA">0</div>
            <div class="vs-icon">↔</div>
            <div class="score-val" id="sB">0</div>
            <div class="team-name" id="nB">TEAM 2</div>
        </div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("matchData/defaultMatch");

    db.on("value", (snap) => {
        const data = snap.val() || {};
        // ਸਕੋਰ ਅਤੇ ਨਾਮ ਅਪਡੇਟ
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('nA').innerText = data.nameA ?? "TEAM 1";
        document.getElementById('nB').innerText = data.nameB ?? "TEAM 2";
        document.getElementById('mTitle').innerText = data.round ?? "FINAL MATCH";
        if(data.tickerText) document.getElementById('ticker-text').innerText = data.tickerText;
    });
</script>
</body>
</html>
