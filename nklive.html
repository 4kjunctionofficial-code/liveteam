<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        /* Scoreboard CSS */
        #scoreboard { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; z-index: 9999; }
        .score-box { width: 140px; height: 100px; background: #111; color: #ffcc00; font-size: 60px; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 15px; border: 4px solid #ffcc00; box-shadow: 0 0 15px rgba(255, 204, 0, 0.5); }
        .vs-box { width: 160px; height: 80px; background: #ffcc00; color: #000; font-size: 45px; font-weight: 900; display: flex; align-items: center; justify-content: center; border-radius: 10px; clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%); }

        /* Ticker CSS */
        #ticker-wrap { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 1700px; height: 100px; background: #ffcc00; display: flex; align-items: center; border-radius: 5px; z-index: 9998; padding: 0 10px; }
        .live-strip { background: #000; color: #fff; padding: 10px 20px; font-weight: 900; font-size: 30px; margin-right: 20px; }
        .ticker-content { flex: 1; overflow: hidden; color: #000; font-size: 32px; font-weight: bold; white-space: nowrap; position: relative; }
        .scroller { display: inline-block; white-space: nowrap; }
        .phone-box { background: #000; color: #ffcc00; padding: 10px 30px; font-size: 40px; font-weight: 900; border-radius: 5px; margin-left: 20px; }
    </style>
</head>
<body>

    <div id="scoreboard">
        <div class="score-box" id="sA">0</div>
        <div class="vs-box">VS</div>
        <div class="score-box" id="sB">0</div>
    </div>

    <div id="ticker-wrap">
        <div class="live-strip">LIVE STREAM</div>
        <div class="ticker-content" id="ticker-container">
            <div class="scroller" id="ticker-text">WELCOME TO LIVE KABADDI MATCH - PLEASE SUBSCRIBE!</div>
        </div>
        <div class="phone-box" id="phone-display">📞 7355300784</div>
    </div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);

    // ਡੇਟਾ ਅਪਡੇਟ
    db.on("value", (snap) => {
        const data = snap.val() || {};
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        
        // ਟਿੱਕਰ ਟੈਕਸਟ ਅਪਡੇਟ
        if(data.tickerText) {
            document.getElementById('ticker-text').innerText = data.tickerText;
        }
    });

    // ਟਿੱਕਰ ਐਨੀਮੇਸ਼ਨ (ਇੱਕ ਵਾਰ ਚੱਲੇਗੀ)
    function startTicker() {
        const scroller = document.getElementById('ticker-text');
        const container = document.getElementById('ticker-container');
        let x = container.offsetWidth;
        
        function animate() {
            x -= 2; // ਸਪੀਡ
            if (x < -scroller.offsetWidth) x = container.offsetWidth;
            scroller.style.transform = `translateX(${x}px)`;
            requestAnimationFrame(animate);
        }
        animate();
    }
    startTicker();
</script>
</body>
</html>
