<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Pro Admin Panel - Modern Setup</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{ font-family:'Segoe UI',sans-serif; background:#f0f2f5; margin:0; padding:8px; }
#main-panel{ width:100%; max-width:760px; margin:auto; }
.card{ background:white; border-radius:14px; box-shadow:0 5px 15px rgba(0,0,0,.15); overflow:hidden; margin-bottom:15px; }
.header{ background:#1a73e8; color:white; padding:10px; text-align:center; font-size:16px; font-weight:bold; text-transform: uppercase; }

.teams-container{ display:flex; gap:10px; padding:12px; align-items:center; }
.team-box{ flex:1; }
.vs-text{ font-size:24px; font-weight:bold; color:#999; }

select, input, textarea{ width:100%; padding:10px; border:2px solid #ddd; border-radius:8px; font-size:15px; font-weight:bold; box-sizing:border-box; margin-bottom:8px; }
textarea { resize: vertical; overflow-y: auto; min-height: 50px; max-height: 200px; }

.team-top{ display:flex; gap:6px; align-items: stretch; }
.team-inputs-wrap { display:flex; flex-direction:column; gap:5px; flex:1; }
.team-input-row { display:flex; gap:5px; }
.team-input{ flex:1; margin-bottom: 0 !important; }

.trans-btn { background:#fbbc05; border:none; border-radius:8px; font-weight:bold; cursor:pointer; padding:0 12px; font-size:16px; color:black; }

.score-val{ text-align:center; font-size:52px; font-weight:900; margin:6px 0; }
.pm-wrap{ display:flex; gap:6px; }
.btn-pm{ flex:1; border:none; color:white; padding:12px; border-radius:8px; font-size:24px; font-weight:bold; cursor:pointer; }
.btn-plus{ background:#28a745; }
.btn-minus{ background:#dc3545; }

.controls{ padding:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.btn-full{ border:none; color:white; height:70px; min-height:70px; padding:10px; border-radius:12px; font-size:18px; font-weight:900; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2; overflow:hidden; word-break:break-word; }

.match-item { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
.event-item { background: #e3f2fd; border: 1px solid #90caf9; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
.match-title { font-size: 16px; font-weight: bold; text-align: center; color: #333; }
.match-actions { display: flex; gap: 5px; justify-content: center; }
.btn-sm { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
.btn-start { background: #1a73e8; }
.btn-walkover { background: #fd7e14; }
.btn-delete { background: #dc3545; max-width: 40px; }
.list-header { font-size: 15px; font-weight: 900; padding: 5px 0; border-bottom: 2px solid #ddd; margin-bottom: 10px; color: #444; }

.prize-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
.prize-col label { font-size: 14px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; display: block; border-bottom: 2px solid #1a73e8; padding-bottom: 2px; }
.prize-col input { font-size: 14px; padding: 8px; margin-bottom: 6px; }
.setup-box { background: #f8f9fa; border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 12px; }

@media(max-width:768px){
    .controls{ grid-template-columns:repeat(2,1fr); }
    .btn-full{ font-size:16px; height:68px; }
    .teams-container { flex-direction: column; }
    .vs-text { padding: 10px 0; }
    .prize-grid { grid-template-columns: 1fr; }
}

.btn-green{background:#28a745;}
.btn-red{background:#ea4335;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-dark{background:#333;}
.btn-blue{background:#1a73e8;}
.btn-purple{background:#6f42c1;}

.settings-section{ padding:12px; }
.ticker-label { font-size: 14px; font-weight: 800; color: #1a73e8; margin: 15px 0 5px 0; display: block; border-bottom: 2px solid #1a73e8; padding-bottom: 3px; }
</style>
</head>

<body>
<div id="main-panel">

<div class="card">
    <div class="header" style="background:#fbbc05; color:black;">LANGUAGE TRANSLATION SETTINGS</div>
    <div class="settings-section" style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:bold; font-size:16px;">Translate to:</span>
        <select id="targetLang" style="margin-bottom:0; border: 2px solid #fbbc05;">
            <option value="en">English (English)</option>
            <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="ur">Urdu (اردو)</option>
        </select>
    </div>
</div>

<div class="card">
<div class="header">LIVE SCORE BOARD</div>
<div class="teams-container" id="teamWrap">
<div class="team-box">
<select id="teamSelectA" onchange="selectTeamA(this.value)"><option value="">Select Team A</option></select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameA" class="team-input" placeholder="Team 1 (English)" oninput="syncField('nameA', this.value)">
            <button class="trans-btn" onclick="translateAndSync('nameA', 'nameA_pa')">⇄</button>
        </div>
        <input type="text" id="nameA_pa" class="team-input" placeholder="Team 1 (Punjabi)" oninput="syncField('nameA_pa', this.value)">
    </div>
</div>
<div class="score-val" id="dispA">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button>
</div>
</div>
<div class="vs-text">VS</div>
<div class="team-box">
<select id="teamSelectB" onchange="selectTeamB(this.value)"><option value="">Select Team B</option></select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameB" class="team-input" placeholder="Team 2 (English)" oninput="syncField('nameB', this.value)">
            <button class="trans-btn" onclick="translateAndSync('nameB', 'nameB_pa')">⇄</button>
        </div>
        <input type="text" id="nameB_pa" class="team-input" placeholder="Team 2 (Punjabi)" oninput="syncField('nameB_pa', this.value)">
    </div>
</div>
<div class="score-val" id="dispB">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button>
</div>
</div>
</div>

<div class="controls">
<button class="btn-full btn-green" onclick="showResultLayer()">RESULT</button>
<button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">Hide Scoreboard</button>
<button class="btn-full btn-yellow" onclick="swapTeams()">SWAP</button>
<button class="btn-full btn-dark" id="camBtn" onclick="toggleCameraView()">Camera View</button>
<button class="btn-full" style="background:#777;" onclick="resetScores()">RESET SCORES</button>
</div>

<div class="settings-section">
<div class="setup-box" style="border-top:3px solid #fbbc05;">
    <label style="font-size:14px; font-weight:bold; color:#b58105; display:block; margin-bottom:5px;">🏆 CURRENT MATCH ROUND / CATEGORY</label>
    <input type="text" id="roundInp" placeholder="e.g. Quarter Final / 72 KG" oninput="syncField('round', this.value)">
</div>

<div class="header" style="margin-bottom:10px; margin-top:10px;">NEXT MATCH SETUP</div>
<div class="setup-box" style="border-top:3px solid #1a73e8;">
    <div style="display:flex; gap:10px; margin-bottom:8px;">
        <select id="nextTeamA" style="flex:1;"><option value="">Select Team 1</option></select>
        <select id="nextTeamB" style="flex:1;"><option value="">Select Team 2</option></select>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:8px;">
        <select id="matchRoundSelect" style="flex:1;">
            <option value="">-- Select Round --</option>
            <option value="1st Round">1st Round</option>
            <option value="2nd Round">2nd Round</option>
            <option value="3rd Round">3rd Round</option>
            <option value="4th Round">4th Round</option>
            <option value="Quarter Final">Quarter Final</option>
            <option value="Semi Final">Semi Final</option>
            <option value="Final">Final</option>
        </select>

        <input type="text" id="matchCategoryInp" placeholder="Type KG or Open (e.g. 50 KG / OPEN)" style="flex:1; margin-bottom:0;">
    </div>

    <button class="btn-full btn-green" onclick="addNewMatch()" style="height:48px; min-height:48px; font-size:15px; margin-top:5px;">+ ADD MATCH TO LIST</button>
</div>

<div class="list-header">📋 SCHEDULED MATCHES LIST</div>
<div id="nextMatchContainer"></div>
</div>
</div>

<div class="card">
    <div class="header" style="background:#0066cc;">TICKER SETTINGS</div>
    <div class="settings-section">
        <label class="ticker-label">1. Village / Location Name</label>
        <div class="team-inputs-wrap">
            <div class="team-input-row">
                <input type="text" id="row1Inp" class="team-input" placeholder="e.g. MAHLA, NEAR GORAYA" oninput="syncField('row1Txt', this.value)">
                <button class="trans-btn" onclick="translateAndSync('row1Inp', 'row1Inp_pa', 'row1Txt_pa')">⇄</button>
            </div>
            <input type="text" id="row1Inp_pa" class="team-input" placeholder="Translated Village" oninput="syncField('row1Inp_pa', this.value)">
        </div>

        <label class="ticker-label">2. Tournament Prizes</label>
        <div class="prize-grid">
            <div class="prize-col">
                <label>🔥 OPEN KABADDI</label>
                <input type="text" id="pzOp1" placeholder="1st Prize" oninput="syncPrizeField('pzOp1', this.value)">
                <input type="text" id="pzOp2" placeholder="2nd Prize" oninput="syncPrizeField('pzOp2', this.value)">
                <input type="text" id="pzOpBest" placeholder="Best Player Prize" oninput="syncPrizeField('pzOpBest', this.value)">
            </div>
            <div class="prize-col">
                <label>🏋️ WEIGHT KABADDI</label>
                <input type="text" id="pzWtKg" placeholder="Kinne KG? (e.g. 72 KG)" style="background:#fff3cd; border-color:#ffecb5; color:#856404;" oninput="syncPrizeField('pzWtKg', this.value)">
                <input type="text" id="pzWt1" placeholder="1st Prize" oninput="syncPrizeField('pzWt1', this.value)">
                <input type="text" id="pzWt2" placeholder="2nd Prize" oninput="syncPrizeField('pzWt2', this.value)">
                <input type="text" id="pzWtBest" placeholder="Best Player Prize" oninput="syncPrizeField('pzWtBest', this.value)">
            </div>
        </div>

        <label class="ticker-label">3. Upcoming Events</label>
        <div style="background:#f8f9fa; padding:12px; border-radius:8px; border:1px solid #ddd;">
            <div class="team-inputs-wrap" style="margin-bottom:10px;">
                <div class="team-input-row">
                    <input type="text" id="ueName" class="team-input" placeholder="Event Name (e.g. Goraya)">
                    <button class="trans-btn" onclick="translateToInput('ueName', 'ueName_pa')">⇄</button>
                </div>
                <input type="text" id="ueName_pa" class="team-input" placeholder="Event Name (Punjabi)">
            </div>
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="date" id="ueDate" style="padding: 8px; flex:1;">
                <button class="btn-green" style="border:none; color:white; border-radius:6px; font-weight:bold; padding:0 15px; cursor:pointer;" onclick="addUpcomingEvent()">ADD EVENT</button>
            </div>
            <div id="upcomingEventsContainer"></div>
        </div>

        <label class="ticker-label">4. Booking Number / Ads</label>
        <input type="text" id="row6Inp" placeholder="e.g. BOOKING: 9115426711" oninput="syncField('row6Txt', this.value)">

        <label class="ticker-label">Watermark / Channel Name</label>
        <input type="text" id="watermarkInp" placeholder="Channel Name (e.g. M LIVE)" oninput="syncField('watermarkTxt', this.value)">
    </div>
</div>

<div class="card">
<div class="header">TOURNAMENT TEAM MANAGER</div>
<div class="settings-section">
    <label class="ticker-label">➕ Add New Team</label>
    <div style="background:#f8f9fa; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:15px;">
        <div class="team-input-row" style="margin-bottom:5px;">
            <input type="text" id="newTeamEn" class="team-input" placeholder="Team Name (English)">
            <button class="trans-btn" onclick="translateToInput('newTeamEn', 'newTeamPa')">⇄</button>
        </div>
        <input type="text" id="newTeamPa" class="team-input" placeholder="Team Name (Punjabi)">
        <button class="btn-full btn-green" onclick="addSingleTeam()" style="height:40px; min-height:40px; font-size:14px; margin-top:8px;">ADD TEAM TO LIST</button>
    </div>

    <label class="ticker-label">📋 All Teams Master List</label>
    <textarea id="allTeamsInp" rows="6" placeholder="Example:\nMudki=ਮੁੱਦਕੀ\nFaridkot=ਫਰੀਦਕੋਟ" oninput="syncFieldArrayTeams(this.value)"></textarea>
</div>
</div>

<button class="btn-full btn-red" onclick="clearAllTeams()" style="width:100%;margin-bottom:15px;padding:14px;border-radius:10px;font-size:15px; height:50px; min-height:50px;">
RESET ALL TEAMS & DATA
</button>

</div>

<script>
const firebaseConfig = { databaseURL:"https://my-scorebord-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id') || 'defaultMatch';
const db = firebase.database().ref("matchData/" + matchId);

let curA=0; let curB=0; let camOpposite=false; let allTeams=[]; 
let nextMatches=[]; let upcomingEvents=[];

function setSafely(id, val) {
    const el = document.getElementById(id);
    if(el && document.activeElement !== el && document.activeElement !== document.getElementById('matchRoundSelect')) {
        el.value = val || "";
    }
}

function syncField(key, val) { db.update({ [key]: val }); }
function syncFieldArrayTeams(val) { let arr = val.split("\n").map(t=>t.trim()).filter(t=>t!==''); db.update({ allTeams: arr }); }

function syncPrizeField(key, val) {
    db.update({ [key]: val }).then(() => recalcPrizesString());
}

function recalcPrizesString() {
    let pzArr = [];
    let op1 = document.getElementById("pzOp1").value; let op2 = document.getElementById("pzOp2").value; let opBest = document.getElementById("pzOpBest").value;
    if(op1 || op2 || opBest) {
        let parts = [];
        if(op1) parts.push("1st: " + op1); if(op2) parts.push("2nd: " + op2); if(opBest) parts.push("Best: " + opBest);
        pzArr.push("🔥 OPEN: " + parts.join(" | "));
    }
    let wtKgRaw = document.getElementById("pzWtKg").value; let wtKgDisplay = wtKgRaw ? wtKgRaw : "WEIGHT";
    let wt1 = document.getElementById("pzWt1").value; let wt2 = document.getElementById("pzWt2").value; let wtBest = document.getElementById("pzWtBest").value;
    if(wt1 || wt2 || wtBest) {
        let parts = [];
        if(wt1) parts.push("1st: " + wt1); if(wt2) parts.push("2nd: " + wt2); if(wtBest) parts.push("Best: " + wtBest);
        pzArr.push("🏋️ " + wtKgDisplay + ": " + parts.join(" | "));
    }
    db.update({ row2Txt: pzArr.join(" 🔴 ") });
}

async function translateToInput(sourceId, targetId) {
    const text = document.getElementById(sourceId).value;
    const targetLang = document.getElementById("targetLang").value; 
    if(!text) return;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        document.getElementById(targetId).value = data[0][0][0];
    } catch(e) { alert("Translation error! Check internet."); }
}

async function translateAndSync(sourceId, targetId, overrideKey = null) {
    const text = document.getElementById(sourceId).value;
    const targetLang = document.getElementById("targetLang").value; 
    if(!text) return;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        const translated = data[0][0][0];
        document.getElementById(targetId).value = translated;
        let dbKey = overrideKey ? overrideKey : targetId;
        db.update({ [dbKey]: translated });
    } catch(e) { alert("Translation error! Check internet."); }
}

db.on("value", (snap) => {
    const data = snap.val();
    if(data) {
        curA = parseFloat(data.scoreA) || 0; curB = parseFloat(data.scoreB) || 0;
        allTeams = data.allTeams || []; nextMatches = data.nextMatches || []; upcomingEvents = data.upcomingEvents || [];

        document.getElementById("dispA").innerText = curA; document.getElementById("dispB").innerText = curB;
        
        setSafely("nameA", data.nameA); setSafely("nameA_pa", data.nameA_pa);
        setSafely("nameB", data.nameB); setSafely("nameB_pa", data.nameB_pa);
        setSafely("roundInp", data.round);
        setSafely("row1Inp", data.row1Txt); setSafely("row1Inp_pa", data.row1Txt_pa);
        setSafely("row3Inp", data.row3Txt); setSafely("row6Inp", data.row6Txt);
        setSafely("watermarkInp", data.watermarkTxt);
        setSafely("pzOp1", data.pzOp1); setSafely("pzOp2", data.pzOp2); setSafely("pzOpBest", data.pzOpBest);
        setSafely("pzWtKg", data.pzWtKg); setSafely("pzWt1", data.pzWt1); setSafely("pzWt2", data.pzWt2); setSafely("pzWtBest", data.pzWtBest);
        setSafely("allTeamsInp", allTeams.join("\n"));

        renderNextMatches(); renderUpcomingEvents(); updateDropdowns();
        
        const sVis = data.scoreVisible !== false;
        document.getElementById("visBtn").innerText = sVis ? "Hide Scoreboard" : "Show Scoreboard";
        camOpposite = data.cameraOpposite || false;
        document.getElementById("teamWrap").style.flexDirection = camOpposite ? "row-reverse" : "row";
        document.getElementById("camBtn").innerText = camOpposite ? "Camera Oppo View" : "Camera View";
    }
});

function addUpcomingEvent() {
    const nameEn = document.getElementById("ueName").value.trim();
    const namePa = document.getElementById("ueName_pa").value.trim();
    const dateVal = document.getElementById("ueDate").value;
    if(nameEn === "") return;
    let dateStr = dateVal ? new Date(dateVal).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : "";
    upcomingEvents.push({ name: nameEn, name_pa: namePa, date: dateStr });
    document.getElementById("ueName").value = ""; document.getElementById("ueName_pa").value = ""; document.getElementById("ueDate").value = "";
    syncUpcomingEventsToDB();
}

function deleteUpcomingEvent(index) { upcomingEvents.splice(index, 1); syncUpcomingEventsToDB(); }

function syncUpcomingEventsToDB() {
    let evEn = upcomingEvents.map((ev, i) => (i+1) + ". " + ev.name + (ev.date ? " (" + ev.date + ")" : "")).join(" | ");
    let evPa = upcomingEvents.map((ev, i) => (i+1) + ". " + (ev.name_pa || ev.name) + (ev.date ? " (" + ev.date + ")" : "")).join(" | ");
    db.update({ upcomingEvents: upcomingEvents, row4Txt: evEn || "UPCOMING EVENTS", row4Txt_pa: evPa || "ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ" });
}

function renderUpcomingEvents() {
    const container = document.getElementById("upcomingEventsContainer");
    if(upcomingEvents.length === 0) { container.innerHTML = `<div style="text-align:center; color:#999; font-size:13px;">No events added yet.</div>`; return; }
    let html = "";
    upcomingEvents.forEach((ev, idx) => {
        let displayDate = ev.date ? `<small style="color:#666;">(${ev.date})</small>` : "";
        let displayName = ev.name_pa ? `${ev.name} / ${ev.name_pa}` : ev.name;
        html += `<div class="event-item"><span>${idx+1}. ${displayName} ${displayDate}</span><button class="btn-red" style="border:none; border-radius:4px; padding:4px 10px; color:white; cursor:pointer;" onclick="deleteUpcomingEvent(${idx})">X</button></div>`;
    });
    container.innerHTML = html;
}

function addSingleTeam() {
    let en = document.getElementById("newTeamEn").value.trim();
    let pa = document.getElementById("newTeamPa").value.trim();
    if(!en) return;
    let combined = pa ? `${en}=${pa}` : en;
    if(!allTeams.includes(combined)) { allTeams.push(combined); db.update({ allTeams: allTeams }); }
    document.getElementById("newTeamEn").value = ""; document.getElementById("newTeamPa").value = "";
}

function updateDropdowns(){
    const a=document.getElementById("teamSelectA"); const b=document.getElementById("teamSelectB");
    const na=document.getElementById("nextTeamA"); const nb=document.getElementById("nextTeamB");
    a.innerHTML='<option value="">Select Team A</option>'; b.innerHTML='<option value="">Select Team B</option>';
    na.innerHTML='<option value="">Select Team 1</option>'; nb.innerHTML='<option value="">Select Team 2</option>';
    
    allTeams.forEach(teamStr => {
        let parts = teamStr.split("=");
        let display = parts[1] ? `${parts[0].trim()} / ${parts[1].trim()}` : parts[0].trim();
        let opt = `<option value="${teamStr}">${display}</option>`;
        a.innerHTML += opt; b.innerHTML += opt; na.innerHTML += opt; nb.innerHTML += opt;
    });
}

function selectTeamA(val){ if(!val) return; let p = val.split("="); db.update({ nameA: p[0].trim(), nameA_pa: p[1] ? p[1].trim() : "" }); }
function selectTeamB(val){ if(!val) return; let p = val.split("="); db.update({ nameB: p[0].trim(), nameB_pa: p[1] ? p[1].trim() : "" }); }

function formatDisplayMatch(matchStr) { return matchStr.replace(/=/g, " / "); }

function renderNextMatches() {
    const container = document.getElementById("nextMatchContainer");
    if(nextMatches.length === 0) { container.innerHTML = `<div style="text-align:center; padding:10px; color:#999; font-size:14px;">No Scheduled Matches</div>`; return; }
    let html = "";
    nextMatches.forEach((matchStr, index) => {
        html += `<div class="match-item">
            <div class="match-title">${formatDisplayMatch(matchStr)}</div>
            <div class="match-actions">
                <button class="btn-sm btn-start" onclick="startSpecificMatch(${index})">START</button>
                <button class="btn-sm btn-delete" onclick="deleteSpecificMatch(${index})">X</button>
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

function addNewMatch(){
    const a = document.getElementById("nextTeamA").value;
    const b = document.getElementById("nextTeamB").value;
    const round = document.getElementById("matchRoundSelect").value;
    const cat = document.getElementById("matchCategoryInp").value.trim();
    if(a === "" || b === "") return;

    let tagParts = [];
    if(cat) tagParts.push(cat);
    if(round) tagParts.push(round);
    let tag = tagParts.join(" - ");

    let matchStr = a + " VS " + b;
    if(tag) matchStr = "(" + tag + ") " + matchStr;

    nextMatches.push(matchStr);
    document.getElementById("nextTeamA").value = ""; document.getElementById("nextTeamB").value = "";
    document.getElementById("matchRoundSelect").value = ""; document.getElementById("matchCategoryInp").value = "";
    
    syncMatchListToDB();
}

function startSpecificMatch(index) {
    let rawMatchStr = nextMatches[index];
    let category = ""; let matchStr = rawMatchStr;
    if(rawMatchStr.startsWith("(")) {
        let parts = rawMatchStr.split(") ");
        category = parts[0].replace("(", "").trim();
        matchStr = parts[1] || rawMatchStr;
    }

    let teams = matchStr.split(" VS ");
    let t1Parts = (teams[0] || "").split("=");
    let t2Parts = (teams[1] || "").split("=");
    
    nextMatches.splice(index, 1);

    let updateObj = { 
        nameA: t1Parts[0].trim(), nameA_pa: t1Parts[1] ? t1Parts[1].trim() : "", 
        nameB: t2Parts[0].trim(), nameB_pa: t2Parts[1] ? t2Parts[1].trim() : "", 
        scoreA: 0, scoreB: 0, scoreVisible: true 
    };

    if(category) { updateObj.round = category; document.getElementById("roundInp").value = category; }

    db.update(updateObj).then(() => syncMatchListToDB());
}

function deleteSpecificMatch(index) {
    nextMatches.splice(index, 1);
    syncMatchListToDB();
}

function syncMatchListToDB() {
    let tEn = ""; let tPa = "";
    nextMatches.forEach(m => {
        let prefix = ""; let main = m;
        if(m.startsWith("(")) { let p = m.split(") "); prefix = p[0] + ") "; main = p[1] || m; }
        let tms = main.split(" VS ");
        let t1 = (tms[0] || "").split("="); let t2 = (tms[1] || "").split("=");
        tEn += `${prefix}${t1[0]} VS ${t2[0]} , `;
        tPa += `${prefix}${t1[1] || t1[0]} VS ${t2[1] || t2[0]} , `;
    });
    db.update({ nextMatches: nextMatches, row5Txt: tEn, row5Txt_pa: tPa });
}

function changeScore(team,val){
    let current=(team==="scoreA")?curA:curB; let newVal;
    if(val>0){ if(curA===0 && curB===0) newVal=1.5; else newVal=current+1; }
    else{ if(current===1.5) newVal=0; else newVal=current-1; if(newVal<0) newVal=0; }
    db.update({ [team]:newVal });
}

function toggleVis(field){ db.child(field).once("value",snap=>{ db.update({ [field]: !snap.val() }); }); }
function swapTeams(){ db.update({ nameA: document.getElementById("nameB").value, nameA_pa: document.getElementById("nameB_pa").value, nameB: document.getElementById("nameA").value, nameB_pa: document.getElementById("nameA_pa").value, scoreA: curB, scoreB: curA }); }
function resetScores(){ if(confirm("Reset Scores?")){ db.update({ scoreA:0, scoreB:0 }); } }
function toggleCameraView(){ db.update({ cameraOpposite: !camOpposite }); }

function showResultLayer(){
    if(curA === 0 && curB === 0){ alert("Score 0-0 hai."); return; }
    if(!confirm("Result update karna chahunde ho?")){ return; }
    const teamA = document.getElementById("nameA").value; const teamB = document.getElementById("nameB").value;
    let winner=""; let loser="";
    if(curA>curB){ winner=teamA; loser=teamB; } else if(curB>curA){ winner=teamB; loser=teamA; } else { winner="TIE"; }
    
    let resTextStr = winner !== "TIE" ? `${winner} WIN vs ${loser} (${curA}-${curB})` : `MATCH TIED (${curA}-${curB})`;
    db.update({ resultText: resTextStr, scoreA: 0, scoreB: 0, nameA: "", nameA_pa: "", nameB: "", nameB_pa: "" });
}

function clearAllTeams(){
    if(confirm("Delete All Teams?")){
        db.update({ allTeams:[], nextMatches:[], upcomingEvents:[], scoreA:0, scoreB:0, nameA:"", nameA_pa:"", nameB:"", nameB_pa:"", resultText:"No Result Yet" });
        document.querySelectorAll('input[type="text"], textarea, input[type="date"]').forEach(el => el.value = '');
    }
}
</script>
