<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Ultra HD Dual Ticker</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* --- HD SCOREBOARD --- */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.5s ease;
            filter: drop-shadow(4px 6px 12px rgba(0,0,0,0.8));
        }
        #top-scoreboard-container.hidden { opacity: 0; }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 65px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        /* Team 1 Side (Royal Blue) */
        .score-a {
            background: #0f3d7a;
            color: #ffcc00;
            font-size: 46px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            font-family: 'Bebas Neue', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        .team-a-panel {
            background: #1a5bb8;
            color: #ffffff;
            font-size: 34px;
            font-weight: 800;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 150px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        .divider { width: 4px; background-color: #ffcc00; }

        /* Team 2 Side (Dark Charcoal) */
        .team-b-panel {
            background: #2d2d2d;
            color: #ffffff;
            font-size: 34px;
            font-weight: 800;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 150px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-transform: uppercase;
        }
        .score-b {
            background: #1a1a1a;
            color: #ffcc00;
            font-size: 46px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            font-family: 'Bebas Neue', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        #match-details-strip {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 20px;
            font-weight: 800;
            padding: 5px 30px;
            margin-top: 6px;
            text-transform: uppercase;
            border-radius: 6px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }
        #match-details-strip.hidden { display: none; }

        /* --- LOGO & WATERMARK --- */
        #logo-container {
            position: absolute; top: 25px; left: 30px; z-index: 9999;
            display: flex; align-items: center; transition: all 0.5s ease;
        }
        #logo-container.hidden { opacity: 0; transform: scale(0.8); }
        #main-logo { height: 90px; width: auto; object-fit: contain; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.6)); }

        #single-wm {
            position: absolute; left: 300px; top: 300px;
            font-family: 'Bebas Neue', sans-serif; font-size: 45px; font-weight: bold;
            color: #ffffff; opacity: 0.45; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9); z-index: 9997; pointer-events: none;
        }

        /* --- DYNAMIC TICKER WRAPPER --- */
        #ticker-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.9);
            transition: opacity 0.5s ease;
            text-transform: uppercase; /* ALL ENGLISH IN CAPS */
        }
        #ticker-wrap.hidden { opacity: 0; }

        .ticker-strip { 
            display: flex; 
            width: 100%; 
            height: 52px;
            transition: all 0.4s ease;
        }

        /* Strip 1 (Top) & Strip 2 (Bottom) Colors */
        .strip-top { background: linear-gradient(90deg, #1a5bb8, #236dd9); border-bottom: 2px solid rgba(0,0,0,0.6); }
        .strip-bot { background: linear-gradient(90deg, #1a1a1a, #2a2a2a); border-top: 1px solid rgba(255,255,255,0.15); }

        .ticker-col {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 25px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* 30% - 40% - 30% Layout */
        .w-30 { width: 30%; }
        .w-40 { width: 40%; background: rgba(0, 0, 0, 0.4); border-left: 2px solid rgba(255,255,255,0.25); border-right: 2px solid rgba(255,255,255,0.25); }
        .text-yellow { color: #ffcc00; }

        /* Step-by-Step Animation */
        .anim-text {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

<div id="logo-container" class="hidden"><img id="main-logo" src="" alt="Logo"></div>
<div id="single-wm">M LIVE</div>

<div id="top-scoreboard-container">
    <div id="main-score-strip">
        <div class="score-a" id="sA">0</div>
        <div class="team-a-panel" id="nA-container"><span id="nA">TEAM 1</span></div>
        <div class="divider"></div>
        <div class="team-b-panel" id="nB-container"><span id="nB">TEAM 2</span></div>
        <div class="score-b" id="sB">0</div>
    </div>
    <div id="match-details-strip" class="hidden"></div>
</div>

<div id="ticker-wrap">
    <div class="ticker-strip strip-top" id="strip-1">
        <div class="ticker-col w-30"><span id="s1-left" class="anim-text">📍 LOCATION</span></div>
        <div class="ticker-col w-40 text-yellow"><span id="s1-mid" class="anim-text">KABADDI TOURNAMENT</span></div>
        <div class="ticker-col w-30"><span id="s1-right" class="anim-text">📅 UPCOMING EVENTS</span></div>
    </div>
    
    <div class="ticker-strip strip-bot" id="strip-2" style="display: none;">
        <div class="ticker-col w-30"><span id="s2-left" class="anim-text">VILLAGE NAME</span></div>
        <div class="ticker-col w-40 text-yellow"><span id="s2-mid" class="anim-text">LIVE MATCHES</span></div>
        <div class="ticker-col w-30"><span id="s2-right" class="anim-text">EVENT DETAILS</span></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);
    const userDb = firebase.database().ref("users/" + matchId);

    userDb.on("value", (snap) => {
        const user = snap.val();
        if (!user || Date.now() > new Date(user.expiryDate).getTime()) {
            document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:black; color:white; font-size:50px; text-align:center;">🛑 PLAN EXPIRED<br><br>HELP LINE: MANPREET MUDKI<br>9115426711</div>`;
        }
    });

    const clientLogos = { "kabaddi101": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png" };

    // Ticker Master Arrays
    let leftItems = [];
    let centerItems = [];
    let rightItems = [];
    
    // Indices & State
    let leftIdx = 0, centerIdx = 0, rightIdx = 0;
    let isEnglish = true; 
    let hasMatches = false;

    db.on("value", (snap) => {
        const data = snap.val() || {}; 
        window.currentData = data; 

        // Logo
        const logoCont = document.getElementById('logo-container');
        if (clientLogos[matchId.trim().toLowerCase()] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[matchId.trim().toLowerCase()];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        // Visibility
        document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
        document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);
        
        // Match Round
        const roundText = data.round || "";
        const detailsStrip = document.getElementById('match-details-strip');
        if (roundText.trim() === "") {
            detailsStrip.classList.add('hidden');
        } else {
            detailsStrip.classList.remove('hidden');
            detailsStrip.innerText = roundText;
        }

        // Scores & Watermark
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('single-wm').innerText = data.watermarkTxt || "M LIVE";

        processTickerData(data);
    });

    function processTickerData(data) {
        // --- 1. BUILD LEFT ITEMS (Village & Prizes: Title Top, Value Bottom) ---
        leftItems = [];
        
        // Village Name
        leftItems.push({
            tEn: "📍 LOCATION", bEn: data.row1Txt || "VILLAGE NAME",
            tPa: "📍 ਸਥਾਨ / ਪਿੰਡ", bPa: data.row1Txt_pa || data.row1Txt || "ਪਿੰਡ"
        });

        // Prize Helper
        let buildPrizeStr = (op, wt, isPa) => {
            let p = [];
            if(op) p.push((isPa ? "ਓਪਨ: " : "OPEN: ") + op);
            if(wt) p.push((isPa ? "ਵਜ਼ਨੀ: " : "WT: ") + wt);
            return p.length > 0 ? p.join(" | ") : (isPa ? "ਕੋਈ ਨਹੀਂ" : "N/A");
        };

        if(data.pzOp1 || data.pzWt1) {
            leftItems.push({
                tEn: "🏆 FIRST PRIZE", bEn: buildPrizeStr(data.pzOp1, data.pzWt1, false),
                tPa: "🏆 ਪਹਿਲਾ ਇਨਾਮ", bPa: buildPrizeStr(data.pzOp1, data.pzWt1, true)
            });
        }
        if(data.pzOp2 || data.pzWt2) {
            leftItems.push({
                tEn: "🏆 SECOND PRIZE", bEn: buildPrizeStr(data.pzOp2, data.pzWt2, false),
                tPa: "🏆 ਦੂਜਾ ਇਨਾਮ", bPa: buildPrizeStr(data.pzOp2, data.pzWt2, true)
            });
        }
        if(data.pzOpBest || data.pzWtBest) {
            leftItems.push({
                tEn: "🏅 BEST PLAYER PRIZE", bEn: buildPrizeStr(data.pzOpBest, data.pzWtBest, false),
                tPa: "🏅 ਬੈਸਟ ਖਿਡਾਰੀਆਂ ਨੂੰ ਇਨਾਮ", bPa: buildPrizeStr(data.pzOpBest, data.pzWtBest, true)
            });
        }

        // --- 2. BUILD CENTER ITEMS (Weight Match Top, Open Match Bottom) ---
        centerItems = [];
        let wtMatches = data.nextMatchesWeight || [];
        let opMatches = data.nextMatchesOpen || [];
        let maxM = Math.max(wtMatches.length, opMatches.length);
        
        hasMatches = maxM > 0;
        
        if(hasMatches) {
            for(let i=0; i<maxM; i++) {
                let wt = wtMatches[i % wtMatches.length] || "NO MATCH";
                let op = opMatches[i % opMatches.length] || "NO MATCH";
                
                let splitMatch = (m) => {
                    if(m === "NO MATCH") return {en: "NO MATCH ADDED", pa: "ਕੋਈ ਮੈਚ ਨਹੀਂ"};
                    let prefix = ""; let main = m;
                    if(m.startsWith("(")) { let p = m.split(") "); prefix = p[0] + ") "; main = p[1] || m; }
                    let tms = main.split(" VS ");
                    let t1 = (tms[0] || "").split(" / "); let t2 = (tms[1] || "").split(" / ");
                    let en = `${prefix}${t1[0]?.trim()} VS ${t2[0]?.trim()}`;
                    let pa = `${prefix}${t1[1]?.trim() || t1[0]?.trim()} VS ${t2[1]?.trim() || t2[0]?.trim()}`;
                    return {en, pa};
                };
                
                let wM = splitMatch(wt);
                let oM = splitMatch(op);
                
                centerItems.push({
                    tEn: `🏋️ WEIGHT: ${wM.en}`, bEn: `🔥 OPEN: ${oM.en}`,
                    tPa: `🏋️ ਵਜ਼ਨੀ: ${wM.pa}`, bPa: `🔥 ਓਪਨ: ${oM.pa}`
                });
            }
        } else {
            // Fallback for Single Strip Mode
            centerItems.push({
                tEn: "KABADDI TOURNAMENT", bEn: "LIVE UPDATES",
                tPa: "ਕਬੱਡੀ ਟੂਰਨਾਮੈਂਟ", bPa: "ਲਾਈਵ ਅੱਪਡੇਟ"
            });
        }

        // --- 3. BUILD RIGHT ITEMS (Upcoming Events Top, Info Bottom) ---
        rightItems = [];
        if(data.upcomingEvents && data.upcomingEvents.length > 0) {
            data.upcomingEvents.forEach(ev => {
                let d = ev.date ? ` (${ev.date})` : "";
                rightItems.push({
                    tEn: "📅 UPCOMING EVENTS", bEn: `${ev.name}${d}`,
                    tPa: "📅 ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ", bPa: `${ev.name_pa || ev.name}${d}`
                });
            });
        }
        if(data.row6Txt || data.row6Txt_pa) {
            rightItems.push({
                tEn: "📞 FOR BOOKING & ADS", bEn: data.row6Txt || "CONTACT US",
                tPa: "📞 ਬੁਕਿੰਗ ਅਤੇ ਐਡ ਲਈ", bPa: data.row6Txt_pa || data.row6Txt || "ਸੰਪਰਕ ਕਰੋ"
            });
        }
        if(rightItems.length === 0) {
            rightItems.push({
                tEn: "📅 UPCOMING EVENTS", bEn: "STAY TUNED",
                tPa: "📅 ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ", bPa: "ਦੇਖਦੇ ਰਹੋ"
            });
        }
        
        // Layout Toggle
        document.getElementById('strip-2').style.display = hasMatches ? 'flex' : 'none';
        
        // Initial Render
        if(document.getElementById('s1-left').innerText === "📍 LOCATION") {
            renderTicker();
        }
    }

    function animateText(elementId, newText) {
        const el = document.getElementById(elementId);
        if (!el || el.innerText === newText) return; 
        
        el.style.opacity = 0;
        el.style.transform = 'translateY(-15px)'; 
        
        setTimeout(() => {
            el.innerText = newText;
            el.style.transform = 'translateY(15px)'; 
            setTimeout(() => { el.style.opacity = 1; el.style.transform = 'translateY(0)'; }, 60);
        }, 450); 
    }

    function renderTicker() {
        let L = leftItems[leftIdx % leftItems.length];
        let C = centerItems[centerIdx % centerItems.length];
        let R = rightItems[rightIdx % rightItems.length];

        if(hasMatches) {
            // Double Strip Output
            animateText('s1-left', isEnglish ? L.tEn : L.tPa);
            animateText('s2-left', isEnglish ? L.bEn : L.bPa);
            
            animateText('s1-mid', isEnglish ? C.tEn : C.tPa);
            animateText('s2-mid', isEnglish ? C.bEn : C.bPa);
            
            animateText('s1-right', isEnglish ? R.tEn : R.tPa);
            animateText('s2-right', isEnglish ? R.bEn : R.bPa);
        } else {
            // Single Strip Output (Combined)
            animateText('s1-left', isEnglish ? `${L.tEn}: ${L.bEn}` : `${L.tPa}: ${L.bPa}`);
            animateText('s1-mid', isEnglish ? C.tEn : C.tPa);
            animateText('s1-right', isEnglish ? `${R.tEn}: ${R.bEn}` : `${R.tPa}: ${R.bPa}`);
        }
    }

    // MASTER ANIMATION LOOP (Language Toggle & Step-by-Step Cycle)
    setInterval(() => {
        // Only advance the arrays when we switch back to English 
        // (so each item is shown once in English, then once in Punjabi)
        if(!isEnglish) {
            leftIdx++;
            centerIdx++;
            rightIdx++;
        }
        
        // Toggle Global Language State
        isEnglish = !isEnglish; 
        
        // Scoreboard Bilingual Sync
        let d = window.currentData;
        if(d) {
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "TEAM 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "TEAM 2");
        }
        
        renderTicker();
    }, 4500); // 4.5 seconds per language

    // Moving Watermark
    const wm = document.getElementById('single-wm');
    let x = 200, y = 200, dx = 1.8, dy = 1.4;
    function animateWatermark() {
        const maxX = 1920 - wm.offsetWidth - 50;
        const maxY = 950 - wm.offsetHeight;
        x += dx; y += dy;
        if (x <= 50 || x >= maxX) dx *= -1;
        if (y <= 120 || y >= maxY) dy *= -1;
        wm.style.left = x + 'px'; wm.style.top = y + 'px';
        requestAnimationFrame(animateWatermark);
    }
    animateWatermark();

</script>
</body>
</html>
