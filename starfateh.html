<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Ultra HD Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* --- SCOREBOARD (AUTO WIDTH & DUAL COLOR) --- */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.5s ease;
            filter: drop-shadow(4px 6px 12px rgba(0,0,0,0.8));
        }
        #top-scoreboard-container.hidden { opacity: 0; }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        /* Team 1 Side (Royal Blue) */
        .score-a {
            background: #0f3d7a;
            color: #ffcc00;
            font-size: 44px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            font-family: 'Bebas Neue', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        .team-a-panel {
            background: #1a5bb8;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 150px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .divider {
            width: 4px;
            background-color: #ffcc00;
        }

        /* Team 2 Side (Dark Charcoal) */
        .team-b-panel {
            background: #2d2d2d;
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            min-width: 150px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .score-b {
            background: #1a1a1a;
            color: #ffcc00;
            font-size: 44px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            font-family: 'Bebas Neue', sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        #match-details-strip {
            background: rgba(0, 0, 0, 0.85);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            padding: 4px 25px;
            margin-top: 5px;
            text-transform: uppercase;
            border-radius: 6px;
            letter-spacing: 1.5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #match-details-strip.hidden { display: none; }

        /* --- LOGO & WATERMARK --- */
        #logo-container {
            position: absolute; top: 25px; left: 30px; z-index: 9999;
            display: flex; align-items: center; transition: all 0.5s ease;
        }
        #logo-container.hidden { opacity: 0; transform: scale(0.8); }
        #main-logo { height: 85px; width: auto; object-fit: contain; filter: drop-shadow(3px 5px 8px rgba(0,0,0,0.6)); }

        #single-wm {
            position: absolute; left: 300px; top: 300px;
            font-family: 'Bebas Neue', sans-serif; font-size: 42px; font-weight: bold;
            color: #ffffff; opacity: 0.45; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9); z-index: 9997; pointer-events: none;
        }

        /* --- DYNAMIC TICKER WRAPPER --- */
        #ticker-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.9);
            transition: opacity 0.5s ease;
        }
        #ticker-wrap.hidden { opacity: 0; }

        .ticker-strip { 
            display: flex; 
            width: 100%; 
            height: 48px;
            transition: all 0.4s ease;
        }

        /* Strip Colors based on 30-40-30 layout */
        .strip-blue { background: linear-gradient(90deg, #1a5bb8, #236dd9); border-bottom: 2px solid rgba(0,0,0,0.5); }
        .strip-dark { background: linear-gradient(90deg, #1a1a1a, #2a2a2a); border-top: 1px solid rgba(255,255,255,0.15); }

        .ticker-col {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 24px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }

        .w-30 { width: 30%; }
        .w-40 { width: 40%; background: rgba(0, 0, 0, 0.4); border-left: 2px solid rgba(255,255,255,0.2); border-right: 2px solid rgba(255,255,255,0.2); }
        .text-yellow { color: #ffcc00; }

        /* Step-by-Step Animation */
        .anim-text {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

<div id="logo-container" class="hidden"><img id="main-logo" src="" alt="Logo"></div>
<div id="single-wm">M LIVE</div>

<div id="top-scoreboard-container">
    <div id="main-score-strip">
        <div class="score-a" id="sA">0</div>
        <div class="team-a-panel" id="nA-container"><span id="nA">ਟੀਮ 1</span></div>
        <div class="divider"></div>
        <div class="team-b-panel" id="nB-container"><span id="nB">ਟੀਮ 2</span></div>
        <div class="score-b" id="sB">0</div>
    </div>
    <div id="match-details-strip" class="hidden"></div>
</div>

<div id="ticker-wrap">
    
    <div class="ticker-strip strip-blue" id="strip-1">
        <div class="ticker-col w-30"><span id="s1-left" class="anim-text">LOCATION</span></div>
        <div class="ticker-col w-40 text-yellow"><span id="s1-mid" class="anim-text">KABADDI TOURNAMENT</span></div>
        <div class="ticker-col w-30"><span id="s1-right" class="anim-text">UPDATES</span></div>
    </div>
    
    <div class="ticker-strip strip-dark" id="strip-2" style="display: none;">
        <div class="ticker-col w-30"><span id="s2-left" class="anim-text">LIVE MATCHES</span></div>
        <div class="ticker-col w-40 text-yellow"><span id="s2-mid" class="anim-text">MATCH LIST</span></div>
        <div class="ticker-col w-30"><span id="s2-right" class="anim-text">UPCOMING EVENTS</span></div>
    </div>

</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);
    const userDb = firebase.database().ref("users/" + matchId);

    userDb.on("value", (snap) => {
        const user = snap.val();
        if (!user || Date.now() > new Date(user.expiryDate).getTime()) {
            document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:black; color:white; font-size:50px; text-align:center;">🛑 PLAN EXPIRED<br><br>HELP LINE: MANPREET MUDKI<br>9115426711</div>`;
        }
    });

    const clientLogos = { "kabaddi101": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png" };

    // Ticker Arrays & Indices
    let s1LeftArr = []; let s1LeftIdx = 0;
    let s1MidArr = []; let s1MidIdx = 0;
    let s1RightArr = []; let s1RightIdx = 0;
    
    let s2LeftArr = []; let s2LeftIdx = 0;
    let s2MidArr = []; let s2MidIdx = 0;
    let s2RightArr = []; let s2RightIdx = 0;
    
    let isPunjabiScoreboard = true;
    let hasMatches = false;

    // Real-time DB Listener
    db.on("value", (snap) => {
        const data = snap.val() || {}; 
        window.currentData = data; 

        // Logo
        const logoCont = document.getElementById('logo-container');
        if (clientLogos[matchId.trim().toLowerCase()] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[matchId.trim().toLowerCase()];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        // Visibility
        document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
        document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);
        
        // Match Round
        const roundText = data.round || "";
        const detailsStrip = document.getElementById('match-details-strip');
        if (roundText.trim() === "") {
            detailsStrip.classList.add('hidden');
        } else {
            detailsStrip.classList.remove('hidden');
            detailsStrip.innerText = roundText;
        }

        // Scores & Watermark
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('single-wm').innerText = data.watermarkTxt || "M LIVE";

        processTickerData(data);
    });

    function processTickerData(data) {
        let allMatches = [...(data.nextMatchesWeight || []), ...(data.nextMatchesOpen || [])];
        hasMatches = allMatches.length > 0;

        // Base Data Collections
        let villageArr = [];
        if(data.row1Txt) villageArr.push("📍 " + data.row1Txt);
        if(data.row1Txt_pa) villageArr.push("📍 " + data.row1Txt_pa);
        if(villageArr.length === 0) villageArr = ["WELCOME TO LIVE KABADDI"];

        let prizesArr = [];
        if(data.pzOp1) prizesArr.push("🔥 ਓਪਨ 1st: " + data.pzOp1);
        if(data.pzOp2) prizesArr.push("🔥 ਓਪਨ 2nd: " + data.pzOp2);
        if(data.pzOpBest) prizesArr.push("🔥 ਬੈਸਟ (OPEN): " + data.pzOpBest);
        let wtKg = data.pzWtKg ? data.pzWtKg : "WEIGHT";
        if(data.pzWt1) prizesArr.push(`🏋️ ${wtKg} 1st: ${data.pzWt1}`);
        if(data.pzWt2) prizesArr.push(`🏋️ ${wtKg} 2nd: ${data.pzWt2}`);
        if(data.pzWtBest) prizesArr.push(`🏋️ ਬੈਸਟ (${wtKg}): ${data.pzWtBest}`);
        if(prizesArr.length === 0) prizesArr = ["🏆 KABADDI PRIZES"];

        let sponsorArr = [];
        if(data.row2Txt) sponsorArr.push(data.row2Txt);
        if(data.row2Txt_pa) sponsorArr.push(data.row2Txt_pa);
        if(sponsorArr.length === 0) sponsorArr = ["KABADDI TOURNAMENT LIVE"];

        let bookingArr = [];
        if(data.row6Txt) bookingArr.push("📞 " + data.row6Txt);
        if(bookingArr.length === 0) bookingArr = ["LIKE & SHARE LIVE STREAM"];

        let eventsArr = [];
        if(data.upcomingEvents && data.upcomingEvents.length > 0) {
            data.upcomingEvents.forEach((ev, i) => {
                let dStr = ev.date ? ` (${ev.date})` : "";
                eventsArr.push(`🗓️ ${i+1}. ${ev.name}${dStr}`);
                if(ev.name_pa) eventsArr.push(`🗓️ ${i+1}. ${ev.name_pa}${dStr}`);
            });
        } else {
            eventsArr = ["UPCOMING KABADDI EVENTS", "ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ"];
        }

        let matchDisplayArr = [];
        allMatches.forEach(m => {
            let prefix = ""; let mainStr = m;
            if(m.startsWith("(")) { let pts = m.split(") "); prefix = pts[0] + ") "; mainStr = pts[1] || m; }
            let teams = mainStr.split(" VS ");
            let t1 = (teams[0] || "").split(" / "); let t2 = (teams[1] || "").split(" / ");
            matchDisplayArr.push(`👉 ${prefix}${t1[0]?.trim()} VS ${t2[0]?.trim()}`);
            if(t1[1] || t2[1]) matchDisplayArr.push(`👉 ${prefix}${t1[1]?.trim() || t1[0]?.trim()} VS ${t2[1]?.trim() || t2[0]?.trim()}`);
        });

        // --- DYNAMIC TICKER ASSIGNMENT ---
        const strip2 = document.getElementById('strip-2');

        if (hasMatches) {
            strip2.style.display = 'flex';
            
            // STRIP 1 (Double Mode)
            s1LeftArr = villageArr;
            s1MidArr = prizesArr;
            s1RightArr = bookingArr;

            // STRIP 2 (Double Mode)
            s2LeftArr = ["LIVE MATCHES", "ਲਾਈਵ ਮੈਚ ਅੱਪਡੇਟ"];
            s2MidArr = matchDisplayArr;
            s2RightArr = eventsArr;
            
        } else {
            strip2.style.display = 'none';
            
            // STRIP 1 (Single Mode)
            s1LeftArr = [...villageArr, ...prizesArr];
            s1MidArr = sponsorArr;
            s1RightArr = [...eventsArr, ...bookingArr];
        }

        // Initialize empty text to avoid blanks
        if(document.getElementById('s1-left').innerText === "LOCATION") {
            document.getElementById('s1-left').innerText = s1LeftArr[0];
            document.getElementById('s1-mid').innerText = s1MidArr[0];
            document.getElementById('s1-right').innerText = s1RightArr[0];
            if(hasMatches) {
                document.getElementById('s2-left').innerText = s2LeftArr[0];
                document.getElementById('s2-mid').innerText = s2MidArr[0];
                document.getElementById('s2-right').innerText = s2RightArr[0];
            }
        }
    }

    // Animation Function
    function animateTextChange(elementId, newText) {
        const el = document.getElementById(elementId);
        if (!el || el.innerText === newText) return; 
        
        el.style.opacity = 0;
        el.style.transform = 'translateY(-15px)'; 
        
        setTimeout(() => {
            el.innerText = newText;
            el.style.transform = 'translateY(15px)'; 
            setTimeout(() => { el.style.opacity = 1; el.style.transform = 'translateY(0)'; }, 50);
        }, 400); 
    }

    // Master Animation Loop
    setInterval(() => {
        // Scoreboard Bilingual
        if(window.currentData) {
            isPunjabiScoreboard = !isPunjabiScoreboard;
            let d = window.currentData;
            document.getElementById('nA').innerText = (isPunjabiScoreboard && d.nameA_pa) ? d.nameA_pa : (d.nameA || "TEAM 1");
            document.getElementById('nB').innerText = (isPunjabiScoreboard && d.nameB_pa) ? d.nameB_pa : (d.nameB || "TEAM 2");
        }

        // Strip 1 Cycle
        if(s1LeftArr.length > 0) { s1LeftIdx = (s1LeftIdx + 1) % s1LeftArr.length; animateTextChange('s1-left', s1LeftArr[s1LeftIdx]); }
        if(s1MidArr.length > 0) { s1MidIdx = (s1MidIdx + 1) % s1MidArr.length; animateTextChange('s1-mid', s1MidArr[s1MidIdx]); }
        if(s1RightArr.length > 0) { s1RightIdx = (s1RightIdx + 1) % s1RightArr.length; animateTextChange('s1-right', s1RightArr[s1RightIdx]); }

        // Strip 2 Cycle
        if(hasMatches) {
            if(s2LeftArr.length > 0) { s2LeftIdx = (s2LeftIdx + 1) % s2LeftArr.length; animateTextChange('s2-left', s2LeftArr[s2LeftIdx]); }
            if(s2MidArr.length > 0) { s2MidIdx = (s2MidIdx + 1) % s2MidArr.length; animateTextChange('s2-mid', s2MidArr[s2MidIdx]); }
            if(s2RightArr.length > 0) { s2RightIdx = (s2RightIdx + 1) % s2RightArr.length; animateTextChange('s2-right', s2RightArr[s2RightIdx]); }
        }
    }, 4500);

    // Watermark
    const wm = document.getElementById('single-wm');
    let x = 200, y = 200, dx = 1.8, dy = 1.4;
    function animateWatermark() {
        const maxX = 1920 - wm.offsetWidth - 50;
        const maxY = 950 - wm.offsetHeight;
        x += dx; y += dy;
        if (x <= 50 || x >= maxX) dx *= -1;
        if (y <= 120 || y >= maxY) dy *= -1;
        wm.style.left = x + 'px'; wm.style.top = y + 'px';
        requestAnimationFrame(animateWatermark);
    }
    animateWatermark();

</script>
</body>
</html>
