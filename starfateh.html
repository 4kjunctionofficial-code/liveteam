<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Pro Overlay 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* --- TOP RIGHT SCOREBOARD --- */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.5s ease;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.6));
        }
        #top-scoreboard-container.hidden { opacity: 0; }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 52px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 4px;
            overflow: hidden;
        }

        .score-a {
            background: #4ea2e2; /* Light Blue */
            color: #ffffff;
            font-size: 38px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .team-name-panel {
            background: #111111;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            padding: 0 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 2px;
            background-color: rgba(255, 255, 255, 0.3);
            margin: 10px 0;
        }

        .score-b {
            background: #e2e8f0; /* Light Grey */
            color: #000000;
            font-size: 38px;
            font-weight: 900;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
        }

        #match-details-strip {
            background: #111111;
            color: #ffcc00;
            font-size: 16px;
            font-weight: 800;
            padding: 4px 20px;
            margin-top: 4px;
            text-transform: uppercase;
            border-radius: 4px;
            letter-spacing: 1px;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.5);
        }
        #match-details-strip.hidden { display: none; }

        /* --- LOGO & WATERMARK --- */
        #logo-container {
            position: absolute; top: 25px; left: 30px; z-index: 9999;
            display: flex; align-items: center; transition: all 0.5s ease;
        }
        #logo-container.hidden { opacity: 0; transform: scale(0.8); }
        #main-logo { height: 80px; width: auto; object-fit: contain; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5)); }

        #single-wm {
            position: absolute; left: 300px; top: 300px;
            font-family: 'Bebas Neue', sans-serif; font-size: 38px; font-weight: bold;
            color: #ffffff; opacity: 0.5; text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); z-index: 9997; pointer-events: none;
        }

        /* --- 3-PART BOTTOM TICKER --- */
        #ticker-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 50px;
            z-index: 9998;
            display: flex;
            background: rgba(20, 20, 20, 0.95);
            border-top: 3px solid #4ea2e2;
            box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.8);
            transition: opacity 0.5s ease;
        }
        #ticker-wrap.hidden { opacity: 0; }

        .ticker-box {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 22px;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            position: relative;
        }

        .w-30 { width: 30%; }
        .w-40 { width: 40%; border-left: 2px solid rgba(255,255,255,0.2); border-right: 2px solid rgba(255,255,255,0.2); background: rgba(5,5,5,0.9); color: #ffcc00; }

        .anim-text {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            transform: translateY(0);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }

    </style>
</head>
<body>

<div id="logo-container" class="hidden"><img id="main-logo" src="" alt="Logo"></div>
<div id="single-wm">M LIVE</div>

<div id="top-scoreboard-container">
    <div id="main-score-strip">
        <div class="score-a" id="sA">0</div>
        <div class="team-name-panel" id="nA-container"><span id="nA">ਟੀਮ 1</span></div>
        <div class="divider"></div>
        <div class="team-name-panel" id="nB-container"><span id="nB">ਟੀਮ 2</span></div>
        <div class="score-b" id="sB">0</div>
    </div>
    <div id="match-details-strip" class="hidden"></div>
</div>

<div id="ticker-wrap">
    <div class="ticker-box w-30"><span id="t-left" class="anim-text">VILLAGE NAME</span></div>
    
    <div class="ticker-box w-40"><span id="t-center" class="anim-text">KABADDI TOURNAMENT</span></div>
    
    <div class="ticker-box w-30"><span id="t-right" class="anim-text">UPCOMING EVENTS</span></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);
    const userDb = firebase.database().ref("users/" + matchId);

    // Plan Expiry Check
    userDb.on("value", (snap) => {
        const user = snap.val();
        if (!user || Date.now() > new Date(user.expiryDate).getTime()) {
            document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:black; color:white; font-size:50px; text-align:center;">🛑 PLAN EXPIRED<br><br>HELP LINE: MANPREET MUDKI<br>9115426711</div>`;
        }
    });

    const clientLogos = { "kabaddi101": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png" };

    // Ticker Arrays & Indices
    let leftArr = []; let leftIdx = 0;
    let centerArr = []; let centerIdx = 0;
    let rightArr = []; let rightIdx = 0;
    
    let isPunjabiScoreboard = true;

    // Real-time DB Listener
    db.on("value", (snap) => {
        const data = snap.val() || {}; 

        // Logo
        const logoCont = document.getElementById('logo-container');
        if (clientLogos[matchId.trim().toLowerCase()] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[matchId.trim().toLowerCase()];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        // Visibility
        document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
        document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);
        
        // Match Round
        const roundText = data.round || "";
        const detailsStrip = document.getElementById('match-details-strip');
        if (roundText.trim() === "") {
            detailsStrip.classList.add('hidden');
        } else {
            detailsStrip.classList.remove('hidden');
            detailsStrip.innerText = roundText;
        }

        // Scores & Watermark
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('single-wm').innerText = data.watermarkTxt || "M LIVE";

        // Update Scoreboard Team Names (Bilingual Toggle handled below)
        window.currentData = data; 
        
        // --- BUILD TICKER ARRAYS ---
        
        // 1. LEFT ARRAY (Village & Prizes)
        leftArr = [];
        if(data.row1Txt) leftArr.push("📍 " + data.row1Txt);
        if(data.row1Txt_pa) leftArr.push("📍 " + data.row1Txt_pa);
        
        if(data.pzOp1) leftArr.push("🔥 ਓਪਨ 1st: " + data.pzOp1);
        if(data.pzOp2) leftArr.push("🔥 ਓਪਨ 2nd: " + data.pzOp2);
        if(data.pzOpBest) leftArr.push("🔥 ਬੈਸਟ (OPEN): " + data.pzOpBest);
        
        let wtKg = data.pzWtKg ? data.pzWtKg : "WEIGHT";
        if(data.pzWt1) leftArr.push(`🏋️ ${wtKg} 1st: ${data.pzWt1}`);
        if(data.pzWt2) leftArr.push(`🏋️ ${wtKg} 2nd: ${data.pzWt2}`);
        if(data.pzWtBest) leftArr.push(`🏋️ ਬੈਸਟ (${wtKg}): ${data.pzWtBest}`);
        
        if(leftArr.length === 0) leftArr = ["WELCOME TO LIVE KABADDI"];

        // 2. CENTER ARRAY (Matches)
        centerArr = [];
        let allMatches = [...(data.nextMatchesWeight || []), ...(data.nextMatchesOpen || [])];
        
        if(allMatches.length > 0) {
            allMatches.forEach(m => {
                // Parse format: (72 KG) TeamA_En / TeamA_Pa VS TeamB_En / TeamB_Pa
                let prefix = ""; let mainStr = m;
                if(m.startsWith("(")) {
                    let pts = m.split(") ");
                    prefix = pts[0] + ") ";
                    mainStr = pts[1] || m;
                }
                
                let teams = mainStr.split(" VS ");
                let t1 = (teams[0] || "").split(" / ");
                let t2 = (teams[1] || "").split(" / ");
                
                let t1En = t1[0]?.trim(); let t1Pa = t1[1]?.trim() || t1En;
                let t2En = t2[0]?.trim(); let t2Pa = t2[1]?.trim() || t2En;

                centerArr.push(`👉 ${prefix}${t1En} VS ${t2En}`);
                centerArr.push(`👉 ${prefix}${t1Pa} VS ${t2Pa}`);
            });
        } else {
            centerArr.push(data.row2Txt || "KABADDI TOURNAMENT");
            if(data.row2Txt_pa) centerArr.push(data.row2Txt_pa);
        }

        // 3. RIGHT ARRAY (Upcoming Events & Booking/Ads)
        rightArr = [];
        if(data.upcomingEvents && data.upcomingEvents.length > 0) {
            data.upcomingEvents.forEach((ev, i) => {
                let dStr = ev.date ? ` (${ev.date})` : "";
                rightArr.push(`🗓️ ${i+1}. ${ev.name}${dStr}`);
                if(ev.name_pa) rightArr.push(`🗓️ ${i+1}. ${ev.name_pa}${dStr}`);
            });
        }
        if(data.row6Txt) rightArr.push("📞 " + data.row6Txt);
        if(data.row6Txt_pa) rightArr.push("📞 " + data.row6Txt_pa);
        
        if(rightArr.length === 0) rightArr = ["LIKE & SHARE LIVE STREAM"];
        
        // Trigger initial text
        if(document.getElementById('t-left').innerText === "VILLAGE NAME") {
            document.getElementById('t-left').innerText = leftArr[0];
            document.getElementById('t-center').innerText = centerArr[0];
            document.getElementById('t-right').innerText = rightArr[0];
        }
    });

    // Step-by-Step Animation Function
    function animateTextChange(elementId, newText) {
        const el = document.getElementById(elementId);
        if (el.innerText === newText) return; 
        
        el.style.opacity = 0;
        el.style.transform = 'translateY(-15px)'; 
        
        setTimeout(() => {
            el.innerText = newText;
            el.style.transform = 'translateY(15px)'; 
            
            setTimeout(() => {
                el.style.opacity = 1;
                el.style.transform = 'translateY(0)'; 
            }, 50);
        }, 500); 
    }

    // Master Animation Loop (Every 4.5 Seconds)
    setInterval(() => {
        // Toggle Scoreboard Teams Language
        if(window.currentData) {
            isPunjabiScoreboard = !isPunjabiScoreboard;
            let d = window.currentData;
            document.getElementById('nA').innerText = (isPunjabiScoreboard && d.nameA_pa) ? d.nameA_pa : (d.nameA || "TEAM 1");
            document.getElementById('nB').innerText = (isPunjabiScoreboard && d.nameB_pa) ? d.nameB_pa : (d.nameB || "TEAM 2");
        }

        // Ticker Arrays Cycle
        if(leftArr.length > 0) {
            leftIdx = (leftIdx + 1) % leftArr.length;
            animateTextChange('t-left', leftArr[leftIdx]);
        }
        if(centerArr.length > 0) {
            centerIdx = (centerIdx + 1) % centerArr.length;
            animateTextChange('t-center', centerArr[centerIdx]);
        }
        if(rightArr.length > 0) {
            rightIdx = (rightIdx + 1) % rightArr.length;
            animateTextChange('t-right', rightArr[rightIdx]);
        }
    }, 4500);

    // Moving Watermark
    const wm = document.getElementById('single-wm');
    let x = 200, y = 200, dx = 1.8, dy = 1.4;
    function animateWatermark() {
        const maxX = 1920 - wm.offsetWidth - 50;
        const maxY = 950 - wm.offsetHeight;
        x += dx; y += dy;
        if (x <= 50 || x >= maxX) dx *= -1;
        if (y <= 120 || y >= maxY) dy *= -1;
        wm.style.left = x + 'px'; wm.style.top = y + 'px';
        requestAnimationFrame(animateWatermark);
    }
    animateWatermark();

</script>
</body>
</html>
