<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <!-- Google Fonts Bebas Neue -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        /* Bebas Neue ਫੌਂਟ ਪੂਰੇ ਪੇਜ ਲਈ ਸੈੱਟ ਕੀਤਾ */
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Bebas Neue', sans-serif; overflow: hidden; position: relative; }
        
        /* Logo */
        #logo-container { position: absolute; top: 30px; left: 40px; z-index: 9999; opacity: 1; transition: all 0.7s ease; }
        #logo-container.hidden { opacity: 0; transform: scale(0); }
        #main-logo { height: 100px; width: auto; max-width: 450px; object-fit: contain; filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.3)); }

       #single-wm{
    position:absolute;
    left:300px;
    top:300px;

    font-family:'Bebas Neue',sans-serif;
    font-size:42px;
    font-weight:bold;

    color:#ffffff;                  /* White */
    opacity:0.55;                   /* Transparent */

    text-transform:uppercase;
    letter-spacing:2px;

    text-shadow:
        2px 2px 4px rgba(0,0,0,.8);

    white-space:nowrap;

    z-index:9997;
    pointer-events:none;
    user-select:none;
}
        
        /* SCOREBOARD BACKGROUND */
        #scoreboard { 
            position: absolute; top: 0px; left: 0px; width: 1920px; height: 1080px; 
            z-index: 9999; opacity: 1; transition: opacity 0.7s ease;
            background-image: url('https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/101%20png.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }
        #scoreboard.hidden { opacity: 0; }

.name-area{
    position:absolute;
    top:43px;
    height:50px;
    overflow:hidden;
    white-space:nowrap;
}

#nA-container{
    left:1055px;
    width:275px;
}

#nB-container{
    left:1575px;
    width:275px;
}

.team-text{
    position:absolute;
    top:0;
    white-space:nowrap;
    color:#fff;
    font-size:35px;
    text-transform:uppercase;
    text-shadow:2px 2px 4px #000;
    will-change:transform;
}
        
        .score-box { position: absolute; top: 40px; height: 50px; width: 50px; display: flex; align-items: center; justify-content: center; font-size: 55px; font-weight: bold; color: #000000; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); z-index: 12; }
        #sA { left: 1360px; } 
        #sB { left: 1497px; } 

        .round-display { position: absolute; top: 110px; left: 1450px; transform: translateX(-50%); color: white; font-size: 30px; text-transform: uppercase; text-shadow: 2px 2px 6px #000; z-index: 11; }

        .name-area{
    position:absolute;
    top:43px;
    height:50px;
    overflow:hidden;
    white-space:nowrap;
}

.team-scroller{
    position:absolute;
    white-space:nowrap;
    will-change:transform;
}

        /* TICKER */
        #ticker-wrap { 
            position: absolute; bottom: 0px; left: 0px; width: 1920px; height: 1080px; 
            z-index: 9998; opacity: 1; transition: opacity 0.7s ease;
            background-image: url('https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Copy%20of%20Star%20Kabaddi%20_20260711_110521_0000.png'); 
            background-size: cover; background-position: center; background-repeat: no-repeat;
            pointer-events: none;
        }
        #ticker-wrap.hidden { opacity: 0; }

        /* TICKER 4 ROWS */
        .row-text { position: absolute; display: flex; align-items: center; text-transform: uppercase; overflow: hidden; box-sizing: border-box; white-space: nowrap; padding-left: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .row-1 { bottom: 61px; left: 210px; width: 350px; height: 50px; font-size: 35px; color: #ffffff; }
        .row-2 { bottom: 53px; left: 587px; width: 815px; height: 50px; font-size: 35px; color: #000000; text-shadow: none; }
        .row-3 { bottom: 53px; left: 1425px; width: 550px; height: 50px; font-size: 35px; color: #ffffff; }
        .row-4 { bottom: 2px; left: 200px; width: 1730px; height: 50px; font-size: 30px; color: #ffffff; }
        .scroller{ display:inline-block; white-space:nowrap; position:relative; will-change:transform; }

        /* DATE & TIME */
        .box-time { position: absolute; bottom: 1px; left: 3px; width: 190px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 12; overflow: hidden; }
        .time-wrap, .date-wrap { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease-in-out; }
        .time-str, .date-str { color: #ffffff; font-size: 30px; letter-spacing: 1px; text-shadow: 2px 2px 5px #000; }
    </style>
</head>
<body>

<div id="logo-container" class="hidden">
    <img id="main-logo" src="" alt="Logo">
</div>

<div id="single-wm">M LIVE</div>
    
<div id="scoreboard">
    <div class="name-area" id="nA-container"><div id="nA" style="width:100%; text-align:right;">TEAM 1</div></div>
    <div class="score-box" id="sA">0</div>
    <div class="score-box" id="sB">0</div>
    <div class="name-area" id="nB-container"><div id="nB" style="width:100%; text-align:left;">TEAM 2</div></div>
    <div class="round-display" id="round-display">LIVE MATCH</div>
</div>

<div id="ticker-wrap">
    <div class="row-text row-1" id="c1">WELCOME TO LIVE KABADDI</div>
    <div class="row-text row-2" id="c2">SUBSCRIBE OUR CHANNEL</div>
    <div class="row-text row-3" id="c3">LIKE & SHARE</div>
    <div class="row-text row-4" id="c4">KEEP WATCHING</div> 

    <div class="box-time">
        <div class="time-wrap" id="t-wrap"><div class="time-str" id="live-time"></div></div>
        <div class="date-wrap" id="d-wrap" style="opacity:0;"><div class="date-str" id="live-date"></div></div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);

    const userDb=firebase.database().ref("users/"+matchId);

userDb.on("value",(snap)=>{

const user=snap.val();

if(!user){

document.body.innerHTML=`
<div style="
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
color:white;
font-size:60px;
text-align:center;
font-family:Arial;
">

🛑 PLAN EXPIRED<br><br>

HELP LINE<br>

MANPREET MUDKI<br>

9115426711

</div>
`;

return;

}

const now=Date.now();

const expiry=new Date(user.expiryDate).getTime();

if(now>expiry){

document.body.innerHTML=`
<div style="
width:100vw;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:black;
color:white;
font-size:60px;
text-align:center;
font-family:Arial;
">

🛑 PLAN EXPIRED<br><br>

HELP LINE<br>

MANPREET MUDKI<br>

9115426711

</div>
`;

}

});

    const clientLogos = {
        "test": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png"
    };

    let tickerInitialized = false;

    db.on("value", (snap) => {
        const data = snap.val() || {}; 
        const logoCont = document.getElementById('logo-container');
        const currentId = matchId.trim().toLowerCase();

        if (clientLogos[currentId] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[currentId];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        document.getElementById('scoreboard').classList.toggle('hidden', data.scoreVisible === false);
        document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);
        
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        if(window.lastNameA!==data.nameA){
    window.lastNameA=data.nameA;
    setTeamName("nA-container",data.nameA);
}

if(window.lastNameB!==data.nameB){
    window.lastNameB=data.nameB;
    setTeamName("nB-container",data.nameB);
}
        document.getElementById('single-wm').innerText =
data.watermarkTxt || "M LIVE";
        
        const roundEl = document.getElementById('round-display');
        roundEl.innerText = data.round || "";
        
        updateTickerContent('c1', data.row1Txt || "WELCOME TO LIVE KABADDI");
        updateTickerContent('c2', data.row2Txt || "SUBSCRIBE OUR CHANNEL");
        updateTickerContent('c3', data.row3Txt || "LIKE & SHARE");
        updateTickerContent('c4', data.row4Txt || "THANKS FOR WATCHING");

        if (!tickerInitialized) {
            startTicker('c1', 1.4);
            startTicker('c2', 2.0);
            startTicker('c3', 1.7);
            startTicker('c4', 1.9);
            tickerInitialized = true;
        }
    });

   const teamScrolls = {};

function setTeamName(containerId, txt){

    const box = document.getElementById(containerId);

    if(teamScrolls[containerId]){
        cancelAnimationFrame(teamScrolls[containerId]);
    }

    box.innerHTML="";

    const d=document.createElement("div");

    d.className="team-text";
    d.innerText=txt;

    if(txt.length<=15){

        d.style.position="relative";
        d.style.transform="none";
        d.style.width="100%";
        d.style.textAlign=(containerId==="nA-container")?"right":"left";

        box.appendChild(d);
        return;
    }

    box.appendChild(d);

    let x=box.offsetWidth;

    function animate(){

        x-=2;          // Speed

        if(x<-d.offsetWidth){
            x=box.offsetWidth;
        }

        d.style.transform=`translateX(${x}px)`;

        teamScrolls[containerId]=requestAnimationFrame(animate);

    }

    animate();

}
    
    function updateTickerContent(id, txt) {
        const el = document.getElementById(id);
        const scroller = el.querySelector('.scroller');
        if (scroller) {
            scroller.innerHTML = `${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}`;
        } else {
            el.innerHTML = `<div class="scroller">${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}</div>`;
        }
    }

    function startTicker(id, speed) {
        const el = document.getElementById(id);
        const scroller = el.querySelector('.scroller');
        let x = el.offsetWidth;
        function animate() {
            x -= speed;
            if (x < -scroller.offsetWidth) x = el.offsetWidth;
            scroller.style.transform = `translateX(${x}px)`;
            requestAnimationFrame(animate);
        }
        animate();
    }

    function updateClock() {
        const now = new Date();
        document.getElementById('live-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    let isTime = true;
    setInterval(() => { 
        isTime = !isTime; 
        document.getElementById('t-wrap').style.opacity = isTime ? "1" : "0"; 
        document.getElementById('d-wrap').style.opacity = isTime ? "0" : "1"; 
    }, 3000);

    const wm = document.getElementById('single-wm');

let x = 100;
let y = 250;

let dx = 2.2;
let dy = 1.6;

function animateWatermark() {
    const maxX = 1920 - wm.offsetWidth;
    const minY = 170; // scoreboard ਦੇ ਹੇਠਾਂ
    const maxY = 980 - wm.offsetHeight; // ticker ਤੋਂ ਉੱਪਰ

    x += dx;
    y += dy;

    if (x <= 0 || x >= maxX) {
        dx *= -1;
    }

    if (y <= minY || y >= maxY) {
        dy *= -1;
    }

    wm.style.left = x + 'px';
    wm.style.top = y + 'px';

    requestAnimationFrame(animateWatermark);
}

animateWatermark();
    
</script>
</body>
</html>
