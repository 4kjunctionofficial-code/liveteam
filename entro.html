<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        #main-panel { width: 100%; max-width: 500px; }
        .card { background: white; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-bottom: 20px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-weight: bold; text-transform: uppercase; }
        .settings-section { padding: 15px; background: #fafafa; }
        
        /* Row Control Styles */
        .row-control { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #eee; padding: 10px; border-radius: 8px; }
        .row-control textarea { flex: 1; margin: 0; min-height: 40px; }
        .row-btns { display: flex; flex-direction: column; gap: 5px; }
        .btn-toggle { padding: 5px 10px; font-size: 10px; cursor: pointer; border: none; border-radius: 4px; }
        .speed-slider { width: 60px; }
        
        textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: none; box-sizing: border-box; }
        .btn-full { border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-red { background: #ea4335; }
    </style>
</head>
<body>

<div id="main-panel">
    <div class="card">
        <div class="header">Ticker Control Panel</div>
        <div class="settings-section">
            <!-- Row 1-4 Controls -->
            <div id="ticker-controls"></div>
            <button class="btn-full btn-red" onclick="resetAll()">Reset All Settings</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);

    // Initial Controls Generation
    for(let i=1; i<=4; i++) {
        document.getElementById('ticker-controls').innerHTML += `
            <div class="row-control">
                <textarea id="r${i}Txt" placeholder="Row ${i}" oninput="updateRow(${i})"></textarea>
                <div class="row-btns">
                    <button class="btn-toggle" id="r${i}Vis" onclick="toggleRow(${i})">ON/OFF</button>
                    <input type="range" class="speed-slider" id="r${i}Spd" min="0.5" max="5" step="0.1" oninput="updateRow(${i})">
                </div>
            </div>
        `;
    }

    function updateRow(i) {
        db.child('tickerSettings/row'+i).update({
            text: document.getElementById('r'+i+'Txt').value,
            speed: document.getElementById('r'+i+'Spd').value
        });
    }

    function toggleRow(i) {
        db.child('tickerSettings/row'+i+'/visible').once('value', snap => {
            let status = snap.val() === false ? true : false;
            db.child('tickerSettings/row'+i).update({ visible: status });
        });
    }

    // Load Data
    db.child('tickerSettings').on('value', snap => {
        let data = snap.val() || {};
        for(let i=1; i<=4; i++) {
            let row = data['row'+i] || {text:"", speed: 1.5, visible: true};
            document.getElementById('r'+i+'Txt').value = row.text;
            document.getElementById('r'+i+'Spd').value = row.speed;
            document.getElementById('r'+i+'Vis').style.background = row.visible ? '#28a745' : '#ccc';
            document.getElementById('r'+i+'Vis').innerText = row.visible ? 'ON' : 'OFF';
        }
    });

    function resetAll() { if(confirm("Reset Ticker?")) db.child('tickerSettings').remove(); }
</script>
</body>
</html>
