<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        /* ਸਕੋਰਬੋਰਡ - ਟੀਮਾਂ ਬਾਹਰ, ਸਕੋਰ ਅੰਦਰ */
        #scoreboard { position: absolute; top: 40px; right: 80px; display: flex; align-items: center; z-index: 9999; }
        .team-label { background: #e60000; color: white; padding: 10px 20px; font-weight: 900; font-size: 28px; border-radius: 5px; }
        .score-middle { background: #dcdcdc; color: #000; padding: 10px 20px; font-weight: 900; font-size: 32px; border: 2px solid #555; margin: 0 10px; border-radius: 5px; }

        /* ਟਿੱਕਰ - ਫੋਟੋ ਵਾਲਾ ਡਿਜ਼ਾਈਨ */
        #ticker-wrap { position: absolute; bottom: 0px; left: 0px; width: 1920px; height: 150px; display: flex; align-items: center; }
        .box-live { width: 300px; height: 100%; background: #e60000; color: white; display: flex; align-items: center; justify-content: center; font-size: 80px; font-weight: 900; clip-path: polygon(0 0, 100% 0, 75% 100%, 0 100%); }
        .center-bar { flex: 1; height: 70%; background: #666; display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: bold; margin: 0 -50px; }
        .box-right { width: 300px; height: 100%; background: #e60000; clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%); }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="team-label">TEAM A</div>
    <div class="score-middle">0 VS 0</div>
    <div class="team-label">TEAM B</div>
</div>

<div id="ticker-wrap">
    <div class="box-live">Live</div>
    <div class="center-bar">WELCOME TO KABADDI LIVE</div>
    <div class="box-right"></div>
</div>

</body>
</html>
