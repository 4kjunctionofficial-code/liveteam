<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; }

        /* ਸਕੋਰਬੋਰਡ ਦਾ ਨਵਾਂ ਡਿਜ਼ਾਈਨ (ਜਿਵੇਂ ਫੋਟੋ ਵਿੱਚ ਹੈ) */
        #scoreboard { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; z-index: 9999; }
        
        .team-box { 
            background: #e60000; color: white; padding: 10px 25px; 
            font-weight: 900; font-size: 30px; border-radius: 5px; 
            min-width: 150px; text-align: center; border: 2px solid #555;
        }
        
        .score-center { 
            background: #dcdcdc; color: #000; padding: 5px 20px; 
            font-weight: 900; font-size: 30px; border-radius: 5px; 
            margin: 0 5px; display: flex; flex-direction: column; 
            align-items: center; border: 2px solid #555;
        }
        
        .vs-text { font-size: 24px; }
        .time-text { font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div id="scoreboard">
    <div class="team-box" id="nA">TEAM A</div>
    <div class="score-center">
        <div id="sA_sB">0 VS 0</div>
        <div class="time-text" id="match-time">00:00</div>
    </div>
    <div class="team-box" id="nB">TEAM B</div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);

    db.on("value", (snap) => {
        const data = snap.val() || {};
        document.getElementById('nA').innerText = data.nameA || "TEAM A";
        document.getElementById('nB').innerText = data.nameB || "TEAM B";
        document.getElementById('sA_sB').innerText = (data.scoreA || "0") + " VS " + (data.scoreB || "0");
        document.getElementById('match-time').innerText = data.matchTime || "00:00";
    });
</script>
</body>
</html>
