<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }

        /* ਟਿੱਕਰ ਕੰਟੇਨਰ */
        #ticker-wrap { 
            position: absolute; bottom: 0px; left: 0px; width: 1920px; height: 160px; 
            display: flex; align-items: center; z-index: 9998; 
        }

        /* ਖੱਬਾ ਲਾਲ ਕੋਨਾ (Left Corner \ ) */
        .box-live { 
            width: 280px; height: 100%; background: #e60000; 
            clip-path: polygon(0 0, 100% 0, 70% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 80px; font-weight: 900; color: white;
            border-bottom: 8px solid white; /* ਲਾਲ ਹਿੱਸੇ ਅੰਦਰ ਚਿੱਟੀ ਲਾਈਨ */
        }

        /* ਵਿਚਕਾਰਲਾ ਚਿੱਟਾ ਹਿੱਸਾ */
        .center-wrap { 
            flex: 1; height: 100%; background: white; 
            display: flex; flex-direction: column; justify-content: center;
            margin: 0 -40px; border-top: 8px solid #e60000; border-bottom: 8px solid #e60000;
        }

        .row-text { font-weight: bold; font-size: 35px; color: black; padding-left: 20px; }

        /* ਸੱਜਾ ਲਾਲ ਕੋਨਾ (Right Corner / ) */
        .box-time { 
            width: 300px; height: 100%; background: #e60000; 
            clip-path: polygon(30% 0, 100% 0, 100% 100%, 0 100%);
            display: flex; align-items: center; justify-content: center;
            font-size: 45px; font-weight: bold; color: white;
            border-bottom: 8px solid white;
        }
    </style>
</head>
<body>

<div id="ticker-wrap">
    <div class="box-live">LIVE</div>
    <div class="center-wrap">
        <div class="row-text">WELCOME TO LIVE KABADDI</div>
        <div class="row-text">SUBSCRIBE OUR CHANNEL</div>
    </div>
    <div class="box-time">00:00</div>
</div>

</body>
</html>
