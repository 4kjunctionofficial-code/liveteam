<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>Master Admin - Kabaddi Scoreboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
        }

        body {
            margin: 0; padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .container {
            max-width: 800px; margin: 0 auto;
            background: var(--panel-bg);
            padding: 30px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0; color: var(--accent);
            border-bottom: 2px solid #334155; padding-bottom: 10px;
            font-size: 24px; text-transform: uppercase; letter-spacing: 1px;
        }

        .config-row {
            display: flex; gap: 15px; margin-bottom: 25px;
            background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px;
        }

        label { font-weight: bold; color: #94a3b8; display: block; margin-bottom: 8px; }
        
        select, input {
            background: #0f172a; border: 1px solid #475569;
            color: white; padding: 10px 15px; border-radius: 6px;
            font-size: 16px; outline: none; width: 100%; box-sizing: border-box;
        }
        select:focus, input:focus, textarea:focus { border-color: var(--accent); }

        /* Auto-expanding Textarea Box */
        textarea {
            background: #0f172a; border: 1px solid #475569;
            color: white; padding: 12px; border-radius: 6px;
            font-size: 16px; outline: none; width: 100%; box-sizing: border-box;
            resize: none; min-height: 50px; max-height: 150px;
            overflow-y: hidden; font-family: inherit;
        }

        .hint { font-size: 13px; color: #64748b; margin-top: 5px; }

        /* Numbered List Styling */
        .list-container {
            margin-top: 20px; background: rgba(0,0,0,0.1);
            border-radius: 8px; overflow: hidden;
        }

        .list-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 15px; border-bottom: 1px solid #334155;
            background: #1e293b; transition: 0.2s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: #24344d; }

        .item-text { display: flex; gap: 10px; font-size: 16px; word-break: break-all; }
        .item-num { color: var(--accent); font-weight: bold; min-width: 25px; }

        .delete-btn {
            background: #ef4444; color: white; border: none;
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
            font-size: 13px; font-weight: bold; transition: 0.2s;
        }
        .delete-btn:hover { background: #dc2626; }

        .action-bar { display: flex; justify-content: flex-end; margin-top: 20px; }
        .save-btn {
            background: var(--accent); color: #0f172a; border: none;
            padding: 12px 30px; border-radius: 6px; font-size: 16px;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .save-btn:hover { background: var(--accent-hover); transform: translateY(-1px); }
    </style>
</head>
<body>

<div class="container">
    <h2>🎯 Match Ticker Controller</h2>
    
    <!-- Client ID Selection -->
    <div class="config-row">
        <div style="flex: 1;">
            <label for="clientId">Select Broadcast Client ID</label>
            <select id="clientId">
                <option value="mudki">Mudki Live</option>
                <option value="malloke">Malloke Ferozepur</option>
                <option value="dholewala">Dholewala Moga</option>
            </select>
        </div>
    </div>

    <!-- Match Input Section -->
    <div style="margin-bottom: 15px;">
        <label for="tickerInput">Type Info & Press Enter to Add</label>
        <!-- ਅੱਖਰ ਵਧਣ ਤੇ ਇਹ ਬਾਕਸ ਆਪਣੇ ਆਪ ਵੱਡਾ ਹੋਵੇਗਾ -->
        <textarea id="tickerInput" placeholder="ਇੱਥੇ ਲਿਖੋ ਅਤੇ Enter ਦਬਾਓ..." rows="1"></textarea>
        <div class="hint">💡 ਜੇਕਰ ਅੱਖਰ ਜ਼ਿਆਦਾ ਹੋਣਗੇ, ਬਾਕਸ ਆਪਣੇ ਆਪ ਵੱਡਾ ਹੁੰਦਾ ਜਾਵੇਗਾ। Enter ਦੱਬਣ ਤੇ ਲਿਸਟ ਬਣੇਗੀ।</div>
    </div>

    <!-- Live Numbered List Preview -->
    <label>Current Live Lines (Numbered List):</label>
    <div class="list-container" id="tickerList">
        <!-- Lines will be loaded here dynamically -->
    </div>

    <!-- Push to Firebase Button -->
    <div class="action-bar">
        <button class="save-btn" id="updateLiveBtn">Update Live Broadcast</button>
    </div>
</div>

<!-- Firebase 9+ SDK Module -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const clientIdSelect = document.getElementById('clientId');
    const tickerInput = document.getElementById('tickerInput');
    const tickerList = document.getElementById('tickerList');
    const updateLiveBtn = document.getElementById('updateLiveBtn');

    let currentLines = [];

    // 1. Auto-Expand Box Functionality (ਅੱਖਰਾਂ ਦੇ ਹਿਸਾਬ ਨਾਲ ਬਾਕਸ ਵੱਡਾ ਕਰਨਾ)
    tickerInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    // 2. Capture Enter Key & Add to Numbered List
    tickerInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // ਨਵੀਂ ਲਾਈਨ ਬਣਨ ਤੋਂ ਰੋਕੋ
            const value = this.value.trim();
            
            if (value !== "") {
                currentLines.push(value);
                this.value = "";
                this.style.height = 'auto'; // ਬਾਕਸ ਰੀਸੈੱਟ
                renderList();
            }
        }
    });

    // 3. Render Numbered List HTML UI
    function renderList() {
        tickerList.innerHTML = "";
        if (currentLines.length === 0) {
            tickerList.innerHTML = '<div class="list-item" style="color: #64748b;">ਕੋਈ ਡਾਟਾ ਨਹੀਂ ਹੈ, ਨਵਾਂ ਲਿਖ ਕੇ Enter ਦਬਾਓ।</div>';
            return;
        }

        currentLines.forEach((line, index) => {
            const item = document.createElement('div');
            item.className = 'list-item';
            item.innerHTML = `
                <div class="item-text">
                    <span class="item-num">${index + 1}.</span>
                    <span>${line}</span>
                </div>
                <button class="delete-btn" data-index="${index}">Delete</button>
            `;
            tickerList.appendChild(item);
        });

        // Delete Button Click Handler
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const idx = parseInt(this.getAttribute('data-index'));
                currentLines.splice(idx, 1);
                renderList();
            });
        });
    }

    // 4. Fetch Existing Data from Selected Client
    function loadClientData() {
        const client = clientIdSelect.value;
        const matchRef = ref(db, `users/${client}/matchData`);
        
        onValue(matchRef, (snapshot) => {
            const data = snapshot.val() || {};
            currentLines = [];
            
            // ਓਵਰਲੇਅ ਦੀਆਂ 3 ਪੱਟੀਆਂ ਵਿੱਚੋਂ ਡਾਟਾ ਲੋਡ ਕਰਨਾ
            if (data.row1Txt) currentLines.push(data.row1Txt);
            if (data.row2Txt) currentLines.push(data.row2Txt);
            if (data.row3Txt) currentLines.push(data.row3Txt);
            
            renderList();
        }, { onlyOnce: true });
    }

    clientIdSelect.addEventListener('change', loadClientData);
    loadClientData(); // ਪਹਿਲੀ ਵਾਰ ਰਨ ਕਰਨ ਲਈ

    // 5. Push List Back to Firebase for Overlay (Row 1, Row 2, Row 3)
    updateLiveBtn.addEventListener('click', () => {
        const client = clientIdSelect.value;
        const updateRef = ref(db, `users/${client}/matchData`);

        // ਡਾਟਾ ਨੂੰ ਓਵਰਲੇਅ ਦੇ ਪੈਟਰਨ (row1Txt, row2Txt, row3Txt) ਵਿੱਚ ਫਿਟ ਕਰਨਾ
        const updates = {
            row1Txt: currentLines[0] || "",
            row2Txt: currentLines[1] || "",
            row3Txt: currentLines[2] || ""
        };

        // Firebase ਵਿੱਚ ਸੇਵ ਕਰਨਾ (ਬਾਕੀ ਡਾਟਾ ਜਿਵੇਂ ਸਕੋਰ ਖਰਾਬ ਨਹੀਂ ਹੋਵੇਗਾ)
        set(updateRef, updates)
        .then(() => {
            alert("🚀 ਓਵਰਲੇਅ ਟਿੱਕਰ ਲਾਈਵ ਅਪਡੇਟ ਹੋ ਗਿਆ ਹੈ!");
        })
        .catch((error) => {
            console.error("Error updating:", error);
        });
    });
</script>

</body>
</html>
