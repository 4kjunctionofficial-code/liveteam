<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Live Scoreboard & Expire Notice</title>
    
    <!-- Firebase Core and Database Libraries -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* Base Setup */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background: transparent; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
        }

        /* 1. Scoreboard Container */
        #scoreboard {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            border: 3px solid #ffd700;
            border-radius: 12px;
            padding: 10px 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .team-box {
            display: flex;
            align-items: center;
            color: white;
        }

        .team-name {
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 15px;
        }

        .score-num {
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            background: #000;
            padding: 2px 18px;
            border-radius: 6px;
            min-width: 70px;
            text-align: center;
        }

        .vs-divider {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin: 0 20px;
            opacity: 0.7;
        }

        /* Round Info */
        #round-display {
            background: #da3633;
            color: white;
            font-size: 14px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 2. Watermark / Logo Area */
        #logo-container {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(0,0,0,0.85);
            padding: 8px 15px;
            border-radius: 8px;
            border-left: 4px solid #ffd700;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        /* 3. Ticker / Scrolling Text Wrapper */
        #ticker-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border-top: 3px solid #238636;
            color: white;
            height: 50px;
            display: flex;
            align-items: center;
            overflow: hidden;
            font-size: 20px;
        }

        .ticker-move {
            display: flex;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker-anim 25s linear infinite;
        }

        .ticker-item {
            padding: 0 40px;
            font-weight: 600;
        }

        @keyframes ticker-anim {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* Visibility Utilities */
        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(-20px) translateX(-50%) !important;
        }
        #logo-container.hidden, #ticker-wrap.hidden {
            transform: none !important;
        }

        /* ⚠️ 4. PLAN EXPIRED SCREEN DESIGN */
        .expire-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 13, 15, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .expire-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .expire-box {
            background: #161b22;
            padding: 45px 40px;
            border-radius: 24px;
            border: 3px solid #da3633;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            max-width: 550px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .expire-overlay.show .expire-box {
            transform: scale(1);
        }

        .expire-box h1 {
            color: #da3633;
            font-size: 42px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 900;
        }

        .expire-box p {
            font-size: 19px;
            color: #c9d1d9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .phone-btn {
            background: #238636;
            color: white;
            padding: 16px 32px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            display: inline-block;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(35, 134, 54, 0.4);
            transition: background 0.2s;
        }
        
        .phone-btn:hover {
            background: #2ea043;
        }
    </style>
</head>
<body>

    <!-- 📺 Main Broadcast Overlay Elements -->
    <div id="scoreboard">
        <div class="team-box">
            <span id="nA-container" class="team-name">TEAM 1</span>
            <span id="sA" class="score-num">0</span>
        </div>
        <div class="vs-divider">VS</div>
        <div class="team-box">
            <span id="sB" class="score-num">0</span>
            <span id="nB-container" class="team-name">TEAM 2</span>
        </div>
        <div id="round-display" style="display: none;"></div>
    </div>

    <div id="logo-container">
        <span id="single-wm">M LIVE</span>
    </div>

    <div id="ticker-wrap">
        <div class="ticker-move">
            <span id="c1" class="ticker-item">WELCOME TO LIVE KABADDI</span>
            <span id="c2" class="ticker-item">SUBSCRIBE OUR CHANNEL</span>
            <span id="c3" class="ticker-item">LIKE & SHARE</span>
        </div>
    </div>

    <!-- ⚠️ PLAN EXPIRED SCREEN -->
    <div id="expireScreen" class="expire-overlay">
        <div class="expire-box">
            <h1>⚠️ PLAN EXPIRED</h1>
            <p>ਤੁਹਾਡਾ ਲਾਈਵ ਕਬੱਡੀ ਸਕੋਰਬੋਰਡ ਪਲਾਨ ਖਤਮ ਹੋ ਚੁੱਕਾ ਹੈ। ਦੁਬਾਰਾ ਚਾਲੂ ਕਰਵਾਉਣ ਲਈ ਹੇਠਾਂ ਦਿੱਤੇ ਨੰਬਰ 'ਤੇ ਸੰਪਰਕ ਕਰੋ।</p>
            <a href="tel:+918699640061" class="phone-btn">📞 Helpline: +91 86996 40061</a>
        </div>
    </div>

    <!-- 🧠 Javascript Logic -->
    <script>
        // 🔗 ਤੁਹਾਡਾ ਨਵਾਂ ਫਾਇਰਬੇਸ ਲਿੰਕ ਸੈੱਟ ਕਰ ਦਿੱਤਾ ਹੈ
        const firebaseConfig = { 
            databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" 
        };
        
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const clientID = urlParams.get('id') || "default"; 

        const db = firebase.database().ref("users/" + clientID + "/matchData");
        const planRef = firebase.database().ref("users/" + clientID + "/planStatus");

        // ਚੈੱਕ ਕਰੋ ਕਿ ਪਲਾਨ ਐਕਟਿਵ ਹੈ ਜਾਂ ਐਕਸਪਾਇਰ
        planRef.on("value", (planSnap) => {
            const isExpired = planSnap.val();
            
            if (isExpired === true) {
                // 🛑 ਪਲਾਨ ਬੰਦ - ਸਕੋਰਬੋਰਡ ਹਟਾਓ ਤੇ ਹੈਲਪਲਾਈਨ ਲਿਆਓ
                if(document.getElementById('scoreboard')) document.getElementById('scoreboard').classList.add('hidden');
                if(document.getElementById('ticker-wrap')) document.getElementById('ticker-wrap').classList.add('hidden');
                if(document.getElementById('logo-container')) document.getElementById('logo-container').classList.add('hidden');
                document.getElementById('expireScreen').classList.add('show');
            } else {
                // 🟢 ਪਲਾਨ ਚਾਲੂ - ਹੈਲਪਲਾਈਨ ਲੁਕਾਓ ਤੇ ਲਾਈਵ ਸਕੋਰ ਦੇਖੋ
                document.getElementById('expireScreen').classList.remove('show');
                
                db.on("value", (snap) => {
                    const data = snap.val();
                    if(!data) return; 
                    
                    if(data.logoVisible === false) { document.getElementById('logo-container').classList.add('hidden'); } else { document.getElementById('logo-container').classList.remove('hidden'); }
                    if(data.scoreVisible === false) { document.getElementById('scoreboard').classList.add('hidden'); } else { document.getElementById('scoreboard').classList.remove('hidden'); }
                    if(data.tickerVisible === false) { document.getElementById('ticker-wrap').classList.add('hidden'); } else { document.getElementById('ticker-wrap').classList.remove('hidden'); }
                    
                    document.getElementById('sA').innerText = data.scoreA !== undefined ? data.scoreA : "0";
                    document.getElementById('sB').innerText = data.scoreB !== undefined ? data.scoreB : "0";
                    document.getElementById('nA-container').innerText = data.nameA || "TEAM 1";
                    document.getElementById('nB-container').innerText = data.nameB || "TEAM 2";
                    document.getElementById('single-wm').innerText = data.watermarkTxt || "M LIVE";
                    
                    const roundVal = data.round || "";
                    const roundEl = document.getElementById('round-display');
                    roundEl.innerText = roundVal;
                    roundEl.style.display = roundVal.trim() === "" ? "none" : "block";
                    
                    document.getElementById('c1').innerText = data.row1Txt || "WELCOME TO LIVE KABADDI"; 
                    document.getElementById('c2').innerText = data.row2Txt || "SUBSCRIBE OUR CHANNEL"; 
                    document.getElementById('c3').innerText = data.row3Txt || "LIKE & SHARE"; 
                });
            }
        }, (err) => {
            console.log("Plan Expired or Blocked.");
            if(document.getElementById('scoreboard')) document.getElementById('scoreboard').classList.add('hidden');
            if(document.getElementById('ticker-wrap')) document.getElementById('ticker-wrap').classList.add('hidden');
            if(document.getElementById('logo-container')) document.getElementById('logo-container').classList.add('hidden');
            document.getElementById('expireScreen').classList.add('show');
        });
    </script>
</body>
</html>
