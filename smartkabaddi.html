<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>Kabaddi Scoreboard & Ticker Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@700;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
    position: relative;
  }

  /* ==================== TOP-LEFT SCOREBOARD ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 32px;
    left: 42px;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 700;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* ==================== TOP-RIGHT WATERMARK ==================== */
  #watermark-box {
    position: absolute;
    top: 32px;
    right: 45px;
    background: linear-gradient(135deg, #111111 0%, #2b2b2b 100%);
    border: 3px solid #f5d800;
    border-radius: 12px;
    padding: 8px 22px;
    color: #f5d800;
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: none;
    z-index: 15;
  }

  /* ==================== BOTTOM TICKER BAR ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 126px;
    display: flex;
    background: #0a0a0a;
    border-top: 3px solid #f5d800;
    z-index: 10;
  }

  .live-badge-box {
    width: 225px;
    height: 100%;
    background: linear-gradient(180deg, #ffe600 0%, #e5be00 100%);
    clip-path: polygon(0 0, 100% 0, 84% 100%, 0% 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 24px;
    z-index: 5;
    flex-shrink: 0;
  }

  .live-text {
    font-family: 'Oswald', sans-serif;
    font-size: 56px;
    font-weight: 700;
    color: #0e6b1d;
    letter-spacing: 2px;
    animation: pulseLive 1.4s infinite ease-in-out;
  }

  @keyframes pulseLive {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.06); opacity: 0.85; }
  }

  .ticker-rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-left: -38px;
    margin-right: -38px;
    z-index: 2;
    overflow: hidden;
    background: #0d0d0d;
  }

  .t-row-1 {
    height: 44px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 29px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 50px;
    white-space: nowrap;
    overflow: hidden;
  }

  .t-row-2 {
    height: 42px;
    background: linear-gradient(180deg, #ffe600 0%, #e0b800 100%);
    color: #000000;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    overflow: hidden;
    position: relative;
    border-top: 2px solid #000000;
    border-bottom: 2px solid #000000;
  }

  .t-row-3 {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 25px;
    font-weight: 700;
    overflow: hidden;
    position: relative;
  }

  .ticker-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .ticker-stream {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0, -50%, 0);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }

  .ticker-chunk {
    display: inline-block;
    padding-right: 70px;
  }

  /* Right PNG Logo Box */
  .right-graphic-box {
    width: 225px;
    height: 100%;
    background: linear-gradient(180deg, #ffe600 0%, #d4ad00 100%);
    clip-path: polygon(18% 0, 100% 0, 100% 100%, 0% 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 26px;
    padding-right: 12px;
    z-index: 5;
    flex-shrink: 0;
  }

  #pngLogoImg {
    max-width: 165px;
    max-height: 104px;
    object-fit: contain;
    display: none;
  }

  #defaultLogoBadge {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .prize-bag-icon {
    font-size: 50px;
    line-height: 1;
  }

  .prize-bag-label {
    font-size: 18px;
    font-weight: 900;
    color: #0e521b;
    text-transform: uppercase;
    margin-top: 2px;
  }
</style>
</head>
<body>

  <!-- SCOREBOARD -->
  <div id="scoreboard-wrapper">
    <div class="sb-main">
      <div class="hex-wrap">
        <div class="hex-box hex-left" id="scoreLeft">0</div>
      </div>

      <div class="teams-bars">
        <div class="team-bar bar-top" id="teamTop">TEAM A</div>
        <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
      </div>

      <div class="hex-wrap">
        <div class="hex-box hex-right" id="scoreRight">0</div>
      </div>
    </div>
    <div class="sb-round" id="roundDisplay">KABADDI TOURNAMENT</div>
  </div>

  <!-- WATERMARK -->
  <div id="watermark-box">M LIVE</div>

  <!-- 3-ROW TICKER -->
  <div id="bottom-ticker-bar">
    <div class="live-badge-box">
      <div class="live-text">LIVE</div>
    </div>

    <div class="ticker-rows">
      <div class="t-row-1" id="row1Header">KABADDI TOURNAMENT LIVE</div>

      <div class="t-row-2">
        <div class="ticker-viewport">
          <div class="ticker-stream" id="streamRow2">
            <span class="ticker-chunk" id="chunk2A">WELCOME TO LIVE KABADDI BROADCAST</span>
            <span class="ticker-chunk" id="chunk2B">WELCOME TO LIVE KABADDI BROADCAST</span>
          </div>
        </div>
      </div>

      <div class="t-row-3">
        <div class="ticker-viewport">
          <div class="ticker-stream" id="streamRow3">
            <span class="ticker-chunk" id="chunk3A">STAY TUNED FOR UPCOMING MATCHES</span>
            <span class="ticker-chunk" id="chunk3B">STAY TUNED FOR UPCOMING MATCHES</span>
          </div>
        </div>
      </div>
    </div>

    <!-- PNG LOGO AREA -->
    <div class="right-graphic-box">
      <img id="pngLogoImg" alt="PNG Logo">
      <div id="defaultLogoBadge">
        <div class="prize-bag-icon">💰</div>
        <div class="prize-bag-label">KABADDI CUP</div>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('id') || 'defaultMatch';
  const langMode = urlParams.get('lang') || 'en';
  // Je URL vich ?logo=https://.../logo.png pass kita hove tan oh vi turant kam karega
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const db = firebase.database().ref("matchData/" + matchId);

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && paVal.trim() !== "") return paVal.trim();
    return (enVal || "").trim();
  }

  function applyPngLogo(url) {
    const imgEl = document.getElementById("pngLogoImg");
    const defaultEl = document.getElementById("defaultLogoBadge");
    const cleanUrl = (url || "").trim();

    if (!cleanUrl) {
      imgEl.onload = null;
      imgEl.onerror = null;
      imgEl.removeAttribute("src");
      imgEl.style.display = "none";
      defaultEl.style.display = "flex";
      return;
    }

    imgEl.onload = () => {
      imgEl.style.display = "block";
      defaultEl.style.display = "none";
    };
    imgEl.onerror = () => {
      imgEl.style.display = "none";
      defaultEl.style.display = "flex";
    };
    imgEl.src = cleanUrl;
  }

  const scrollers = {};

  function setupScroller(streamId, chunkAId, chunkBId, text, speedPxPerSec) {
    const stream = document.getElementById(streamId);
    const chunkA = document.getElementById(chunkAId);
    const chunkB = document.getElementById(chunkBId);

    const cleanText = (text && text.trim()) ? text.trim() : "LIVE KABADDI BROADCAST";
    chunkA.textContent = cleanText;
    chunkB.textContent = cleanText;

    requestAnimationFrame(() => {
      let singleWidth = chunkA.getBoundingClientRect().width;
      const viewportWidth = stream.parentElement.getBoundingClientRect().width || 1500;

      if (singleWidth < viewportWidth) {
        const repeatCount = Math.ceil((viewportWidth * 1.4) / Math.max(singleWidth, 120));
        const repeated = Array(repeatCount).fill(cleanText).join("   ★   ");
        chunkA.textContent = repeated;
        chunkB.textContent = repeated;
        singleWidth = chunkA.getBoundingClientRect().width;
      }

      if (!scrollers[streamId]) {
        scrollers[streamId] = {
          el: stream,
          x: 0,
          width: singleWidth || 600,
          speed: speedPxPerSec,
          lastTime: performance.now()
        };
      } else {
        scrollers[streamId].width = singleWidth || 600;
        scrollers[streamId].speed = speedPxPerSec;
      }
    });
  }

  function tickScrollers(now) {
    Object.values(scrollers).forEach((s) => {
      const dt = Math.min((now - s.lastTime) / 1000, 0.1);
      s.lastTime = now;
      s.x -= s.speed * dt;
      if (Math.abs(s.x) >= s.width) {
        s.x += s.width;
      }
      s.el.style.transform = `translate3d(${s.x.toFixed(2)}px, -50%, 0)`;
    });
    requestAnimationFrame(tickScrollers);
  }
  requestAnimationFrame(tickScrollers);

  if (queryLogoUrl) {
    applyPngLogo(queryLogoUrl);
  }

  db.on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    const sbWrapper = document.getElementById("scoreboard-wrapper");
    sbWrapper.style.opacity = (data.scoreVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    const scoreA = data.scoreA !== undefined ? data.scoreA : 0;
    const scoreB = data.scoreB !== undefined ? data.scoreB : 0;

    if (data.cameraOpposite) {
      document.getElementById("teamTop").innerText = nameB;
      document.getElementById("scoreLeft").innerText = scoreB;
      document.getElementById("teamBottom").innerText = nameA;
      document.getElementById("scoreRight").innerText = scoreA;
    } else {
      document.getElementById("teamTop").innerText = nameA;
      document.getElementById("scoreLeft").innerText = scoreA;
      document.getElementById("teamBottom").innerText = nameB;
      document.getElementById("scoreRight").innerText = scoreB;
    }

    document.getElementById("roundDisplay").innerText = data.round || "";

    const wmBox = document.getElementById("watermark-box");
    if (data.watermarkTxt && data.watermarkTxt.trim() !== "") {
      wmBox.innerText = data.watermarkTxt.trim();
      wmBox.style.display = "block";
    } else {
      wmBox.style.display = "none";
    }

    applyPngLogo(queryLogoUrl || data.logoUrl);

    const village = getText(data.row1Txt, data.row1Txt_pa);
    const program = getText(data.programTxt, data.programTxt_pa);
    let headerParts = [];
    if (village) headerParts.push(village);
    if (program) headerParts.push(program);
    document.getElementById("row1Header").innerText = headerParts.join(" — ") || "KABADDI LIVE";

    let row2Items = [];

    let cat1Parts = [];
    if (data.pzTitle1) cat1Parts.push(`🏆 ${data.pzTitle1}:`);
    if (data.pzOp1) cat1Parts.push(`1st: ${data.pzOp1}`);
    if (data.pzOp2) cat1Parts.push(`2nd: ${data.pzOp2}`);
    if (data.pzOpBest) cat1Parts.push(`Best: ${data.pzOpBest}`);
    if (cat1Parts.length > 0) row2Items.push(cat1Parts.join("  "));

    let cat2Parts = [];
    if (data.pzTitle2) cat2Parts.push(`🏆 ${data.pzTitle2}:`);
    if (data.pzWt1) cat2Parts.push(`1st: ${data.pzWt1}`);
    if (data.pzWt2) cat2Parts.push(`2nd: ${data.pzWt2}`);
    if (data.pzWtBest) cat2Parts.push(`Best: ${data.pzWtBest}`);
    if (cat2Parts.length > 0) row2Items.push(cat2Parts.join("  "));

    if (data.resultText && data.resultText !== "No Result Yet") {
      row2Items.push(`🏅 RESULT: ${data.resultText}`);
    }

    if (data.adsText && data.adsText.trim() !== "") {
      row2Items.push(data.adsText.trim());
    }

    const finalRow2 = row2Items.length > 0
      ? row2Items.join("   ★   ")
      : (headerParts.join(" — ") || "LIVE KABADDI TOURNAMENT");

    setupScroller("streamRow2", "chunk2A", "chunk2B", finalRow2, 115);

    let row3Items = [];

    const nextMatchesStr = getText(data.row5Txt, data.row5Txt_pa);
    if (nextMatchesStr) {
      let cleanMatches = nextMatchesStr.replace(/,\s*$/, "");
      if (cleanMatches) row3Items.push(`📋 NEXT MATCHES: ${cleanMatches}`);
    }

    const upcomingStr = getText(data.row4Txt, data.row4Txt_pa);
    if (upcomingStr && upcomingStr !== "UPCOMING EVENTS" && upcomingStr !== "ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ") {
      row3Items.push(`📅 UPCOMING EVENTS: ${upcomingStr}`);
    }

    if (data.row6Txt && data.row6Txt.trim() !== "") {
      row3Items.push(`📡 ${data.row6Txt.trim()}`);
    }

    const finalRow3 = row3Items.length > 0
      ? row3Items.join("   |   ")
      : "WATCH LIVE KABADDI ACTION";

    setupScroller("streamRow3", "chunk3A", "chunk3B", finalRow3, 105);
  });
</script>
</body>
</html>
