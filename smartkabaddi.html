<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Live Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@700;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
  }

  #render-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
  }

  /* ==================== TOP-LEFT SCOREBOARD ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 700;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* ==================== TOP-RIGHT CLIENT LOGO ==================== */
  #sb-logo-box {
    position: absolute;
    top: 30px;
    right: 42px;
    width: 132px;
    height: 104px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 16;
  }

  #pngLogoImg {
    max-width: 128px;
    max-height: 100px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.75));
  }

  /* ==================== BOTTOM 3-LINE TICKER WITH GREEN SIDE BOXES ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 122px;
    display: flex;
    align-items: stretch;
    background: #0d0d0d;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .side-box-left {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 16px;
    flex-shrink: 0;
    z-index: 5;
  }

  .live-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-style: italic;
    font-size: 60px;
    font-weight: 900;
    color: #ffe600;
    letter-spacing: 1.5px;
    line-height: 1;
    transform: skewX(-6deg);
  }

  .ticker-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: -28px;
    margin-right: -28px;
    overflow: hidden;
    background: #0d0d0d;
    z-index: 2;
  }

  .row-top {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    overflow: hidden;
    position: relative;
  }

  .row-yellow {
    height: 42px;
    background: #ffe600;
    color: #111111;
    display: flex;
    align-items: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .row-bottom {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .scroll-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0px, -50%, 0);
    display: inline-flex;
    align-items: center;
    white-space: pre;
    will-change: transform;
  }

  .scroll-item {
    display: inline-block;
    white-space: pre;
    padding-right: 180px;
    flex-shrink: 0;
  }

  .side-box-right {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%);
    flex-shrink: 0;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="render-stage">

    <!-- SCOREBOARD -->
    <div id="scoreboard-wrapper">
      <div class="sb-main">
        <div class="hex-wrap">
          <div class="hex-box hex-left" id="scoreLeft">0</div>
        </div>

        <div class="teams-bars">
          <div class="team-bar bar-top" id="teamTop">TEAM A</div>
          <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
        </div>

        <div class="hex-wrap">
          <div class="hex-box hex-right" id="scoreRight">0</div>
        </div>
      </div>
      <div class="sb-round" id="roundDisplay">KABADDI OPEN MATCH</div>
    </div>

    <!-- TOP-RIGHT CLIENT LOGO -->
    <div id="sb-logo-box">
      <img id="pngLogoImg" alt="Client Logo">
    </div>

    <!-- BOTTOM 3-LINE SCROLLING TICKER WITH GREEN SIDE BOXES -->
    <div id="bottom-ticker-bar">
      <div class="side-box-left">
        <div class="live-label">LIVE</div>
      </div>

      <div class="ticker-center">
        <div class="row-top">
          <div class="scroll-box">
            <div class="scroll-track" id="trackTop">
              <span class="scroll-item" id="itemTopA">OPEN KABADDI TOURNAMENT</span>
              <span class="scroll-item" id="itemTopB">OPEN KABADDI TOURNAMENT</span>
            </div>
          </div>
        </div>

        <div class="row-yellow">
          <div class="scroll-box">
            <div class="scroll-track" id="trackYellow">
              <span class="scroll-item" id="itemYellowA">LIVE KABADDI BROADCAST</span>
              <span class="scroll-item" id="itemYellowB">LIVE KABADDI BROADCAST</span>
            </div>
          </div>
        </div>

        <div class="row-bottom">
          <div class="scroll-box">
            <div class="scroll-track" id="trackBottom">
              <span class="scroll-item" id="itemBottomA">STAY TUNED FOR UPDATES</span>
              <span class="scroll-item" id="itemBottomB">STAY TUNED FOR UPDATES</span>
            </div>
          </div>
        </div>
      </div>

      <div class="side-box-right"></div>
    </div>

  </div>

<script>
  function fitStage() {
    const stage = document.getElementById("render-stage");
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('id') || 'defaultMatch';
  const langMode = urlParams.get('lang') || 'en';
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const clientLogos = {
    "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/KABADDI%20SPORTS%201%20Logo.png"
  };

  function getActiveLogo(dbLogoUrl) {
    if (queryLogoUrl) return queryLogoUrl;
    if (clientLogos[matchId]) return clientLogos[matchId];
    if (dbLogoUrl && dbLogoUrl.trim() !== "") return dbLogoUrl.trim();
    return "";
  }

  const db = firebase.database().ref("matchData/" + matchId);

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && paVal.trim() !== "") return paVal.trim();
    return (enVal || "").trim();
  }

  function setRightCornerLogo(url) {
    const box = document.getElementById("sb-logo-box");
    const img = document.getElementById("pngLogoImg");
    const clean = (url || "").trim();

    if (!clean) {
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      box.style.display = "none";
      return;
    }

    img.onload = () => {
      box.style.display = "flex";
    };
    img.onerror = () => {
      box.style.display = "none";
    };
    img.src = clean;
  }

  // Per-line speed (px/sec) — editable anytime via Firebase (speedRow1/2/3), URL (?r1Speed=...&r2Speed=...&r3Speed=...), or window.setRowSpeeds(...)
  const lineSpeeds = {
    trackTop: Number(urlParams.get("r1Speed")) > 0 ? Number(urlParams.get("r1Speed")) : 95,
    trackYellow: Number(urlParams.get("r2Speed")) > 0 ? Number(urlParams.get("r2Speed")) : 115,
    trackBottom: Number(urlParams.get("r3Speed")) > 0 ? Number(urlParams.get("r3Speed")) : 105
  };

  const tickers = {};
  let latestData = null;

  function buildLinesFromData(data) {
    if (!data) {
      return {
        r1: "OPEN KABADDI TOURNAMENT",
        r2: "LIVE KABADDI BROADCAST",
        r3: "STAY TUNED FOR UPDATES"
      };
    }

    const r1Raw = (data.row1Txt !== undefined && data.row1Txt !== null) ? String(data.row1Txt) : "";
    const r1 = r1Raw.replace(/\r?\n/g, " ");

    const r2Parts = [];
    const r2MainRaw = (data.row2Txt !== undefined && data.row2Txt !== null && String(data.row2Txt).trim() !== "")
      ? String(data.row2Txt)
      : ((data.programTxt !== undefined && data.programTxt !== null) ? String(data.programTxt) : "");
    if (r2MainRaw.trim() !== "") r2Parts.push(r2MainRaw.replace(/\r?\n/g, " "));
    if (data.resultText && String(data.resultText).trim() !== "" && String(data.resultText).trim() !== "No Result Yet") {
      r2Parts.push(`RESULT :- ${String(data.resultText).trim()}`);
    }
    const r2 = r2Parts.length > 0 ? r2Parts.join("        |        ") : (r1.trim() ? r1 : "LIVE KABADDI BROADCAST");

    const r3Parts = [];
    if (data.row3Txt !== undefined && data.row3Txt !== null && String(data.row3Txt).trim() !== "") {
      r3Parts.push(String(data.row3Txt).replace(/\r?\n/g, " "));
    }
    if (Array.isArray(data.nextMatches) && data.nextMatches.length > 0) {
      r3Parts.push(`NEXT MATCHES :- ${data.nextMatches.join(" , ")}`);
    }
    if (data.contactUs !== undefined && data.contactUs !== null && String(data.contactUs).trim() !== "") {
      r3Parts.push(String(data.contactUs).trim());
    }
    const r3 = r3Parts.length > 0 ? r3Parts.join("        |        ") : "LIVE KABADDI BROADCAST";

    return {
      r1: r1.trim() !== "" ? r1 : "OPEN KABADDI TOURNAMENT",
      r2,
      r3
    };
  }

  function updateTicker(trackId, itemAId, itemBId, text, speed) {
    const track = document.getElementById(trackId);
    const itemA = document.getElementById(itemAId);
    const itemB = document.getElementById(itemBId);

    const rawLine = (text !== undefined && text !== null && String(text).trim() !== "")
      ? String(text)
      : "LIVE KABADDI TOURNAMENT";

    const validSpeed = (Number.isFinite(speed) && speed > 0) ? speed : 100;
    const prev = tickers[trackId];
    const textChanged = !prev || prev.raw !== rawLine;

    itemA.textContent = rawLine;
    itemB.textContent = rawLine;

    requestAnimationFrame(() => {
      const boxW = track.parentElement.getBoundingClientRect().width || 1380;
      let w = itemA.getBoundingClientRect().width;

      if (w > 0 && w < boxW + 240) {
        const spacer = " ".repeat(24);
        const count = Math.ceil((boxW + 320) / Math.max(w + 180, 1));
        const repeated = Array(count).fill(rawLine).join(spacer);
        itemA.textContent = repeated;
        itemB.textContent = repeated;
        w = itemA.getBoundingClientRect().width;
      }

      if (!prev) {
        tickers[trackId] = {
          el: track,
          raw: rawLine,
          x: 0,
          width: Math.max(w, 1),
          speed: validSpeed,
          ts: performance.now()
        };
      } else {
        prev.raw = rawLine;
        prev.speed = validSpeed;
        if (w > 0) {
          if (textChanged) {
            prev.x = prev.x % w;
            if (prev.x > 0) prev.x -= w;
          }
          prev.width = w;
        }
        prev.ts = performance.now();
      }
    });
  }

  function refreshAllTickers() {
    const lines = buildLinesFromData(latestData);
    updateTicker("trackTop", "itemTopA", "itemTopB", lines.r1, lineSpeeds.trackTop);
    updateTicker("trackYellow", "itemYellowA", "itemYellowB", lines.r2, lineSpeeds.trackYellow);
    updateTicker("trackBottom", "itemBottomA", "itemBottomB", lines.r3, lineSpeeds.trackBottom);
  }

  // Helper to set speed of each line live (e.g. setRowSpeeds({ row1: 90, row2: 120, row3: 100 }))
  window.setRowSpeeds = function({ row1, row2, row3 } = {}) {
    if (Number(row1) > 0) lineSpeeds.trackTop = Number(row1);
    if (Number(row2) > 0) lineSpeeds.trackYellow = Number(row2);
    if (Number(row3) > 0) lineSpeeds.trackBottom = Number(row3);
    refreshAllTickers();
  };

  function animateTickers(now) {
    Object.values(tickers).forEach((t) => {
      const dt = Math.min((now - t.ts) / 1000, 0.05);
      t.ts = now;
      t.x -= t.speed * dt;
      if (t.x <= -t.width) {
        t.x += t.width;
      }
      t.el.style.transform = `translate3d(${t.x.toFixed(2)}px, -50%, 0)`;
    });
    requestAnimationFrame(animateTickers);
  }
  requestAnimationFrame(animateTickers);

  const initialLogo = getActiveLogo("");
  if (initialLogo) {
    setRightCornerLogo(initialLogo);
  }

  db.on("value", (snap) => {
    const data = snap.val();
    if (!data) return;
    latestData = data;

    document.getElementById("scoreboard-wrapper").style.opacity =
      (data.scoreVisible === false) ? "0" : "1";

    document.getElementById("bottom-ticker-bar").style.opacity =
      (data.tickerVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    const scoreA = data.scoreA !== undefined ? data.scoreA : 0;
    const scoreB = data.scoreB !== undefined ? data.scoreB : 0;

    if (data.cameraOpposite) {
      document.getElementById("teamTop").innerText = nameB;
      document.getElementById("scoreLeft").innerText = scoreB;
      document.getElementById("teamBottom").innerText = nameA;
      document.getElementById("scoreRight").innerText = scoreA;
    } else {
      document.getElementById("teamTop").innerText = nameA;
      document.getElementById("scoreLeft").innerText = scoreA;
      document.getElementById("teamBottom").innerText = nameB;
      document.getElementById("scoreRight").innerText = scoreB;
    }

    document.getElementById("roundDisplay").innerText = data.round || "";

    setRightCornerLogo(getActiveLogo(data.logoUrl));

    if (Number(data.speedRow1) > 0 && !urlParams.get("r1Speed")) {
      lineSpeeds.trackTop = Number(data.speedRow1);
    }
    if (Number(data.speedRow2) > 0 && !urlParams.get("r2Speed")) {
      lineSpeeds.trackYellow = Number(data.speedRow2);
    }
    if (Number(data.speedRow3) > 0 && !urlParams.get("r3Speed")) {
      lineSpeeds.trackBottom = Number(data.speedRow3);
    }

    refreshAllTickers();
  });
</script>
</body>
</html>
