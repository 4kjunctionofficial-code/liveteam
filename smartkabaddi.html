<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Live Overlay - SmartKabaddi</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@800;900&family=Noto+Sans+Gurmukhi:wght@800;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@800;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-weight: 900;
    text-transform: uppercase;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif;
    font-weight: 900;
    text-transform: uppercase;
  }

  #render-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
    display: block;
  }

  /* ==================== FLOATING WATERMARK ==================== */
  #floating-watermark {
    position: absolute;
    top: 200px;
    left: 420px;
    font-family: 'Roboto Condensed', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif;
    font-size: 46px;
    font-weight: 900;
    color: #ffffff;
    opacity: 0.24;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    pointer-events: none;
    white-space: pre;
    display: none;
    z-index: 12;
  }

  /* ==================== TOP-LEFT SCOREBOARD ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 14px;
    left: 40px;
    transform: scale(1);
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif;
    font-size: 52px;
    font-weight: 900;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* ==================== CLIENT LOGO AT TOP-RIGHT CORNER ==================== */
  #sb-logo-box {
    position: absolute;
    top: 24px;
    right: 32px;
    width: 265px;
    height: 195px;
    transform: scale(1);
    transform-origin: top right;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 16;
  }

  #pngLogoImg {
    max-width: 256px;
    max-height: 186px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.8));
  }

  /* ==================== BOTTOM 3-LINE TICKER ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 144px;
    display: none;
    align-items: stretch;
    background: #0d0d0d;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .side-box-left {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 16px;
    flex-shrink: 0;
    z-index: 5;
  }

  .live-label {
    font-family: 'Roboto Condensed', 'Noto Sans Devanagari', 'Noto Sans Gurmukhi', sans-serif;
    font-style: italic;
    font-size: 66px;
    font-weight: 900;
    color: #ffe600;
    letter-spacing: 1.5px;
    line-height: 1;
    transform: skewX(-6deg);
  }

  .ticker-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: -28px;
    margin-right: -28px;
    overflow: hidden;
    background: #0d0d0d;
    z-index: 2;
  }

  .row-top {
    flex: 1;
    min-height: 0;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 29px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    overflow: hidden;
    position: relative;
  }

  .row-yellow {
    flex: 1.06;
    min-height: 0;
    background: #ffe600;
    color: #111111;
    display: flex;
    align-items: center;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .row-bottom {
    flex: 1;
    min-height: 0;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .scroll-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scroll-item {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0px, -50%, 0);
    display: inline-block;
    font-weight: 900;
    text-transform: uppercase;
    white-space: pre;
    will-change: transform;
  }

  .scroll-item.centered-static {
    left: 50%;
    transform: translate3d(-50%, -50%, 0) !important;
    will-change: auto;
  }

  .side-box-right {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%);
    flex-shrink: 0;
    z-index: 5;
  }

  /* ==================== PLAN EXPIRED LOCK SCREEN ==================== */
  #plan-expired-lock {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #07090d;
    color: #ffffff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    z-index: 999999;
  }

  .expired-card {
    background: #12161f;
    border: 3px solid #ff3b30;
    border-radius: 20px;
    padding: 46px 64px;
    max-width: 980px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
  }

  .expired-title {
    font-size: 56px;
    font-weight: 900;
    color: #ffe600;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.25;
  }

  .expired-sub {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 900;
    color: #ff5c52;
    line-height: 1.35;
  }

  .expired-phone {
    margin-top: 24px;
    font-size: 44px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div id="render-stage">

    <!-- SCOREBOARD -->
    <div id="scoreboard-wrapper">
      <div class="sb-main">
        <div class="hex-wrap">
          <div class="hex-box hex-left" id="scoreLeft">0</div>
        </div>

        <div class="teams-bars">
          <div class="team-bar bar-top" id="teamTop">TEAM A</div>
          <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
        </div>

        <div class="hex-wrap">
          <div class="hex-box hex-right" id="scoreRight">0</div>
        </div>
      </div>
      <div class="sb-round" id="roundDisplay"></div>
    </div>

    <!-- CLIENT LOGO AT TOP-RIGHT CORNER -->
    <div id="sb-logo-box">
      <img id="pngLogoImg" alt="SmartKabaddi Logo">
    </div>

    <!-- FLOATING WATERMARK -->
    <div id="floating-watermark"></div>

    <!-- BOTTOM 3-LINE SCROLLING TICKER WITH GREEN SIDE BOXES -->
    <div id="bottom-ticker-bar">
      <div class="side-box-left">
        <div class="live-label">LIVE</div>
      </div>

      <div class="ticker-center">
        <div class="row-top" id="rowTopWrap">
          <div class="scroll-box">
            <span class="scroll-item" id="itemTop"></span>
          </div>
        </div>

        <div class="row-yellow" id="rowYellowWrap">
          <div class="scroll-box">
            <span class="scroll-item" id="itemYellow"></span>
          </div>
        </div>

        <div class="row-bottom" id="rowBottomWrap">
          <div class="scroll-box">
            <span class="scroll-item" id="itemBottom"></span>
          </div>
        </div>
      </div>

      <div class="side-box-right"></div>
    </div>

  </div>

  <!-- PLAN EXPIRED LOCK SCREEN -->
  <div id="plan-expired-lock">
    <div class="expired-card">
      <div class="expired-title">🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ</div>
      <div class="expired-sub">ਮਾਸਟਰ ਵੱਲੋਂ ਪਲਾਨ ਖਤਮ ਕਰ ਦਿੱਤਾ ਗਿਆ ਹੈ • ਓਵਰਲੇਅ ਬੰਦ ਹੈ</div>
      <div class="expired-phone">ਹੈਲਪਲਾਈਨ: 8699640061</div>
    </div>
  </div>

<script>
  let isOverlayLocked = false;
  let rafId = null;

  function toCaps(val) {
    return String(val ?? "").toUpperCase();
  }

  function fitStage() {
    const stage = document.getElementById("render-stage");
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const rawMatchId = (urlParams.get('id') || 'smartkabaddi').trim();
  const matchId = rawMatchId.toLowerCase();
  const langMode = (urlParams.get('lang') || 'en').trim().toLowerCase();
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const clientLogos = {
    "smartkabaddi": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Picsart_24-01-02_09-57-53-097.jpg.jpeg"
  };

  function getActiveLogo(dbLogoUrl) {
    if (queryLogoUrl) return queryLogoUrl;
    if (clientLogos[matchId]) return clientLogos[matchId];
    if (dbLogoUrl && String(dbLogoUrl).trim() !== "") return String(dbLogoUrl).trim();
    return "";
  }

  const db = firebase.database().ref("matchData/" + matchId);
  const masterPlanDb = firebase.database().ref("masterPlans/" + matchId);
  const userPlanDb = firebase.database().ref("users/" + matchId);

  function lockOverlayDueToExpiry() {
    if (isOverlayLocked) return;
    isOverlayLocked = true;

    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    try {
      db.off();
      masterPlanDb.off();
      userPlanDb.off();
    } catch (e) {}

    const stage = document.getElementById("render-stage");
    if (stage) stage.style.display = "none";

    const lockEl = document.getElementById("plan-expired-lock");
    if (lockEl) lockEl.style.display = "flex";
  }

  function evaluatePlanStatus(planObj) {
    if (!planObj || isOverlayLocked) return;

    const explicitExpired =
      planObj.planExpired === true ||
      planObj.expired === true ||
      planObj.isExpired === true ||
      planObj.active === false ||
      String(planObj.status || "").toLowerCase() === "expired";

    let dateExpired = false;
    if (planObj.expiryDate) {
      const expTime = new Date(planObj.expiryDate).getTime();
      if (!Number.isNaN(expTime) && Date.now() > expTime) {
        dateExpired = true;
      }
    }

    if (explicitExpired || dateExpired) {
      lockOverlayDueToExpiry();
    }
  }

  masterPlanDb.on("value", (snap) => {
    evaluatePlanStatus(snap.val());
  });

  userPlanDb.on("value", (snap) => {
    evaluatePlanStatus(snap.val());
  });

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && String(paVal).trim() !== "") return toCaps(String(paVal).trim());
    return toCaps((enVal || "").trim());
  }

  let currentLogoUrl = getActiveLogo("");
  let currentLogoVisible = true;
  let currentTickerHeight = 144;
  let currentTickerBottom = 0;

  function applyLayoutAdjustments(data = {}) {
    const sbEl = document.getElementById("scoreboard-wrapper");
    const sbTop = Number.isFinite(Number(data.sbTop)) ? Number(data.sbTop) : 14;
    const sbLeft = Number.isFinite(Number(data.sbLeft)) ? Number(data.sbLeft) : 40;
    const sbScale = Number.isFinite(Number(data.sbScale)) ? Math.min(Math.max(Number(data.sbScale), 40), 200) / 100 : 1;
    sbEl.style.top = `${sbTop}px`;
    sbEl.style.left = `${sbLeft}px`;
    sbEl.style.transform = `scale(${sbScale})`;

    const logoBox = document.getElementById("sb-logo-box");
    const logoTop = Number.isFinite(Number(data.logoTop)) ? Number(data.logoTop) : 24;
    const logoRight = Number.isFinite(Number(data.logoRight)) ? Number(data.logoRight) : 32;
    const logoScale = Number.isFinite(Number(data.logoSize)) ? Math.min(Math.max(Number(data.logoSize), 30), 250) / 100 : 1;
    logoBox.style.top = `${logoTop}px`;
    logoBox.style.right = `${logoRight}px`;
    logoBox.style.transform = `scale(${logoScale})`;

    const tickerBar = document.getElementById("bottom-ticker-bar");
    currentTickerHeight = Number.isFinite(Number(data.tickerHeight)) ? Math.min(Math.max(Number(data.tickerHeight), 72), 540) : 144;
    currentTickerBottom = Number.isFinite(Number(data.tickerBottom)) ? Math.min(Math.max(Number(data.tickerBottom), -200), 700) : 0;
    tickerBar.style.height = `${currentTickerHeight}px`;
    tickerBar.style.bottom = `${currentTickerBottom}px`;

    const baseFont = Math.max(22, Math.min(44, Math.round(currentTickerHeight * 0.2)));
    document.getElementById("rowTopWrap").style.fontSize = `${baseFont}px`;
    document.getElementById("rowYellowWrap").style.fontSize = `${baseFont + 2}px`;
    document.getElementById("rowBottomWrap").style.fontSize = `${Math.max(20, baseFont - 1)}px`;
  }

  function renderRightCornerLogo() {
    const box = document.getElementById("sb-logo-box");
    const img = document.getElementById("pngLogoImg");
    const clean = (currentLogoUrl || "").trim();

    if (!clean || !currentLogoVisible) {
      box.style.display = "none";
      return;
    }

    if (img.src !== clean) {
      img.onload = () => {
        if (currentLogoVisible && img.src === clean) box.style.display = "flex";
      };
      img.onerror = () => {
        box.style.display = "none";
      };
      img.src = clean;
    } else if (img.complete && img.naturalWidth > 0) {
      box.style.display = "flex";
    }
  }

  /* Floating Watermark State */
  const wmEl = document.getElementById("floating-watermark");
  let wmX = 420;
  let wmY = 200;
  let wmVx = 85;
  let wmVy = 62;
  let wmLastTs = performance.now();
  let wmActive = false;

  function setFloatingWatermark(txt) {
    const clean = toCaps(String(txt || "").trim());
    if (!clean) {
      wmActive = false;
      wmEl.textContent = "";
      wmEl.style.display = "none";
      return;
    }
    wmEl.textContent = clean;
    wmEl.style.display = "block";
    wmActive = true;
  }

  // Per-line speed (px/sec) & scroll state
  const lineSpeeds = {
    itemTop: urlParams.get("r1Speed") !== null ? Number(urlParams.get("r1Speed")) : 95,
    itemYellow: urlParams.get("r2Speed") !== null ? Number(urlParams.get("r2Speed")) : 115,
    itemBottom: urlParams.get("r3Speed") !== null ? Number(urlParams.get("r3Speed")) : 105
  };

  const lineScrollEnabled = {
    itemTop: true,
    itemYellow: true,
    itemBottom: true
  };

  const tickers = {};
  let latestData = null;

  function normalizeTickerLine(val) {
    if (val === undefined || val === null) return "";
    const str = toCaps(String(val).replace(/\r?\n/g, " "));
    return str.trim() === "" ? "" : str;
  }

  function measureItemWidth(el) {
    const wasCentered = el.classList.contains("centered-static");
    const prevTransform = el.style.transform;
    const prevLeft = el.style.left;
    el.classList.remove("centered-static");
    el.style.left = "0";
    el.style.transform = "translate3d(0px, -50%, 0)";
    const w = el.getBoundingClientRect().width;
    el.style.left = prevLeft;
    el.style.transform = prevTransform;
    if (wasCentered) el.classList.add("centered-static");
    return w;
  }

  function updateTicker(itemId, wrapId, rawText, speed, scrollOn) {
    const item = document.getElementById(itemId);
    const wrap = wrapId ? document.getElementById(wrapId) : null;
    const box = item.parentElement;

    const line = normalizeTickerLine(rawText);
    const numericSpeed = Number.isFinite(speed) ? Math.max(0, speed) : 100;
    const shouldScroll = Boolean(scrollOn) && numericSpeed > 0;

    if (!line || isOverlayLocked) {
      if (wrap) wrap.style.display = "none";
      item.textContent = "";
      item.classList.remove("centered-static");
      if (tickers[itemId]) {
        tickers[itemId].active = false;
        tickers[itemId].raw = "";
      }
      return;
    }

    if (wrap) wrap.style.display = "flex";

    const prev = tickers[itemId];
    const textChanged = !prev || prev.raw !== line;

    item.textContent = line;

    if (!shouldScroll) {
      item.classList.add("centered-static");
      item.style.left = "50%";
      item.style.transform = "translate3d(-50%, -50%, 0)";
      if (tickers[itemId]) {
        tickers[itemId].active = false;
        tickers[itemId].raw = line;
        tickers[itemId].wasScrolling = false;
      }
      return;
    }

    item.classList.remove("centered-static");
    item.style.left = "0";

    const boxW = box.getBoundingClientRect().width || 1380;
    const textW = Math.max(measureItemWidth(item), 40);

    if (!prev) {
      tickers[itemId] = {
        el: item,
        raw: line,
        x: boxW,
        boxW: boxW,
        textW: textW,
        speed: numericSpeed,
        active: true,
        wasScrolling: true
      };
      item.style.transform = `translate3d(${boxW.toFixed(2)}px, -50%, 0)`;
    } else {
      prev.raw = line;
      prev.speed = numericSpeed;
      prev.boxW = boxW;
      prev.textW = textW;
      prev.active = true;
      if (textChanged || !prev.wasScrolling) {
        prev.x = boxW;
        prev.el.style.transform = `translate3d(${boxW.toFixed(2)}px, -50%, 0)`;
      }
      prev.wasScrolling = true;
    }
  }

  function refreshAllTickers() {
    const bar = document.getElementById("bottom-ticker-bar");

    if (isOverlayLocked || !latestData) {
      updateTicker("itemTop", "rowTopWrap", "", 0, false);
      updateTicker("itemYellow", "rowYellowWrap", "", 0, false);
      updateTicker("itemBottom", "rowBottomWrap", "", 0, false);
      if (bar) bar.style.display = "none";
      return;
    }

    const r1 = normalizeTickerLine(latestData.row1Txt);
    const r2 = normalizeTickerLine(latestData.row2Txt);
    const r3 = normalizeTickerLine(latestData.row3Txt);

    const anyLineActive = Boolean(r1 || r2 || r3);
    if (bar) {
      bar.style.display = (anyLineActive && latestData.tickerVisible !== false) ? "flex" : "none";
    }

    updateTicker("itemTop", "rowTopWrap", r1, lineSpeeds.itemTop, lineScrollEnabled.itemTop);
    updateTicker("itemYellow", "rowYellowWrap", r2, lineSpeeds.itemYellow, lineScrollEnabled.itemYellow);
    updateTicker("itemBottom", "rowBottomWrap", r3, lineSpeeds.itemBottom, lineScrollEnabled.itemBottom);
  }

  window.setRowSpeeds = function({ row1, row2, row3 } = {}) {
    if (isOverlayLocked) return;
    if (row1 !== undefined && Number.isFinite(Number(row1))) lineSpeeds.itemTop = Math.max(0, Number(row1));
    if (row2 !== undefined && Number.isFinite(Number(row2))) lineSpeeds.itemYellow = Math.max(0, Number(row2));
    if (row3 !== undefined && Number.isFinite(Number(row3))) lineSpeeds.itemBottom = Math.max(0, Number(row3));
    refreshAllTickers();
  };

  function animateLoop(now) {
    if (isOverlayLocked) return;

    const dt = Math.min((now - wmLastTs) / 1000, 0.08);
    wmLastTs = now;

    Object.values(tickers).forEach((t) => {
      if (!t.active) return;
      t.x -= t.speed * dt;
      if (t.x <= -t.textW - 40) {
        t.x = t.boxW + 20;
      }
      t.el.style.transform = `translate3d(${t.x.toFixed(2)}px, -50%, 0)`;
    });

    if (wmActive) {
      const minX = 40;
      const minY = 140;
      const maxX = Math.max(minX + 100, 1920 - 315 - wmEl.offsetWidth);
      const maxY = Math.max(minY + 60, 1080 - currentTickerHeight - currentTickerBottom - wmEl.offsetHeight - 30);

      wmX += wmVx * dt;
      wmY += wmVy * dt;

      if (wmX <= minX) {
        wmX = minX;
        wmVx = Math.abs(wmVx);
      } else if (wmX >= maxX) {
        wmX = maxX;
        wmVx = -Math.abs(wmVx);
      }

      if (wmY <= minY) {
        wmY = minY;
        wmVy = Math.abs(wmVy);
      } else if (wmY >= maxY) {
        wmY = maxY;
        wmVy = -Math.abs(wmVy);
      }

      wmEl.style.transform = `translate3d(${wmX.toFixed(1)}px, ${wmY.toFixed(1)}px, 0)`;
    }

    rafId = requestAnimationFrame(animateLoop);
  }
  rafId = requestAnimationFrame(animateLoop);

  applyLayoutAdjustments({});
  renderRightCornerLogo();

  db.on("value", (snap) => {
    if (isOverlayLocked) return;
    const data = snap.val();
    if (!data) {
      latestData = null;
      applyLayoutAdjustments({});
      currentLogoUrl = getActiveLogo("");
      currentLogoVisible = true;
      renderRightCornerLogo();
      refreshAllTickers();
      return;
    }

    latestData = data;
    evaluatePlanStatus(data);
    if (isOverlayLocked) return;

    applyLayoutAdjustments(data);

    document.getElementById("scoreboard-wrapper").style.opacity =
      (data.scoreVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    document.getElementById("teamTop").innerText = nameA;
    document.getElementById("scoreLeft").innerText = (data.scoreA !== undefined && data.scoreA !== null) ? toCaps(data.scoreA) : "0";
    document.getElementById("teamBottom").innerText = nameB;
    document.getElementById("scoreRight").innerText = (data.scoreB !== undefined && data.scoreB !== null) ? toCaps(data.scoreB) : "0";

    const roundVal = (data.round !== undefined && data.round !== null) ? toCaps(String(data.round).trim()) : "";
    const roundEl = document.getElementById("roundDisplay");
    roundEl.innerText = roundVal;
    roundEl.style.display = roundVal ? "block" : "none";

    setFloatingWatermark(data.watermarkTxt);

    currentLogoUrl = getActiveLogo(data.logoUrl);
    currentLogoVisible = (data.logoVisible !== false);
    renderRightCornerLogo();

    if (data.speedRow1 !== undefined && urlParams.get("r1Speed") === null) {
      lineSpeeds.itemTop = Math.max(0, Number(data.speedRow1) || 0);
    }
    if (data.speedRow2 !== undefined && urlParams.get("r2Speed") === null) {
      lineSpeeds.itemYellow = Math.max(0, Number(data.speedRow2) || 0);
    }
    if (data.speedRow3 !== undefined && urlParams.get("r3Speed") === null) {
      lineSpeeds.itemBottom = Math.max(0, Number(data.speedRow3) || 0);
    }

    lineScrollEnabled.itemTop = data.scrollRow1 !== false;
    lineScrollEnabled.itemYellow = data.scrollRow2 !== false;
    lineScrollEnabled.itemBottom = data.scrollRow3 !== false;

    refreshAllTickers();
  });
</script>
</body>
</html>
