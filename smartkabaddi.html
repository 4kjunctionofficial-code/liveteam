<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Live Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@700;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
  }

  #render-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
  }

  /* ==================== TOP-LEFT SCOREBOARD ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 700;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* ==================== TOP-RIGHT CLIENT LOGO ==================== */
  #sb-logo-box {
    position: absolute;
    top: 30px;
    right: 42px;
    width: 132px;
    height: 104px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 16;
  }

  #pngLogoImg {
    max-width: 128px;
    max-height: 100px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.75));
  }

  /* ==================== BOTTOM TICKER (~500px SPACE OF 1080) ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 500px;
    display: flex;
    align-items: stretch;
    background: rgba(13, 13, 13, 0.92);
    border-top: 3px solid #ffe600;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .side-box-left {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 16px;
    flex-shrink: 0;
    z-index: 5;
  }

  .live-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-style: italic;
    font-size: 64px;
    font-weight: 900;
    color: #ffe600;
    letter-spacing: 1.5px;
    line-height: 1;
    transform: skewX(-6deg);
  }

  .ticker-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: -28px;
    margin-right: -28px;
    overflow: hidden;
    z-index: 2;
  }

  .ticker-line {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  .row-top {
    background: #0d0d0d;
    color: #ffffff;
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-bottom: 2px solid rgba(255, 255, 255, 0.14);
  }

  .row-yellow {
    background: #ffe600;
    color: #111111;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 0.4px;
    border-bottom: 2px solid #090909;
  }

  .row-bottom {
    background: #0d0d0d;
    color: #ffffff;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.4px;
  }

  .scroll-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0px, -50%, 0);
    display: inline-flex;
    align-items: center;
    white-space: pre;
    will-change: transform;
  }

  .scroll-chunk {
    display: inline-block;
    white-space: pre;
    padding-right: 160px;
    flex-shrink: 0;
  }

  .side-box-right {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%);
    flex-shrink: 0;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="render-stage">

    <!-- SCOREBOARD -->
    <div id="scoreboard-wrapper">
      <div class="sb-main">
        <div class="hex-wrap">
          <div class="hex-box hex-left" id="scoreLeft">0</div>
        </div>

        <div class="teams-bars">
          <div class="team-bar bar-top" id="teamTop">TEAM A</div>
          <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
        </div>

        <div class="hex-wrap">
          <div class="hex-box hex-right" id="scoreRight">0</div>
        </div>
      </div>
      <div class="sb-round" id="roundDisplay">KABADDI OPEN MATCH</div>
    </div>

    <!-- TOP-RIGHT CLIENT LOGO -->
    <div id="sb-logo-box">
      <img id="pngLogoImg" alt="Client Logo">
    </div>

    <!-- BOTTOM TICKER (~500px SPACE) -->
    <div id="bottom-ticker-bar">
      <div class="side-box-left">
        <div class="live-label">LIVE</div>
      </div>

      <div class="ticker-center">
        <div class="ticker-line row-top">
          <div class="scroll-box">
            <div class="scroll-track" id="trackTop">
              <span class="scroll-chunk" id="chunkTopA"></span>
              <span class="scroll-chunk" id="chunkTopB"></span>
            </div>
          </div>
        </div>

        <div class="ticker-line row-yellow">
          <div class="scroll-box">
            <div class="scroll-track" id="trackYellow">
              <span class="scroll-chunk" id="chunkYellowA"></span>
              <span class="scroll-chunk" id="chunkYellowB"></span>
            </div>
          </div>
        </div>

        <div class="ticker-line row-bottom">
          <div class="scroll-box">
            <div class="scroll-track" id="trackBottom">
              <span class="scroll-chunk" id="chunkBottomA"></span>
              <span class="scroll-chunk" id="chunkBottomB"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="side-box-right"></div>
    </div>

  </div>

<script>
  function fitStage() {
    const stage = document.getElementById("render-stage");
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('id') || 'defaultMatch';
  const langMode = urlParams.get('lang') || 'en';
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const clientLogos = {
    "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/KABADDI%20SPORTS%201%20Logo.png"
  };

  function getActiveLogo(dbLogoUrl) {
    if (queryLogoUrl) return queryLogoUrl;
    if (clientLogos[matchId]) return clientLogos[matchId];
    if (dbLogoUrl && dbLogoUrl.trim() !== "") return dbLogoUrl.trim();
    return "";
  }

  const db = firebase.database().ref("matchData/" + matchId);

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && paVal.trim() !== "") return paVal.trim();
    return (enVal || "").trim();
  }

  function setRightCornerLogo(url) {
    const box = document.getElementById("sb-logo-box");
    const img = document.getElementById("pngLogoImg");
    const clean = (url || "").trim();

    if (!clean) {
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      box.style.display = "none";
      return;
    }

    img.onload = () => {
      box.style.display = "flex";
    };
    img.onerror = () => {
      box.style.display = "none";
    };
    img.src = clean;
  }

  /* Smooth Jump-Free Scroller Preserving Exact Spaces + Repeat Gap */
  const scrollers = {};

  function sanitizeLineKeepSpaces(rawText) {
    if (rawText === null || rawText === undefined) return "";
    // Preserve exact spaces typed in admin; only normalize line breaks into spaces
    return String(rawText).replace(/\r?\n/g, " ");
  }

  function setSingleLineTicker(trackId, chunkAId, chunkBId, rawText, speed) {
    const track = document.getElementById(trackId);
    const chunkA = document.getElementById(chunkAId);
    const chunkB = document.getElementById(chunkBId);

    const line = sanitizeLineKeepSpaces(rawText);
    const validSpeed = (Number.isFinite(speed) && speed > 0) ? speed : 100;

    if (!line.trim()) {
      chunkA.textContent = "";
      chunkB.textContent = "";
      if (scrollers[trackId]) {
        scrollers[trackId].active = false;
        scrollers[trackId].x = 0;
        track.style.transform = "translate3d(0px, -50%, 0)";
      }
      return;
    }

    const prevState = scrollers[trackId];
    const textChanged = !prevState || prevState.raw !== line;

    chunkA.textContent = line;
    chunkB.textContent = line;

    requestAnimationFrame(() => {
      const boxW = track.parentElement.getBoundingClientRect().width || 1380;
      let chunkWidth = chunkA.getBoundingClientRect().width;

      // If text is shorter than viewport, repeat exact line with a 160px spacer span
      // so the repeat is clearly separated and still loops seamlessly without jump
      if (chunkWidth > 0 && chunkWidth < boxW + 200) {
        const spacer = " ".repeat(18);
        const times = Math.ceil((boxW + 240) / Math.max(chunkWidth + 120, 1));
        const repeated = Array(times).fill(line).join(spacer);
        chunkA.textContent = repeated;
        chunkB.textContent = repeated;
        chunkWidth = chunkA.getBoundingClientRect().width;
      }

      if (!scrollers[trackId]) {
        scrollers[trackId] = {
          el: track,
          raw: line,
          x: 0,
          width: Math.max(chunkWidth, 1),
          speed: validSpeed,
          active: true,
          lastTs: performance.now()
        };
      } else {
        const s = scrollers[trackId];
        s.raw = line;
        s.speed = validSpeed;
        s.active = true;
        if (chunkWidth > 0) {
          if (textChanged) {
            s.x = s.x % chunkWidth;
            if (s.x > 0) s.x -= chunkWidth;
          }
          s.width = chunkWidth;
        }
        s.lastTs = performance.now();
      }
    });
  }

  function stepAllTickers(now) {
    Object.values(scrollers).forEach((s) => {
      if (!s.active) return;
      const dt = Math.min((now - s.lastTs) / 1000, 0.04);
      s.lastTs = now;
      s.x -= s.speed * dt;
      if (s.x <= -s.width) {
        s.x += s.width;
      }
      s.el.style.transform = `translate3d(${s.x.toFixed(2)}px, -50%, 0)`;
    });
    requestAnimationFrame(stepAllTickers);
  }
  requestAnimationFrame(stepAllTickers);

  const initialLogo = getActiveLogo("");
  if (initialLogo) {
    setRightCornerLogo(initialLogo);
  }

  db.on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    document.getElementById("scoreboard-wrapper").style.opacity =
      (data.scoreVisible === false) ? "0" : "1";

    document.getElementById("bottom-ticker-bar").style.opacity =
      (data.tickerVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    const scoreA = data.scoreA !== undefined ? data.scoreA : 0;
    const scoreB = data.scoreB !== undefined ? data.scoreB : 0;

    if (data.cameraOpposite) {
      document.getElementById("teamTop").innerText = nameB;
      document.getElementById("scoreLeft").innerText = scoreB;
      document.getElementById("teamBottom").innerText = nameA;
      document.getElementById("scoreRight").innerText = scoreA;
    } else {
      document.getElementById("teamTop").innerText = nameA;
      document.getElementById("scoreLeft").innerText = scoreA;
      document.getElementById("teamBottom").innerText = nameB;
      document.getElementById("scoreRight").innerText = scoreB;
    }

    document.getElementById("roundDisplay").innerText = data.round || "";

    setRightCornerLogo(getActiveLogo(data.logoUrl));

    const speed1 = parseFloat(data.speedRow1) || 95;
    const speed2 = parseFloat(data.speedRow2) || 115;
    const speed3 = parseFloat(data.speedRow3) || 105;

    const line1 = data.row1Txt ?? "";
    const line2 = data.row2Txt ?? data.programTxt ?? "";
    const line3 = data.row3Txt ?? data.contactUs ?? "";

    setSingleLineTicker("trackTop", "chunkTopA", "chunkTopB", line1, speed1);
    setSingleLineTicker("trackYellow", "chunkYellowA", "chunkYellowB", line2, speed2);
    setSingleLineTicker("trackBottom", "chunkBottomA", "chunkBottomB", line3, speed3);
  });
</script>
</body>
</html>
