<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Live Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@700;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
  }

  #render-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
  }

  /* ==================== FLOATING WATERMARK ==================== */
  #floating-watermark {
    position: absolute;
    top: 220px;
    left: 420px;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
    font-size: 46px;
    font-weight: 900;
    color: rgba(255, 255, 255, 0.42);
    text-transform: uppercase;
    letter-spacing: 2.5px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
    pointer-events: none;
    white-space: pre;
    display: none;
    z-index: 12;
  }

  /* ==================== TOP-LEFT SCOREBOARD ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    flex-direction: column;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 700;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* ==================== TOP-RIGHT CLIENT LOGO ==================== */
  #sb-logo-box {
    position: absolute;
    top: 30px;
    right: 42px;
    width: 132px;
    height: 104px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 16;
  }

  #pngLogoImg {
    max-width: 128px;
    max-height: 100px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.75));
  }

  /* ==================== BOTTOM 3-LINE TICKER WITH GREEN SIDE BOXES ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 122px;
    display: flex;
    align-items: stretch;
    background: #0d0d0d;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .side-box-left {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 16px;
    flex-shrink: 0;
    z-index: 5;
  }

  .live-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-style: italic;
    font-size: 60px;
    font-weight: 900;
    color: #ffe600;
    letter-spacing: 1.5px;
    line-height: 1;
    transform: skewX(-6deg);
  }

  .ticker-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: -28px;
    margin-right: -28px;
    overflow: hidden;
    background: #0d0d0d;
    z-index: 2;
  }

  .row-top {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    overflow: hidden;
    position: relative;
  }

  .row-yellow {
    height: 42px;
    background: #ffe600;
    color: #111111;
    display: flex;
    align-items: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .row-bottom {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .scroll-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0px, -50%, 0);
    display: inline-flex;
    align-items: center;
    white-space: pre;
    will-change: transform;
  }

  .scroll-item {
    display: inline-block;
    white-space: pre;
    padding-right: 90px;
    flex-shrink: 0;
  }

  .side-box-right {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%);
    flex-shrink: 0;
    z-index: 5;
  }

  /* ==================== PLAN EXPIRED LOCK SCREEN ==================== */
  #plan-expired-lock {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #07090d;
    color: #ffffff;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    z-index: 999999;
  }

  .expired-card {
    background: #12161f;
    border: 3px solid #ff3b30;
    border-radius: 20px;
    padding: 46px 64px;
    max-width: 980px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
  }

  .expired-title {
    font-size: 56px;
    font-weight: 900;
    color: #ffe600;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.25;
  }

  .expired-sub {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 800;
    color: #ff5c52;
    line-height: 1.35;
  }

  .expired-phone {
    margin-top: 24px;
    font-size: 44px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div id="render-stage">

    <!-- SCOREBOARD -->
    <div id="scoreboard-wrapper">
      <div class="sb-main">
        <div class="hex-wrap">
          <div class="hex-box hex-left" id="scoreLeft">0</div>
        </div>

        <div class="teams-bars">
          <div class="team-bar bar-top" id="teamTop">TEAM A</div>
          <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
        </div>

        <div class="hex-wrap">
          <div class="hex-box hex-right" id="scoreRight">0</div>
        </div>
      </div>
      <div class="sb-round" id="roundDisplay"></div>
    </div>

    <!-- FLOATING WATERMARK -->
    <div id="floating-watermark"></div>

    <!-- TOP-RIGHT CLIENT LOGO -->
    <div id="sb-logo-box">
      <img id="pngLogoImg" alt="Client Logo">
    </div>

    <!-- BOTTOM 3-LINE SCROLLING TICKER WITH GREEN SIDE BOXES -->
    <div id="bottom-ticker-bar">
      <div class="side-box-left">
        <div class="live-label">LIVE</div>
      </div>

      <div class="ticker-center">
        <div class="row-top" id="rowTopWrap">
          <div class="scroll-box">
            <div class="scroll-track" id="trackTop">
              <span class="scroll-item" id="itemTopA"></span>
              <span class="scroll-item" id="itemTopB"></span>
            </div>
          </div>
        </div>

        <div class="row-yellow" id="rowYellowWrap">
          <div class="scroll-box">
            <div class="scroll-track" id="trackYellow">
              <span class="scroll-item" id="itemYellowA"></span>
              <span class="scroll-item" id="itemYellowB"></span>
            </div>
          </div>
        </div>

        <div class="row-bottom" id="rowBottomWrap">
          <div class="scroll-box">
            <div class="scroll-track" id="trackBottom">
              <span class="scroll-item" id="itemBottomA"></span>
              <span class="scroll-item" id="itemBottomB"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="side-box-right"></div>
    </div>

  </div>

  <!-- PLAN EXPIRED LOCK SCREEN -->
  <div id="plan-expired-lock">
    <div class="expired-card">
      <div class="expired-title">🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ</div>
      <div class="expired-sub">ਮਾਸਟਰ ਵੱਲੋਂ ਪਲਾਨ ਖਤਮ ਕਰ ਦਿੱਤਾ ਗਿਆ ਹੈ • ਓਵਰਲੇਅ ਬੰਦ ਹੈ</div>
      <div class="expired-phone">ਹੈਲਪਲਾਈਨ: 8699640061</div>
    </div>
  </div>

<script>
  let isOverlayLocked = false;
  let rafId = null;

  function fitStage() {
    const stage = document.getElementById("render-stage");
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('id') || 'defaultMatch';
  const langMode = urlParams.get('lang') || 'en';
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const clientLogos = {
    "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/KABADDI%20SPORTS%201%20Logo.png"
  };

  function getActiveLogo(dbLogoUrl) {
    if (queryLogoUrl) return queryLogoUrl;
    if (clientLogos[matchId]) return clientLogos[matchId];
    if (dbLogoUrl && dbLogoUrl.trim() !== "") return dbLogoUrl.trim();
    return "";
  }

  const db = firebase.database().ref("matchData/" + matchId);
  const masterPlanDb = firebase.database().ref("masterPlans/" + matchId);
  const userPlanDb = firebase.database().ref("users/" + matchId);

  function lockOverlayDueToExpiry() {
    if (isOverlayLocked) return;
    isOverlayLocked = true;

    if (rafId !== null) {
      cancelAnimationFrame(rafId);
      rafId = null;
    }

    try {
      db.off();
      masterPlanDb.off();
      userPlanDb.off();
    } catch (e) {}

    const stage = document.getElementById("render-stage");
    if (stage) stage.style.display = "none";

    const lockEl = document.getElementById("plan-expired-lock");
    if (lockEl) lockEl.style.display = "flex";
  }

  function evaluatePlanStatus(planObj) {
    if (!planObj || isOverlayLocked) return;

    const explicitExpired =
      planObj.planExpired === true ||
      planObj.expired === true ||
      planObj.isExpired === true ||
      planObj.active === false ||
      String(planObj.status || "").toLowerCase() === "expired";

    let dateExpired = false;
    if (planObj.expiryDate) {
      const expTime = new Date(planObj.expiryDate).getTime();
      if (!Number.isNaN(expTime) && Date.now() > expTime) {
        dateExpired = true;
      }
    }

    if (explicitExpired || dateExpired) {
      lockOverlayDueToExpiry();
    }
  }

  masterPlanDb.on("value", (snap) => {
    evaluatePlanStatus(snap.val());
  });

  userPlanDb.on("value", (snap) => {
    evaluatePlanStatus(snap.val());
  });

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && paVal.trim() !== "") return paVal.trim();
    return (enVal || "").trim();
  }

  let currentLogoUrl = "";
  let currentLogoVisible = true;
  let roundHasValue = false;

  function renderRightCornerLogo() {
    const box = document.getElementById("sb-logo-box");
    const img = document.getElementById("pngLogoImg");
    const clean = (currentLogoUrl || "").trim();

    if (!roundHasValue || !clean || !currentLogoVisible) {
      box.style.display = "none";
      return;
    }

    if (img.src !== clean) {
      img.onload = () => {
        if (roundHasValue && currentLogoVisible && img.src === clean) box.style.display = "flex";
      };
      img.onerror = () => {
        box.style.display = "none";
      };
      img.src = clean;
    } else if (img.complete && img.naturalWidth > 0) {
      box.style.display = "flex";
    }
  }

  /* Floating Watermark State */
  const wmEl = document.getElementById("floating-watermark");
  let wmX = 420;
  let wmY = 220;
  let wmVx = 85;
  let wmVy = 62;
  let wmLastTs = performance.now();
  let wmActive = false;

  function setFloatingWatermark(txt) {
    const clean = String(txt || "").trim();
    if (!roundHasValue || !clean) {
      wmActive = false;
      wmEl.textContent = "";
      wmEl.style.display = "none";
      return;
    }
    wmEl.textContent = clean;
    wmEl.style.display = "block";
    wmActive = true;
  }

  // Per-line speed (px/sec)
  const lineSpeeds = {
    trackTop: Number(urlParams.get("r1Speed")) > 0 ? Number(urlParams.get("r1Speed")) : 95,
    trackYellow: Number(urlParams.get("r2Speed")) > 0 ? Number(urlParams.get("r2Speed")) : 115,
    trackBottom: Number(urlParams.get("r3Speed")) > 0 ? Number(urlParams.get("r3Speed")) : 105
  };

  const tickers = {};
  let latestData = null;

  function normalizeTickerLine(val) {
    if (val === undefined || val === null) return "";
    const str = String(val).replace(/\r?\n/g, " ");
    return str.trim() === "" ? "" : str;
  }

  function updateTicker(trackId, chunkAId, chunkBId, wrapId, rawText, speed) {
    const track = document.getElementById(trackId);
    const chunkA = document.getElementById(chunkAId);
    const chunkB = document.getElementById(chunkBId);
    const wrap = wrapId ? document.getElementById(wrapId) : null;

    const line = normalizeTickerLine(rawText);
    const validSpeed = (Number.isFinite(speed) && speed > 0) ? speed : 100;

    if (!line) {
      if (wrap) wrap.style.visibility = "hidden";
      chunkA.textContent = "";
      chunkB.textContent = "";
      if (tickers[trackId]) {
        tickers[trackId].active = false;
        tickers[trackId].raw = "";
        tickers[trackId].x = 0;
        track.style.transform = "translate3d(0px, -50%, 0)";
      }
      return;
    }

    if (wrap) wrap.style.visibility = "visible";

    const prev = tickers[trackId];
    const textChanged = !prev || prev.raw !== line;

    chunkA.textContent = line;
    chunkB.textContent = line;

    requestAnimationFrame(() => {
      if (isOverlayLocked || !roundHasValue) return;
      const boxW = track.parentElement.getBoundingClientRect().width || 1380;
      let w = chunkA.getBoundingClientRect().width;

      if (w > 0 && w < boxW + 180) {
        const spacer = "        ";
        const count = Math.ceil((boxW + 240) / Math.max(w + 90, 1));
        const repeated = Array(count).fill(line).join(spacer);
        chunkA.textContent = repeated;
        chunkB.textContent = repeated;
        w = itemA.getBoundingClientRect().width;
      }

      if (!prev) {
        tickers[trackId] = {
          el: track,
          raw: line,
          x: 0,
          width: Math.max(w, 1),
          speed: validSpeed,
          active: true,
          ts: performance.now()
        };
      } else {
        prev.raw = line;
        prev.speed = validSpeed;
        prev.active = true;
        if (w > 0) {
          if (textChanged) {
            prev.x = prev.x % w;
            if (prev.x > 0) prev.x -= w;
          }
          prev.width = w;
        }
        prev.ts = performance.now();
      }
    });
  }

  function refreshAllTickers() {
    if (isOverlayLocked || !roundHasValue) {
      updateTicker("trackTop", "chunkTopA", "chunkTopB", "rowTopWrap", "", lineSpeeds.trackTop);
      updateTicker("trackYellow", "chunkYellowA", "chunkYellowB", "rowYellowWrap", "", lineSpeeds.trackYellow);
      updateTicker("trackBottom", "chunkBottomA", "chunkBottomB", "rowBottomWrap", "", lineSpeeds.trackBottom);
      const bar = document.getElementById("bottom-ticker-bar");
      if (bar) bar.style.display = "none";
      return;
    }

    const r1 = normalizeTickerLine(latestData ? latestData.row1Txt : "");
    const r2 = normalizeTickerLine(latestData ? latestData.row2Txt : "");
    const r3 = normalizeTickerLine(latestData ? latestData.row3Txt : "");

    const anyLineActive = Boolean(r1 || r2 || r3);
    const bar = document.getElementById("bottom-ticker-bar");
    if (bar) {
      bar.style.display = anyLineActive ? "flex" : "none";
    }

    updateTicker("trackTop", "chunkTopA", "chunkTopB", "rowTopWrap", r1, lineSpeeds.trackTop);
    updateTicker("trackYellow", "chunkYellowA", "chunkYellowB", r2, lineSpeeds.trackYellow);
    updateTicker("trackBottom", "chunkBottomA", "chunkBottomB", r3, lineSpeeds.trackBottom);
  }

  window.setRowSpeeds = function({ row1, row2, row3 } = {}) {
    if (isOverlayLocked) return;
    if (Number(row1) > 0) lineSpeeds.trackTop = Number(row1);
    if (Number(row2) > 0) lineSpeeds.trackYellow = Number(row2);
    if (Number(row3) > 0) lineSpeeds.trackBottom = Number(row3);
    refreshAllTickers();
  };

  function animateLoop(now) {
    if (isOverlayLocked) return;

    const dt = Math.min((now - wmLastTs) / 1000, 0.08);
    wmLastTs = now;

    Object.values(tickers).forEach((t) => {
      if (!t.active) return;
      t.x -= t.speed * dt;
      if (t.x <= -t.width) {
        t.x += t.width;
      }
      t.el.style.transform = `translate3d(${t.x.toFixed(2)}px, -50%, 0)`;
    });

    if (wmActive) {
      const minX = 40;
      const minY = 140;
      const maxX = Math.max(minX + 100, 1920 - wmEl.offsetWidth - 40);
      const maxY = Math.max(minY + 60, 1080 - 122 - wmEl.offsetHeight - 30);

      wmX += wmVx * dt;
      wmY += wmVy * dt;

      if (wmX <= minX) {
        wmX = minX;
        wmVx = Math.abs(wmVx);
      } else if (wmX >= maxX) {
        wmX = maxX;
        wmVx = -Math.abs(wmVx);
      }

      if (wmY <= minY) {
        wmY = minY;
        wmVy = Math.abs(wmVy);
      } else if (wmY >= maxY) {
        wmY = maxY;
        wmVy = -Math.abs(wmVy);
      }

      wmEl.style.transform = `translate3d(${wmX.toFixed(1)}px, ${wmY.toFixed(1)}px, 0)`;
    }

    rafId = requestAnimationFrame(animateLoop);
  }
  rafId = requestAnimationFrame(animateLoop);

  const stageEl = document.getElementById("render-stage");
  stageEl.style.display = "none";

  db.on("value", (snap) => {
    if (isOverlayLocked) return;
    const data = snap.val();
    if (!data) {
      roundHasValue = false;
      latestData = null;
      stageEl.style.display = "none";
      return;
    }

    latestData = data;
    evaluatePlanStatus(data);
    if (isOverlayLocked) return;

    const roundVal = (data.round !== undefined && data.round !== null) ? String(data.round).trim() : "";
    roundHasValue = roundVal !== "";

    if (!roundHasValue) {
      stageEl.style.display = "none";
      setFloatingWatermark("");
      renderRightCornerLogo();
      refreshAllTickers();
      return;
    }

    stageEl.style.display = "block";

    document.getElementById("scoreboard-wrapper").style.opacity =
      (data.scoreVisible === false) ? "0" : "1";

    document.getElementById("bottom-ticker-bar").style.opacity =
      (data.tickerVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    const scoreA = data.scoreA !== undefined ? data.scoreA : 0;
    const scoreB = data.scoreB !== undefined ? data.scoreB : 0;

    if (data.cameraOpposite) {
      document.getElementById("teamTop").innerText = nameB;
      document.getElementById("scoreLeft").innerText = scoreB;
      document.getElementById("teamBottom").innerText = nameA;
      document.getElementById("scoreRight").innerText = scoreA;
    } else {
      document.getElementById("teamTop").innerText = nameA;
      document.getElementById("scoreLeft").innerText = scoreA;
      document.getElementById("teamBottom").innerText = nameB;
      document.getElementById("scoreRight").innerText = scoreB;
    }

    document.getElementById("roundDisplay").innerText = roundVal;

    setFloatingWatermark(data.watermarkTxt);

    currentLogoUrl = getActiveLogo(data.logoUrl);
    currentLogoVisible = (data.logoVisible !== false);
    renderRightCornerLogo();

    if (Number(data.speedRow1) > 0 && !urlParams.get("r1Speed")) {
      lineSpeeds.trackTop = Number(data.speedRow1);
    }
    if (Number(data.speedRow2) > 0 && !urlParams.get("r2Speed")) {
      lineSpeeds.trackYellow = Number(data.speedRow2);
    }
    if (Number(data.speedRow3) > 0 && !urlParams.get("r3Speed")) {
      lineSpeeds.trackBottom = Number(data.speedRow3);
    }

    refreshAllTickers();
  });
</script>
</body>
</html>
