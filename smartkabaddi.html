<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Live Overlay</title>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@700;900&family=Oswald:wght@700&family=Roboto+Condensed:wght@700;900&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Roboto Condensed', 'Noto Sans Gurmukhi', sans-serif;
  }

  #render-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1920px;
    height: 1080px;
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    background: transparent;
    overflow: hidden;
  }

  /* ==================== TOP-LEFT SCOREBOARD + PNG LOGO ==================== */
  #scoreboard-wrapper {
    position: absolute;
    top: 30px;
    left: 40px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: opacity 0.25s ease;
    z-index: 15;
  }

  .sb-left-col {
    display: flex;
    flex-direction: column;
  }

  .sb-main {
    display: flex;
    align-items: center;
    height: 92px;
    position: relative;
  }

  .hex-wrap {
    width: 108px;
    height: 98px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }

  .hex-box {
    width: 102px;
    height: 92px;
    clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 52px;
    font-weight: 700;
  }

  .hex-left {
    background: linear-gradient(180deg, #ffe600 0%, #d4b800 100%);
    color: #0b4619;
  }

  .hex-right {
    background: linear-gradient(180deg, #1b7a2a 0%, #0d4a17 100%);
    color: #ffe600;
  }

  .teams-bars {
    display: flex;
    flex-direction: column;
    justify-content: center;
    margin-left: -26px;
    margin-right: -26px;
    z-index: 2;
    width: 390px;
  }

  .team-bar {
    height: 41px;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-top: 2px solid #ffffff;
    border-bottom: 2px solid #ffffff;
  }

  .bar-top {
    background: linear-gradient(90deg, #f5d800 0%, #ffe933 100%);
    color: #000000;
    padding-left: 38px;
    padding-right: 45px;
    justify-content: flex-start;
  }

  .bar-bottom {
    background: linear-gradient(90deg, #0e521b 0%, #197a2c 100%);
    color: #ffffff;
    padding-left: 45px;
    padding-right: 38px;
    justify-content: flex-end;
    margin-top: -2px;
  }

  .sb-round {
    margin-top: 6px;
    padding-left: 24px;
    font-size: 25px;
    font-weight: 900;
    color: #ffffff;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    -webkit-text-stroke: 1px #000000;
    paint-order: stroke fill;
  }

  /* PNG Logo Attached Right Beside Scoreboard */
  #sb-logo-box {
    width: 112px;
    height: 98px;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #pngLogoImg {
    max-width: 108px;
    max-height: 96px;
    width: auto;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.75));
  }

  /* ==================== TOP-RIGHT WATERMARK ==================== */
  #watermark-box {
    position: absolute;
    top: 30px;
    right: 42px;
    background: rgba(12, 12, 12, 0.88);
    border: 2px solid #ffe600;
    border-radius: 10px;
    padding: 7px 20px;
    color: #ffe600;
    font-size: 26px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: none;
    z-index: 15;
  }

  /* ==================== BOTTOM 3-LINE TICKER WITH GREEN SIDE BOXES ==================== */
  #bottom-ticker-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 1920px;
    height: 122px;
    display: flex;
    align-items: stretch;
    background: #0d0d0d;
    transition: opacity 0.25s ease;
    z-index: 10;
  }

  .side-box-left {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 50%, calc(100% - 28px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding-right: 16px;
    flex-shrink: 0;
    z-index: 5;
  }

  .live-label {
    font-family: 'Roboto Condensed', sans-serif;
    font-style: italic;
    font-size: 60px;
    font-weight: 900;
    color: #ffe600;
    letter-spacing: 1.5px;
    line-height: 1;
    transform: skewX(-6deg);
  }

  .ticker-center {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100%;
    margin-left: -28px;
    margin-right: -28px;
    overflow: hidden;
    background: #0d0d0d;
    z-index: 2;
  }

  .row-top {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 27px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    overflow: hidden;
    position: relative;
  }

  .row-yellow {
    height: 42px;
    background: #ffe600;
    color: #111111;
    display: flex;
    align-items: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .row-bottom {
    height: 40px;
    background: #0d0d0d;
    color: #ffffff;
    display: flex;
    align-items: center;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.3px;
    overflow: hidden;
    position: relative;
  }

  .scroll-box {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .scroll-track {
    position: absolute;
    top: 50%;
    left: 0;
    transform: translate3d(0, -50%, 0);
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    will-change: transform;
  }

  .scroll-item {
    display: inline-block;
    padding-right: 75px;
  }

  .side-box-right {
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #1b8a2b 0%, #0d4a17 100%);
    clip-path: polygon(28px 0, 100% 0, 100% 100%, 28px 100%, 0 50%);
    flex-shrink: 0;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="render-stage">

    <!-- SCOREBOARD + PNG LOGO -->
    <div id="scoreboard-wrapper">
      <div class="sb-left-col">
        <div class="sb-main">
          <div class="hex-wrap">
            <div class="hex-box hex-left" id="scoreLeft">0</div>
          </div>

          <div class="teams-bars">
            <div class="team-bar bar-top" id="teamTop">TEAM A</div>
            <div class="team-bar bar-bottom" id="teamBottom">TEAM B</div>
          </div>

          <div class="hex-wrap">
            <div class="hex-box hex-right" id="scoreRight">0</div>
          </div>
        </div>
        <div class="sb-round" id="roundDisplay">KABADDI OPEN MATCH</div>
      </div>

      <div id="sb-logo-box">
        <img id="pngLogoImg" alt="Logo">
      </div>
    </div>

    <!-- WATERMARK -->
    <div id="watermark-box"></div>

    <!-- BOTTOM 3-LINE SCROLLING TICKER -->
    <div id="bottom-ticker-bar">
      <div class="side-box-left">
        <div class="live-label">LIVE</div>
      </div>

      <div class="ticker-center">
        <div class="row-top">
          <div class="scroll-box">
            <div class="scroll-track" id="trackTop">
              <span class="scroll-item" id="itemTopA">OPEN KABADDI TOURNAMENT</span>
              <span class="scroll-item" id="itemTopB">OPEN KABADDI TOURNAMENT</span>
            </div>
          </div>
        </div>

        <div class="row-yellow">
          <div class="scroll-box">
            <div class="scroll-track" id="trackYellow">
              <span class="scroll-item" id="itemYellowA">LIVE KABADDI BROADCAST</span>
              <span class="scroll-item" id="itemYellowB">LIVE KABADDI BROADCAST</span>
            </div>
          </div>
        </div>

        <div class="row-bottom">
          <div class="scroll-box">
            <div class="scroll-track" id="trackBottom">
              <span class="scroll-item" id="itemBottomA">STAY TUNED FOR UPDATES</span>
              <span class="scroll-item" id="itemBottomB">STAY TUNED FOR UPDATES</span>
            </div>
          </div>
        </div>
      </div>

      <div class="side-box-right"></div>
    </div>

  </div>

<script>
  function fitStage() {
    const stage = document.getElementById("render-stage");
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }
  fitStage();
  window.addEventListener("resize", fitStage);

  const firebaseConfig = {
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
  };
  firebase.initializeApp(firebaseConfig);

  const urlParams = new URLSearchParams(window.location.search);
  const matchId = urlParams.get('id') || 'defaultMatch';
  const langMode = urlParams.get('lang') || 'en';
  const queryLogoUrl = (urlParams.get('logo') || "").trim();

  const clientLogos = {
    "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/KABADDI%20SPORTS%201%20Logo.png"
  };

  function getActiveLogo(dbLogoUrl) {
    if (queryLogoUrl) return queryLogoUrl;
    if (dbLogoUrl && dbLogoUrl.trim() !== "") return dbLogoUrl.trim();
    if (clientLogos[matchId]) return clientLogos[matchId];
    return "";
  }

  const db = firebase.database().ref("matchData/" + matchId);

  function getText(enVal, paVal) {
    if (langMode === 'pa' && paVal && paVal.trim() !== "") return paVal.trim();
    return (enVal || "").trim();
  }

  function setScoreboardLogo(url) {
    const box = document.getElementById("sb-logo-box");
    const img = document.getElementById("pngLogoImg");
    const clean = (url || "").trim();

    if (!clean) {
      img.onload = null;
      img.onerror = null;
      img.removeAttribute("src");
      box.style.display = "none";
      return;
    }

    img.onload = () => {
      box.style.display = "flex";
    };
    img.onerror = () => {
      box.style.display = "none";
    };
    img.src = clean;
  }

  const tickers = {};

  function updateTicker(trackId, itemAId, itemBId, text, speed) {
    const track = document.getElementById(trackId);
    const itemA = document.getElementById(itemAId);
    const itemB = document.getElementById(itemBId);

    const clean = (text && text.trim()) ? text.trim() : "LIVE KABADDI TOURNAMENT";
    itemA.textContent = clean;
    itemB.textContent = clean;

    requestAnimationFrame(() => {
      let w = itemA.getBoundingClientRect().width;
      const boxW = track.parentElement.getBoundingClientRect().width || 1400;

      if (w < boxW * 1.15) {
        const count = Math.ceil((boxW * 1.4) / Math.max(w, 120));
        const repeated = Array(count).fill(clean).join("     •     ");
        itemA.textContent = repeated;
        itemB.textContent = repeated;
        w = itemA.getBoundingClientRect().width;
      }

      const validSpeed = (Number.isFinite(speed) && speed > 0) ? speed : 100;

      if (!tickers[trackId]) {
        tickers[trackId] = {
          el: track,
          x: 0,
          width: w || 600,
          speed: validSpeed,
          ts: performance.now()
        };
      } else {
        tickers[trackId].width = w || 600;
        tickers[trackId].speed = validSpeed;
      }
    });
  }

  function animateTickers(now) {
    Object.values(tickers).forEach((t) => {
      const dt = Math.min((now - t.ts) / 1000, 0.1);
      t.ts = now;
      t.x -= t.speed * dt;
      if (Math.abs(t.x) >= t.width) {
        t.x += t.width;
      }
      t.el.style.transform = `translate3d(${t.x.toFixed(2)}px, -50%, 0)`;
    });
    requestAnimationFrame(animateTickers);
  }
  requestAnimationFrame(animateTickers);

  const initialLogo = getActiveLogo("");
  if (initialLogo) {
    setScoreboardLogo(initialLogo);
  }

  db.on("value", (snap) => {
    const data = snap.val();
    if (!data) return;

    document.getElementById("scoreboard-wrapper").style.opacity =
      (data.scoreVisible === false) ? "0" : "1";

    document.getElementById("bottom-ticker-bar").style.opacity =
      (data.tickerVisible === false) ? "0" : "1";

    const nameA = getText(data.nameA, data.nameA_pa) || "TEAM A";
    const nameB = getText(data.nameB, data.nameB_pa) || "TEAM B";
    const scoreA = data.scoreA !== undefined ? data.scoreA : 0;
    const scoreB = data.scoreB !== undefined ? data.scoreB : 0;

    if (data.cameraOpposite) {
      document.getElementById("teamTop").innerText = nameB;
      document.getElementById("scoreLeft").innerText = scoreB;
      document.getElementById("teamBottom").innerText = nameA;
      document.getElementById("scoreRight").innerText = scoreA;
    } else {
      document.getElementById("teamTop").innerText = nameA;
      document.getElementById("scoreLeft").innerText = scoreA;
      document.getElementById("teamBottom").innerText = nameB;
      document.getElementById("scoreRight").innerText = scoreB;
    }

    document.getElementById("roundDisplay").innerText = data.round || "";

    const wm = document.getElementById("watermark-box");
    if (data.watermarkTxt && data.watermarkTxt.trim() !== "") {
      wm.innerText = data.watermarkTxt.trim();
      wm.style.display = "block";
    } else {
      wm.style.display = "none";
    }

    setScoreboardLogo(getActiveLogo(data.logoUrl));

    const speed1 = parseFloat(data.speedRow1) || 95;
    const speed2 = parseFloat(data.speedRow2) || 115;
    const speed3 = parseFloat(data.speedRow3) || 105;

    // Row 1
    const r1 = (data.row1Txt || "").trim() || "OPEN KABADDI TOURNAMENT";
    updateTicker("trackTop", "itemTopA", "itemTopB", r1, speed1);

    // Row 2
    const r2Parts = [];
    const r2Main = ((data.row2Txt || data.programTxt) || "").trim();
    if (r2Main) r2Parts.push(r2Main);
    if (data.resultText && data.resultText !== "No Result Yet") {
      r2Parts.push(`RESULT :- ${data.resultText}`);
    }
    const r2Line = r2Parts.length > 0 ? r2Parts.join("     |     ") : r1;
    updateTicker("trackYellow", "itemYellowA", "itemYellowB", r2Line, speed2);

    // Row 3
    const r3Parts = [];
    if (data.row3Txt && data.row3Txt.trim() !== "") {
      r3Parts.push(data.row3Txt.trim());
    }
    if (Array.isArray(data.nextMatches) && data.nextMatches.length > 0) {
      r3Parts.push(`NEXT MATCHES :- ${data.nextMatches.join(" , ")}`);
    }
    if (data.contactUs && data.contactUs.trim() !== "") {
      r3Parts.push(data.contactUs.trim());
    }
    const r3Line = r3Parts.length > 0 ? r3Parts.join("     |     ") : "LIVE KABADDI BROADCAST";
    updateTicker("trackBottom", "itemBottomA", "itemBottomB", r3Line, speed3);
  });
</script>
</body>
</html>
