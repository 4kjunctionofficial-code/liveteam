<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { 
            margin: 0; padding: 0; width: 1920px; height: 1080px; 
            background: transparent; overflow: hidden; position: relative; 
        }
        
        /* 100% ਹੂਬਹੂ ਸੇਮ ਟਿਕਰ ਬਾਕਸ - ਕੋਡ ਰਾਹੀਂ ਤਿਆਰ */
        #main-ticker-container {
            position: absolute; bottom: 0; left: 0; width: 1920px; height: 155px;
            display: flex; z-index: 9998; opacity: 1; transition: all 0.5s ease;
        }
        #main-ticker-container.hidden { opacity: 0; transform: translateY(160px); }

        /* ਖੱਬੇ ਪਾਸੇ ਵਾਲਾ ਤਿਰਛਾ ਲਾਲ LIVE ਬਾਕਸ */
        .live-box-new {
            width: 280px; height: 155px; background: #e60000;
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%);
            z-index: 15; padding-right: 40px; box-sizing: border-box;
        }
        .live-text-new {
            color: white; font-size: 75px; font-weight: 900;
            font-family: 'Impact', 'Arial Black', sans-serif; text-transform: uppercase;
            letter-spacing: 1px; text-shadow: 2px 3px 5px rgba(0,0,0,0.3);
        }

        /* ਸੈਂਟਰ ਵਾਲੀ 3-ਸਟੈਪ ਗ੍ਰੇ ਪੱਟੀ (ਬਿਲਕੁਲ ਫੋਟੋ ਵਰਗੀ) */
        .center-ticker-new {
            flex: 1; height: 155px; margin-left: -65px; margin-right: -55px;
            display: flex; flex-direction: column; z-index: 10; overflow: hidden;
            clip-path: polygon(5% 0, 100% 0, 96% 100%, 0 100%);
        }
        .row-text { 
            display: flex; align-items: center; font-weight: 900; text-transform: uppercase; 
            width: 100%; overflow: hidden; box-sizing: border-box; white-space: nowrap; 
            font-family: 'Arial', sans-serif; padding-left: 90px;
        }
        .row-1 { background: #5a5a5a; color: #ffffff; height: 46px; font-size: 26px; border-bottom: 1px solid #4a4a4a; } 
        .row-2 { background: #969696; color: #000000; height: 62px; font-size: 38px; padding-left: 100px; } 
        .row-3 { background: #383838; color: #ffcc00; height: 47px; font-size: 26px; border-top: 1px solid #4a4a4a; }

        .scroller { display: inline-block; padding-left: 100%; animation: scroll-anim 25s linear infinite; }
        @keyframes scroll-anim { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* ਸੱਜੇ ਪਾਸੇ ਵਾਲਾ ਤਿਰਛਾ ਲਾਲ TIME ਬਾਕਸ */
        .time-box-new {
            width: 320px; height: 155px; background: #e60000;
            display: flex; align-items: center; justify-content: center;
            clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%);
            z-index: 15; padding-left: 50px; box-sizing: border-box;
        }
        .time-wrap, .date-wrap { position: absolute; width: 100%; display: flex; align-items: center; justify-content: center; transition: 0.8s; font-family: 'Arial', sans-serif; font-weight: bold; }
        .time-str { color: #ffffff; font-size: 45px; letter-spacing: 1px; font-weight: 900; }
        .date-str { font-size: 30px; color: #ffffff; font-weight: 900; }

        /* ਵਟਸਐਪ ਨੰਬਰ ਪੱਟੀ (ਟਿਕਰ ਦੇ ਉੱਪਰ ਖੱਬੇ ਪਾਸੇ ਹੂਬਹੂ ਸੇਮ) */
        .whatsapp-bar-new {
            position: absolute; bottom: 165px; left: 10px; display: flex; align-items: center;
            background: #000000; color: #ffffff; padding: 5px 20px 5px 50px; border-radius: 25px;
            font-size: 24px; font-weight: 900; font-family: 'Arial', sans-serif; z-index: 9999;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2);
        }
        .whatsapp-icon-new {
            position: absolute; left: -2px; width: 46px; height: 46px;
            background: #e60000; border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }
        /* SVG ਵਟਸਐਪ ਆਈਕਨ - ਕਿਸੇ ਬਾਹਰਲੇ ਲਿੰਕ ਦੀ ਲੋੜ ਨਹੀਂ */
        .whatsapp-icon-new svg { width: 26px; height: 26px; fill: white; }

        /* ਉੱਪਰ ਖੱਬੇ ਪਾਸੇ ਕਲਾਇੰਟ ਲੋਗੋ ਕੰਟੇਨਰ */
        #logo-container {
            position: absolute; top: 30px; left: 40px; z-index: 9999;
            opacity: 1; transition: all 0.5s ease;
        }
        #logo-container.hidden { opacity: 0; transform: scale(0); }
        #main-logo { height: 85px; width: auto; max-width: 350px; object-fit: contain; }

        /* ਰੈਂਡਮ ਘੁੰਮਣ ਵਾਲਾ ਵਾਟਰਮਾਰਕ */
        #single-wm { 
            position: absolute; color: rgba(255, 255, 255, 0.6); font-size: 32px; font-weight: bold; 
            font-family: 'Arial', sans-serif; text-transform: uppercase; text-shadow: 2px 2px 5px #000; 
            white-space: nowrap; z-index: 1;
        }

        /* ਸਕੋਰਬੋਰਡ (Top Right) */
        #scoreboard { 
            position: absolute; top: 45px; right: 80px; display: flex; flex-direction: column; align-items: center; z-index: 9999;
            opacity: 1; transition: all 0.5s ease; 
        }
        #scoreboard.hidden { opacity: 0; transform: translateY(-100px); }
        .main-bar { 
            display: flex; align-items: center; height: 65px; background: rgba(20, 20, 20, 0.95); 
            border-radius: 6px; border: 2px solid rgba(255,255,255,0.2); padding: 0 5px; position: relative; overflow: hidden; 
        }
        .s-box { 
            background: linear-gradient(145deg, #e60000, #990000); color: #ffffff; font-size: 42px; font-weight: 900; 
            width: 120px; height: 100%; display: flex; align-items: center; justify-content: center; 
            transform: skewX(-15deg); text-shadow: 2px 2px 4px #000; box-shadow: inset 2px 2px 6px rgba(255,255,255,0.4); position: relative; z-index: 11; 
        }
        .s-left { margin-left: -17px; border-radius: 4px 0 0 4px; }
        .s-right { margin-right: -17px; border-radius: 0 4px 4px 0; }
        .inner-val { transform: skewX(15deg); }
        .name-area { 
            width: 220px; height: 100%; display: flex; align-items: center; overflow: hidden; 
            white-space: nowrap; color: #ffffff; font-size: 28px; font-weight: bold; font-family: 'Arial', sans-serif;
            text-align: center; padding: 0 10px; text-shadow: 2px 2px 4px #000; box-sizing: border-box; text-transform: uppercase; position: relative; z-index: 11;
        }
        .team-scroller { display: inline-block; padding-left: 100%; animation: team-scroll 8s linear infinite; }
        @keyframes team-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .vs-text { 
            color: #ffffff; font-size: 20px; font-weight: 900; margin: 0 10px; text-shadow: 1px 1px 3px #000; 
            background: #333; display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px; border-radius: 50%; border: 2px solid #e60000; position: relative; z-index: 11;
        }
        .round-display {
            color: white; font-size: 22px; font-weight: bold; text-transform: uppercase; font-family: 'Arial', sans-serif;
            margin-top: 15px; text-shadow: 2px 2px 6px #000; letter-spacing: 2px; display: block; background: rgba(0,0,0,0.6); padding: 4px 15px; border-radius: 4px;
        }
    </style>
</head>
