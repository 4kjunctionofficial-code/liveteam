<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
font-family:'Segoe UI',sans-serif;
background:#f0f2f5;
margin:0;
padding:10px;
display:flex;
flex-direction:column;
align-items:center;
}
.card{
background:white;
width:100%;
max-width:650px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
margin-bottom:20px;
overflow:hidden;
}
.header{
background:#1a73e8;
color:white;
padding:14px;
text-align:center;
font-weight:bold;
font-size:18px;
}
.teams-container{
display:flex;
padding:20px;
gap:20px;
}
.team-box{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
}
.team-input,.std-input,select{
width:100%;
padding:12px;
font-size:22px;
font-weight:bold;
border:2px solid #ccc;
border-radius:8px;
margin-bottom:12px;
box-sizing:border-box;
}
.score-val{
font-size:70px;
font-weight:900;
}
.btn-pm{
flex:1;
padding:16px;
font-size:28px;
border:none;
border-radius:8px;
color:white;
margin:0 5px;
}
.btn-plus{background:#28a745;}
.btn-minus{background:#dc3545;}
.controls,.settings-section{
padding:15px;
display:flex;
flex-direction:column;
gap:8px;
}
.btn-full{
padding:14px;
border:none;
border-radius:8px;
font-weight:bold;
font-size:15px;
cursor:pointer;
}
.btn-blue{background:#1a73e8;color:white;}
.btn-yellow{background:#fbbc05;}
.btn-red{background:#ea4335;color:white;}
.btn-dark{background:#333;color:white;}
textarea{
width:100%;
min-height:90px;
padding:16px;
font-size:24px;
font-weight:bold;
border:2px solid #ccc;
border-radius:8px;
resize:none;
overflow:hidden;
box-sizing:border-box;
}
</style>
</head>
<body>

<!-- SCORE -->
<div class="card">
<div class="header">Live Score Board</div>

<div class="teams-container">

<div class="team-box">
<input id="nameA" class="team-input" placeholder="TEAM 1">
<div id="dispA" class="score-val">0</div>
<div style="display:flex;width:100%">
<button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button>
</div>
</div>

<div style="display:flex;align-items:center;font-size:26px;">VS</div>

<div class="team-box">
<input id="nameB" class="team-input" placeholder="TEAM 2">
<div id="dispB" class="score-val">0</div>
<div style="display:flex;width:100%">
<button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button>
</div>
</div>

</div>

<div class="controls">
<button class="btn-full btn-blue" onclick="updateTeamNames()">Update Team Names</button>
<button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">Hide Scoreboard</button>
<button class="btn-full btn-red" onclick="resetScores()">Reset Scores</button>
<button class="btn-full btn-yellow" onclick="swapTeamNames()">Only Team Swap</button>
<button id="camBtn" class="btn-full btn-dark" onclick="toggleCameraView()">Camera View</button>
<input id="roundInp" class="std-input" placeholder="ROUND">
</div>
</div>

<!-- TICKER -->
<div class="card">
<div class="header">Ticker & Branding</div>
<div class="settings-section">
<textarea id="row1Inp" oninput="autoGrow(this)" placeholder="Title Line 1"></textarea>
<textarea id="row2Inp" oninput="autoGrow(this)" placeholder="Title Line 2"></textarea>
<textarea id="row3Inp" oninput="autoGrow(this)" placeholder="Title Line 3"></textarea>
<input id="watermarkInp" class="std-input" placeholder="Channel Name">
<button class="btn-full btn-blue" onclick="updateTicker()">Update Ticker</button>
<button id="tickVisBtn" class="btn-full btn-red" onclick="toggleVis('tickerVisible')">Hide Ticker</button>
</div>
</div>

<!-- TEAM LIST -->
<div class="card">
<div class="header">Teams List</div>
<div class="settings-section">

<input id="newTeamInp" class="std-input" placeholder="Add New Team">
<button class="btn-full btn-blue" onclick="addTeamToList()">Add Team To List</button>

<select id="team1Select" onchange="selectTeam(1)">
<option value="">Select Team 1</option>
</select>

<select id="team2Select" onchange="selectTeam(2)">
<option value="">Select Team 2</option>
</select>

</div>
</div>

<script>
const firebaseConfig={
databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);

const matchId=new URLSearchParams(window.location.search).get('id')||'defaultMatch';
const db=firebase.database().ref("matchData/"+matchId);

let curA=0,curB=0,sVis=true,tVis=true,camOpposite=false;
let teamsList=[];

db.on("value",snap=>{
const data=snap.val();
if(!data)return;

curA=data.scoreA||0;
curB=data.scoreB||0;

document.getElementById("dispA").innerText=curA;
document.getElementById("dispB").innerText=curB;

document.getElementById("nameA").value=data.nameA||"";
document.getElementById("nameB").value=data.nameB||"";

document.getElementById("roundInp").value=data.round||"";
document.getElementById("row1Inp").value=data.row1Txt||"";
document.getElementById("row2Inp").value=data.row2Txt||"";
document.getElementById("row3Inp").value=data.row3Txt||"";
document.getElementById("watermarkInp").value=data.watermarkTxt||"";

autoGrow(row1Inp); autoGrow(row2Inp); autoGrow(row3Inp);

teamsList=data.teamsList||[];
renderTeamDropdowns();

camOpposite=data.cameraOpposite||false;
document.querySelector(".teams-container").style.flexDirection=
camOpposite?"row-reverse":"row";
});

function changeScore(team,val){
let c=team==="scoreA"?curA:curB;
let n=(val>0)?(curA===0&&curB===0?1.5:c+1):(c===1.5?0:Math.max(0,c-1));
db.update({[team]:n});
}

function updateTeamNames(){
db.update({
nameA:nameA.value,
nameB:nameB.value
});
}

function updateTicker(){
db.update({
round:roundInp.value,
row1Txt:row1Inp.value,
row2Txt:row2Inp.value,
row3Txt:row3Inp.value,
watermarkTxt:watermarkInp.value
});
}

function toggleVis(field){
db.child(field).set(true);
}

function resetScores(){
if(confirm("Reset?")) db.update({scoreA:0,scoreB:0});
}

function swapTeamNames(){
db.update({nameA:nameB.value,nameB:nameA.value});
}

function toggleCameraView(){
db.update({cameraOpposite:!camOpposite});
}

function autoGrow(el){
el.style.height="auto";
el.style.height=el.scrollHeight+"px";
}

function addTeamToList(){
let t=newTeamInp.value.trim();
if(!t)return;
if(!teamsList.includes(t)){
teamsList.push(t);
db.update({teamsList});
}
newTeamInp.value="";
}

function renderTeamDropdowns(){
team1Select.innerHTML='<option value="">Select Team 1</option>';
team2Select.innerHTML='<option value="">Select Team 2</option>';
teamsList.forEach(t=>{
team1Select.innerHTML+=`<option value="${t}">${t}</option>`;
team2Select.innerHTML+=`<option value="${t}">${t}</option>`;
});
}

function selectTeam(n){
if(n===1){
nameA.value=team1Select.value;
db.update({nameA:team1Select.value});
}else{
nameB.value=team2Select.value;
db.update({nameB:team2Select.value});
}
}
</script>

</body>
</html>
