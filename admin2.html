<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{ font-family:'Segoe UI',sans-serif; background:#f0f2f5; margin:0; padding:8px; }
#main-panel{ width:100%; max-width:760px; margin:auto; }
.card{ background:white; border-radius:14px; box-shadow:0 5px 15px rgba(0,0,0,.15); overflow:hidden; margin-bottom:15px; }
.header{ background:#1a73e8; color:white; padding:10px; text-align:center; font-size:16px; font-weight:bold; text-transform: uppercase; }

.teams-container{ display:flex; gap:10px; padding:12px; align-items:center; }
.team-box{ flex:1; }
.vs-text{ font-size:24px; font-weight:bold; color:#999; }

select, input, textarea{ width:100%; padding:10px; border:2px solid #ddd; border-radius:8px; font-size:15px; font-weight:bold; box-sizing:border-box; margin-bottom:8px; }
textarea { resize: vertical; overflow-y: auto; min-height: 50px; max-height: 200px; }

.team-top{ display:flex; gap:6px; align-items: stretch; }
.team-inputs-wrap { display:flex; flex-direction:column; gap:5px; flex:1; }
.team-input-row { display:flex; gap:5px; }
.team-input{ flex:1; margin-bottom: 0 !important; }

.trans-btn { background:#fbbc05; border:none; border-radius:8px; font-weight:bold; cursor:pointer; padding:0 12px; font-size:16px; color:black; }

.score-val{ text-align:center; font-size:52px; font-weight:900; margin:6px 0; }
.pm-wrap{ display:flex; gap:6px; }
.btn-pm{ flex:1; border:none; color:white; padding:12px; border-radius:8px; font-size:24px; font-weight:bold; cursor:pointer; }
.btn-plus{ background:#28a745; }
.btn-minus{ background:#dc3545; }

.controls{ padding:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
.btn-full{ border:none; color:white; height:70px; min-height:70px; padding:10px; border-radius:12px; font-size:18px; font-weight:900; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.2; overflow:hidden; word-break:break-word; }

/* LIST STYLES */
.match-item { background: #fff; border: 2px solid #ddd; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 10px; }
.event-item { background: #e3f2fd; border: 1px solid #90caf9; border-radius: 8px; padding: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
.match-title { font-size: 16px; font-weight: bold; text-align: center; color: #333; }
.match-actions { display: flex; gap: 5px; justify-content: center; }
.btn-sm { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; color: white; cursor: pointer; font-size: 14px; }
.btn-start { background: #1a73e8; }
.btn-walkover { background: #fd7e14; }
.btn-delete { background: #dc3545; max-width: 40px; }
.list-header { font-size: 15px; font-weight: 900; padding: 5px 0; border-bottom: 2px solid #ddd; margin-bottom: 10px; color: #444; }

/* GRID FOR PRIZES */
.prize-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #ddd; }
.prize-col label { font-size: 14px; font-weight: bold; color: #1a73e8; margin-bottom: 8px; display: block; border-bottom: 2px solid #1a73e8; padding-bottom: 2px; }
.prize-col input { font-size: 14px; padding: 8px; margin-bottom: 6px; }

/* MOBILE */
@media(max-width:768px){
    .controls{ grid-template-columns:repeat(2,1fr); }
    .btn-full{ font-size:16px; height:68px; }
    .teams-container { flex-direction: column; }
    .vs-text { padding: 10px 0; }
    .prize-grid { grid-template-columns: 1fr; }
}

.btn-green{background:#28a745;}
.btn-red{background:#ea4335;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-dark{background:#333;}
.btn-blue{background:#1a73e8;}
.btn-purple{background:#6f42c1;}

.settings-section{ padding:12px; }
.result-box{ background:#111; color:white; border-radius:10px; padding:18px; text-align:center; }
.result-title{ font-size:28px; font-weight:900; color:#fbbc05; }
.result-text{ font-size:20px; font-weight:bold; margin-top:10px; }
.ticker-label { font-size: 14px; font-weight: 800; color: #1a73e8; margin: 15px 0 5px 0; display: block; border-bottom: 2px solid #1a73e8; padding-bottom: 3px; }
</style>
</head>

<body>

<div id="main-panel">

<div class="card">
    <div class="header" style="background:#fbbc05; color:black;">LANGUAGE TRANSLATION SETTINGS</div>
    <div class="settings-section" style="display:flex; align-items:center; gap:10px;">
        <span style="font-weight:bold; font-size:16px;">Translate to:</span>
        <select id="targetLang" style="margin-bottom:0; border: 2px solid #fbbc05;">
            <option value="en">English (ਅੰਗਰੇਜ਼ੀ)</option>
            <option value="pa">Punjabi (ਪੰਜਾਬੀ)</option>
            <option value="hi">Hindi (हिन्दी)</option>
            <option value="ur">Urdu (اردو)</option>
        </select>
    </div>
</div>

<div class="card">
<div class="header">LIVE SCORE BOARD</div>
<div class="teams-container" id="teamWrap">
<div class="team-box">
<select id="teamSelectA" onchange="selectTeamA(this.value)"><option value="">Select Team A</option></select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameA" class="team-input" placeholder="Team 1 (Input)" oninput="updateTeamA()">
            <button class="trans-btn" onclick="translateText('nameA', 'nameA_pa').then(() => updateTeamA())">⇄</button>
        </div>
        <input type="text" id="nameA_pa" class="team-input" placeholder="Team 1 (Translated)" oninput="updateTeamA()">
    </div>
</div>
<div class="score-val" id="dispA">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button>
</div>
</div>
<div class="vs-text">VS</div>
<div class="team-box">
<select id="teamSelectB" onchange="selectTeamB(this.value)"><option value="">Select Team B</option></select>
<div class="team-top">
    <div class="team-inputs-wrap">
        <div class="team-input-row">
            <input type="text" id="nameB" class="team-input" placeholder="Team 2 (Input)" oninput="updateTeamB()">
            <button class="trans-btn" onclick="translateText('nameB', 'nameB_pa').then(() => updateTeamB())">⇄</button>
        </div>
        <input type="text" id="nameB_pa" class="team-input" placeholder="Team 2 (Translated)" oninput="updateTeamB()">
    </div>
</div>
<div class="score-val" id="dispB">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button>
</div>
</div>
</div>

<div class="controls">
<button class="btn-full btn-green" onclick="showResultLayer()">RESULT</button>
<button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">Hide Scoreboard</button>
<button class="btn-full btn-yellow" onclick="swapTeams()">SWAP</button>
<button class="btn-full btn-dark" id="camBtn" onclick="toggleCameraView()">Camera View</button>
<button class="btn-full" style="background:#777;" onclick="resetScores()">RESET SCORES</button>
</div>

<div class="settings-section">
<input type="text" id="roundInp" placeholder="MATCH ROUND / CATEGORY (e.g. 72 KG QUARTER FINAL)" oninput="updateTicker();">

<div class="header" style="margin-bottom:10px; margin-top:10px;">NEXT MATCH LIST & SETUP</div>
<select id="nextTeamA"><option value="">Select Next Match Team 1</option></select>
<select id="nextTeamB"><option value="">Select Next Match Team 2</option></select>

<div style="display:flex; gap:10px; margin-bottom:15px;">
    <button class="btn-full btn-blue" onclick="addNextMatch('weight')" style="height:50px; min-height:50px; font-size:14px;">+ ADD TO WEIGHT LIST</button>
    <button class="btn-full btn-purple" onclick="addNextMatch('open')" style="height:50px; min-height:50px; font-size:14px;">+ ADD TO OPEN LIST</button>
</div>

<div class="list-header">🏋️ WEIGHT MATCHES (ਵਜ਼ਨੀ)</div>
<div id="nextMatchContainerWeight" style="margin-bottom:15px;"></div>
<div class="list-header">🔥 OPEN MATCHES (ਓਪਨ)</div>
<div id="nextMatchContainerOpen"></div>
</div>
</div>

<div class="card">
    <div class="header" style="background:#0066cc;">TICKER SETTINGS (DOUBLE STRIP)</div>
    <div class="settings-section">
        
        <label class="ticker-label">1. Village / Location Name (Top Left)</label>
        <div class="team-inputs-wrap">
            <div class="team-input-row">
                <input type="text" id="row1Inp" class="team-input" placeholder="e.g. MAHLA, NEAR GORAYA" oninput="updateTicker();">
                <button class="trans-btn" onclick="translateText('row1Inp', 'row1Inp_pa').then(() => updateTicker())">⇄</button>
            </div>
            <input type="text" id="row1Inp_pa" class="team-input" placeholder="Translated Village" oninput="updateTicker();">
        </div>

        <label class="ticker-label">2. Tournament Prizes (Top Center Scrolling)</label>
        <div class="prize-grid">
            <div class="prize-col">
                <label>🔥 ਓਪਨ ਕਬੱਡੀ (OPEN KABADDI)</label>
                <input type="text" id="pzOp1" placeholder="1st Prize (e.g. 1 Lakh)" oninput="updateTicker();">
                <input type="text" id="pzOp2" placeholder="2nd Prize" oninput="updateTicker();">
                <input type="text" id="pzOpBest" placeholder="Best Player Prize" oninput="updateTicker();">
            </div>
            <div class="prize-col">
                <label>🏋️ ਵਜ਼ਨੀ ਕਬੱਡੀ (WEIGHT KABADDI)</label>
                <input type="text" id="pzWtKg" placeholder="Kinne KG? (e.g. 72 KG)" style="background:#fff3cd; border-color:#ffecb5; color:#856404;" oninput="updateTicker();">
                <input type="text" id="pzWt1" placeholder="1st Prize" oninput="updateTicker();">
                <input type="text" id="pzWt2" placeholder="2nd Prize" oninput="updateTicker();">
                <input type="text" id="pzWtBest" placeholder="Best Player Prize" oninput="updateTicker();">
            </div>
        </div>

        <label class="ticker-label">3. Extra Details (Top Right Box)</label>
        <input type="text" id="row3Inp" placeholder="e.g. LIVE ON KABADDI365" oninput="updateTicker();">

        <label class="ticker-label">4. Upcoming Events List (Bottom Left)</label>
        <div style="background:#f8f9fa; padding:12px; border-radius:8px; border:1px solid #ddd;">
            <div style="display:flex; gap:5px; margin-bottom:10px;">
                <input type="text" id="ueName" placeholder="Event Name (e.g. Goraya)">
                <input type="date" id="ueDate" style="padding: 8px;">
                <button class="btn-green" style="border:none; color:white; border-radius:6px; font-weight:bold; padding:0 15px; cursor:pointer;" onclick="addUpcomingEvent()">ADD</button>
            </div>
            <div id="upcomingEventsContainer"></div>
        </div>

        <label class="ticker-label">5. Booking Number / Ads (Bottom Right)</label>
        <input type="text" id="row6Inp" placeholder="e.g. BOOKING: 9115426711" oninput="updateTicker();">

        <label class="ticker-label">Watermark / Channel Name</label>
        <input type="text" id="watermarkInp" placeholder="Channel Name (e.g. M LIVE)" oninput="updateTicker();">
    </div>
</div>

<div class="card">
<div class="header">TOURNAMENT TEAM MANAGER</div>
<div class="settings-section">
<textarea id="newTeamInp" rows="3" placeholder="Mudki, Faridkot, Talwandi..."></textarea>
<button class="btn-full btn-green" onclick="addTeam()" style="width:100%;margin-bottom:8px; height:50px; min-height:50px;">ADD TEAM</button>
<textarea id="allTeamsInp" rows="6" placeholder="All Participating Teams"></textarea>
<button class="btn-full btn-blue" onclick="saveAllTeams()" style="width:100%;margin-bottom:8px; height:50px; min-height:50px;">SAVE TEAM LIST</button>
<textarea id="winnerTeamsInp" rows="4" placeholder="Qualified Teams"></textarea>
<textarea id="loserTeamsInp" rows="4" placeholder="Eliminated Teams"></textarea>
</div>
</div>

<button class="btn-full btn-red" onclick="clearAllTeams()" style="width:100%;margin-bottom:15px;padding:14px;border-radius:10px;font-size:15px; height:50px; min-height:50px;">
RESET ALL TEAMS & DATA
</button>

</div>

<script>
const firebaseConfig = { databaseURL:"https://my-scorebord-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id') || 'defaultMatch';
const db = firebase.database().ref("matchData/" + matchId);

let curA=0; let curB=0; let camOpposite=false; let allTeams=[]; 
let nextMatchesWeight=[]; let nextMatchesOpen=[]; let upcomingEvents=[];

async function translateText(sourceId, targetId) {
    const text = document.getElementById(sourceId).value;
    const targetLang = document.getElementById("targetLang").value; 
    if(!text) return;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        document.getElementById(targetId).value = data[0][0][0];
    } catch(e) { alert("Translation error! Check internet."); }
}

db.on("value",(snap)=>{
    const data=snap.val();
    if(data){
        curA=parseFloat(data.scoreA)||0; curB=parseFloat(data.scoreB)||0;
        allTeams=data.allTeams || []; 
        nextMatchesWeight=data.nextMatchesWeight || [];
        nextMatchesOpen=data.nextMatchesOpen || [];
        upcomingEvents=data.upcomingEvents || [];

        document.getElementById("dispA").innerText=curA; document.getElementById("dispB").innerText=curB;
        
        if(document.activeElement !== document.getElementById("nameA")) document.getElementById("nameA").value=data.nameA||"";
        if(document.activeElement !== document.getElementById("nameA_pa")) document.getElementById("nameA_pa").value=data.nameA_pa||"";
        if(document.activeElement !== document.getElementById("nameB")) document.getElementById("nameB").value=data.nameB||"";
        if(document.activeElement !== document.getElementById("nameB_pa")) document.getElementById("nameB_pa").value=data.nameB_pa||"";
        
        document.getElementById("roundInp").value=data.round||"";
        document.getElementById("row1Inp").value = data.row1Txt || "";
        document.getElementById("row1Inp_pa").value = data.row1Txt_pa || "";
        document.getElementById("row3Inp").value = data.row3Txt || "";
        document.getElementById("row6Inp").value = data.row6Txt || "";
        document.getElementById("watermarkInp").value = data.watermarkTxt || "";

        // Load Prize Fields
        document.getElementById("pzOp1").value = data.pzOp1 || "";
        document.getElementById("pzOp2").value = data.pzOp2 || "";
        document.getElementById("pzOpBest").value = data.pzOpBest || "";
        
        document.getElementById("pzWtKg").value = data.pzWtKg || "";
        document.getElementById("pzWt1").value = data.pzWt1 || "";
        document.getElementById("pzWt2").value = data.pzWt2 || "";
        document.getElementById("pzWtBest").value = data.pzWtBest || "";

        document.getElementById("winnerTeamsInp").value = data.qualifiedTeams || "";
        document.getElementById("loserTeamsInp").value = data.eliminatedTeams || "";
        document.getElementById("allTeamsInp").value = allTeams.join("\n");

        renderNextMatches(); 
        renderUpcomingEvents();
        
        const sVis = data.scoreVisible !== false;
        document.getElementById("visBtn").innerText = sVis ? "Hide Scoreboard" : "Show Scoreboard";
        
        camOpposite=data.cameraOpposite||false;
        document.getElementById("teamWrap").style.flexDirection = camOpposite ? "row-reverse" : "row";
        document.getElementById("camBtn").innerText = camOpposite ? "Camera Oppo View" : "Camera View";
        updateDropdowns();
    }
});

/* --- UPCOMING EVENTS LOGIC WITH DATE FORMATTING --- */
function addUpcomingEvent() {
    const name = document.getElementById("ueName").value.trim();
    const dateVal = document.getElementById("ueDate").value;
    if(name === "") return;
    
    let dateStr = "";
    if(dateVal) {
        const d = new Date(dateVal);
        // Formats as "15 Sep" or similar
        dateStr = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }
    
    upcomingEvents.push({ name: name, date: dateStr });
    document.getElementById("ueName").value = "";
    document.getElementById("ueDate").value = "";
    updateTicker(); // Save to DB & sync string
}

function deleteUpcomingEvent(index) {
    upcomingEvents.splice(index, 1);
    updateTicker();
}

function renderUpcomingEvents() {
    const container = document.getElementById("upcomingEventsContainer");
    if(upcomingEvents.length === 0) {
        container.innerHTML = `<div style="text-align:center; color:#999; font-size:13px;">No events added yet.</div>`;
        return;
    }
    let html = "";
    upcomingEvents.forEach((ev, idx) => {
        let displayDate = ev.date ? `<small style="color:#666;">(${ev.date})</small>` : "";
        html += `<div class="event-item">
            <span>${idx+1}. ${ev.name} ${displayDate}</span>
            <button class="btn-red" style="border:none; border-radius:4px; padding:4px 10px; color:white; cursor:pointer;" onclick="deleteUpcomingEvent(${idx})">X</button>
        </div>`;
    });
    container.innerHTML = html;
}

/* --- MATCH LISTS LOGIC --- */
function renderListHTML(list, typeStr) {
    if(list.length === 0) return `<div style="text-align:center; padding:10px; color:#999; font-size:14px;">No Matches Added</div>`;
    let html = "";
    list.forEach((matchStr, index) => {
        html += `<div class="match-item">
            <div class="match-title">${matchStr}</div>
            <div class="match-actions">
                <button class="btn-sm btn-start" onclick="startSpecificMatch(${index}, '${typeStr}')">START</button>
                <button class="btn-sm btn-delete" onclick="deleteSpecificMatch(${index}, '${typeStr}')">X</button>
            </div>
        </div>`;
    });
    return html;
}

function renderNextMatches() {
    document.getElementById("nextMatchContainerWeight").innerHTML = renderListHTML(nextMatchesWeight, 'weight');
    document.getElementById("nextMatchContainerOpen").innerHTML = renderListHTML(nextMatchesOpen, 'open');
}

function addNextMatch(type){
    const a = document.getElementById("nextTeamA").value;
    const b = document.getElementById("nextTeamB").value;
    if(a === "" || b === "") return;
    
    const matchStr = a + " VS " + b;
    if(type === 'weight') nextMatchesWeight.push(matchStr);
    else nextMatchesOpen.push(matchStr);

    document.getElementById("nextTeamA").value = ""; document.getElementById("nextTeamB").value = "";
    updateTicker();
}

function startSpecificMatch(index, type) {
    let matchStr = (type === 'weight') ? nextMatchesWeight[index] : nextMatchesOpen[index];
    let teams = matchStr.split(" VS ");
    let t1 = teams[0] ? teams[0].trim() : ""; let t2 = teams[1] ? teams[1].trim() : "";
    
    if(type === 'weight') nextMatchesWeight.splice(index, 1);
    else nextMatchesOpen.splice(index, 1);

    db.update({ nameA: t1, nameA_pa: "", nameB: t2, nameB_pa: "", scoreA: 0, scoreB: 0, scoreVisible: true });
    updateTicker();
}

function deleteSpecificMatch(index, type) {
    if(type === 'weight') nextMatchesWeight.splice(index, 1);
    else nextMatchesOpen.splice(index, 1);
    updateTicker();
}

/* --- CORE TICKER SYNC LOGIC --- */
function updateTicker(){
    // 1. Build Match List String (Row 5)
    let tickerStr = "";
    if (nextMatchesWeight.length > 0) tickerStr += "ਵਜ਼ਨੀ ਮੈਚ: " + nextMatchesWeight.join(" , ");
    if (nextMatchesWeight.length > 0 && nextMatchesOpen.length > 0) tickerStr += " || ";
    if (nextMatchesOpen.length > 0) tickerStr += "ਓਪਨ ਮੈਚ: " + nextMatchesOpen.join(" , ");

    // 2. Build Upcoming Events String (Row 4)
    let eventsStr = upcomingEvents.map((ev, i) => {
        let d = ev.date ? " (" + ev.date + ")" : "";
        return (i+1) + ". " + ev.name + d;
    }).join(" | ");
    if(eventsStr === "") eventsStr = "UPCOMING EVENTS";

    // 3. Build Prizes String (Row 2) - Updated to 1st, 2nd, Best Format
    let pzArr = [];
    
    let op1 = document.getElementById("pzOp1").value;
    let op2 = document.getElementById("pzOp2").value;
    let opBest = document.getElementById("pzOpBest").value;
    if(op1 || op2 || opBest) {
        let parts = [];
        if(op1) parts.push("1st: " + op1);
        if(op2) parts.push("2nd: " + op2);
        if(opBest) parts.push("Best: " + opBest);
        pzArr.push("🔥 ਓਪਨ (OPEN): " + parts.join(" | "));
    }
    
    let wtKgRaw = document.getElementById("pzWtKg").value;
    let wtKgDisplay = wtKgRaw ? wtKgRaw : "WEIGHT";
    let wt1 = document.getElementById("pzWt1").value;
    let wt2 = document.getElementById("pzWt2").value;
    let wtBest = document.getElementById("pzWtBest").value;
    
    if(wt1 || wt2 || wtBest) {
        let parts = [];
        if(wt1) parts.push("1st: " + wt1);
        if(wt2) parts.push("2nd: " + wt2);
        if(wtBest) parts.push("Best: " + wtBest);
        pzArr.push("🏋️ " + wtKgDisplay + ": " + parts.join(" | "));
    }
    let prizeStr = pzArr.join(" 🔴 ");

    // 4. Save Everything
    db.update({
        round: document.getElementById("roundInp").value,
        row1Txt: document.getElementById("row1Inp").value,
        row1Txt_pa: document.getElementById("row1Inp_pa").value,
        
        row2Txt: prizeStr, 
        row4Txt: eventsStr,
        row5Txt: tickerStr,
        
        row3Txt: document.getElementById("row3Inp").value,
        row6Txt: document.getElementById("row6Inp").value,
        watermarkTxt: document.getElementById("watermarkInp").value,

        pzOp1: op1, pzOp2: op2, pzOpBest: opBest,
        pzWtKg: wtKgRaw, pzWt1: wt1, pzWt2: wt2, pzWtBest: wtBest,
        
        upcomingEvents: upcomingEvents,
        nextMatchesWeight: nextMatchesWeight,
        nextMatchesOpen: nextMatchesOpen
    });
}

function updateDropdowns(){
    const a=document.getElementById("teamSelectA"); const b=document.getElementById("teamSelectB");
    const na=document.getElementById("nextTeamA"); const nb=document.getElementById("nextTeamB");
    a.innerHTML='<option value="">Select Team A</option>'; b.innerHTML='<option value="">Select Team B</option>';
    na.innerHTML='<option value="">Select Next Match Team 1</option>'; nb.innerHTML='<option value="">Select Next Match Team 2</option>';
    allTeams.forEach(team=>{
        a.innerHTML += `<option value="${team}">${team}</option>`; b.innerHTML += `<option value="${team}">${team}</option>`;
        na.innerHTML += `<option value="${team}">${team}</option>`; nb.innerHTML += `<option value="${team}">${team}</option>`;
    });
}
function addTeam(){
    const teamsText = document.getElementById("newTeamInp").value;
    const newTeams = teamsText.split(",").map(t=>t.trim()).filter(t=>t!=='');
    newTeams.forEach(team=>{ if(!allTeams.includes(team)){ allTeams.push(team); } });
    document.getElementById("allTeamsInp").value = allTeams.join("\n");
    db.update({ allTeams:allTeams }); updateDropdowns(); document.getElementById("newTeamInp").value="";
}
function saveAllTeams(){
    allTeams= document.getElementById("allTeamsInp").value.split("\n").map(t=>t.trim()).filter(t=>t!=='');
    db.update({ allTeams:allTeams }); updateDropdowns();
}
function selectTeamA(team){ document.getElementById("nameA").value=team; updateTeamA(); }
function selectTeamB(team){ document.getElementById("nameB").value=team; updateTeamB(); }
function updateTeamA(){ db.update({ nameA:document.getElementById("nameA").value, nameA_pa:document.getElementById("nameA_pa").value }); }
function updateTeamB(){ db.update({ nameB:document.getElementById("nameB").value, nameB_pa:document.getElementById("nameB_pa").value }); }
function changeScore(team,val){
    let current=(team==="scoreA")?curA:curB; let newVal;
    if(val>0){ if(curA===0 && curB===0) newVal=1.5; else newVal=current+1; }
    else{ if(current===1.5) newVal=0; else newVal=current-1; if(newVal<0) newVal=0; }
    db.update({ [team]:newVal });
}
function toggleVis(field){ db.child(field).once("value",snap=>{ db.update({ [field]: !snap.val() }); }); }
function swapTeams(){ db.update({ nameA: document.getElementById("nameB").value, nameA_pa: document.getElementById("nameB_pa").value, nameB: document.getElementById("nameA").value, nameB_pa: document.getElementById("nameA_pa").value, scoreA: curB, scoreB: curA }); }
function resetScores(){ if(confirm("Reset Scores?")){ db.update({ scoreA:0, scoreB:0 }); } }
function toggleCameraView(){ db.update({ cameraOpposite: !camOpposite }); }
function showResultLayer(){
    if(curA === 0 && curB === 0){ alert("Score 0-0 hai."); return; }
    if(!confirm("Result update karna chahunde ho?")){ return; }
    const teamA = document.getElementById("nameA").value; const teamB = document.getElementById("nameB").value;
    let winner=""; let loser="";
    if(curA>curB){ winner=teamA; loser=teamB; } else if(curB>curA){ winner=teamB; loser=teamA; } else { winner="TIE"; }
    let winners = document.getElementById("winnerTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    if(winner !== "TIE") winners.push(winner + " (WIN)");
    let losers = document.getElementById("loserTeamsInp").value.split("\n").filter(t=>t.trim()!=='');
    if(winner !== "TIE") losers.push(loser);
    document.getElementById("winnerTeamsInp").value = winners.join("\n"); document.getElementById("loserTeamsInp").value = losers.join("\n");
    if(loser !== ""){ allTeams = allTeams.filter(t=>t!==loser); }
    nextMatchesWeight = nextMatchesWeight.filter(m=>!(m.toLowerCase().includes(teamA.toLowerCase()) && m.toLowerCase().includes(teamB.toLowerCase())));
    nextMatchesOpen = nextMatchesOpen.filter(m=>!(m.toLowerCase().includes(teamA.toLowerCase()) && m.toLowerCase().includes(teamB.toLowerCase())));
    db.update({ qualifiedTeams: winners.join("\n"), eliminatedTeams: losers.join("\n"), allTeams: allTeams, scoreA: 0, scoreB: 0, nameA: "", nameA_pa: "", nameB: "", nameB_pa: "" });
    updateTicker(); updateDropdowns();
}
function clearAllTeams(){
    if(confirm("Delete All Teams?")){
        allTeams=[]; nextMatchesWeight=[]; nextMatchesOpen=[]; upcomingEvents=[];
        db.update({
            allTeams:[], qualifiedTeams:"", eliminatedTeams:"", nextMatchesWeight:[], nextMatchesOpen:[], upcomingEvents:[],
            scoreA:0, scoreB:0, nameA:"", nameA_pa:"", nameB:"", nameB_pa:"",
            row1Txt:"", row1Txt_pa:"", row2Txt:"", row3Txt:"", row4Txt:"", row5Txt:"", row6Txt:"",
            pzOp1:"", pzOp2:"", pzOpBest:"", pzWtKg:"", pzWt1:"", pzWt2:"", pzWtBest:""
        });
        document.querySelectorAll('input[type="text"], textarea, input[type="date"]').forEach(el => el.value = '');
        curA=0; curB=0; updateDropdowns();
    }
}
</script>
</body>
</html>
