<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

#main-panel{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.card{
    background:white;
    width:100%;
    max-width:750px;
    border-radius:15px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    overflow:hidden;
    margin-bottom:20px;
}

.header{
    background:#1a73e8;
    color:white;
    padding:14px;
    text-align:center;
    font-weight:bold;
    font-size:18px;
    text-transform:uppercase;
}

.teams-container{
    display:flex;
    padding:20px;
    gap:20px;
    border-bottom:2px solid #eee;
}

.team-box{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.team-input{
    flex:1;
    min-height:55px;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    box-sizing:border-box;
}

.score-val{
    font-size:70px;
    font-weight:900;
    color:#333;
    margin:10px 0;
}

.btn-pm{
    border:none;
    color:white;
    padding:16px;
    border-radius:8px;
    font-size:28px;
    font-weight:bold;
    cursor:pointer;
    flex:1;
    margin:0 5px;
}

.btn-plus{background:#28a745;}
.btn-minus{background:#dc3545;}

.controls{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.btn-full{
    border:none;
    color:white;
    padding:14px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    text-transform:uppercase;
    width:100%;
}

.btn-blue{background:#1a73e8;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-red{background:#ea4335;}
.btn-dark{background:#333;}
.btn-green{background:#28a745;}

.settings-section{
    padding:15px;
    background:#fafafa;
}

textarea,
.std-input,
select{
    width:100%;
    min-height:55px;
    padding:12px;
    border:2px solid #ccc;
    border-radius:8px;
    font-size:22px;
    font-weight:bold;
    margin-bottom:12px;
    box-sizing:border-box;
}

textarea{
    resize:none;
    line-height:1.4;
    overflow:hidden;
}

.result-box{
    background:#111;
    color:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.result-title{
    font-size:32px;
    font-weight:900;
    color:#fbbc05;
    margin-bottom:10px;
}

.result-text{
    font-size:24px;
    font-weight:bold;
}

</style>
</head>

<body>

<div id="main-panel">

<!-- LIVE SCOREBOARD -->
<div class="card">

<div class="header">
LIVE SCORE BOARD
</div>

<div class="teams-container" id="teamWrap">

<!-- TEAM A -->
<div class="team-box">

<select id="teamSelectA"
onchange="selectTeamA(this.value)">
<option value="">Select Team A</option>
</select>

<div style="display:flex;width:100%;gap:8px;">

<input type="text"
id="nameA"
class="team-input"
placeholder="TEAM 1">

<button class="btn-full btn-blue"
style="width:110px;margin:0;"
onclick="updateTeamA()">
SET
</button>

</div>

<div class="score-val" id="dispA">0</div>

<div style="display:flex;width:100%;">

<button class="btn-pm btn-minus"
onclick="changeScore('scoreA',-1)">-</button>

<button class="btn-pm btn-plus"
onclick="changeScore('scoreA',1)">+</button>

</div>

</div>

<!-- VS -->
<div style="display:flex;align-items:center;font-weight:bold;font-size:28px;color:#999;">
VS
</div>

<!-- TEAM B -->
<div class="team-box">

<select id="teamSelectB"
onchange="selectTeamB(this.value)">
<option value="">Select Team B</option>
</select>

<div style="display:flex;width:100%;gap:8px;">

<input type="text"
id="nameB"
class="team-input"
placeholder="TEAM 2">

<button class="btn-full btn-blue"
style="width:110px;margin:0;"
onclick="updateTeamB()">
SET
</button>

</div>

<div class="score-val" id="dispB">0</div>

<div style="display:flex;width:100%;">

<button class="btn-pm btn-minus"
onclick="changeScore('scoreB',-1)">-</button>

<button class="btn-pm btn-plus"
onclick="changeScore('scoreB',1)">+</button>

</div>

</div>

</div>

<!-- NEXT MATCH -->
<div class="settings-section">

<div class="header"
style="margin:-15px -15px 15px -15px;">
NEXT MATCH SETUP
</div>

<select id="nextTeamA">
<option value="">Select Next Match Team 1</option>
</select>

<select id="nextTeamB">
<option value="">Select Next Match Team 2</option>
</select>

<button class="btn-full btn-green"
onclick="addNextMatch()">
ADD NEXT MATCH
</button>

<textarea id="nextMatchList"
rows="5"
placeholder="Next Match Teams"
oninput="autoGrow(this)"></textarea>

<button class="btn-full btn-blue"
onclick="saveNextMatches()">
SAVE NEXT MATCHES
</button>

</div>

<!-- CONTROLS -->
<div class="controls">

<button class="btn-full btn-green"
onclick="showResultLayer()">
Show Result Screen
</button>

<button id="visBtn"
class="btn-full btn-red"
onclick="toggleVis('scoreVisible')">
Hide Scoreboard
</button>

<button class="btn-full btn-yellow"
onclick="swapTeams()">
Swap Teams + Score
</button>

<button class="btn-full btn-dark"
onclick="toggleCameraView()">
Camera View
</button>

<button class="btn-full"
style="background:#777;"
onclick="resetScores()">
Reset Scores
</button>

<input type="text"
id="roundInp"
class="std-input"
placeholder="ROUND">

</div>

</div>

<!-- TEAM MANAGER -->
<div class="card">

<div class="header">
TOURNAMENT TEAM MANAGER
</div>

<div class="settings-section">

<input type="text"
id="newTeamInp"
class="std-input"
placeholder="Add New Team">

<button class="btn-full btn-green"
onclick="addTeam()">
Add Team
</button>

<textarea id="allTeamsInp"
rows="8"
placeholder="All Participating Teams"
oninput="autoGrow(this)"></textarea>

<button class="btn-full btn-blue"
onclick="saveAllTeams()">
Save Team List
</button>

<textarea id="winnerTeamsInp"
rows="5"
placeholder="Qualified Teams"
oninput="autoGrow(this)"></textarea>

<textarea id="loserTeamsInp"
rows="5"
placeholder="Eliminated Teams"
oninput="autoGrow(this)"></textarea>

</div>
</div>

<!-- TICKER -->
<div class="card">

<div class="header">
TICKER & BRANDING
</div>

<div class="settings-section">

<textarea id="row1Inp"
rows="2"
placeholder="Title Line 1"
oninput="autoGrow(this)"></textarea>

<textarea id="row2Inp"
rows="2"
placeholder="Title Line 2"
oninput="autoGrow(this)"></textarea>

<textarea id="row3Inp"
rows="2"
placeholder="Title Line 3"
oninput="autoGrow(this)"></textarea>

<input type="text"
id="watermarkInp"
class="std-input"
placeholder="Channel Name">

<button class="btn-full btn-blue"
onclick="updateTicker()">
Update Ticker
</button>

<button id="tickVisBtn"
class="btn-full btn-red"
onclick="toggleVis('tickerVisible')">
Hide Ticker
</button>

</div>
</div>

<!-- RESULT -->
<div class="card">

<div class="header">
MATCH RESULT
</div>

<div class="settings-section">

<div class="result-box">

<div class="result-title">
RESULT
</div>

<div class="result-text"
id="resultText">
No Result Yet
</div>

</div>

</div>
</div>

</div>

<script>

const firebaseConfig = {
    databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const urlParams = new URLSearchParams(window.location.search);

const matchId =
urlParams.get('id') || 'defaultMatch';

const db =
firebase.database().ref("matchData/" + matchId);

let curA=0;
let curB=0;

let sVis=true;
let tVis=true;

let camOpposite=false;

let allTeams=[];
let nextMatches=[];

db.on("value",(snap)=>{

    const data=snap.val();

    if(data){

        curA=parseFloat(data.scoreA)||0;
        curB=parseFloat(data.scoreB)||0;

        sVis=data.scoreVisible!==false;
        tVis=data.tickerVisible!==false;

        allTeams=data.allTeams || [];
        nextMatches=data.nextMatches || [];

        updateTeamTextarea();
        updateTeamDropdowns();
        updateNextMatchDropdowns();

        document.getElementById("dispA").innerText=curA;
        document.getElementById("dispB").innerText=curB;

        document.getElementById("nameA").value=data.nameA||"";
        document.getElementById("nameB").value=data.nameB||"";

        document.getElementById("roundInp").value=data.round||"";

        document.getElementById("row1Inp").value=data.row1Txt||"";
        document.getElementById("row2Inp").value=data.row2Txt||"";
        document.getElementById("row3Inp").value=data.row3Txt||"";

        document.getElementById("watermarkInp").value =
        data.watermarkTxt||"";

        document.getElementById("winnerTeamsInp").value =
        data.qualifiedTeams || "";

        document.getElementById("loserTeamsInp").value =
        data.eliminatedTeams || "";

        document.getElementById("nextMatchList").value =
        nextMatches.join("\n");

        document.getElementById("resultText").innerText =
        data.resultText || "No Result Yet";

        autoGrow(document.getElementById("allTeamsInp"));
        autoGrow(document.getElementById("winnerTeamsInp"));
        autoGrow(document.getElementById("loserTeamsInp"));
        autoGrow(document.getElementById("nextMatchList"));

        camOpposite=data.cameraOpposite||false;

        document.getElementById("teamWrap").style.flexDirection =
        camOpposite ? "row-reverse" : "row";
    }
});

function autoGrow(el){

    el.style.height="auto";
    el.style.height=el.scrollHeight+"px";
}

function addTeam(){

    const team =
    document.getElementById("newTeamInp").value.trim();

    if(team==="") return;

    allTeams.push(team);

    updateTeamTextarea();
    updateTeamDropdowns();
    updateNextMatchDropdowns();

    db.update({
        allTeams:allTeams
    });

    document.getElementById("newTeamInp").value="";
}

function saveAllTeams(){

    const txt =
    document.getElementById("allTeamsInp").value;

    allTeams =
    txt.split("\n")
    .map(t=>t.trim())
    .filter(t=>t!=='');

    updateTeamDropdowns();
    updateNextMatchDropdowns();

    db.update({
        allTeams:allTeams
    });
}

function updateTeamTextarea(){

    document.getElementById("allTeamsInp").value =
    allTeams.join("\n");
}

function updateTeamDropdowns(){

    const selectA =
    document.getElementById("teamSelectA");

    const selectB =
    document.getElementById("teamSelectB");

    selectA.innerHTML =
    '<option value="">Select Team A</option>';

    selectB.innerHTML =
    '<option value="">Select Team B</option>';

    allTeams.forEach(team=>{

        selectA.innerHTML +=
        `<option value="${team}">${team}</option>`;

        selectB.innerHTML +=
        `<option value="${team}">${team}</option>`;
    });
}

function updateNextMatchDropdowns(){

    const selA =
    document.getElementById("nextTeamA");

    const selB =
    document.getElementById("nextTeamB");

    selA.innerHTML =
    '<option value="">Select Next Match Team 1</option>';

    selB.innerHTML =
    '<option value="">Select Next Match Team 2</option>';

    allTeams.forEach(team=>{

        selA.innerHTML +=
        `<option value="${team}">${team}</option>`;

        selB.innerHTML +=
        `<option value="${team}">${team}</option>`;
    });
}

function selectTeamA(team){
    document.getElementById("nameA").value=team;
}

function selectTeamB(team){
    document.getElementById("nameB").value=team;
}

function updateTeamA(){

    db.update({
        nameA:
        document.getElementById("nameA").value
    });
}

function updateTeamB(){

    db.update({
        nameB:
        document.getElementById("nameB").value
    });
}

function changeScore(team,val){

    let current=(team==="scoreA") ? curA : curB;

    let newVal;

    if(val>0){

        if(curA===0 && curB===0)
            newVal=1.5;
        else
            newVal=current+1;

    }else{

        if(current===1.5)
            newVal=0;
        else
            newVal=current-1;

        if(newVal<0)
            newVal=0;
    }

    db.update({
        [team]:newVal
    });
}

function updateTicker(){

    db.update({

        round:
        document.getElementById("roundInp").value,

        row1Txt:
        document.getElementById("row1Inp").value,

        row2Txt:
        document.getElementById("row2Inp").value,

        row3Txt:
        document.getElementById("row3Inp").value,

        watermarkTxt:
        document.getElementById("watermarkInp").value
    });
}

function toggleVis(field){

    let val =
    field==="scoreVisible" ? sVis : tVis;

    db.child(field).set(!val);
}

function swapTeams(){

    db.update({

        nameA:
        document.getElementById("nameB").value,

        nameB:
        document.getElementById("nameA").value,

        scoreA:curB,
        scoreB:curA
    });
}

function resetScores(){

    if(confirm("Reset Match Scores?")){

        db.update({
            scoreA:0,
            scoreB:0
        });
    }
}

function toggleCameraView(){

    db.update({
        cameraOpposite: !camOpposite
    });
}

function showResultLayer(){

    const teamA =
    document.getElementById("nameA").value;

    const teamB =
    document.getElementById("nameB").value;

    let winner="";
    let loser="";

    if(curA>curB){

        winner=teamA;
        loser=teamB;

    }else{

        winner=teamB;
        loser=teamA;
    }

    let winners =
    document.getElementById("winnerTeamsInp").value;

    if(winners.trim()==="")
        winners=winner;
    else
        winners += "\n"+winner;

    let losers =
    document.getElementById("loserTeamsInp").value;

    if(losers.trim()==="")
        losers=loser;
    else
        losers += "\n"+loser;

    document.getElementById("winnerTeamsInp").value =
    winners;

    document.getElementById("loserTeamsInp").value =
    losers;

    const resultText =
    winner +
    " defeated " +
    loser +
    " by " +
    curA +
    " - " +
    curB;

    document.getElementById("resultText").innerText =
    resultText;

    db.update({

        resultText:resultText,

        winnerTeam:winner,

        loserTeam:loser,

        qualifiedTeams:winners,

        eliminatedTeams:losers
    });

    allTeams =
    allTeams.filter(t=>t!==loser);

    updateTeamTextarea();
    updateTeamDropdowns();
    updateNextMatchDropdowns();

    db.update({
        allTeams:allTeams
    });
}

function addNextMatch(){

    const a =
    document.getElementById("nextTeamA").value;

    const b =
    document.getElementById("nextTeamB").value;

    if(a==="" || b==="") return;

    const match =
    a + " VS " + b;

    nextMatches.push(match);

    document.getElementById("nextMatchList").value =
    nextMatches.join("\n");

    autoGrow(document.getElementById("nextMatchList"));

    db.update({
        nextMatches:nextMatches
    });
}

function saveNextMatches(){

    const txt =
    document.getElementById("nextMatchList").value;

    nextMatches =
    txt.split("\n")
    .map(t=>t.trim())
    .filter(t=>t!=='');

    db.update({
        nextMatches:nextMatches
    });
}

</script>

</body>
</html>
