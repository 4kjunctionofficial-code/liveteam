<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
    body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .team-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #ddd; }
    .btn { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; color: white; }
    .win-btn { background: #28a745; }
    .lose-btn { background: #dc3545; }
    input { padding: 10px; width: 80%; }
</style>
</head>
<body>

<div class="card">
    <h2>1. ਟੀਮਾਂ ਦਾਖਲ ਕਰੋ</h2>
    <input type="text" id="teamInput" placeholder="ਟੀਮ ਦਾ ਨਾਮ ਲਿਖੋ (ਜਿਵੇਂ: mudki)">
    <button onclick="addTeam()">ਐਡ ਕਰੋ</button>
</div>

<div class="card">
    <h2>2. ਮੌਜੂਦਾ ਰਾਊਂਡ (ਟੀਮਾਂ ਚੁਣੋ)</h2>
    <div id="matchSetup">
        <select id="selectA"></select> VS <select id="selectB"></select>
        <button onclick="startMatch()">ਮੈਚ ਸ਼ੁਰੂ ਕਰੋ</button>
    </div>
</div>

<div class="card">
    <h2>3. ਸਕੋਰਬੋਰਡ</h2>
    <div id="scoreboard">
        <h3 id="displayNames">... VS ...</h3>
        <h1 id="scores">0 - 0</h1>
        <button onclick="updateScore('A', 1)">Team A +1</button>
        <button onclick="updateScore('B', 1)">Team B +1</button>
        <hr>
        <button class="win-btn" onclick="declareWinner('A')">A ਜੇਤੂ (Next Round)</button>
        <button class="win-btn" onclick="declareWinner('B')">B ਜੇਤੂ (Next Round)</button>
    </div>
</div>

<script>
const firebaseConfig = { databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
firebase.initializeApp(firebaseConfig);
const db = firebase.database().ref("tournament");

function addTeam() {
    const name = document.getElementById("teamInput").value;
    db.child("teams").push(name);
    document.getElementById("teamInput").value = "";
}

// ਟੀਮਾਂ ਲੋਡ ਕਰਨਾ
db.child("teams").on("value", snap => {
    const teams = snap.val();
    let html = '<option>ਚੁਣੋ</option>';
    for(let key in teams) html += `<option value="${teams[key]}">${teams[key]}</option>`;
    document.getElementById("selectA").innerHTML = html;
    document.getElementById("selectB").innerHTML = html;
});

function startMatch() {
    const a = document.getElementById("selectA").value;
    const b = document.getElementById("selectB").value;
    db.update({ match: { teamA: a, teamB: b, scoreA: 0, scoreB: 0 } });
}

db.child("match").on("value", snap => {
    const d = snap.val();
    if(d) {
        document.getElementById("displayNames").innerText = d.teamA + " VS " + d.teamB;
        document.getElementById("scores").innerText = d.scoreA + " - " + d.scoreB;
    }
});

function updateScore(t, val) {
    db.child("match").once("value").then(snap => {
        let d = snap.val();
        let s = (t === 'A') ? d.scoreA + val : d.scoreB + val;
        db.child("match").update(t === 'A' ? {scoreA: s} : {scoreB: s});
    });
}

function declareWinner(winnerSide) {
    db.child("match").once("value").then(snap => {
        const d = snap.val();
        const winner = (winnerSide === 'A') ? d.teamA : d.teamB;
        // ਜੇਤੂ ਨੂੰ ਅਗਲੇ ਰਾਊਂਡ (next_round) ਲਿਸਟ ਵਿੱਚ ਪਾਓ
        db.child("next_round").push(winner);
        alert(winner + " ਅਗਲੇ ਰਾਊਂਡ ਵਿੱਚ ਪਹੁੰਚ ਗਈ!");
        db.child("match").remove(); // ਮੈਚ ਖਤਮ
    });
}
</script>
</body>
</html>
