<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>

body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:8px;
    display:flex;
    justify-content:center;
}

#main-panel{
    width:100%;
    max-width:760px;
}

.card{
    background:white;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    overflow:hidden;
    margin-bottom:16px;
}

.header{
    background:#1a73e8;
    color:white;
    padding:10px;
    text-align:center;
    font-weight:bold;
    font-size:16px;
}

.teams-container{
    display:flex;
    gap:12px;
    padding:12px;
    align-items:center;
}

.team-box{
    flex:1;
}

select,
.team-input,
.std-input,
textarea{
    width:100%;
    padding:10px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
    box-sizing:border-box;
}

textarea{
    resize:none;
}

.team-top{
    display:flex;
    gap:6px;
}

.set-btn{
    width:70px;
    border:none;
    background:#1a73e8;
    color:white;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.score-val{
    text-align:center;
    font-size:52px;
    font-weight:900;
    margin:6px 0;
    color:#222;
}

.pm-wrap{
    display:flex;
    gap:6px;
}

.btn-pm{
    flex:1;
    border:none;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

.btn-plus{
    background:#28a745;
}

.btn-minus{
    background:#dc3545;
}

.controls{
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.btn-full{
    border:none;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-blue{background:#1a73e8;}
.btn-red{background:#ea4335;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-dark{background:#333;}
.btn-green{background:#28a745;}

.settings-section{
    padding:12px;
}

.result-box{
    background:#111;
    color:white;
    border-radius:10px;
    padding:18px;
    text-align:center;
}

.result-title{
    color:#fbbc05;
    font-size:28px;
    font-weight:900;
}

.result-text{
    font-size:20px;
    font-weight:bold;
    margin-top:10px;
}

.vs-text{
    font-size:24px;
    font-weight:bold;
    color:#999;
}

</style>
</head>

<body>

<div id="main-panel">

<!-- SCOREBOARD -->
<div class="card">

<div class="header">
LIVE SCORE BOARD
</div>

<div class="teams-container" id="teamWrap">

<!-- TEAM A -->
<div class="team-box">

<select id="teamSelectA"
onchange="selectTeamA(this.value)">
<option value="">Select Team A</option>
</select>

<div class="team-top">

<input type="text"
id="nameA"
class="team-input"
placeholder="TEAM 1">

<button class="set-btn"
onclick="updateTeamA()">
SET
</button>

</div>

<div class="score-val" id="dispA">0</div>

<div class="pm-wrap">

<button class="btn-pm btn-minus"
onclick="changeScore('scoreA',-1)">
-
</button>

<button class="btn-pm btn-plus"
onclick="changeScore('scoreA',1)">
+
</button>

</div>

</div>

<div class="vs-text">
VS
</div>

<!-- TEAM B -->
<div class="team-box">

<select id="teamSelectB"
onchange="selectTeamB(this.value)">
<option value="">Select Team B</option>
</select>

<div class="team-top">

<input type="text"
id="nameB"
class="team-input"
placeholder="TEAM 2">

<button class="set-btn"
onclick="updateTeamB()">
SET
</button>

</div>

<div class="score-val" id="dispB">0</div>

<div class="pm-wrap">

<button class="btn-pm btn-minus"
onclick="changeScore('scoreB',-1)">
-
</button>

<button class="btn-pm btn-plus"
onclick="changeScore('scoreB',1)">
+
</button>

</div>

</div>

</div>

<div class="controls">

<input type="text"
id="roundInp"
class="std-input"
placeholder="ROUND">

<!-- NEXT MATCH -->
<div class="settings-section"
style="padding:0;">

<div class="header"
style="margin-bottom:10px;">
NEXT MATCH SETUP
</div>

<select id="nextTeamA">
<option value="">Select Next Match Team 1</option>
</select>

<select id="nextTeamB">
<option value="">Select Next Match Team 2</option>
</select>

<button class="btn-full btn-green"
onclick="addNextMatch()">
ADD NEXT MATCH
</button>

<textarea id="nextMatchList"
rows="4"
placeholder="Next Match Teams"
oninput="autoGrow(this)"></textarea>

<button class="btn-full btn-blue"
onclick="saveNextMatches()">
SAVE NEXT MATCHES
</button>

</div>

<button class="btn-full btn-green"
onclick="showResultLayer()">
SHOW RESULT SCREEN
</button>

<button id="visBtn"
class="btn-full btn-red"
onclick="toggleVis('scoreVisible')">
HIDE SCOREBOARD
</button>

<button class="btn-full btn-yellow"
onclick="swapTeams()">
SWAP TEAMS + SCORE
</button>

<button class="btn-full btn-dark"
onclick="toggleCameraView()">
CAMERA VIEW
</button>

<button class="btn-full"
style="background:#777;"
onclick="resetScores()">
RESET SCORES
</button>

</div>

</div>

<!-- TEAM MANAGER -->
<div class="card">

<div class="header">
TOURNAMENT TEAM MANAGER
</div>

<div class="settings-section">

<input type="text"
id="newTeamInp"
class="std-input"
placeholder="Add New Team">

<button class="btn-full btn-green"
onclick="addTeam()">
ADD TEAM
</button>

<textarea id="allTeamsInp"
rows="7"
placeholder="All Participating Teams"
oninput="autoGrow(this)"></textarea>

<button class="btn-full btn-blue"
onclick="saveAllTeams()">
SAVE TEAM LIST
</button>

<textarea id="winnerTeamsInp"
rows="4"
placeholder="Qualified Teams"
oninput="autoGrow(this)"></textarea>

<textarea id="loserTeamsInp"
rows="4"
placeholder="Eliminated Teams"
oninput="autoGrow(this)"></textarea>

</div>

</div>

<!-- TICKER -->
<div class="card">

<div class="header">
TICKER & BRANDING
</div>

<div class="settings-section">

<textarea id="row1Inp"
rows="2"
placeholder="Title Line 1"
oninput="autoGrow(this)"></textarea>

<textarea id="row2Inp"
rows="2"
placeholder="Title Line 2"
oninput="autoGrow(this)"></textarea>

<textarea id="row3Inp"
rows="2"
placeholder="Title Line 3"
oninput="autoGrow(this)"></textarea>

<input type="text"
id="watermarkInp"
class="std-input"
placeholder="Channel Name">

<button class="btn-full btn-blue"
onclick="updateTicker()">
UPDATE TICKER
</button>

<button id="tickVisBtn"
class="btn-full btn-red"
onclick="toggleVis('tickerVisible')">
HIDE TICKER
</button>

</div>

</div>

<!-- RESULT -->
<div class="card">

<div class="header">
MATCH RESULT
</div>

<div class="settings-section">

<div class="result-box">

<div class="result-title">
RESULT
</div>

<div class="result-text"
id="resultText">
No Result Yet
</div>

</div>

</div>

</div>

</div>

<script>

const firebaseConfig = {
databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/"
};

firebase.initializeApp(firebaseConfig);

const urlParams = new URLSearchParams(window.location.search);

const matchId =
urlParams.get('id') || 'defaultMatch';

const db =
firebase.database().ref("matchData/" + matchId);

let curA=0;
let curB=0;

let sVis=true;
let tVis=true;

let camOpposite=false;

let allTeams=[];
let nextMatches=[];

db.on("value",(snap)=>{

const data=snap.val();

if(data){

curA=parseFloat(data.scoreA)||0;
curB=parseFloat(data.scoreB)||0;

allTeams=data.allTeams || [];
nextMatches=data.nextMatches || [];

updateTeamTextarea();
updateTeamDropdowns();
updateNextMatchDropdowns();

document.getElementById("dispA").innerText=curA;
document.getElementById("dispB").innerText=curB;

document.getElementById("nameA").value=data.nameA||"";
document.getElementById("nameB").value=data.nameB||"";

document.getElementById("roundInp").value=data.round||"";

document.getElementById("row1Inp").value=data.row1Txt||"";
document.getElementById("row2Inp").value=data.row2Txt||"";
document.getElementById("row3Inp").value=data.row3Txt||"";

document.getElementById("watermarkInp").value =
data.watermarkTxt||"";

document.getElementById("winnerTeamsInp").value =
data.qualifiedTeams || "";

document.getElementById("loserTeamsInp").value =
data.eliminatedTeams || "";

document.getElementById("nextMatchList").value =
nextMatches.join("\n");

document.getElementById("resultText").innerText =
data.resultText || "No Result Yet";

camOpposite=data.cameraOpposite||false;

document.getElementById("teamWrap").style.flexDirection =
camOpposite ? "row-reverse" : "row";

}
});

function autoGrow(el){

el.style.height="auto";
el.style.height=el.scrollHeight+"px";
}

function addTeam(){

const team =
document.getElementById("newTeamInp").value.trim();

if(team==="") return;

allTeams.push(team);

updateTeamTextarea();
updateTeamDropdowns();
updateNextMatchDropdowns();

db.update({
allTeams:allTeams
});

document.getElementById("newTeamInp").value="";
}

function saveAllTeams(){

const txt =
document.getElementById("allTeamsInp").value;

allTeams =
txt.split("\n")
.map(t=>t.trim())
.filter(t=>t!=='');

updateTeamDropdowns();
updateNextMatchDropdowns();

db.update({
allTeams:allTeams
});
}

function updateTeamTextarea(){

document.getElementById("allTeamsInp").value =
allTeams.join("\n");
}

function updateTeamDropdowns(){

const selectA =
document.getElementById("teamSelectA");

const selectB =
document.getElementById("teamSelectB");

selectA.innerHTML =
'<option value="">Select Team A</option>';

selectB.innerHTML =
'<option value="">Select Team B</option>';

allTeams.forEach(team=>{

selectA.innerHTML +=
`<option value="${team}">${team}</option>`;

selectB.innerHTML +=
`<option value="${team}">${team}</option>`;
});
}

function updateNextMatchDropdowns(){

const selA =
document.getElementById("nextTeamA");

const selB =
document.getElementById("nextTeamB");

selA.innerHTML =
'<option value="">Select Next Match Team 1</option>';

selB.innerHTML =
'<option value="">Select Next Match Team 2</option>';

allTeams.forEach(team=>{

selA.innerHTML +=
`<option value="${team}">${team}</option>`;

selB.innerHTML +=
`<option value="${team}">${team}</option>`;
});
}

function selectTeamA(team){
document.getElementById("nameA").value=team;
}

function selectTeamB(team){
document.getElementById("nameB").value=team;
}

function updateTeamA(){

db.update({
nameA:
document.getElementById("nameA").value
});
}

function updateTeamB(){

db.update({
nameB:
document.getElementById("nameB").value
});
}

function changeScore(team,val){

let current=(team==="scoreA") ? curA : curB;

let newVal;

if(val>0){

if(curA===0 && curB===0)
newVal=1.5;
else
newVal=current+1;

}else{

if(current===1.5)
newVal=0;
else
newVal=current-1;

if(newVal<0)
newVal=0;
}

db.update({
[team]:newVal
});
}

function updateTicker(){

db.update({

round:
document.getElementById("roundInp").value,

row1Txt:
document.getElementById("row1Inp").value,

row2Txt:
document.getElementById("row2Inp").value,

row3Txt:
document.getElementById("row3Inp").value,

watermarkTxt:
document.getElementById("watermarkInp").value
});
}

function toggleVis(field){

let val =
field==="scoreVisible" ? sVis : tVis;

db.child(field).set(!val);
}

function swapTeams(){

db.update({

nameA:
document.getElementById("nameB").value,

nameB:
document.getElementById("nameA").value,

scoreA:curB,
scoreB:curA
});
}

function resetScores(){

if(confirm("Reset Match Scores?")){

db.update({
scoreA:0,
scoreB:0
});
}
}

function toggleCameraView(){

db.update({
cameraOpposite: !camOpposite
});
}

function showResultLayer(){

const teamA =
document.getElementById("nameA").value;

const teamB =
document.getElementById("nameB").value;

let winner="";
let loser="";

if(curA>curB){

winner=teamA;
loser=teamB;

}else{

winner=teamB;
loser=teamA;
}

let winners =
document.getElementById("winnerTeamsInp").value;

if(winners.trim()==="")
winners=winner;
else
winners += "\n"+winner;

let losers =
document.getElementById("loserTeamsInp").value;

if(losers.trim()==="")
losers=loser;
else
losers += "\n"+loser;

document.getElementById("winnerTeamsInp").value =
winners;

document.getElementById("loserTeamsInp").value =
losers;

const resultText =
winner +
" defeated " +
loser +
" by " +
curA +
" - " +
curB;

document.getElementById("resultText").innerText =
resultText;

db.update({

resultText:resultText,

winnerTeam:winner,

loserTeam:loser,

qualifiedTeams:winners,

eliminatedTeams:losers
});

allTeams =
allTeams.filter(t=>t!==loser);

updateTeamTextarea();
updateTeamDropdowns();
updateNextMatchDropdowns();

db.update({
allTeams:allTeams
});
}

function addNextMatch(){

const a =
document.getElementById("nextTeamA").value;

const b =
document.getElementById("nextTeamB").value;

if(a==="" || b==="") return;

const match =
a + " VS " + b;

nextMatches.push(match);

document.getElementById("nextMatchList").value =
nextMatches.join("\n");

db.update({
nextMatches:nextMatches
});
}

function saveNextMatches(){

const txt =
document.getElementById("nextMatchList").value;

nextMatches =
txt.split("\n")
.map(t=>t.trim())
.filter(t=>t!=='');

db.update({
nextMatches:nextMatches
});
}

</script>

</body>
</html>
