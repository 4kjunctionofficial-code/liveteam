<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Sports 1 - Skewed Broadcast Ticker & Clock</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            user-select: none;
            text-transform: uppercase;
            transform-origin: top left;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
            SCOREBOARD (KABADDI SPORTS 1 GOLD + ROYAL BLUE)
        ========================================================= */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #top-scoreboard-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 2.5px solid #ffd000;
            transform: skewX(16deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.75);
        }

        .unskew {
            transform: skewX(-16deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .score-a {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .team-a-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .vs-divider {
            width: 12px;
            background: #090909;
            border-left: 1.5px solid #ffd000;
            border-right: 1.5px solid #ffd000;
        }

        .team-b-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .score-b {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        #match-details-strip {
            background: linear-gradient(90deg, #002b80 0%, #0055ff 50%, #002b80 100%);
            color: #ffe24a;
            font-size: 24px;
            font-weight: 800;
            padding: 6px 40px;
            margin-top: 8px;
            border-radius: 6px;
            letter-spacing: 2px;
            border: 1.5px solid #ffd000;
            transform: skewX(16deg);
            margin-right: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.65);
        }

        #match-details-strip.hidden {
            display: none;
        }

        /* =========================================================
            LOGO & WATERMARK (STATIC LOGO - NO ANIMATION)
        ========================================================= */
        #logo-container {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            transition: opacity 0.3s ease;
            opacity: 1;
        }

        #logo-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #main-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }

        #single-wm {
            position: absolute;
            left: 300px;
            top: 300px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 50px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.45;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* =========================================================
            IMAGE-STYLE SKEWED TICKER + GOLD TRACK + BLUE BAR & CLOCK
        ========================================================= */
        #ticker-wrap {
            position: absolute;
            bottom: 32px;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.8));
            transition: opacity 0.4s ease;
        }

        #ticker-wrap.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Upper Tier: Row 1 Badge (Village + Event/Tournament) + Row 2 Gold Track (Prize + Upcoming + Winner) */
        .upper-tier {
            position: relative;
            display: flex;
            align-items: center;
            height: 54px;
            width: 100%;
            z-index: 2;
        }

        .skewed-badge {
            position: relative;
            z-index: 3;
            height: 54px;
            min-width: 630px;
            max-width: 780px;
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            border: 3px solid #ffe24a;
            border-left: none;
            transform: skewX(-24deg);
            margin-left: -14px;
            padding: 0 38px 0 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.6);
        }

        .skewed-badge-unskew {
            transform: skewX(24deg);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #ffffff;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
            white-space: nowrap;
        }

        .gold-track {
            position: relative;
            flex: 1;
            height: 44px;
            background: linear-gradient(180deg, #ffe600 0%, #f5c400 55%, #dca000 100%);
            border-top: 3.5px solid #090909;
            border-bottom: 3.5px solid #090909;
            display: flex;
            align-items: center;
            overflow: hidden;
            margin-left: -26px;
            padding-left: 34px;
        }

        .gold-track.empty-track {
            opacity: 0;
            pointer-events: none;
        }

        .gold-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: #090909;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        /* Lower Tier (Row 3): Match List + Right Corner Clock Time Box */
        .lower-tier {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 44px;
            margin-top: -3px;
            background: linear-gradient(90deg, #001f66 0%, #0047cc 25%, #0066ff 55%, #003b99 85%, #001a54 100%);
            border-top: 1.5px solid rgba(255, 226, 74, 0.55);
            border-bottom: 2px solid #ffd000;
            display: flex;
            align-items: stretch;
            overflow: hidden;
        }

        .lower-content {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 0 24px;
            color: #ffffff;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
        }

        /* Row 3 Right Corner Clock Time Box */
        .clock-time-box {
            flex: 0 0 245px;
            height: 100%;
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            border-left: 3px solid #090909;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .clock-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d90429;
            box-shadow: 0 0 8px rgba(217, 4, 41, 0.85);
            animation: clockPulse 1s infinite alternate;
        }

        @keyframes clockPulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.35; transform: scale(0.8); }
        }

        .dot-sep {
            color: #090909;
            margin: 0 10px;
            font-weight: 900;
        }

        .star-accent {
            color: #ffe24a;
            font-weight: 900;
            margin: 0 10px;
            letter-spacing: 1.5px;
        }

        .round-tag {
            color: #ffe24a;
            font-weight: 900;
            margin-right: 4px;
        }

        .match-vs-pill {
            display: inline-block;
            background: #090909;
            color: #ffe24a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            padding: 0 8px;
            border-radius: 4px;
            margin: 0 5px;
            vertical-align: middle;
        }

        .anim-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .anim-center-in {
            animation: tickerFadeSlide 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes tickerFadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .anim-wrap.marquee-mode {
            justify-content: flex-start;
        }

        .anim-wrap.marquee-mode .ticker-text {
            display: inline-block;
            flex: 0 0 auto;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: tickerMarquee var(--marquee-duration, 20s) linear infinite;
        }

        @keyframes tickerMarquee {
            0% { transform: translateX(var(--start-x, 0px)); }
            100% { transform: translateX(var(--end-x, -200px)); }
        }
    </style>
</head>

<body>

    <!-- STATIC LOGO -->
    <div id="logo-container" class="hidden">
        <img id="main-logo" src="" alt="Logo">
    </div>

    <!-- WATERMARK -->
    <div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

    <!-- SCOREBOARD -->
    <div id="top-scoreboard-container">
        <div id="main-score-strip">
            <div class="score-a"><div class="unskew" id="sA">0</div></div>
            <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>
            <div class="vs-divider"><div class="unskew"></div></div>
            <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
            <div class="score-b"><div class="unskew" id="sB">0</div></div>
        </div>
        <div id="match-details-strip" class="hidden">
            <div class="unskew" id="match-round"></div>
        </div>
    </div>

    <!-- BROADCAST TICKER -->
    <div id="ticker-wrap">
        <!-- Upper Tier: Row 1 Badge (Village + Event/Tournament) + Row 2 Gold Track (Prize + Upcoming + Winner) -->
        <div class="upper-tier">
            <div class="skewed-badge">
                <div class="skewed-badge-unskew">
                    <div id="badge-ticker" class="anim-wrap"></div>
                </div>
            </div>

            <div class="gold-track empty-track" id="gold-track-box">
                <div class="gold-content">
                    <div id="gold-ticker" class="anim-wrap"></div>
                </div>
            </div>
        </div>

        <!-- Lower Tier (Row 3): Match List + Right Corner Clock Time Box -->
        <div class="lower-tier">
            <div class="lower-content">
                <div id="lower-ticker" class="anim-wrap"></div>
            </div>
            <div class="clock-time-box" id="row3-clock-box">
                <span class="clock-dot"></span>
                <span id="live-clock-text">11:27:00 AM</span>
            </div>
        </div>
    </div>

    <script>
        function autoResizeOverlay() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.width = `${baseWidth}px`;
            document.body.style.height = `${baseHeight}px`;
        }

        window.addEventListener('resize', autoResizeOverlay);
        window.addEventListener('load', autoResizeOverlay);
        autoResizeOverlay();

        // Live Clock in Row 3 Right Corner
        function updateLiveClock() {
            const now = new Date();
            const clockEl = document.getElementById("live-clock-text");
            if (clockEl) {
                clockEl.innerText = now.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                });
            }
        }
        updateLiveClock();
        setInterval(updateLiveClock, 1000);

        const firebaseConfig = {
            databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || 'defaultMatch';

        const db = firebase.database().ref("matchData/" + matchId);
        const userDb = firebase.database().ref("users/" + matchId);

        userDb.on("value", (snap) => {
            const user = snap.val();
            if (user && user.expiryDate && Date.now() > new Date(user.expiryDate).getTime()) {
                document.body.innerHTML = `
                    <div style="width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:black;color:white;font-size:50px;text-align:center;">
                        🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ<br>ਹੈਲਪ ਲਾਈਨ: ਮਨਪ੍ਰੀਤ ਮੁਦਕੀ<br>9115426711
                    </div>
                `;
            }
        });

        const clientLogos = {
            "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/kabaddisports1.png"
        };

        const dict = {
            "Kabaddi": "ਕਬੱਡੀ",
            "Open": "ਓਪਨ",
            "Quarter Final": "ਕੁਆਰਟਰ ਫਾਈਨਲ",
            "Semi Final": "ਸੈਮੀ ਫਾਈਨਲ",
            "Final": "ਫਾਈਨਲ",
            "1st Round": "ਪਹਿਲਾ ਰਾਊਂਡ",
            "2nd Round": "ਦੂਜਾ ਰਾਊਂਡ",
            "3rd Round": "ਤੀਜਾ ਰਾਊਂਡ",
            "4th Round": "ਚੌਥਾ ਰਾਊਂਡ",
            "Pool A": "ਪੂਲ ਏ",
            "Pool B": "ਪੂਲ ਬੀ",
            "Winner": "ਵਿੰਨਰ",
            "Tournament": "ਟੂਰਨਾਮੈਂਟ"
        };

        function translateToPunjabi(text) {
            if (!text) return "";
            let translated = String(text).trim();
            for (let key in dict) {
                let regex = new RegExp(key, 'gi');
                translated = translated.replace(regex, dict[key]);
            }
            return translated.replace(/KG/gi, "ਕਿਲੋ");
        }

        function hasValue(val) {
            return val !== null && val !== undefined && String(val).trim() !== "";
        }

        function normalizeArray(value) {
            if (Array.isArray(value)) {
                return value.filter(item => {
                    if (item === null || item === undefined) return false;
                    if (typeof item === "string") return item.trim() !== "";
                    if (typeof item === "object") {
                        return Object.values(item).some(v => v !== null && v !== undefined && String(v).trim() !== "");
                    }
                    return false;
                });
            }
            if (value && typeof value === "object") {
                return Object.values(value).filter(item => {
                    if (item === null || item === undefined) return false;
                    if (typeof item === "string") return item.trim() !== "";
                    if (typeof item === "object") {
                        return Object.values(item).some(v => v !== null && v !== undefined && String(v).trim() !== "");
                    }
                    return false;
                });
            }
            return [];
        }

        function formatMatchString(m, index, isEnglishMode) {
            m = String(m || "").trim();
            let bracketContent = "";
            let teamPart = m;

            if (m.startsWith("(")) {
                const closeIdx = m.indexOf(")");
                if (closeIdx !== -1) {
                    bracketContent = m.substring(1, closeIdx).trim();
                    teamPart = m.substring(closeIdx + 1).trim();
                }
            }

            const tms = teamPart.split(/\s+VS\s+/i);
            const t1Parts = (tms[0] || "").trim().split("=");
            const t2Parts = (tms[1] || "").trim().split("=");

            const t1En = (t1Parts[0] || "").trim();
            const t2En = (t2Parts[0] || "").trim();
            const t1Pa = translateToPunjabi((t1Parts[1] || t1Parts[0] || "").trim());
            const t2Pa = translateToPunjabi((t2Parts[1] || t2Parts[0] || "").trim());

            const tagPa = hasValue(bracketContent) ? `<span class="round-tag">[${translateToPunjabi(bracketContent)}]</span> ` : "";
            const tagEn = hasValue(bracketContent) ? `<span class="round-tag">[${bracketContent}]</span> ` : "";
            const num = `${index + 1}. `;

            if (isEnglishMode) {
                return `${num}${tagEn}${t1En} <span class="match-vs-pill">VS</span> ${t2En}`;
            }
            return `${num}${tagPa}${t1Pa} <span class="match-vs-pill">ਬਨਾਮ</span> ${t2Pa}`;
        }

        let badgeList = [];
        let goldList = [];
        let lowerList = [];

        let bIdx = 0;
        let gIdx = 0;
        let lIdx = 0;

        let isEnglish = false;
        let lastSig = "";

        function buildTicker(data) {
            badgeList = [];
            goldList = [];
            lowerList = [];

            // =====================================================
            // ROW 1 (SKEWED BADGE): ONLY Village/Location + Event/Tournament
            // =====================================================
            const locEn = (data.row1Txt || data.location || "").trim();
            const locPa = (data.row1Txt_pa || data.location_pa || locEn).trim();
            const progEn = (data.programTxt || "").trim();
            const progPa = (data.programTxt_pa || progEn).trim();

            if (hasValue(locPa) || hasValue(locEn) || hasValue(progPa) || hasValue(progEn)) {
                badgeList.push({
                    pa: `** ${[locPa, progPa].filter(hasValue).map(translateToPunjabi).join(" • ")}`,
                    en: `** ${[locEn, progEn].filter(hasValue).join(" • ")}`
                });
            } else {
                badgeList.push({
                    pa: "** ਕਬੱਡੀ ਟੂਰਨਾਮੈਂਟ ਲਾਈਵ",
                    en: "** KABADDI TOURNAMENT LIVE"
                });
            }

            // =====================================================
            // ROW 2 (GOLD TRACK): ONLY Prize + Upcoming + Winner Details
            // =====================================================
            const prizePartsEn = [];
            const prizePartsPa = [];

            if (hasValue(data.pzOp1) || hasValue(data.pzOp2) || hasValue(data.pzOpBest)) {
                const t1 = hasValue(data.pzTitle1) ? String(data.pzTitle1).trim() : "OPEN";
                const t1Pa = translateToPunjabi(t1);
                const p1En = [
                    hasValue(data.pzOp1) && `1st: ${String(data.pzOp1).trim()}`,
                    hasValue(data.pzOp2) && `2nd: ${String(data.pzOp2).trim()}`,
                    hasValue(data.pzOpBest) && `Best: ${String(data.pzOpBest).trim()}`
                ].filter(Boolean).join(" • ");
                const p1Pa = [
                    hasValue(data.pzOp1) && `ਪਹਿਲਾ: ${String(data.pzOp1).trim()}`,
                    hasValue(data.pzOp2) && `ਦੂਜਾ: ${String(data.pzOp2).trim()}`,
                    hasValue(data.pzOpBest) && `ਬੈਸਟ: ${String(data.pzOpBest).trim()}`
                ].filter(Boolean).join(" • ");
                if (p1En) {
                    prizePartsEn.push(`🏆 ${t1}: ${p1En}`);
                    prizePartsPa.push(`🏆 ${t1Pa}: ${p1Pa}`);
                }
            }

            if (hasValue(data.pzWt1) || hasValue(data.pzWt2) || hasValue(data.pzWtBest)) {
                const t2 = hasValue(data.pzTitle2) ? String(data.pzTitle2).trim() : "WEIGHT";
                const t2Pa = translateToPunjabi(t2);
                const p2En = [
                    hasValue(data.pzWt1) && `1st: ${String(data.pzWt1).trim()}`,
                    hasValue(data.pzWt2) && `2nd: ${String(data.pzWt2).trim()}`,
                    hasValue(data.pzWtBest) && `Best: ${String(data.pzWtBest).trim()}`
                ].filter(Boolean).join(" • ");
                const p2Pa = [
                    hasValue(data.pzWt1) && `ਪਹਿਲਾ: ${String(data.pzWt1).trim()}`,
                    hasValue(data.pzWt2) && `ਦੂਜਾ: ${String(data.pzWt2).trim()}`,
                    hasValue(data.pzWtBest) && `ਬੈਸਟ: ${String(data.pzWtBest).trim()}`
                ].filter(Boolean).join(" • ");
                if (p2En) {
                    prizePartsEn.push(`🏆 ${t2}: ${p2En}`);
                    prizePartsPa.push(`🏆 ${t2Pa}: ${p2Pa}`);
                }
            }

            if (prizePartsEn.length > 0) {
                goldList.push({
                    pa: `${prizePartsPa.join(" <span class='dot-sep'>•</span> ")}`,
                    en: `${prizePartsEn.join(" <span class='dot-sep'>•</span> ")}`
                });
            }

            const upcomingArr = normalizeArray(data.upcomingEvents);
            if (upcomingArr.length > 0) {
                const upEn = upcomingArr.map((ev, i) => `${i + 1}. ${ev.name || ev.eventName || ""}${hasValue(ev.date) ? ` (${ev.date})` : ""}`).join(" • ");
                const upPa = upcomingArr.map((ev, i) => `${i + 1}. ${ev.name_pa || ev.eventName_pa || translateToPunjabi(ev.name || ev.eventName || "")}${hasValue(ev.date) ? ` (${ev.date})` : ""}`).join(" • ");
                if (upEn.trim()) {
                    goldList.push({
                        pa: `📡 ਆਉਣ ਵਾਲੇ ਲਾਈਵ: ${upPa}`,
                        en: `📡 UPCOMING LIVE: ${upEn}`
                    });
                }
            }

            const rawMatches = normalizeArray(data.nextMatches);
            const winnersFromMatches = rawMatches.filter(m => /winner|ਵਿੰਨਰ|\(win\)/i.test(String(m)));
            if (winnersFromMatches.length > 0) {
                goldList.push({
                    pa: `🥇 ਵਿੰਨਰ ਲਿਸਟ: ${winnersFromMatches.map((m, i) => formatMatchString(m, i, false)).join(" • ")}`,
                    en: `🥇 WINNER LIST: ${winnersFromMatches.map((m, i) => formatMatchString(m, i, true)).join(" • ")}`
                });
            } else if (hasValue(data.qualifiedTeams)) {
                const qRaw = String(data.qualifiedTeams).split("\n").map(s => s.trim()).filter(Boolean).join(" • ");
                if (qRaw) {
                    goldList.push({
                        pa: `🥇 ਵਿੰਨਰ ਲਿਸਟ: ${translateToPunjabi(qRaw)}`,
                        en: `🥇 WINNER LIST: ${qRaw}`
                    });
                }
            }

            if (hasValue(data.resultText) && String(data.resultText).trim() !== "No Result Yet") {
                goldList.push({
                    pa: `🥇 ਨਤੀਜਾ: ${translateToPunjabi(data.resultText)}`,
                    en: `🥇 RESULT: ${data.resultText}`
                });
            }

            const goldTrackBox = document.getElementById("gold-track-box");
            if (goldTrackBox) {
                goldTrackBox.classList.toggle("empty-track", goldList.length === 0);
            }

            // =====================================================
            // ROW 3 (LOWER BLUE BAR): Match List (with Round) + Row 3 / Contact (NO Team List)
            // =====================================================
            const r3En = (data.row3Txt || "").trim();
            const r3Pa = (data.row3Txt_pa || r3En).trim();
            const contactText = hasValue(data.contactUs || data.row6Txt)
                ? String(data.contactUs || data.row6Txt).trim()
                : "MANPREET MUDKI • +91 8699640061 / 9115426711";

            const extraPa = [r3Pa && translateToPunjabi(r3Pa), contactText && `ਸੰਪਰਕ: ${translateToPunjabi(contactText)}`].filter(Boolean).join(" <span class='star-accent'>******</span> ");
            const extraEn = [r3En, contactText && `CONTACT US: ${contactText}`].filter(Boolean).join(" <span class='star-accent'>******</span> ");

            if (rawMatches.length > 0) {
                const matchListPa = rawMatches.map((m, i) => formatMatchString(m, i, false)).join(" <span class='star-accent'>•</span> ");
                const matchListEn = rawMatches.map((m, i) => formatMatchString(m, i, true)).join(" <span class='star-accent'>•</span> ");
                lowerList.push({
                    pa: `📋 ਮੈਚ ਲਿਸਟ: ${matchListPa}${extraPa ? ` <span class='star-accent'>******</span> ${extraPa}` : ""}`,
                    en: `📋 MATCH LIST: ${matchListEn}${extraEn ? ` <span class='star-accent'>******</span> ${extraEn}` : ""}`
                });
            } else if (hasValue(data.row5Txt) || hasValue(data.row5Txt_pa)) {
                const mRawPa = translateToPunjabi(data.row5Txt_pa || data.row5Txt);
                const mRawEn = data.row5Txt || data.row5Txt_pa;
                lowerList.push({
                    pa: `📋 ਮੈਚ ਲਿਸਟ: ${mRawPa}${extraPa ? ` <span class='star-accent'>******</span> ${extraPa}` : ""}`,
                    en: `📋 MATCH LIST: ${mRawEn}${extraEn ? ` <span class='star-accent'>******</span> ${extraEn}` : ""}`
                });
            } else {
                lowerList.push({
                    pa: extraPa || `ਸੰਪਰਕ ਕਰੋ: ${translateToPunjabi(contactText)}`,
                    en: extraEn || `CONTACT US: ${contactText}`
                });
            }

            const sig = JSON.stringify({
                b: badgeList.map(x => x.en + x.pa),
                g: goldList.map(x => x.en + x.pa),
                l: lowerList.map(x => x.en + x.pa)
            });

            if (sig !== lastSig) {
                lastSig = sig;
                bIdx = 0;
                gIdx = 0;
                lIdx = 0;
                ['badge-ticker', 'gold-ticker', 'lower-ticker'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.dataset.currentText = "";
                        el.dataset.language = "";
                        el.innerHTML = "";
                    }
                });
            }

            renderSlot('badge-ticker', badgeList.length ? badgeList[bIdx % badgeList.length] : null);
            renderSlot('gold-ticker', goldList.length ? goldList[gIdx % goldList.length] : null);
            renderSlot('lower-ticker', lowerList.length ? lowerList[lIdx % lowerList.length] : null);
        }

        // Constant speed marquee that scrolls completely across without stopping mid-way
        function renderSlot(elementId, item) {
            const el = document.getElementById(elementId);
            if (!el) return;

            if (!item) {
                el.dataset.currentText = "";
                el.dataset.language = "";
                el.innerHTML = "";
                return;
            }

            const textToShow = isEnglish ? item.en : item.pa;
            const langKey = String(isEnglish);

            if (el.dataset.currentText === textToShow && el.dataset.language === langKey) {
                return;
            }

            el.dataset.currentText = textToShow;
            el.dataset.language = langKey;
            el.className = "anim-wrap";
            el.innerHTML = "";
            el.style.removeProperty("--marquee-duration");
            el.style.removeProperty("--start-x");
            el.style.removeProperty("--end-x");

            const span = document.createElement("span");
            span.className = "ticker-text";
            span.innerHTML = textToShow;
            el.appendChild(span);

            requestAnimationFrame(() => {
                const boxWidth = el.clientWidth;
                const textWidth = span.scrollWidth;

                if (textWidth > boxWidth - 16) {
                    const startX = 12;
                    const endX = -(textWidth + 24);
                    const totalDistance = Math.abs(endX - startX);
                    const constantSpeedPxPerSec = 70;
                    const duration = Math.max(8, totalDistance / constantSpeedPxPerSec);

                    el.classList.add("marquee-mode");
                    el.style.setProperty("--start-x", `${startX}px`);
                    el.style.setProperty("--end-x", `${endX}px`);
                    el.style.setProperty("--marquee-duration", `${duration}s`);
                    span.style.animation = "none";
                    void span.offsetWidth;
                    span.style.animation = `tickerMarquee ${duration}s linear infinite`;
                } else {
                    el.classList.add("anim-center-in");
                }
            });
        }

        db.on("value", (snap) => {
            const data = snap.val() || {};
            window.currentData = data;

            const logoCont = document.getElementById('logo-container');
            const logoKey = matchId.trim().toLowerCase();

            if (clientLogos[logoKey] && data.logoVisible !== false) {
                document.getElementById('main-logo').src = clientLogos[logoKey];
                logoCont.classList.remove('hidden');
            } else {
                logoCont.classList.add('hidden');
            }

            document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
            document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);

            const roundText = data.round || "";
            const detailsStrip = document.getElementById('match-details-strip');
            if (String(roundText).trim() === "") {
                detailsStrip.classList.add('hidden');
            } else {
                detailsStrip.classList.remove('hidden');
                document.getElementById('match-round').innerText = translateToPunjabi(roundText);
            }

            document.getElementById('sA').innerText = data.scoreA ?? "0";
            document.getElementById('sB').innerText = data.scoreB ?? "0";
            document.getElementById('single-wm').innerText = data.watermarkTxt || "ਐੱਮ ਲਾਈਵ";

            buildTicker(data);
        });

        setInterval(() => {
            if (badgeList.length > 0) bIdx = (bIdx + 1) % badgeList.length;
            if (goldList.length > 0) gIdx = (gIdx + 1) % goldList.length;
            if (lowerList.length > 0) lIdx = (lIdx + 1) % lowerList.length;
            if (window.currentData) buildTicker(window.currentData);
        }, 12000);

        setInterval(() => {
            isEnglish = !isEnglish;
            ['badge-ticker', 'gold-ticker', 'lower-ticker'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.dataset.language = "";
            });
            if (window.currentData) buildTicker(window.currentData);
        }, 18000);

        setInterval(() => {
            const d = window.currentData;
            if (!d) return;
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "ਟੀਮ 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "ਟੀਮ 2");
        }, 2000);

        const wm = document.getElementById('single-wm');
        let x = 200, y = 200, dx = 1.8, dy = 1.4;
        function animateWatermark() {
            const maxX = 1920 - wm.offsetWidth - 50;
            const maxY = 850 - wm.offsetHeight;
            x += dx;
            y += dy;
            if (x <= 50 || x >= maxX) dx *= -1;
            if (y <= 120 || y >= maxY) dy *= -1;
            wm.style.left = x + 'px';
            wm.style.top = y + 'px';
            requestAnimationFrame(animateWatermark);
        }
        animateWatermark();
    </script>
</body>
</html>
