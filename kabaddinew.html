<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultra HD - 3-Row Smart Ticker</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@800;900&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            user-select: none;
            text-transform: uppercase;
            transform-origin: top left;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
            SCOREBOARD
        ========================================================= */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #top-scoreboard-container.hidden {
            opacity: 0;
        }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 2.5px solid rgba(255,255,255,0.9);
            transform: skewX(16deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
        }

        .unskew {
            transform: skewX(-16deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .score-a {
            background: linear-gradient(135deg, #0066cc, #0099ff);
            color: #ffffff;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .team-a-panel {
            background: linear-gradient(135deg, #1a8cff, #4da6ff);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 50px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
        }

        .vs-divider {
            width: 12px;
            background: #111111;
        }

        .team-b-panel {
            background: linear-gradient(135deg, #1f1f1f, #2e2e2e);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 50px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
        }

        .score-b {
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: #ffcc00;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        #match-details-strip {
            background: rgba(0,0,0,0.95);
            color: #ffcc00;
            font-size: 24px;
            font-weight: 800;
            padding: 6px 40px;
            margin-top: 8px;
            border-radius: 6px;
            letter-spacing: 2.5px;
            border: 1.5px solid rgba(255,204,0,0.6);
            transform: skewX(16deg);
            margin-right: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        #match-details-strip.hidden {
            display: none;
        }

        /* =========================================================
            LOGO
        ========================================================= */
        #logo-container {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: scale(1) rotate(0deg);
            will-change: transform;
        }

        #logo-container.hidden {
            opacity: 0;
            transform: scale(0.3) translateY(-40px) rotate(-360deg);
        }

        #logo-container.animate-slow-spin {
            animation: logoSlowSpin 2.2s cubic-bezier(0.4,0,0.2,1) forwards;
        }

        @keyframes logoSlowSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { filter: drop-shadow(0 0 20px rgba(51,153,255,0.9)); }
            100% { transform: scale(1) rotate(360deg); }
        }

        #main-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }

        /* =========================================================
            WATERMARK
        ========================================================= */
        #single-wm {
            position: absolute;
            left: 300px;
            top: 300px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 50px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.45;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* =========================================================
            3-ROW TICKER WRAP
        ========================================================= */
        #ticker-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            transition: opacity 0.5s ease;
            box-shadow: 0 -6px 28px rgba(0,0,0,0.85);
        }

        #ticker-wrap.hidden {
            opacity: 0;
        }

        .ticker-row {
            display: flex;
            align-items: stretch;
            width: 100%;
            height: 54px;
            overflow: hidden;
        }

        /* Row 1: Admin Row 3 Update */
        .row-1 {
            background: linear-gradient(90deg, #0b5ed7, #1a8cff, #0b5ed7);
            border-bottom: 2px solid rgba(255,255,255,0.25);
        }

        /* Row 2: Winner Match */
        .row-2 {
            background: linear-gradient(90deg, #161616, #262626, #161616);
            border-bottom: 2px solid rgba(255,204,0,0.45);
        }

        /* Row 3: Match List */
        .row-3 {
            background: linear-gradient(90deg, #090909, #151515, #090909);
            border-top: 1px solid rgba(255,255,255,0.18);
        }

        .row-badge {
            flex: 0 0 290px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 900;
            letter-spacing: 1.5px;
            padding: 0 18px;
            white-space: nowrap;
        }

        .row-1 .row-badge {
            background: #ffcc00;
            color: #111111;
        }

        .row-2 .row-badge {
            background: #e6b800;
            color: #111111;
        }

        .row-3 .row-badge {
            background: #1a8cff;
            color: #ffffff;
        }

        .row-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 0 20px;
            font-size: 31px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 1.5px;
        }

        .match-vs-3d {
            color: #ffcc00;
            background: #111111;
            padding: 1px 10px;
            border-radius: 5px;
            margin: 0 8px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 28px;
            letter-spacing: 1.5px;
            display: inline-block;
            transform: translateY(-2px);
        }

        .anim-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .anim-center-in {
            animation: tickerCenterIn 0.45s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes tickerCenterIn {
            0% { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .anim-wrap.marquee-mode {
            justify-content: flex-start;
        }

        .anim-wrap.marquee-mode .ticker-text {
            display: inline-block;
            flex: 0 0 auto;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: tickerMarquee var(--marquee-duration, 16s) linear infinite;
        }

        @keyframes tickerMarquee {
            0% { transform: translateX(0); }
            10% { transform: translateX(0); }
            100% { transform: translateX(calc(-1 * var(--scroll-distance, 100px))); }
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <div id="logo-container" class="hidden">
        <img id="main-logo" src="" alt="Logo">
    </div>

    <!-- WATERMARK -->
    <div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

    <!-- SCOREBOARD -->
    <div id="top-scoreboard-container">
        <div id="main-score-strip">
            <div class="score-a"><div class="unskew" id="sA">0</div></div>
            <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>
            <div class="vs-divider"><div class="unskew"></div></div>
            <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
            <div class="score-b"><div class="unskew" id="sB">0</div></div>
        </div>
        <div id="match-details-strip" class="hidden">
            <div class="unskew" id="match-round"></div>
        </div>
    </div>

    <!-- 3-ROW TICKER -->
    <div id="ticker-wrap">
        <!-- Row 1: Admin Row 3 Update -->
        <div class="ticker-row row-1">
            <div class="row-badge" id="badge-r1">ਤਾਜ਼ਾ ਅਪਡੇਟ</div>
            <div class="row-content">
                <div id="r1-text" class="anim-wrap"></div>
            </div>
        </div>

        <!-- Row 2: Winner Match -->
        <div class="ticker-row row-2">
            <div class="row-badge" id="badge-r2">ਵਿੰਨਰ ਮੈਚ</div>
            <div class="row-content">
                <div id="r2-text" class="anim-wrap"></div>
            </div>
        </div>

        <!-- Row 3: Match List -->
        <div class="ticker-row row-3">
            <div class="row-badge" id="badge-r3">ਮੈਚ ਲਿਸਟ</div>
            <div class="row-content">
                <div id="r3-text" class="anim-wrap"></div>
            </div>
        </div>
    </div>

    <script>
        function autoResizeOverlay() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.width = `${baseWidth}px`;
            document.body.style.height = `${baseHeight}px`;
        }

        window.addEventListener('resize', autoResizeOverlay);
        window.addEventListener('load', autoResizeOverlay);
        autoResizeOverlay();

        const firebaseConfig = {
            databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || 'defaultMatch';

        const db = firebase.database().ref("matchData/" + matchId);
        const userDb = firebase.database().ref("users/" + matchId);

        userDb.on("value", (snap) => {
            const user = snap.val();
            if (!user || Date.now() > new Date(user.expiryDate).getTime()) {
                document.body.innerHTML = `
                    <div style="width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:black;color:white;font-size:50px;text-align:center;">
                        🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ<br>ਹੈਲਪ ਲਾਈਨ: ਮਨਪ੍ਰੀਤ ਮੁਦਕੀ<br>9115426711
                    </div>
                `;
            }
        });

        const clientLogos = {
            "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/kabaddisports1.png"
        };

        const dict = {
            "Kabaddi": "ਕਬੱਡੀ",
            "Open": "ਓਪਨ",
            "Quarter Final": "ਕੁਆਰਟਰ ਫਾਈਨਲ",
            "Semi Final": "ਸੈਮੀ ਫਾਈਨਲ",
            "Final": "ਫਾਈਨਲ",
            "1st Round": "ਪਹਿਲਾ ਰਾਊਂਡ",
            "2nd Round": "ਦੂਜਾ ਰਾਊਂਡ",
            "3rd Round": "ਤੀਜਾ ਰਾਊਂਡ",
            "4th Round": "ਚੌਥਾ ਰਾਊਂਡ",
            "Pool A": "ਪੂਲ ਏ",
            "Pool B": "ਪੂਲ ਬੀ",
            "Winner": "ਵਿੰਨਰ"
        };

        function translateToPunjabi(text) {
            if (!text) return "";
            let translated = String(text).trim();
            for (let key in dict) {
                let regex = new RegExp(key, 'gi');
                translated = translated.replace(regex, dict[key]);
            }
            return translated.replace(/KG/gi, "ਕਿਲੋ");
        }

        function normalizeArray(value) {
            if (Array.isArray(value)) {
                return value.filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            if (value && typeof value === "object") {
                return Object.values(value).filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            return [];
        }

        function formatMatchItem(m, index) {
            m = String(m || "").trim();
            let bracketContent = "";
            let teamPart = m;

            if (m.startsWith("(")) {
                const closeIdx = m.indexOf(")");
                if (closeIdx !== -1) {
                    bracketContent = m.substring(1, closeIdx).trim();
                    teamPart = m.substring(closeIdx + 1).trim();
                }
            }

            const tms = teamPart.split(/\s+VS\s+/i);
            const t1Parts = (tms[0] || "").trim().split("=");
            const t2Parts = (tms[1] || "").trim().split("=");

            const t1En = (t1Parts[0] || "").trim();
            const t2En = (t2Parts[0] || "").trim();
            const t1Pa = translateToPunjabi((t1Parts[1] || t1Parts[0] || "").trim());
            const t2Pa = translateToPunjabi((t2Parts[1] || t2Parts[0] || "").trim());

            const bracketPa = translateToPunjabi(bracketContent);
            const tagPa = bracketPa ? `(${bracketPa}) ` : "";
            const tagEn = bracketContent ? `(${bracketContent}) ` : "";
            const numTag = `${index + 1}. `;

            const vsPa = `<span class="match-vs-3d">ਬਨਾਮ</span>`;
            const vsEn = `<span class="match-vs-3d">VS</span>`;

            return {
                pa: `${numTag}${tagPa}${t1Pa} ${vsPa} ${t2Pa}`,
                en: `${numTag}${tagEn}${t1En} ${vsEn} ${t2En}`
            };
        }

        let row1Items = [];
        let row2Items = [];
        let row3Items = [];

        let r1Idx = 0;
        let r2Idx = 0;
        let r3Idx = 0;

        let isEnglish = false;
        let lastSignature = "";

        function buildTickerRows(data) {
            // 1. Admin Row 3 update (row3Txt / row3Txt_pa) + fallback info
            row1Items = [];
            const adminRow3Pa = (data.row3Txt_pa || data.row3Txt || "").trim();
            const adminRow3En = (data.row3Txt || data.row3Txt_pa || "").trim();

            if (adminRow3Pa || adminRow3En) {
                row1Items.push({
                    pa: translateToPunjabi(adminRow3Pa),
                    en: adminRow3En
                });
            }

            if (data.programTxt || data.programTxt_pa) {
                row1Items.push({
                    pa: translateToPunjabi(data.programTxt_pa || data.programTxt),
                    en: data.programTxt || data.programTxt_pa
                });
            }

            if (data.resultText && data.resultText !== "No Result Yet") {
                row1Items.push({
                    pa: `ਨਤੀਜਾ: ${translateToPunjabi(data.resultText)}`,
                    en: `RESULT: ${data.resultText}`
                });
            }

            if (row1Items.length === 0) {
                row1Items.push({
                    pa: "ਲਾਈਵ ਕਬੱਡੀ ਟੂਰਨਾਮੈਂਟ",
                    en: "LIVE KABADDI TOURNAMENT"
                });
            }

            // 2. Match List update -> Winner Match goes into Row 2
            const rawMatches = normalizeArray(data.nextMatches);
            row2Items = [];
            row3Items = [];

            if (rawMatches.length > 0) {
                const winnerMatches = [];
                const otherMatches = [];

                rawMatches.forEach((mStr, idx) => {
                    const formatted = formatMatchItem(mStr, idx);
                    const isWinner = /winner|ਵਿੰਨਰ/i.test(String(mStr));
                    if (isWinner) {
                        winnerMatches.push(formatted);
                    } else {
                        otherMatches.push(formatted);
                    }
                });

                // If explicit "winner" match exists in list, use it; otherwise promote first match to Row 2
                if (winnerMatches.length > 0) {
                    row2Items = winnerMatches;
                    row3Items = otherMatches.length > 0 ? otherMatches : winnerMatches;
                } else {
                    row2Items = [otherMatches[0]];
                    row3Items = otherMatches.length > 1 ? otherMatches.slice(1) : [otherMatches[0]];
                }
            } else {
                row2Items.push({
                    pa: "ਵਿੰਨਰ ਮੈਚ ਜਲਦ ਆ ਰਿਹਾ ਹੈ",
                    en: "WINNER MATCH COMING SOON"
                });
                row3Items.push({
                    pa: "ਮੈਚ ਲਿਸਟ ਅੱਪਡੇਟ ਹੋ ਰਹੀ ਹੈ",
                    en: "MATCH LIST UPDATING"
                });
            }

            const sig = JSON.stringify({
                r3: data.row3Txt,
                r3pa: data.row3Txt_pa,
                prog: data.programTxt,
                progPa: data.programTxt_pa,
                res: data.resultText,
                matches: rawMatches
            });

            if (sig !== lastSignature) {
                lastSignature = sig;
                r1Idx = 0;
                r2Idx = 0;
                r3Idx = 0;
                ['r1-text', 'r2-text', 'r3-text'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.dataset.currentText = "";
                        el.dataset.language = "";
                    }
                });
            }

            renderRow('r1-text', row1Items[r1Idx % row1Items.length]);
            renderRow('r2-text', row2Items[r2Idx % row2Items.length]);
            renderRow('r3-text', row3Items[r3Idx % row3Items.length]);
        }

        function renderRow(elementId, item) {
            const el = document.getElementById(elementId);
            if (!el || !item) return;

            const textToShow = isEnglish ? item.en : item.pa;
            const langKey = String(isEnglish);

            if (el.dataset.currentText === textToShow && el.dataset.language === langKey) {
                return;
            }

            el.dataset.currentText = textToShow;
            el.dataset.language = langKey;
            el.className = "anim-wrap";
            el.innerHTML = "";
            el.style.removeProperty("--marquee-duration");
            el.style.removeProperty("--scroll-distance");

            const span = document.createElement("span");
            span.className = "ticker-text";
            span.innerHTML = textToShow;
            el.appendChild(span);

            requestAnimationFrame(() => {
                const boxWidth = el.clientWidth;
                const textWidth = span.scrollWidth;

                if (textWidth > boxWidth - 20) {
                    const distance = textWidth - boxWidth + 30;
                    const duration = Math.max(10, distance / 55 + 2);
                    el.classList.add("marquee-mode");
                    el.style.setProperty("--scroll-distance", `${distance}px`);
                    el.style.setProperty("--marquee-duration", `${duration}s`);
                    span.style.animation = "none";
                    void span.offsetWidth;
                    span.style.animation = `tickerMarquee ${duration}s linear infinite`;
                } else {
                    el.classList.add("anim-center-in");
                }
            });
        }

        db.on("value", (snap) => {
            const data = snap.val() || {};
            window.currentData = data;

            const logoCont = document.getElementById('logo-container');
            const logoKey = matchId.trim().toLowerCase();

            if (clientLogos[logoKey] && data.logoVisible !== false) {
                document.getElementById('main-logo').src = clientLogos[logoKey];
                logoCont.classList.remove('hidden');
            } else {
                logoCont.classList.add('hidden');
            }

            document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
            document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);

            const roundText = data.round || "";
            const detailsStrip = document.getElementById('match-details-strip');
            if (String(roundText).trim() === "") {
                detailsStrip.classList.add('hidden');
            } else {
                detailsStrip.classList.remove('hidden');
                document.getElementById('match-round').innerText = translateToPunjabi(roundText);
            }

            document.getElementById('sA').innerText = data.scoreA ?? "0";
            document.getElementById('sB').innerText = data.scoreB ?? "0";
            document.getElementById('single-wm').innerText = data.watermarkTxt || "ਐੱਮ ਲਾਈਵ";

            buildTickerRows(data);
        });

        // Cycle items every 10s
        setInterval(() => {
            r1Idx++;
            r2Idx++;
            r3Idx++;
            if (window.currentData) buildTickerRows(window.currentData);
        }, 10000);

        // Toggle Punjabi / English every 18s
        setInterval(() => {
            isEnglish = !isEnglish;
            ['r1-text', 'r2-text', 'r3-text'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.dataset.language = "";
            });
            if (window.currentData) buildTickerRows(window.currentData);
        }, 18000);

        // Logo spin every 15s
        setInterval(() => {
            const logoBox = document.getElementById('logo-container');
            if (logoBox && !logoBox.classList.contains('hidden')) {
                logoBox.classList.add('animate-slow-spin');
                setTimeout(() => logoBox.classList.remove('animate-slow-spin'), 2200);
            }
        }, 15000);

        // Scoreboard names update
        setInterval(() => {
            const d = window.currentData;
            if (!d) return;
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "ਟੀਮ 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "ਟੀਮ 2");
        }, 2000);

        // Watermark movement
        const wm = document.getElementById('single-wm');
        let x = 200, y = 200, dx = 1.8, dy = 1.4;
        function animateWatermark() {
            const maxX = 1920 - wm.offsetWidth - 50;
            const maxY = 880 - wm.offsetHeight;
            x += dx;
            y += dy;
            if (x <= 50 || x >= maxX) dx *= -1;
            if (y <= 120 || y >= maxY) dy *= -1;
            wm.style.left = x + 'px';
            wm.style.top = y + 'px';
            requestAnimationFrame(animateWatermark);
        }
        animateWatermark();
    </script>
</body>
</html>
