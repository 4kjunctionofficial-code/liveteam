<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Sports 1 - Broadcast Ticker & Clock Box</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            user-select: none;
            text-transform: uppercase;
            transform-origin: top left;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
            SCOREBOARD (KABADDI SPORTS 1 GOLD + ROYAL BLUE)
        ========================================================= */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #top-scoreboard-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 2.5px solid #ffd000;
            transform: skewX(16deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.75);
        }

        .unskew {
            transform: skewX(-16deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .score-a {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .team-a-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .vs-divider {
            width: 12px;
            background: #090909;
            border-left: 1.5px solid #ffd000;
            border-right: 1.5px solid #ffd000;
        }

        .team-b-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .score-b {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        #match-details-strip {
            background: linear-gradient(90deg, #002b80 0%, #0055ff 50%, #002b80 100%);
            color: #ffe24a;
            font-size: 24px;
            font-weight: 800;
            padding: 6px 40px;
            margin-top: 8px;
            border-radius: 6px;
            letter-spacing: 2px;
            border: 1.5px solid #ffd000;
            transform: skewX(16deg);
            margin-right: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.65);
        }

        #match-details-strip.hidden {
            display: none;
        }

        /* =========================================================
            LOGO & WATERMARK
        ========================================================= */
        #logo-container {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: scale(1) rotate(0deg);
            will-change: transform;
        }

        #logo-container.hidden {
            opacity: 0;
            transform: scale(0.3) translateY(-40px) rotate(-360deg);
        }

        #logo-container.animate-slow-spin {
            animation: logoSlowSpin 2.2s cubic-bezier(0.4,0,0.2,1) forwards;
        }

        @keyframes logoSlowSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 208, 0, 0.95)); }
            100% { transform: scale(1) rotate(360deg); }
        }

        #main-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }

        #single-wm {
            position: absolute;
            left: 300px;
            top: 300px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 50px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.45;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* =========================================================
            3-ROW BROADCAST TICKER + ROW 3 CLOCK BOX
        ========================================================= */
        #ticker-wrap {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.8));
            transition: opacity 0.4s ease;
        }

        #ticker-wrap.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .ticker-row {
            display: flex;
            align-items: stretch;
            width: 100%;
            height: 48px;
            overflow: hidden;
        }

        /* Row 1: Green Background with Gold Badge */
        .row-1-green {
            background: linear-gradient(90deg, #004700 0%, #007a00 30%, #008c00 50%, #007a00 70%, #004400 100%);
            border-top: 2.5px solid #ffd000;
            border-bottom: 2px solid #090909;
        }

        .row-1-green .row-badge {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 70%, #c98600 100%);
            color: #090909;
            border-right: 2.5px solid #090909;
        }

        .row-1-green .row-content {
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
        }

        /* Row 2: Gold Track (Prize List + Upcoming Live + Winner Match List) */
        .row-2-gold {
            background: linear-gradient(180deg, #ffd41f 0%, #f0a800 55%, #b87800 100%);
            border-bottom: 2px solid #090909;
        }

        .row-2-gold .row-badge {
            background: #090909;
            color: #ffe24a;
            border-right: 2.5px solid #ffd000;
        }

        .row-2-gold .row-content {
            color: #090909;
        }

        /* Row 3: Royal Blue Banner + Right Corner Clock Time Box */
        .row-3-blue {
            background: linear-gradient(90deg, #001f66 0%, #0047cc 25%, #0066ff 55%, #003b99 85%, #001a54 100%);
            border-bottom: 2px solid #ffd000;
        }

        .row-3-blue .row-badge {
            background: linear-gradient(180deg, #1b78ff 0%, #003b99 100%);
            color: #ffe24a;
            border-right: 2.5px solid #ffd000;
        }

        .row-3-blue .row-content {
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
        }

        .row-badge {
            flex: 0 0 275px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            padding: 0 14px;
            white-space: nowrap;
        }

        .row-content {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 0 18px;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 0.8px;
        }

        /* Row 3 Right Corner Clock Time Box */
        .clock-time-box {
            flex: 0 0 245px;
            height: 100%;
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            border-left: 3px solid #090909;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 14px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        .clock-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d90429;
            box-shadow: 0 0 8px rgba(217, 4, 41, 0.85);
            animation: clockPulse 1s infinite alternate;
        }

        @keyframes clockPulse {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0.35; transform: scale(0.8); }
        }

        .star-accent {
            color: #ffe24a;
            font-weight: 900;
            margin: 0 10px;
        }

        .row-2-gold .star-accent {
            color: #090909;
        }

        .match-vs-pill {
            display: inline-block;
            background: #090909;
            color: #ffe24a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            padding: 0 8px;
            border-radius: 4px;
            margin: 0 5px;
            vertical-align: middle;
        }

        .anim-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .anim-center-in {
            animation: tickerFadeSlide 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes tickerFadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .anim-wrap.marquee-mode {
            justify-content: flex-start;
        }

        .anim-wrap.marquee-mode .ticker-text {
            display: inline-block;
            flex: 0 0 auto;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: tickerMarquee var(--marquee-duration, 16s) linear infinite;
        }

        @keyframes tickerMarquee {
            0% { transform: translateX(0); }
            10% { transform: translateX(0); }
            100% { transform: translateX(calc(-1 * var(--scroll-distance, 120px))); }
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <div id="logo-container" class="hidden">
        <img id="main-logo" src="" alt="Logo">
    </div>

    <!-- WATERMARK -->
    <div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

    <!-- SCOREBOARD -->
    <div id="top-scoreboard-container">
        <div id="main-score-strip">
            <div class="score-a"><div class="unskew" id="sA">0</div></div>
            <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>
            <div class="vs-divider"><div class="unskew"></div></div>
            <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
            <div class="score-b"><div class="unskew" id="sB">0</div></div>
        </div>
        <div id="match-details-strip" class="hidden">
            <div class="unskew" id="match-round"></div>
        </div>
    </div>

    <!-- 3-ROW TICKER -->
    <div id="ticker-wrap">
        <!-- Row 1 (Green): Event / Location / Live Update -->
        <div class="ticker-row row-1-green">
            <div class="row-badge" id="badge-r1">ਲਾਈਵ ਅੱਪਡੇਟ</div>
            <div class="row-content">
                <div id="r1-text" class="anim-wrap"></div>
            </div>
        </div>

        <!-- Row 2 (Gold): Prize List + Upcoming Live + Winner Match List -->
        <div class="ticker-row row-2-gold">
            <div class="row-badge" id="badge-r2">ਇਨਾਮ • ਵਿੰਨਰ • ਲਾਈਵ</div>
            <div class="row-content">
                <div id="r2-text" class="anim-wrap"></div>
            </div>
        </div>

        <!-- Row 3 (Blue): Team List + Contact Us + Right Corner Clock Box -->
        <div class="ticker-row row-3-blue">
            <div class="row-badge" id="badge-r3">ਟੀਮਾਂ • ਸੰਪਰਕ</div>
            <div class="row-content">
                <div id="r3-text" class="anim-wrap"></div>
            </div>
            <div class="clock-time-box" id="row3-clock-box">
                <span class="clock-dot"></span>
                <span id="live-clock-text">11:23:00 AM</span>
            </div>
        </div>
    </div>

    <script>
        function autoResizeOverlay() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.width = `${baseWidth}px`;
            document.body.style.height = `${baseHeight}px`;
        }

        window.addEventListener('resize', autoResizeOverlay);
        window.addEventListener('load', autoResizeOverlay);
        autoResizeOverlay();

        // Live Clock in Row 3 Right Corner
        function updateLiveClock() {
            const now = new Date();
            const clockEl = document.getElementById("live-clock-text");
            if (clockEl) {
                clockEl.innerText = now.toLocaleTimeString("en-US", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: true
                });
            }
        }
        updateLiveClock();
        setInterval(updateLiveClock, 1000);

        const firebaseConfig = {
            databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || 'defaultMatch';

        const db = firebase.database().ref("matchData/" + matchId);
        const userDb = firebase.database().ref("users/" + matchId);

        userDb.on("value", (snap) => {
            const user = snap.val();
            if (user && user.expiryDate && Date.now() > new Date(user.expiryDate).getTime()) {
                document.body.innerHTML = `
                    <div style="width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:black;color:white;font-size:50px;text-align:center;">
                        🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ<br>ਹੈਲਪ ਲਾਈਨ: ਮਨਪ੍ਰੀਤ ਮੁਦਕੀ<br>9115426711
                    </div>
                `;
            }
        });

        const clientLogos = {
            "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/kabaddisports1.png"
        };

        const dict = {
            "Kabaddi": "ਕਬੱਡੀ",
            "Open": "ਓਪਨ",
            "Quarter Final": "ਕੁਆਰਟਰ ਫਾਈਨਲ",
            "Semi Final": "ਸੈਮੀ ਫਾਈਨਲ",
            "Final": "ਫਾਈਨਲ",
            "1st Round": "ਪਹਿਲਾ ਰਾਊਂਡ",
            "2nd Round": "ਦੂਜਾ ਰਾਊਂਡ",
            "3rd Round": "ਤੀਜਾ ਰਾਊਂਡ",
            "4th Round": "ਚੌਥਾ ਰਾਊਂਡ",
            "Pool A": "ਪੂਲ ਏ",
            "Pool B": "ਪੂਲ ਬੀ",
            "Winner": "ਵਿੰਨਰ"
        };

        function translateToPunjabi(text) {
            if (!text) return "";
            let translated = String(text).trim();
            for (let key in dict) {
                let regex = new RegExp(key, 'gi');
                translated = translated.replace(regex, dict[key]);
            }
            return translated.replace(/KG/gi, "ਕਿਲੋ");
        }

        function normalizeArray(value) {
            if (Array.isArray(value)) {
                return value.filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            if (value && typeof value === "object") {
                return Object.values(value).filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            return [];
        }

        function formatMatchString(m, index, isEnglishMode) {
            m = String(m || "").trim();
            let bracketContent = "";
            let teamPart = m;

            if (m.startsWith("(")) {
                const closeIdx = m.indexOf(")");
                if (closeIdx !== -1) {
                    bracketContent = m.substring(1, closeIdx).trim();
                    teamPart = m.substring(closeIdx + 1).trim();
                }
            }

            const tms = teamPart.split(/\s+VS\s+/i);
            const t1Parts = (tms[0] || "").trim().split("=");
            const t2Parts = (tms[1] || "").trim().split("=");

            const t1En = (t1Parts[0] || "").trim();
            const t2En = (t2Parts[0] || "").trim();
            const t1Pa = translateToPunjabi((t1Parts[1] || t1Parts[0] || "").trim());
            const t2Pa = translateToPunjabi((t2Parts[1] || t2Parts[0] || "").trim());

            const tagPa = translateToPunjabi(bracketContent) ? `(${translateToPunjabi(bracketContent)}) ` : "";
            const tagEn = bracketContent ? `(${bracketContent}) ` : "";
            const num = `${index + 1}. `;

            if (isEnglishMode) {
                return `${num}${tagEn}${t1En} <span class="match-vs-pill">VS</span> ${t2En}`;
            }
            return `${num}${tagPa}${t1Pa} <span class="match-vs-pill">ਬਨਾਮ</span> ${t2Pa}`;
        }

        let r1List = [];
        let r2List = [];
        let r3List = [];

        let r1Idx = 0;
        let r2Idx = 0;
        let r3Idx = 0;

        let isEnglish = false;
        let lastSig = "";

        function buildRows(data) {
            r1List = [];
            r2List = [];
            r3List = [];

            // ---------------- ROW 1 (GREEN): Program / Location / Row1-Row3 / Result ----------------
            const locEn = (data.row1Txt || data.location || "").trim();
            const locPa = (data.row1Txt_pa || data.location_pa || locEn).trim();
            const progEn = (data.programTxt || data.row2Txt || "").trim();
            const progPa = (data.programTxt_pa || data.row2Txt_pa || progEn).trim();
            const r3En = (data.row3Txt || "").trim();
            const r3Pa = (data.row3Txt_pa || r3En).trim();

            if (progPa || progEn || locPa || locEn) {
                r1List.push({
                    pa: `** ${[locPa, progPa].filter(Boolean).map(translateToPunjabi).join(" • ")}`,
                    en: `** ${[locEn, progEn].filter(Boolean).join(" • ")}`
                });
            }
            if (r3Pa || r3En) {
                r1List.push({
                    pa: `** ${translateToPunjabi(r3Pa)}`,
                    en: `** ${r3En}`
                });
            }
            if (data.resultText && data.resultText !== "No Result Yet") {
                r1List.push({
                    pa: `** ਨਤੀਜਾ: ${translateToPunjabi(data.resultText)}`,
                    en: `** RESULT: ${data.resultText}`
                });
            }
            if (r1List.length === 0) {
                r1List.push({
                    pa: "** ਕਬੱਡੀ ਸਪੋਰਟਸ 1 ਲਾਈਵ ਪ੍ਰਸਾਰਣ",
                    en: "** KABADDI SPORTS 1 LIVE TELECAST"
                });
            }

            // ---------------- ROW 2 (GOLD): Prize List + Upcoming Live + Winner Match List ----------------
            const prizePartsEn = [];
            const prizePartsPa = [];
            if (data.pzTitle1 || data.pzOp1 || data.pzOp2 || data.pzOpBest) {
                const t1 = data.pzTitle1 || "OPEN";
                const t1Pa = translateToPunjabi(t1);
                const p1En = [data.pzOp1 && `1st: ${data.pzOp1}`, data.pzOp2 && `2nd: ${data.pzOp2}`, data.pzOpBest && `Best: ${data.pzOpBest}`].filter(Boolean).join(" • ");
                const p1Pa = [data.pzOp1 && `ਪਹਿਲਾ: ${data.pzOp1}`, data.pzOp2 && `ਦੂਜਾ: ${data.pzOp2}`, data.pzOpBest && `ਬੈਸਟ: ${data.pzOpBest}`].filter(Boolean).join(" • ");
                prizePartsEn.push(`🏆 ${t1}: ${p1En}`);
                prizePartsPa.push(`🏆 ${t1Pa}: ${p1Pa}`);
            }
            if (data.pzTitle2 || data.pzWt1 || data.pzWt2 || data.pzWtBest) {
                const t2 = data.pzTitle2 || "WEIGHT";
                const t2Pa = translateToPunjabi(t2);
                const p2En = [data.pzWt1 && `1st: ${data.pzWt1}`, data.pzWt2 && `2nd: ${data.pzWt2}`, data.pzWtBest && `Best: ${data.pzWtBest}`].filter(Boolean).join(" • ");
                const p2Pa = [data.pzWt1 && `ਪਹਿਲਾ: ${data.pzWt1}`, data.pzWt2 && `ਦੂਜਾ: ${data.pzWt2}`, data.pzWtBest && `ਬੈਸਟ: ${data.pzWtBest}`].filter(Boolean).join(" • ");
                prizePartsEn.push(`🏆 ${t2}: ${p2En}`);
                prizePartsPa.push(`🏆 ${t2Pa}: ${p2Pa}`);
            }
            if (prizePartsEn.length > 0) {
                r2List.push({
                    pa: `${prizePartsPa.join(" <span class='star-accent'>•</span> ")}`,
                    en: `${prizePartsEn.join(" <span class='star-accent'>•</span> ")}`
                });
            }

            const upcomingArr = normalizeArray(data.upcomingEvents);
            if (upcomingArr.length > 0) {
                const upEn = upcomingArr.map((ev, i) => `${i + 1}. ${ev.name || ev.eventName || ""}${ev.date ? ` (${ev.date})` : ""}`).join(" • ");
                const upPa = upcomingArr.map((ev, i) => `${i + 1}. ${ev.name_pa || ev.eventName_pa || translateToPunjabi(ev.name || ev.eventName || "")}${ev.date ? ` (${ev.date})` : ""}`).join(" • ");
                r2List.push({
                    pa: `📡 ਆਉਣ ਵਾਲੇ ਲਾਈਵ: ${upPa}`,
                    en: `📡 UPCOMING LIVE: ${upEn}`
                });
            } else if (data.row4Txt || data.row4Txt_pa) {
                r2List.push({
                    pa: `📡 ਆਉਣ ਵਾਲੇ ਲਾਈਵ: ${translateToPunjabi(data.row4Txt_pa || data.row4Txt)}`,
                    en: `📡 UPCOMING LIVE: ${data.row4Txt || data.row4Txt_pa}`
                });
            }

            const rawMatches = normalizeArray(data.nextMatches);
            const winnersFromMatches = rawMatches.filter(m => /winner|ਵਿੰਨਰ|\(win\)/i.test(String(m)));
            if (winnersFromMatches.length > 0) {
                r2List.push({
                    pa: `🥇 ਵਿੰਨਰ ਮੈਚ ਲਿਸਟ: ${winnersFromMatches.map((m, i) => formatMatchString(m, i, false)).join(" • ")}`,
                    en: `🥇 WINNER MATCH LIST: ${winnersFromMatches.map((m, i) => formatMatchString(m, i, true)).join(" • ")}`
                });
            } else if (data.qualifiedTeams) {
                const qRaw = String(data.qualifiedTeams).split("\n").map(s => s.trim()).filter(Boolean).join(" • ");
                r2List.push({
                    pa: `🥇 ਵਿੰਨਰ / ਕੁਆਲੀਫਾਈਡ ਟੀਮਾਂ: ${translateToPunjabi(qRaw)}`,
                    en: `🥇 WINNER / QUALIFIED TEAMS: ${qRaw}`
                });
            } else if (rawMatches.length > 0) {
                r2List.push({
                    pa: `🥇 ਵਿੰਨਰ ਮੈਚ: ${formatMatchString(rawMatches[0], 0, false)}`,
                    en: `🥇 WINNER MATCH: ${formatMatchString(rawMatches[0], 0, true)}`
                });
            }

            if (r2List.length === 0) {
                r2List.push({
                    pa: "🏆 ਇਨਾਮ ਸੂਚੀ • ਆਉਣ ਵਾਲੇ ਲਾਈਵ • ਵਿੰਨਰ ਮੈਚ ਲਿਸਟ",
                    en: "🏆 PRIZE LIST • UPCOMING LIVE • WINNER MATCH LIST"
                });
            }

            // ---------------- ROW 3 (BLUE): Team List + Contact Us ----------------
            const teamsArr = normalizeArray(data.allTeams);
            const contactText = (data.contactUs || data.row6Txt || "MANPREET MUDKI • +91 8699640061 / 9115426711").trim();

            if (teamsArr.length > 0) {
                const tEn = teamsArr.map(t => t.split("=")[0].trim()).join(", ");
                const tPa = teamsArr.map(t => translateToPunjabi((t.split("=")[1] || t.split("=")[0] || "").trim())).join(", ");
                r3List.push({
                    pa: `ਟੀਮ ਲਿਸਟ: ${tPa} <span class="star-accent">******</span> ਸੰਪਰਕ: ${translateToPunjabi(contactText)} <span class="star-accent">******</span>`,
                    en: `TEAM LIST: ${tEn} <span class="star-accent">******</span> CONTACT US: ${contactText} <span class="star-accent">******</span>`
                });
            } else {
                r3List.push({
                    pa: `ਸੰਪਰਕ ਕਰੋ (CONTACT US): ${translateToPunjabi(contactText)} <span class="star-accent">******</span> ਕਬੱਡੀ ਸਪੋਰਟਸ 1 ਲਾਈਵ`,
                    en: `CONTACT US: ${contactText} <span class="star-accent">******</span> KABADDI SPORTS 1 LIVE`
                });
            }

            const sig = JSON.stringify({
                r1: r1List.map(x => x.en + x.pa),
                r2: r2List.map(x => x.en + x.pa),
                r3: r3List.map(x => x.en + x.pa)
            });

            if (sig !== lastSig) {
                lastSig = sig;
                r1Idx = 0;
                r2Idx = 0;
                r3Idx = 0;
                ['r1-text', 'r2-text', 'r3-text'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.dataset.currentText = "";
                        el.dataset.language = "";
                    }
                });
            }

            renderSlot('r1-text', r1List[r1Idx % r1List.length]);
            renderSlot('r2-text', r2List[r2Idx % r2List.length]);
            renderSlot('r3-text', r3List[r3Idx % r3List.length]);
        }

        function renderSlot(elementId, item) {
            const el = document.getElementById(elementId);
            if (!el || !item) return;

            const textToShow = isEnglish ? item.en : item.pa;
            const langKey = String(isEnglish);

            if (el.dataset.currentText === textToShow && el.dataset.language === langKey) {
                return;
            }

            el.dataset.currentText = textToShow;
            el.dataset.language = langKey;
            el.className = "anim-wrap";
            el.innerHTML = "";
            el.style.removeProperty("--marquee-duration");
            el.style.removeProperty("--scroll-distance");

            const span = document.createElement("span");
            span.className = "ticker-text";
            span.innerHTML = textToShow;
            el.appendChild(span);

            requestAnimationFrame(() => {
                const boxWidth = el.clientWidth;
                const textWidth = span.scrollWidth;

                if (textWidth > boxWidth - 16) {
                    const distance = textWidth - boxWidth + 40;
                    const duration = Math.max(10, distance / 62 + 2);
                    el.classList.add("marquee-mode");
                    el.style.setProperty("--scroll-distance", `${distance}px`);
                    el.style.setProperty("--marquee-duration", `${duration}s`);
                    span.style.animation = "none";
                    void span.offsetWidth;
                    span.style.animation = `tickerMarquee ${duration}s linear infinite`;
                } else {
                    el.classList.add("anim-center-in");
                }
            });
        }

        db.on("value", (snap) => {
            const data = snap.val() || {};
            window.currentData = data;

            const logoCont = document.getElementById('logo-container');
            const logoKey = matchId.trim().toLowerCase();

            if (clientLogos[logoKey] && data.logoVisible !== false) {
                document.getElementById('main-logo').src = clientLogos[logoKey];
                logoCont.classList.remove('hidden');
            } else {
                logoCont.classList.add('hidden');
            }

            document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
            document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);

            const roundText = data.round || "";
            const detailsStrip = document.getElementById('match-details-strip');
            if (String(roundText).trim() === "") {
                detailsStrip.classList.add('hidden');
            } else {
                detailsStrip.classList.remove('hidden');
                document.getElementById('match-round').innerText = translateToPunjabi(roundText);
            }

            document.getElementById('sA').innerText = data.scoreA ?? "0";
            document.getElementById('sB').innerText = data.scoreB ?? "0";
            document.getElementById('single-wm').innerText = data.watermarkTxt || "ਐੱਮ ਲਾਈਵ";

            buildRows(data);
        });

        setInterval(() => {
            r1Idx++;
            r2Idx++;
            r3Idx++;
            if (window.currentData) buildRows(window.currentData);
        }, 10000);

        setInterval(() => {
            isEnglish = !isEnglish;
            ['r1-text', 'r2-text', 'r3-text'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.dataset.language = "";
            });
            if (window.currentData) buildRows(window.currentData);
        }, 18000);

        setInterval(() => {
            const logoBox = document.getElementById('logo-container');
            if (logoBox && !logoBox.classList.contains('hidden')) {
                logoBox.classList.add('animate-slow-spin');
                setTimeout(() => logoBox.classList.remove('animate-slow-spin'), 2200);
            }
        }, 15000);

        setInterval(() => {
            const d = window.currentData;
            if (!d) return;
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "ਟੀਮ 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "ਟੀਮ 2");
        }, 2000);

        const wm = document.getElementById('single-wm');
        let x = 200, y = 200, dx = 1.8, dy = 1.4;
        function animateWatermark() {
            const maxX = 1920 - wm.offsetWidth - 50;
            const maxY = 850 - wm.offsetHeight;
            x += dx;
            y += dy;
            if (x <= 50 || x >= maxX) dx *= -1;
            if (y <= 120 || y >= maxY) dy *= -1;
            wm.style.left = x + 'px';
            wm.style.top = y + 'px';
            requestAnimationFrame(animateWatermark);
        }
        animateWatermark();
    </script>
</body>
</html>
