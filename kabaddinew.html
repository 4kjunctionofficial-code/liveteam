<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Sports 1 - Dual Admin Overlay & Ticker</title>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            user-select: none;
            text-transform: uppercase;
            transform-origin: top left;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* =========================================================
            SCOREBOARD (KABADDI SPORTS 1 GOLD + ROYAL BLUE)
        ========================================================= */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #top-scoreboard-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 75px;
            border-radius: 8px;
            overflow: hidden;
            border: 2.5px solid #ffd000;
            transform: skewX(16deg);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.75);
        }

        .unskew {
            transform: skewX(-16deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .score-a {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .team-a-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .vs-divider {
            width: 12px;
            background: #090909;
            border-left: 1.5px solid #ffd000;
            border-right: 1.5px solid #ffd000;
        }

        .team-b-panel {
            background: linear-gradient(180deg, #1b78ff 0%, #0047cc 60%, #002773 100%);
            color: #ffffff;
            font-size: 38px;
            font-weight: 800;
            padding: 0 46px;
            white-space: nowrap;
            min-width: 180px;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.7);
        }

        .score-b {
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 65%, #c98600 100%);
            color: #090909;
            font-size: 58px;
            font-weight: 900;
            padding: 0 38px;
            font-family: 'Bebas Neue', sans-serif;
        }

        #match-details-strip {
            background: linear-gradient(90deg, #002b80 0%, #0055ff 50%, #002b80 100%);
            color: #ffe24a;
            font-size: 24px;
            font-weight: 800;
            padding: 6px 40px;
            margin-top: 8px;
            border-radius: 6px;
            letter-spacing: 2px;
            border: 1.5px solid #ffd000;
            transform: skewX(16deg);
            margin-right: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.65);
        }

        #match-details-strip.hidden {
            display: none;
        }

        /* =========================================================
            LOGO
        ========================================================= */
        #logo-container {
            position: absolute;
            top: 25px;
            left: 30px;
            z-index: 9999;
            display: flex;
            align-items: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            opacity: 1;
            transform: scale(1) rotate(0deg);
            will-change: transform;
        }

        #logo-container.hidden {
            opacity: 0;
            transform: scale(0.3) translateY(-40px) rotate(-360deg);
        }

        #logo-container.animate-slow-spin {
            animation: logoSlowSpin 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes logoSlowSpin {
            0% { transform: scale(1) rotate(0deg); }
            50% { filter: drop-shadow(0 0 20px rgba(255, 208, 0, 0.95)); }
            100% { transform: scale(1) rotate(360deg); }
        }

        #main-logo {
            height: 100px;
            width: auto;
            object-fit: contain;
        }

        /* =========================================================
            WATERMARK
        ========================================================= */
        #single-wm {
            position: absolute;
            left: 300px;
            top: 300px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 50px;
            font-weight: bold;
            color: #ffffff;
            opacity: 0.45;
            letter-spacing: 3px;
            pointer-events: none;
        }

        /* =========================================================
            BROADCAST TICKER (KABADDI SPORTS 1 COLOR MATCH)
        ========================================================= */
        #ticker-wrap {
            position: absolute;
            bottom: 36px;
            left: 0;
            width: 1920px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.8));
            transition: opacity 0.4s ease;
        }

        #ticker-wrap.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Upper Tier: Gold/Black Skewed Badge + Gold Track */
        .upper-tier {
            position: relative;
            display: flex;
            align-items: center;
            height: 56px;
            width: 100%;
            z-index: 2;
        }

        .gold-badge-skew {
            position: relative;
            z-index: 3;
            height: 56px;
            min-width: 640px;
            max-width: 790px;
            background: linear-gradient(180deg, #ffe24a 0%, #f5b400 58%, #c98600 100%);
            border: 3.5px solid #090909;
            border-left: none;
            transform: skewX(-24deg);
            margin-left: -14px;
            padding: 0 38px 0 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.6);
        }

        .gold-badge-unskew {
            transform: skewX(24deg);
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #090909;
            font-size: 31px;
            font-weight: 900;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }

        .gold-track {
            position: relative;
            flex: 1;
            height: 46px;
            background: linear-gradient(180deg, #ffd41f 0%, #f0a800 55%, #b87800 100%);
            border-top: 4px solid #080808;
            border-bottom: 4px solid #080808;
            display: flex;
            align-items: center;
            overflow: hidden;
            margin-left: -26px;
            padding-left: 34px;
        }

        .gold-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: #090909;
            font-size: 29px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        /* Lower Tier: Royal Blue Banner (Matches Logo Bottom Bar) */
        .lower-tier {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 44px;
            margin-top: -4px;
            background: linear-gradient(90deg, #001f66 0%, #0047cc 24%, #0066ff 50%, #0047cc 76%, #001a54 100%);
            border-top: 1.5px solid #ffd000;
            border-bottom: 2px solid #00123b;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding: 0 28px;
        }

        .lower-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
        }

        .star-accent {
            color: #ffe24a;
            font-weight: 900;
            margin: 0 12px;
            letter-spacing: 2px;
        }

        .match-vs-pill {
            display: inline-block;
            background: #090909;
            color: #ffe24a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 25px;
            padding: 0 9px;
            border-radius: 4px;
            margin: 0 6px;
            letter-spacing: 1px;
            vertical-align: middle;
            border: 1px solid rgba(255, 226, 74, 0.6);
        }

        /* =========================================================
            TEXT & MARQUEE ANIMATIONS
        ========================================================= */
        .anim-wrap {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            overflow: hidden;
        }

        .anim-center-in {
            animation: tickerFadeSlide 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes tickerFadeSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .anim-wrap.marquee-mode {
            justify-content: flex-start;
        }

        .anim-wrap.marquee-mode .ticker-text {
            display: inline-block;
            flex: 0 0 auto;
            width: max-content;
            white-space: nowrap;
            will-change: transform;
            animation: tickerMarquee var(--marquee-duration, 16s) linear infinite;
        }

        @keyframes tickerMarquee {
            0% { transform: translateX(0); }
            10% { transform: translateX(0); }
            100% { transform: translateX(calc(-1 * var(--scroll-distance, 120px))); }
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <div id="logo-container" class="hidden">
        <img id="main-logo" src="" alt="Logo">
    </div>

    <!-- WATERMARK -->
    <div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

    <!-- SCOREBOARD -->
    <div id="top-scoreboard-container">
        <div id="main-score-strip">
            <div class="score-a"><div class="unskew" id="sA">0</div></div>
            <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>
            <div class="vs-divider"><div class="unskew"></div></div>
            <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
            <div class="score-b"><div class="unskew" id="sB">0</div></div>
        </div>
        <div id="match-details-strip" class="hidden">
            <div class="unskew" id="match-round"></div>
        </div>
    </div>

    <!-- BROADCAST TICKER -->
    <div id="ticker-wrap">
        <div class="upper-tier">
            <!-- Left Skewed Gold Badge: Admin Row 3 Update -->
            <div class="gold-badge-skew">
                <div class="gold-badge-unskew">
                    <div id="badge-row3-update" class="anim-wrap"></div>
                </div>
            </div>

            <!-- Gold Track: Winner Match -->
            <div class="gold-track">
                <div class="gold-content">
                    <div id="winner-match-ticker" class="anim-wrap"></div>
                </div>
            </div>
        </div>

        <!-- Bottom Royal Blue Banner: Match List & Info -->
        <div class="lower-tier">
            <div class="lower-content">
                <div id="match-list-ticker" class="anim-wrap"></div>
            </div>
        </div>
    </div>

    <script>
        function autoResizeOverlay() {
            const baseWidth = 1920;
            const baseHeight = 1080;
            const scale = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
            document.body.style.transform = `scale(${scale})`;
            document.body.style.width = `${baseWidth}px`;
            document.body.style.height = `${baseHeight}px`;
        }

        window.addEventListener('resize', autoResizeOverlay);
        window.addEventListener('load', autoResizeOverlay);
        autoResizeOverlay();

        const firebaseConfig = {
            databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);

        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id') || 'defaultMatch';

        const db = firebase.database().ref("matchData/" + matchId);
        const userDb = firebase.database().ref("users/" + matchId);

        userDb.on("value", (snap) => {
            const user = snap.val();
            if (user && user.expiryDate && Date.now() > new Date(user.expiryDate).getTime()) {
                document.body.innerHTML = `
                    <div style="width:100vw;height:100vh;display:flex;justify-content:center;align-items:center;background:black;color:white;font-size:50px;text-align:center;">
                        🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ<br>ਹੈਲਪ ਲਾਈਨ: ਮਨਪ੍ਰੀਤ ਮੁਦਕੀ<br>9115426711
                    </div>
                `;
            }
        });

        const clientLogos = {
            "mudki1": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/kabaddisports1.png"
        };

        const dict = {
            "Kabaddi": "ਕਬੱਡੀ",
            "Open": "ਓਪਨ",
            "Quarter Final": "ਕੁਆਰਟਰ ਫਾਈਨਲ",
            "Semi Final": "ਸੈਮੀ ਫਾਈਨਲ",
            "Final": "ਫਾਈਨਲ",
            "1st Round": "ਪਹਿਲਾ ਰਾਊਂਡ",
            "2nd Round": "ਦੂਜਾ ਰਾਊਂਡ",
            "3rd Round": "ਤੀਜਾ ਰਾਊਂਡ",
            "4th Round": "ਚੌਥਾ ਰਾਊਂਡ",
            "Pool A": "ਪੂਲ ਏ",
            "Pool B": "ਪੂਲ ਬੀ",
            "Winner": "ਵਿੰਨਰ"
        };

        function translateToPunjabi(text) {
            if (!text) return "";
            let translated = String(text).trim();
            for (let key in dict) {
                let regex = new RegExp(key, 'gi');
                translated = translated.replace(regex, dict[key]);
            }
            return translated.replace(/KG/gi, "ਕਿਲੋ");
        }

        function normalizeArray(value) {
            if (Array.isArray(value)) {
                return value.filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            if (value && typeof value === "object") {
                return Object.values(value).filter(item => item !== null && item !== undefined && String(item).trim() !== "");
            }
            return [];
        }

        function formatMatchString(m, index, isEnglishMode) {
            m = String(m || "").trim();
            let bracketContent = "";
            let teamPart = m;

            if (m.startsWith("(")) {
                const closeIdx = m.indexOf(")");
                if (closeIdx !== -1) {
                    bracketContent = m.substring(1, closeIdx).trim();
                    teamPart = m.substring(closeIdx + 1).trim();
                }
            }

            const tms = teamPart.split(/\s+VS\s+/i);
            const t1Parts = (tms[0] || "").trim().split("=");
            const t2Parts = (tms[1] || "").trim().split("=");

            const t1En = (t1Parts[0] || "").trim();
            const t2En = (t2Parts[0] || "").trim();
            const t1Pa = translateToPunjabi((t1Parts[1] || t1Parts[0] || "").trim());
            const t2Pa = translateToPunjabi((t2Parts[1] || t2Parts[0] || "").trim());

            const tagPa = translateToPunjabi(bracketContent) ? `(${translateToPunjabi(bracketContent)}) ` : "";
            const tagEn = bracketContent ? `(${bracketContent}) ` : "";
            const num = `${index + 1}. `;

            if (isEnglishMode) {
                return `${num}${tagEn}${t1En} <span class="match-vs-pill">VS</span> ${t2En}`;
            }
            return `${num}${tagPa}${t1Pa} <span class="match-vs-pill">ਬਨਾਮ</span> ${t2Pa}`;
        }

        let row3Updates = [];
        let winnerMatchItems = [];
        let matchListItems = [];

        let r3Idx = 0;
        let winIdx = 0;
        let listIdx = 0;

        let isEnglish = false;
        let lastSignature = "";

        function buildTickerData(data) {
            // 1. Admin Row 3 update (compatible with both Admin 1 & Admin 2)
            row3Updates = [];
            const r3Pa = (data.row3Txt_pa || data.row3Txt || "").trim();
            const r3En = (data.row3Txt || data.row3Txt_pa || "").trim();

            if (r3Pa || r3En) {
                row3Updates.push({
                    pa: `** ${translateToPunjabi(r3Pa)}`,
                    en: `** ${r3En}`
                });
            }

            if (data.programTxt || data.programTxt_pa) {
                row3Updates.push({
                    pa: `** ${translateToPunjabi(data.programTxt_pa || data.programTxt)}`,
                    en: `** ${data.programTxt || data.programTxt_pa}`
                });
            }

            if (data.row1Txt) {
                row3Updates.push({
                    pa: `** ${translateToPunjabi(data.row1Txt_pa || data.row1Txt)}`,
                    en: `** ${data.row1Txt}`
                });
            }

            if (row3Updates.length === 0) {
                row3Updates.push({
                    pa: "** ਕਬੱਡੀ ਸਪੋਰਟਸ 1 ਲਾਈਵ",
                    en: "** KABADDI SPORTS 1 LIVE"
                });
            }

            // 2. Match List & Winner Match (from nextMatches, qualifiedTeams, or row5Txt/row5Txt_pa)
            const rawMatches = normalizeArray(data.nextMatches);
            winnerMatchItems = [];
            matchListItems = [];

            if (rawMatches.length > 0) {
                const explicitWinners = [];
                const normalMatches = [];

                rawMatches.forEach((mStr, idx) => {
                    const isWin = /winner|ਵਿੰਨਰ/i.test(String(mStr));
                    const paStr = formatMatchString(mStr, idx, false);
                    const enStr = formatMatchString(mStr, idx, true);
                    if (isWin) {
                        explicitWinners.push({ pa: paStr, en: enStr });
                    } else {
                        normalMatches.push({ pa: paStr, en: enStr });
                    }
                });

                if (explicitWinners.length > 0) {
                    winnerMatchItems = explicitWinners.map(w => ({
                        pa: `ਵਿੰਨਰ ਮੈਚ: ${w.pa}`,
                        en: `WINNER MATCH: ${w.en}`
                    }));
                } else if (data.qualifiedTeams) {
                    const qText = String(data.qualifiedTeams).replace(/\n+/g, " • ");
                    winnerMatchItems.push({
                        pa: `ਵਿੰਨਰ / ਕੁਆਲੀਫਾਈਡ: ${translateToPunjabi(qText)}`,
                        en: `WINNER / QUALIFIED: ${qText}`
                    });
                } else {
                    winnerMatchItems = [{
                        pa: `ਵਿੰਨਰ ਮੈਚ: ${normalMatches[0].pa}`,
                        en: `WINNER MATCH: ${normalMatches[0].en}`
                    }];
                }

                const listSource = normalMatches.length > 0 ? normalMatches : explicitWinners;
                const combinedPa = listSource.map(x => x.pa).join(` <span class="star-accent">******</span> `);
                const combinedEn = listSource.map(x => x.en).join(` <span class="star-accent">******</span> `);

                matchListItems.push({
                    pa: `<span class="star-accent">******</span> ਮੈਚ ਲਿਸਟ: ${combinedPa} <span class="star-accent">******</span>`,
                    en: `<span class="star-accent">******</span> MATCH LIST: ${combinedEn} <span class="star-accent">******</span>`
                });
            } else if (data.row5Txt || data.row5Txt_pa) {
                const mPa = (data.row5Txt_pa || data.row5Txt || "").trim();
                const mEn = (data.row5Txt || data.row5Txt_pa || "").trim();
                winnerMatchItems.push({
                    pa: `ਵਿੰਨਰ ਮੈਚ: ${translateToPunjabi(mPa.split(",")[0] || mPa)}`,
                    en: `WINNER MATCH: ${mEn.split(",")[0] || mEn}`
                });
                matchListItems.push({
                    pa: `<span class="star-accent">******</span> ਮੈਚ ਲਿਸਟ: ${translateToPunjabi(mPa)} <span class="star-accent">******</span>`,
                    en: `<span class="star-accent">******</span> MATCH LIST: ${mEn} <span class="star-accent">******</span>`
                });
            } else {
                winnerMatchItems.push({
                    pa: "ਵਿੰਨਰ ਮੈਚ: ਜਲਦ ਆ ਰਿਹਾ ਹੈ",
                    en: "WINNER MATCH: COMING SOON"
                });
                matchListItems.push({
                    pa: `<span class="star-accent">******</span> ਮੈਚ ਲਿਸਟ ਅੱਪਡੇਟ ਹੋ ਰਹੀ ਹੈ <span class="star-accent">******</span>`,
                    en: `<span class="star-accent">******</span> MATCH LIST UPDATING <span class="star-accent">******</span>`
                });
            }

            if (data.resultText && data.resultText !== "No Result Yet") {
                matchListItems.push({
                    pa: `<span class="star-accent">******</span> ਨਤੀਜਾ: ${translateToPunjabi(data.resultText)} <span class="star-accent">******</span>`,
                    en: `<span class="star-accent">******</span> RESULT: ${data.resultText} <span class="star-accent">******</span>`
                });
            }

            const sig = JSON.stringify({
                r1: data.row1Txt,
                r1pa: data.row1Txt_pa,
                r2: data.row2Txt,
                r3: data.row3Txt,
                r3pa: data.row3Txt_pa,
                r5: data.row5Txt,
                r5pa: data.row5Txt_pa,
                prog: data.programTxt,
                progPa: data.programTxt_pa,
                qual: data.qualifiedTeams,
                res: data.resultText,
                matches: rawMatches
            });

            if (sig !== lastSignature) {
                lastSignature = sig;
                r3Idx = 0;
                winIdx = 0;
                listIdx = 0;
                ['badge-row3-update', 'winner-match-ticker', 'match-list-ticker'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.dataset.currentText = "";
                        el.dataset.language = "";
                    }
                });
            }

            renderTickerSlot('badge-row3-update', row3Updates[r3Idx % row3Updates.length]);
            renderTickerSlot('winner-match-ticker', winnerMatchItems[winIdx % winnerMatchItems.length]);
            renderTickerSlot('match-list-ticker', matchListItems[listIdx % matchListItems.length]);
        }

        function renderTickerSlot(elementId, item) {
            const el = document.getElementById(elementId);
            if (!el || !item) return;

            const textToShow = isEnglish ? item.en : item.pa;
            const langKey = String(isEnglish);

            if (el.dataset.currentText === textToShow && el.dataset.language === langKey) {
                return;
            }

            el.dataset.currentText = textToShow;
            el.dataset.language = langKey;
            el.className = "anim-wrap";
            el.innerHTML = "";
            el.style.removeProperty("--marquee-duration");
            el.style.removeProperty("--scroll-distance");

            const span = document.createElement("span");
            span.className = "ticker-text";
            span.innerHTML = textToShow;
            el.appendChild(span);

            requestAnimationFrame(() => {
                const boxWidth = el.clientWidth;
                const textWidth = span.scrollWidth;

                if (textWidth > boxWidth - 16) {
                    const distance = textWidth - boxWidth + 36;
                    const duration = Math.max(10, distance / 60 + 2);
                    el.classList.add("marquee-mode");
                    el.style.setProperty("--scroll-distance", `${distance}px`);
                    el.style.setProperty("--marquee-duration", `${duration}s`);
                    span.style.animation = "none";
                    void span.offsetWidth;
                    span.style.animation = `tickerMarquee ${duration}s linear infinite`;
                } else {
                    el.classList.add("anim-center-in");
                }
            });
        }

        db.on("value", (snap) => {
            const data = snap.val() || {};
            window.currentData = data;

            const logoCont = document.getElementById('logo-container');
            const logoKey = matchId.trim().toLowerCase();

            if (clientLogos[logoKey] && data.logoVisible !== false) {
                document.getElementById('main-logo').src = clientLogos[logoKey];
                logoCont.classList.remove('hidden');
            } else {
                logoCont.classList.add('hidden');
            }

            document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
            document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);

            const roundText = data.round || "";
            const detailsStrip = document.getElementById('match-details-strip');
            if (String(roundText).trim() === "") {
                detailsStrip.classList.add('hidden');
            } else {
                detailsStrip.classList.remove('hidden');
                document.getElementById('match-round').innerText = translateToPunjabi(roundText);
            }

            document.getElementById('sA').innerText = data.scoreA ?? "0";
            document.getElementById('sB').innerText = data.scoreB ?? "0";
            document.getElementById('single-wm').innerText = data.watermarkTxt || "ਐੱਮ ਲਾਈਵ";

            buildTickerData(data);
        });

        setInterval(() => {
            r3Idx++;
            winIdx++;
            listIdx++;
            if (window.currentData) buildTickerData(window.currentData);
        }, 10000);

        setInterval(() => {
            isEnglish = !isEnglish;
            ['badge-row3-update', 'winner-match-ticker', 'match-list-ticker'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.dataset.language = "";
            });
            if (window.currentData) buildTickerData(window.currentData);
        }, 18000);

        setInterval(() => {
            const logoBox = document.getElementById('logo-container');
            if (logoBox && !logoBox.classList.contains('hidden')) {
                logoBox.classList.add('animate-slow-spin');
                setTimeout(() => logoBox.classList.remove('animate-slow-spin'), 2200);
            }
        }, 15000);

        setInterval(() => {
            const d = window.currentData;
            if (!d) return;
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "ਟੀਮ 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "ਟੀਮ 2");
        }, 2000);

        const wm = document.getElementById('single-wm');
        let x = 200, y = 200, dx = 1.8, dy = 1.4;
        function animateWatermark() {
            const maxX = 1920 - wm.offsetWidth - 50;
            const maxY = 880 - wm.offsetHeight;
            x += dx;
            y += dy;
            if (x <= 50 || x >= maxX) dx *= -1;
            if (y <= 120 || y >= maxY) dy *= -1;
            wm.style.left = x + 'px';
            wm.style.top = y + 'px';
            requestAnimationFrame(animateWatermark);
        }
        animateWatermark();
    </script>
</body>
</html>
