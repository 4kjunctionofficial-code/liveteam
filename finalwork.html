<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: transparent; font-family: 'Arial', sans-serif; overflow: hidden; position: relative; }
        
        /* WhatsApp Bar */
        .whatsapp-bar { position: absolute; bottom: 165px; left: 10px; display: flex; align-items: center; background: #000000; color: #ffffff; padding: 6px 18px 6px 45px; border-radius: 25px; font-size: 22px; font-weight: bold; z-index: 9999; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .whatsapp-icon { position: absolute; left: -2px; width: 44px; height: 44px; background: #e60000; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .whatsapp-icon svg { width: 24px; height: 24px; fill: white; }

        /* Logo */
        #logo-container { position: absolute; top: 30px; left: 40px; z-index: 9999; opacity: 1; transition: all 0.7s ease; }
        #logo-container.hidden { opacity: 0; transform: scale(0); }
        #main-logo { height: 100px; width: auto; max-width: 450px; object-fit: contain; filter: drop-shadow(1px 2px 4px rgba(0,0,0,0.3)); }

        /* Floating Watermark */
        #single-wm { position: absolute; color: rgba(255, 255, 255, 0.7); font-size: 35px; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 5px #000; white-space: nowrap; z-index: 1; opacity: 1; }

        /* SCOREBOARD BACKGROUND (Locked to 1920x1080) */
        #scoreboard { 
            position: absolute; 
            top: 0px; 
            left: 0px; 
            width: 1920px; 
            height: 1080px; 
            z-index: 9999; opacity: 1; transition: opacity 0.7s ease;
            background-image: url('https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/101%20score%20png.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        #scoreboard.hidden { opacity: 0; }

        /* TEXT POSITIONING INSIDE SCOREBOARD */
        .name-area { position: absolute; top: 32px; height: 50px; display: flex; align-items: center; color: #ffffff; font-size: 32px; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 4px #000; overflow: hidden; white-space: nowrap; z-index: 11; }
        #nA-container { left: 1030px; width: 310px; justify-content: flex-end; }
        #nB-container { left: 1560px; width: 310px; justify-content: flex-start; }
        
        .score-box { position: absolute; top: 32px; height: 50px; width: 60px; display: flex; align-items: center; justify-content: center; font-size: 45px; font-weight: 900; color: #e60000; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); z-index: 12; }
        #sA { left: 1355px; } 
        #sB { left: 1485px; } 

        .round-display { position: absolute; top: 88px; left: 1450px; transform: translateX(-50%); color: white; font-size: 20px; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 6px #000; letter-spacing: 2px; z-index: 11; }

        .team-scroller { display: inline-block; padding-left: 100%; animation: team-scroll 8s linear infinite; }
        @keyframes team-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* TICKER BACKGROUND (Locked to 1920x1080) */
        #ticker-wrap { 
            position: absolute; bottom: 0px; left: 0px; width: 1920px; height: 1080px; 
            z-index: 9998; opacity: 1; transition: opacity 0.7s ease;
            background-image: url('https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Copy%20of%20Star%20Kabaddi%20_20260711_110521_0000.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        #ticker-wrap.hidden { opacity: 0; }

        /* TICKER 4 ROWS POSITIONING */
        .row-text { position: absolute; display: flex; align-items: center; font-weight: bold; text-transform: uppercase; overflow: hidden; box-sizing: border-box; white-space: nowrap; padding-left: 10px; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .row-1 { bottom: 67px; left: 210px; width: 350px; height: 35px; font-size: 40px; color: #ffffff; }
        .row-2 { bottom: 64px; left: 587px; width: 815px; height: 35px; font-size: 40px; color: #000000; text-shadow: none; }
        .row-3 { bottom: 60px; left: 1425px; width: 550px; height: 35px; font-size: 40px; color: #ffffff; }
        .row-4 { bottom: 6px; left: 200px; width: 1730px; height: 28px; font-size: 40px; color: #ffffff; }
        .scroller{ display:inline-block; white-space:nowrap; position:relative; will-change:transform; }

        /* DATE & TIME */
        .box-time { position: absolute; bottom: 1px; left: 3px; width: 190px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 12; overflow: hidden; }
        .time-wrap, .date-wrap { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; transition: opacity 0.3s ease-in-out; font-weight: bold; }
        .time-str, .date-str { color: #ffffff; font-size: 26px; letter-spacing: 1px; text-shadow: 2px 2px 5px #000; }
    </style>
</head>
<body>

<div class="whatsapp-bar">
    <div class="whatsapp-icon"><svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.405.003 12.022.003c3.201.001 6.212 1.244 8.477 3.513 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.35 12.002-11.97 12.002-2.012-.002-3.992-.501-5.756-1.451L0 24zm6.59-4.846c1.6.95 3.188 1.449 4.825 1.451 5.436 0 9.86-4.37 9.864-9.742.002-2.602-1.01-5.05-2.85-6.893-1.839-1.84-4.287-2.853-6.89-2.854-5.441 0-9.865 4.37-9.869 9.745-.001 1.706.469 3.374 1.359 4.848l-.993 3.626 3.754-.981zM17.48 14.86c-.29-.145-1.714-.846-1.98-.942-.264-.096-.457-.145-.648.145-.19.29-.738.942-.905 1.134-.167.19-.334.212-.623.067-.29-.145-1.223-.45-2.33-1.44-.863-.77-1.445-1.72-1.614-2.012-.17-.29-.018-.447.127-.592.13-.13.29-.335.434-.503.144-.167.192-.28.29-.466.096-.186.047-.35-.024-.495-.072-.145-.648-1.56-.888-2.137-.233-.56-.47-.483-.648-.492-.167-.008-.36-.01-.553-.01-.193 0-.507.073-.77.361-.264.288-1.01.987-1.01 2.407s1.033 2.795 1.178 2.99c.145.19 2.032 3.102 4.922 4.35.688.298 1.224.475 1.643.607.692.22 1.323.19 1.82.115.553-.083 1.714-.7 1.958-1.376.244-.677.244-1.255.172-1.376-.073-.12-.265-.193-.554-.338z"/></svg></div>
    +91 74007 35730
</div>

<div id="logo-container" class="hidden">
    <img id="main-logo" src="" alt="Logo">
</div>

<div id="single-wm">M LIVE</div>

<!-- Scoreboard with Background Image -->
<div id="scoreboard">
    <div class="name-area" id="nA-container"><div id="nA" style="width:100%; text-align:right;">TEAM 1</div></div>
    <div class="score-box" id="sA">0</div>
    <div class="score-box" id="sB">0</div>
    <div class="name-area" id="nB-container"><div id="nB" style="width:100%; text-align:left;">TEAM 2</div></div>
    <div class="round-display" id="round-display">LIVE MATCH</div>
</div>

<!-- Ticker with Background Image -->
<div id="ticker-wrap">
    <!-- 4 Ticker Rows -->
    <div class="row-text row-1" id="c1">WELCOME TO LIVE KABADDI</div>
    <div class="row-text row-2" id="c2">SUBSCRIBE OUR CHANNEL</div>
    <div class="row-text row-3" id="c3">LIKE & SHARE</div>
    <div class="row-text row-4" id="c4">KEEP WATCHING</div> 

    <!-- Date & Time Flashing -->
    <div class="box-time">
        <div class="time-wrap" id="t-wrap"><div class="time-str" id="live-time"></div></div>
        <div class="date-wrap" id="d-wrap" style="opacity:0;"><div class="date-str" id="live-date"></div></div>
    </div>
</div>

<script>
    // --- FIREBASE SCRIPT ---
    const firebaseConfig = { databaseURL: "https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);

    const clientLogos = {
        "test": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png"
    };

    let tickerInitialized = false;

    db.on("value", (snap) => {
        const data = snap.val() || {}; 
        const logoCont = document.getElementById('logo-container');
        const currentId = matchId.trim().toLowerCase();

        // Logo visibility
        if (clientLogos[currentId] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[currentId];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        // Display Scoreboard and Ticker based on Database values
        document.getElementById('scoreboard').classList.toggle('hidden', data.scoreVisible === false);
        const tickerWrap = document.getElementById('ticker-wrap');
        const whatsappBar = document.querySelector('.whatsapp-bar');
        tickerWrap.classList.toggle('hidden', data.tickerVisible === false);
        whatsappBar.style.display = (data.tickerVisible === false) ? 'none' : 'flex';
        
        // Match Data
        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        setTeamName('nA-container', data.nameA || "TEAM 1");
        setTeamName('nB-container', data.nameB || "TEAM 2");
        document.getElementById('single-wm').innerText = data.watermarkTxt || "M LIVE";
        
        const roundEl = document.getElementById('round-display');
        roundEl.innerText = data.round || "";
        roundEl.style.display = (data.round || "").trim() === "" ? "none" : "block";
        
        // Ticker Lines
        updateTickerContent('c1', data.row1Txt || "WELCOME TO LIVE KABADDI");
        updateTickerContent('c2', data.row2Txt || "SUBSCRIBE OUR CHANNEL");
        updateTickerContent('c3', data.row3Txt || "LIKE & SHARE");
        updateTickerContent('c4', data.row4Txt || "THANKS FOR WATCHING");

        if (!tickerInitialized) {
            startTicker('c1', 1.4);
            startTicker('c2', 2.0);
            startTicker('c3', 1.7);
            startTicker('c4', 1.9);
            tickerInitialized = true;
        }
    });

    function setTeamName(containerId, txt) {
        const el = document.getElementById(containerId);
        let alignment = containerId === 'nA-container' ? 'right' : 'left';
        el.innerHTML = txt.length > 15 ? `<div class="team-scroller">${txt}</div>` : `<div style="width:100%; text-align:${alignment};">${txt}</div>`;
    }

    function updateTickerContent(id, txt) {
        const el = document.getElementById(id);
        const scroller = el.querySelector('.scroller');
        if (scroller) {
            scroller.innerHTML = `${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}`;
        } else {
            el.innerHTML = `<div class="scroller">${txt}&nbsp;&nbsp; • &nbsp;&nbsp; ${txt}</div>`;
        }
    }

    function startTicker(id, speed) {
        const el = document.getElementById(id);
        const scroller = el.querySelector('.scroller');
        let x = el.offsetWidth;

        function animate() {
            x -= speed;
            if (x < -scroller.offsetWidth) x = el.offsetWidth;
            scroller.style.transform = `translateX(${x}px)`;
            requestAnimationFrame(animate);
        }
        animate();
    }

    // Flash Date & Time Functions
    function updateClock() {
        const now = new Date();
        document.getElementById('live-time').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        document.getElementById('live-date').innerText = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    // Toggle Time & Date every 3 seconds
    let isTime = true;
    setInterval(() => { 
        isTime = !isTime; 
        document.getElementById('t-wrap').style.opacity = isTime ? "1" : "0"; 
        document.getElementById('d-wrap').style.opacity = isTime ? "0" : "1"; 
    }, 3000);

    // Floating Watermark
    const wmEl = document.getElementById('single-wm');
    function moveWM() { wmEl.style.left = (Math.random() * 1400 + 100) + 'px'; wmEl.style.top = (Math.random() * 600 + 150) + 'px'; }
    moveWM(); setInterval(moveWM, 6000);
</script>
</body>
</html>
