<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Ultra HD - Smart Event Ticker</title>

<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@800;900&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    width:1920px;height:1080px;background:transparent;
    font-family:'Noto Sans Gurmukhi','Mukta',Arial,sans-serif;
    overflow:hidden;position:absolute;top:0;left:0;user-select:none;
    text-transform:uppercase;transform-origin:top left;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}

/* SCOREBOARD */
#top-scoreboard-container{
    position:absolute;top:35px;right:45px;display:flex;
    flex-direction:column;align-items:flex-end;z-index:9999;
    transition:opacity .5s ease
}
#top-scoreboard-container.hidden{opacity:0}

#main-score-strip{
    display:flex;align-items:stretch;height:75px;border-radius:8px;
    overflow:hidden;border:2.5px solid rgba(255,255,255,.9);
    transform:skewX(16deg);box-shadow:0 8px 25px rgba(0,0,0,.7)
}
.unskew{
    transform:skewX(-16deg);display:flex;align-items:center;
    justify-content:center;width:100%;height:100%
}
.score-a{
    background:linear-gradient(135deg,#0066cc,#0099ff);color:#fff;
    font-size:58px;font-weight:900;padding:0 38px;font-family:'Bebas Neue',sans-serif
}
.team-a-panel{
    background:linear-gradient(135deg,#1a8cff,#4da6ff);color:#fff;
    font-size:38px;font-weight:800;padding:0 50px;white-space:nowrap;
    min-width:180px;letter-spacing:1.5px
}
.vs-divider{width:12px;background:#111}
.team-b-panel{
    background:linear-gradient(135deg,#1f1f1f,#2e2e2e);color:#fff;
    font-size:38px;font-weight:800;padding:0 50px;white-space:nowrap;
    min-width:180px;letter-spacing:1.5px
}
.score-b{
    background:linear-gradient(135deg,#0a0a0a,#1a1a1a);color:#ffcc00;
    font-size:58px;font-weight:900;padding:0 38px;font-family:'Bebas Neue',sans-serif
}
#match-details-strip{
    background:rgba(0,0,0,.95);color:#ffcc00;font-size:24px;font-weight:800;
    padding:6px 40px;margin-top:8px;border-radius:6px;letter-spacing:2.5px;
    border:1.5px solid rgba(255,204,0,.6);transform:skewX(16deg);
    margin-right:25px;box-shadow:0 5px 15px rgba(0,0,0,.6)
}
#match-details-strip.hidden{display:none}

/* LOGO / WATERMARK */
#logo-container{
    position:absolute;top:25px;left:30px;z-index:9999;display:flex;
    align-items:center;transition:opacity .6s ease,transform .6s ease;
    opacity:1;transform:scale(1) rotate(0deg);will-change:transform
}
#logo-container.hidden{opacity:0;transform:scale(.3) translateY(-40px) rotate(-360deg)}
#logo-container.animate-slow-spin{
    animation:logoSlowSpin 2.2s cubic-bezier(.4,0,.2,1) forwards
}
@keyframes logoSlowSpin{
    0%{transform:scale(1) rotate(0deg)}
    50%{filter:drop-shadow(0 0 20px rgba(51,153,255,.9))}
    100%{transform:scale(1) rotate(360deg)}
}
#main-logo{height:100px;width:auto;object-fit:contain}

#single-wm{
    position:absolute;left:300px;top:300px;font-family:'Bebas Neue',sans-serif;
    font-size:50px;font-weight:bold;color:#fff;opacity:.45;letter-spacing:3px;
    pointer-events:none
}

/* TICKER */
#ticker-wrap{
    position:absolute;bottom:0;left:0;width:1920px;z-index:9998;
    display:flex;flex-direction:column;transition:opacity .5s ease;
    box-shadow:0 -5px 25px rgba(0,0,0,.8)
}
#ticker-wrap.hidden{opacity:0}
.ticker-strip{display:flex;width:100%;height:60px}
.strip-top{
    background:linear-gradient(90deg,#1a8cff,#3399ff,#1a8cff);
    border-bottom:2.5px solid rgba(0,0,0,.6)
}
.strip-bot{
    background:linear-gradient(90deg,#0d0d0d,#1a1a1a,#0d0d0d);
    border-top:1.5px solid rgba(255,255,255,.25)
}
.ticker-col{
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:33px;color:#fff!important;
    overflow:hidden;position:relative;letter-spacing:2px;padding:0 15px
}
.w-30{width:30%}
.w-40{
    width:40%;border-left:2.5px solid rgba(255,255,255,.35);
    border-right:2.5px solid rgba(255,255,255,.35);color:#fff!important
}

/* VILLAGE ICON */
.map-pin-icon{
    width:34px;height:34px;object-fit:contain;display:inline-block;
    vertical-align:middle;margin-right:10px;flex:none;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))
}

/* MATCH VS */
.match-vs-3d{
    color:#ffcc00;background:#111;padding:2px 12px;border-radius:6px;
    margin:0 10px;font-family:'Bebas Neue',sans-serif;font-size:32px;
    letter-spacing:2px;display:inline-block;transform:translateY(-2px)
}

/* ALL TICKER LINES USE SAME ANIMATION SYSTEM */
.anim-line{
    position:absolute;left:0;top:0;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;white-space:nowrap;opacity:1;
    will-change:transform,opacity
}
.anim-line .line-content{
    display:inline-flex;align-items:center;white-space:nowrap;
    width:max-content;max-width:none;flex:none
}

/* normal item */
.anim-enter{
    animation:lineEnter .55s cubic-bezier(.22,1,.36,1) both
}
@keyframes lineEnter{
    0%{opacity:0;transform:translateY(22px) scale(.94)}
    100%{opacity:1;transform:translateY(0) scale(1)}
}

/* horizontal scroll - ONE COPY ONLY, NO DUPLICATE TEXT */
.anim-line.scrolling{
    justify-content:flex-start
}
.anim-line.scrolling .line-content{
    transform:translateX(28px);
    animation:lineScroll var(--scroll-duration,14s) linear 1 both;
    animation-delay:1.2s;
    will-change:transform
}
@keyframes lineScroll{
    0%{transform:translateX(28px)}
    100%{transform:translateX(calc(-1 * var(--scroll-distance,300px)))}
}

/* small fade before next item */
.line-switch{
    animation:switchFade .38s ease both
}
@keyframes switchFade{
    0%{opacity:.15;transform:translateY(-14px)}
    100%{opacity:1;transform:translateY(0)}
}

/* RESULT */
#result-popup{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);
    background:rgba(15,15,15,.98);border:6px solid #ffcc00;
    padding:50px 80px;border-radius:18px;color:#fff;text-align:center;
    z-index:100000;transition:all .6s cubic-bezier(.175,.885,.32,1.275);
    opacity:0;box-shadow:0 20px 60px rgba(0,0,0,.95)
}
#result-popup.show{transform:translate(-50%,-50%) scale(1);opacity:1}
.res-title{
    font-size:45px;color:#ffcc00;margin-bottom:15px;font-weight:900;
    border-bottom:2px solid rgba(255,204,0,.4);padding-bottom:8px;letter-spacing:2px
}
.res-text-pa{
    font-size:55px;font-weight:800;line-height:1.2;color:#fff;
    margin-bottom:10px;letter-spacing:1.5px
}
.res-text-en{
    font-size:45px;font-weight:800;line-height:1.2;color:#3399ff;
    letter-spacing:1.5px
}
</style>
</head>

<body>

<div id="logo-container" class="hidden">
    <img id="main-logo" src="" alt="Logo">
</div>

<div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

<div id="result-popup">
    <div class="res-title">🏆 ਮੈਚ ਨਤੀਜਾ / MATCH RESULT</div>
    <div class="res-text-pa" id="res-msg-pa">ਵਿਨਰ ਨਾਮ</div>
    <div class="res-text-en" id="res-msg-en">WINNER NAME</div>
</div>

<div id="top-scoreboard-container">
    <div id="main-score-strip">
        <div class="score-a"><div class="unskew" id="sA">0</div></div>
        <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>

        <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
        <div class="score-b"><div class="unskew" id="sB">0</div></div>
    </div>
    <div id="match-details-strip" class="hidden">
        <div class="unskew" id="match-round"></div>
    </div>
</div>

<div id="ticker-wrap">

    <div class="ticker-strip strip-top" id="strip-1">

        <div class="ticker-col w-30">
            <div id="s1-left" class="anim-line">
                <span class="line-content">📍</span>
            </div>
        </div>

        <div class="ticker-col w-40">
            <div id="s1-mid" class="anim-line">
                <span class="line-content">EVENT DETAILS</span>
            </div>
        </div>

        <div class="ticker-col w-30">
            <div id="s1-right" class="anim-line">
                <span class="line-content">ਆਉਣ ਵਾਲੇ ਮੇਲੇ</span>
            </div>
        </div>

    </div>

    <div class="ticker-strip strip-bot" id="strip-2" style="display:none;">

        <div class="ticker-col w-30">
            <div id="s2-left" class="anim-line">
                <span class="line-content">ਪਿੰਡ</span>
            </div>
        </div>

        <div class="ticker-col w-40">
            <div id="s2-mid" class="anim-line">
                <span class="line-content">ਲਾਈਵ ਮੈਚ</span>
            </div>
        </div>

        <div class="ticker-col w-30">
            <div id="s2-right" class="anim-line">
                <span class="line-content">ਵੇਰਵਾ</span>
            </div>
        </div>

    </div>
</div>

/* =========================================================
   AUTO RESIZE
========================================================= */
function autoResizeOverlay(){
    const baseWidth=1920,baseHeight=1080;
    const scaleX=window.innerWidth/baseWidth;
    const scaleY=window.innerHeight/baseHeight;
    const scale=Math.min(scaleX,scaleY);
    document.body.style.transform=`scale(${scale})`;
    document.body.style.width=`${baseWidth}px`;
    document.body.style.height=`${baseHeight}px`;
}
window.addEventListener('resize',autoResizeOverlay);
window.addEventListener('load',autoResizeOverlay);
autoResizeOverlay();

/* =========================================================
   FIREBASE
========================================================= */

    databaseURL:"https://my-scorebord-default-rtdb.firebaseio.com/"

            9115426711

});

  ਹੁਣ ਕੋਈ "KABADDI TOURNAMENT" hardcoded fallback ਨਹੀਂ ਹੈ.
*/
function getEventDetails(data){

    const possible=[
        {
            en:data.programTxt,
            pa:data.programTxt_pa
        },
        {
            en:data.eventName,
            pa:data.eventName_pa
        },
        {
            en:data.eventTitle,
            pa:data.eventTitle_pa
        },
        {
            en:data.eventDetails,
            pa:data.eventDetails_pa
        },
        {
            en:data.eventTxt,
            pa:data.eventTxt_pa
        }
    ];

    if(data.event && typeof data.event==="object"){
        possible.push(
            {en:data.event.name,pa:data.event.name_pa},
            {en:data.event.title,pa:data.event.title_pa},
            {en:data.event.details,pa:data.event.details_pa}
        );
    }

    for(const item of possible){
        const en=cleanText(item.en);
        const pa=cleanText(item.pa);

        if(en || pa){
            return {
                en:en || pa,
                pa:pa || en
            };
        }
    }

    return {
        en:"EVENT DETAILS NOT SET",
        pa:"ਇਵੈਂਟ ਵੇਰਵਾ ਸੈੱਟ ਨਹੀਂ"
    };
}

/* =========================================================
   PUNJABI TRANSLATION
========================================================= */
const dict={
    "Kabaddi":"ਕਬੱਡੀ",
    "Open":"ਓਪਨ",
    "Quarter Final":"ਕੁਆਰਟਰ ਫਾਈਨਲ",
    "Semi Final":"ਸੈਮੀ ਫਾਈਨਲ",
    "Final":"ਫਾਈਨਲ",
    "1st Round":"ਪਹਿਲਾ ਰਾਊਂਡ",
    "2nd Round":"ਦੂਜਾ ਰਾਊਂਡ",
    "3rd Round":"ਤੀਜਾ ਰਾਊਂਡ",
    "4th Round":"ਚੌਥਾ ਰਾਊਂਡ",
    "Pool A":"ਪੂਲ ਏ",
    "Pool B":"ਪੂਲ ਬੀ"
};

function translateToPunjabi(text){
    if(!text) return "";
    let translated=String(text).trim();

    for(const key in dict){
        const regex=new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
        translated=translated.replace(regex,dict[key]);
    }

    translated=translated.replace(/KG/gi,"ਕਿਲੋ");
    return translated;
}

/* =========================================================
   SAFE HTML
   Admin text is escaped before inserting into innerHTML.
   Match VS badge is allowed separately.
========================================================= */
function escapeHtml(value){
    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

/* =========================================================
   PARSE MATCH
========================================================= */
function parseMatchFull(m,index){

    m=cleanText(m);

    let bracketContent="";
    let teamPart=m;

    if(m.startsWith("(")){
        const closeIdx=m.indexOf(")");

        if(closeIdx!==-1){
            bracketContent=m.substring(1,closeIdx).trim();
            teamPart=m.substring(closeIdx+1).trim();
        }
    }

    const tms=teamPart.split(/\s+VS\s+/i);

    const t1Full=(tms[0]||"").trim();
    const t2Full=(tms[1]||"").trim();

    const t1Parts=t1Full.split("=");
    const t2Parts=t2Full.split("=");

    const t1En=cleanText(t1Parts[0]);
    const t1Pa=cleanText(t1Parts[1])||t1En;

    const t2En=cleanText(t2Parts[0]);
    const t2Pa=cleanText(t2Parts[1])||t2En;

    const bracketPa=translateToPunjabi(bracketContent);

    const tagPa=bracketPa?`(${escapeHtml(bracketPa)}) `:"";
    const tagEn=bracketContent?`(${escapeHtml(bracketContent)}) `:"";

    const numTag=`${index+1}. `;

    const vsHtmlPa=
        `<span class="match-vs-3d">ਬਨਾਮ</span>`;

    const vsHtmlEn=
        `<span class="match-vs-3d">VS</span>`;

    return{
        pa:
            `${numTag}${tagPa}`+
            `${escapeHtml(t1Pa)} ${vsHtmlPa} ${escapeHtml(t2Pa)}`,

        en:
            `${numTag}${tagEn}`+
            `${escapeHtml(t1En)} ${vsHtmlEn} ${escapeHtml(t2En)}`
    };
}

/* =========================================================
   BUILD ALL TICKER DATA
========================================================= */
function processTickerData(data){

    /* -------------------------
       EVENT DETAILS
       ------------------------- */
    const eventDetails=getEventDetails(data);

    /* -------------------------
       LEFT / VILLAGE
       ------------------------- */
    const vNameEn=cleanText(data.row1Txt)||"VILLAGE NAME";
    const vNamePa=cleanText(data.row1Txt_pa)||vNameEn;

    leftItems=[
        {
            topEn:mapPinHtml,
            topPa:mapPinHtml,

            botEn:escapeHtml(vNameEn),
            botPa:escapeHtml(vNamePa),

            singleEn:`${mapPinHtml}<span>${escapeHtml(vNameEn)}</span>`,
            singlePa:`${mapPinHtml}<span>${escapeHtml(vNamePa)}</span>`
        }
    ];

    /* -------------------------
       TOP CENTER
       IMPORTANT:
       "KABADDI TOURNAMENT" removed.
       Admin event/program text appears here.
       ------------------------- */
    topCenterItems=[
        {
            pa:escapeHtml(eventDetails.pa),
            en:escapeHtml(eventDetails.en)
        }
    ];

    if(data.resultText && data.resultText!=="No Result Yet"){
        const resText=cleanText(data.resultText);

        topCenterItems.push({
            pa:`ਪਿਛਲਾ ਨਤੀਜਾ: ${escapeHtml(translateToPunjabi(resText))}`,
            en:`LAST RESULT: ${escapeHtml(resText)}`
        });
    }

    if(data.pzOp1){
        topCenterItems.push({
            pa:`ਓਪਨ ਪਹਿਲਾ ਇਨਾਮ: ${escapeHtml(data.pzOp1)}`,
            en:`OPEN 1ST PRIZE: ${escapeHtml(data.pzOp1)}`
        });
    }

    if(data.pzOp2){
        topCenterItems.push({
            pa:`ਓਪਨ ਦੂਜਾ ਇਨਾਮ: ${escapeHtml(data.pzOp2)}`,
            en:`OPEN 2ND PRIZE: ${escapeHtml(data.pzOp2)}`
        });
    }

    if(data.pzOpBest){
        topCenterItems.push({
            pa:`ਓਪਨ ਬੈਸਟ ਖਿਡਾਰੀ: ${escapeHtml(data.pzOpBest)}`,
            en:`OPEN BEST PLAYER: ${escapeHtml(data.pzOpBest)}`
        });
    }

    const wKg=data.pzWtKg?cleanText(data.pzWtKg):"WEIGHT";
    const wKgPa=data.pzWtKg?
        translateToPunjabi(data.pzWtKg):
        "ਵਜ਼ਨੀ";

    if(data.pzWt1){
        topCenterItems.push({
            pa:`(${escapeHtml(wKgPa)}) ਪਹਿਲਾ ਇਨਾਮ: ${escapeHtml(data.pzWt1)}`,
            en:`(${escapeHtml(wKg)}) 1ST PRIZE: ${escapeHtml(data.pzWt1)}`
        });
    }

    if(data.pzWt2){
        topCenterItems.push({
            pa:`(${escapeHtml(wKgPa)}) ਦੂਜਾ ਇਨਾਮ: ${escapeHtml(data.pzWt2)}`,
            en:`(${escapeHtml(wKg)}) 2ND PRIZE: ${escapeHtml(data.pzWt2)}`
        });
    }

    if(data.pzWtBest){
        topCenterItems.push({
            pa:`(${escapeHtml(wKgPa)}) ਬੈਸਟ ਖਿਡਾਰੀ: ${escapeHtml(data.pzWtBest)}`,
            en:`(${escapeHtml(wKg)}) BEST PLAYER: ${escapeHtml(data.pzWtBest)}`
        });
    }

    /* -------------------------
       MATCH LIST
       ------------------------- */
    bottomCenterItems=[];

    const matchesList=toArray(data.nextMatches)
        .filter(x=>cleanText(x));

    hasMatches=matchesList.length>0;

    if(hasMatches){

        matchesList.forEach((mStr,idx)=>{

            const res=parseMatchFull(mStr,idx);

            bottomCenterItems.push({
                pa:res.pa,
                en:res.en
            });

        });

    }else{

        bottomCenterItems.push({
            pa:`📍 ${escapeHtml(vNamePa)}`,
            en:`📍 ${escapeHtml(vNameEn)}`
        });

    }

    /* -------------------------
       RIGHT SIDE
       ------------------------- */
    rightItems=[];

    const upcoming=toArray(data.upcomingEvents);

    upcoming.forEach(ev=>{

        if(!ev || typeof ev!=="object") return;

        const nameEn=cleanText(ev.name);
        const namePa=cleanText(ev.name_pa)||nameEn;
        const d=cleanText(ev.date)?` (${escapeHtml(ev.date)})`:"";

        if(!nameEn && !namePa) return;

        rightItems.push({
            topPa:"ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ",
            topEn:"UPCOMING EVENTS",

            botPa:`${escapeHtml(namePa)}${d}`,
            botEn:`${escapeHtml(nameEn||namePa)}${d}`,

            singlePa:
                `ਆਉਣ ਵਾਲੇ ਮੇਲੇ: ${escapeHtml(namePa)}${d}`,

            singleEn:
                `UPCOMING EVENTS: ${escapeHtml(nameEn||namePa)}${d}`
        });
    });

    if(data.row6Txt || data.row6Txt_pa){

        const liveEn=cleanText(data.row6Txt)||"LIVE STREAMING";
        const livePa=cleanText(data.row6Txt_pa)||liveEn;

        rightItems.push({
            topPa:"ਲਾਈਵ ਪ੍ਰਸਾਰਣ",
            topEn:"LIVE TELECAST",

            botPa:escapeHtml(livePa),
            botEn:escapeHtml(liveEn),

            singlePa:`ਲਾਈਵ ਪ੍ਰਸਾਰਣ: ${escapeHtml(livePa)}`,
            singleEn:`LIVE TELECAST: ${escapeHtml(liveEn)}`
        });
    }

    if(rightItems.length===0){

        rightItems.push({
            topPa:"ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ",
            topEn:"UPCOMING EVENTS",

            botPa:"ਦੇਖਦੇ ਰਹੋ",
            botEn:"STAY TUNED",

            singlePa:"ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ - ਦੇਖਦੇ ਰਹੋ",
            singleEn:"UPCOMING EVENTS - STAY TUNED"
        });
    }

    /* SHOW / HIDE SECOND STRIP */
    document.getElementById('strip-2').style.display=
        hasMatches?'flex':'none';

    /*
      Data change ਆਉਂਦੇ ਹੀ ਹਰ line ਨੂੰ fresh token ਮਿਲਦਾ ਹੈ.
      ਇਸ ਨਾਲ ਪੁਰਾਣੀ line ਅਟਕੀ ਨਹੀਂ ਰਹਿੰਦੀ.
    */
    renderIndependentTickers(true);
}

/* =========================================================
   ONE COMMON ANIMATION FOR EVERY LINE
   - Short text: center/vertical entry
   - Long text: one-line slow scroll
   - No duplicated text
   - Each line has its own timer
   - Next animation starts after 80% of scroll time
========================================================= */
function runTickerLine(elementId,textToShow,onDone){

    const el=document.getElementById(elementId);
    if(!el) return;

    if(lineTimers[elementId]){
        clearTimeout(lineTimers[elementId]);
        lineTimers[elementId]=null;
    }

    const token=(lineTokens[elementId]||0)+1;
    lineTokens[elementId]=token;

    el.className="anim-line";
    el.innerHTML="";

    const content=document.createElement("span");
    content.className="line-content";

    /*
      textToShow can contain safe HTML such as village icon
      and VS badge.
    */
    content.innerHTML=textToShow||"";
    el.appendChild(content);

    requestAnimationFrame(()=>{

        if(lineTokens[elementId]!==token) return;

        const boxWidth=el.clientWidth;
        const textWidth=content.scrollWidth;

        /* -------------------------
           SHORT TEXT
           ------------------------- */
        if(textWidth<=boxWidth-25){

            el.classList.add("anim-enter");

            /*
              Short line ਵੀ ਆਪਣਾ independent cycle ਰੱਖਦੀ ਹੈ.
            */
            lineTimers[elementId]=setTimeout(()=>{

                if(lineTokens[elementId]!==token) return;

                if(typeof onDone==="function"){
                    onDone();
                }

            },4200);

            return;
        }

        /* -------------------------
           LONG TEXT / SCROLL
           ------------------------- */
        el.classList.add("scrolling");

        const distance=Math.max(30,textWidth-boxWidth+35);

        /*
          78 px/sec = slow smooth scroll.
          Minimum 10 sec ਤਾਂ ਕਿ text ਤੇਜ਼ ਨਾ ਭੱਜੇ.
        */
        const scrollDuration=Math.max(
            10,
            distance/78
        );

        el.style.setProperty(
            "--scroll-distance",
            `${distance}px`
        );

        el.style.setProperty(
            "--scroll-duration",
            `${scrollDuration}s`
        );

        /*
          1.2 sec starting pause ਤੋਂ ਬਾਅਦ scroll.
          80% scroll complete ਹੋਣ ਤੇ next item.
        */
        const nextDelay=
            1200 +
            (scrollDuration*1000*0.80);

        lineTimers[elementId]=setTimeout(()=>{

            if(lineTokens[elementId]!==token) return;

            if(typeof onDone==="function"){
                onDone();
            }

        },nextDelay);
    });
}

/* =========================================================
   PER-LINE CYCLING
========================================================= */
const lineIndexes={
    "s1-left":0,
    "s1-mid":0,
    "s1-right":0,
    "s2-left":0,
    "s2-mid":0,
    "s2-right":0
};

function getLineItems(elementId){

    if(elementId==="s1-left"){
        return leftItems.map(x=>({
            pa:x.singlePa,
            en:x.singleEn
        }));
    }

    if(elementId==="s1-mid"){
        return topCenterItems.map(x=>({
            pa:x.pa,
            en:x.en
        }));
    }

    if(elementId==="s1-right"){
        return rightItems.map(x=>({
            pa:x.singlePa,
            en:x.singleEn
        }));
    }

    if(elementId==="s2-left"){
        return leftItems.map(x=>({
            pa:x.botPa,
            en:x.botEn
        }));
    }

    if(elementId==="s2-mid"){
        return bottomCenterItems.map(x=>({
            pa:x.pa,
            en:x.en
        }));
    }

    if(elementId==="s2-right"){
        return rightItems.map(x=>({
            pa:x.botPa,
            en:x.botEn
        }));
    }

    return [];
}

function cycleLine(elementId,reset=false){

    const items=getLineItems(elementId);

    if(!items.length) return;

    if(reset){
        lineIndexes[elementId]=0;
    }

    const index=
        lineIndexes[elementId]%items.length;

    const item=items[index];

    const text=isEnglish?item.en:item.pa;

    runTickerLine(
        elementId,
        text,
        ()=>{
            lineIndexes[elementId]++;

            cycleLine(elementId,false);
        }
    );
}

/* =========================================================
   RENDER
   Every physical line runs separately.
========================================================= */
function renderIndependentTickers(forceReset=false){

    if(forceReset){

        for(const key in lineIndexes){
            lineIndexes[key]=0;

            if(lineTimers[key]){
                clearTimeout(lineTimers[key]);
                lineTimers[key]=null;
            }

            lineTokens[key]=(lineTokens[key]||0)+1;
        }
    }

    if(hasMatches){

        document.getElementById('strip-2').style.display="flex";

        cycleLine("s1-left",forceReset);
        cycleLine("s1-mid",forceReset);
        cycleLine("s1-right",forceReset);

        cycleLine("s2-left",forceReset);
        cycleLine("s2-mid",forceReset);
        cycleLine("s2-right",forceReset);

    }else{

        document.getElementById('strip-2').style.display="none";

        cycleLine("s1-left",forceReset);
        cycleLine("s1-mid",forceReset);
        cycleLine("s1-right",forceReset);

        /* Stop hidden strip timers */
        ["s2-left","s2-mid","s2-right"].forEach(id=>{
            if(lineTimers[id]){
                clearTimeout(lineTimers[id]);
                lineTimers[id]=null;
            }
            lineTokens[id]=(lineTokens[id]||0)+1;
        });
    }
}

/* =========================================================
   LANGUAGE SWITCH
   Punjabi -> English -> Punjabi
   Every 14 sec, all lines restart from their own first item.
========================================================= */
setInterval(()=>{

    isEnglish=!isEnglish;

    renderIndependentTickers(true);

/* =========================================================
   WATERMARK
========================================================= */
const wm=document.getElementById('single-wm');

let x=200,y=200;
let dx=1.8,dy=1.4;

function animateWatermark(){

    const maxX=1920-wm.offsetWidth-50;
    const maxY=950-wm.offsetHeight;

    x+=dx;
    y+=dy;

    if(x<=50 || x>=maxX) dx*=-1;
    if(y<=120 || y>=maxY) dy*=-1;

    wm.style.left=x+"px";
    wm.style.top=y+"px";

    requestAnimationFrame(animateWatermark);
}

animateWatermark();
