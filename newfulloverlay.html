<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabaddi Ultra HD - Hint Top & Detail Bottom Overlay</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&family=Bebas+Neue&family=Noto+Sans+Gurmukhi:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1920px;
            height: 1080px;
            background: transparent;
            font-family: 'Noto Sans Gurmukhi', 'Mukta', Arial, sans-serif;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            user-select: none;
            text-transform: uppercase;
            transform-origin: top left;
        }

        /* --- HD SCOREBOARD (SKY BLUE THEME) --- */
        #top-scoreboard-container {
            position: absolute;
            top: 35px;
            right: 45px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        #top-scoreboard-container.hidden { opacity: 0; }

        #main-score-strip {
            display: flex;
            align-items: stretch;
            height: 75px;
            border-radius: 6px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transform: skewX(16deg); 
        }

        .unskew {
            transform: skewX(-16deg);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .score-a {
            background: #007acc; color: #ffffff; font-size: 56px; font-weight: 900;
            padding: 0 35px; font-family: 'Bebas Neue', sans-serif;
        }
        .team-a-panel {
            background: #3399ff; color: #ffffff; font-size: 38px; font-weight: 800;
            padding: 0 50px; white-space: nowrap; min-width: 180px; letter-spacing: 1px;
        }

        .vs-divider { width: 10px; background: #111111; }

        .team-b-panel {
            background: #242424; color: #ffffff; font-size: 38px; font-weight: 800;
            padding: 0 50px; white-space: nowrap; min-width: 180px; letter-spacing: 1px;
        }
        .score-b {
            background: #111111; color: #ffcc00; font-size: 56px; font-weight: 900;
            padding: 0 35px; font-family: 'Bebas Neue', sans-serif;
        }

        #match-details-strip {
            background: rgba(0, 0, 0, 0.9); color: #ffcc00; font-size: 24px; font-weight: 800;
            padding: 6px 40px; margin-top: 8px; border-radius: 6px;
            letter-spacing: 2px; border: 1px solid rgba(255, 255, 255, 0.4);
            transform: skewX(16deg); margin-right: 25px; 
        }
        #match-details-strip.hidden { display: none; }

        /* --- LOGO & WATERMARK --- */
        #logo-container { position: absolute; top: 25px; left: 30px; z-index: 9999; display: flex; align-items: center; transition: all 0.5s ease; }
        #logo-container.hidden { opacity: 0; transform: scale(0.8); }
        #main-logo { height: 100px; width: auto; object-fit: contain; }

        #single-wm {
            position: absolute; left: 300px; top: 300px; font-family: 'Bebas Neue', sans-serif; font-size: 50px; font-weight: bold;
            color: #ffffff; opacity: 0.45; letter-spacing: 3px; pointer-events: none;
        }

        /* --- TICKER STRIPS (SKY BLUE TOP) --- */
        #ticker-wrap {
            position: absolute; bottom: 0; left: 0; width: 1920px; z-index: 9998;
            display: flex; flex-direction: column; transition: opacity 0.5s ease;
        }
        #ticker-wrap.hidden { opacity: 0; }

        .ticker-strip { display: flex; width: 100%; height: 60px; }

        .strip-top { background: #3399ff; border-bottom: 2px solid rgba(0,0,0,0.5); }
        .strip-bot { background: #121212; border-top: 1px solid rgba(255,255,255,0.15); }

        .ticker-col {
            display: flex; align-items: center; justify-content: center; 
            font-weight: 900; font-size: 32px; color: #ffffff !important; 
            overflow: hidden; position: relative; letter-spacing: 2px; padding: 0 15px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.6);
        }

        .w-30 { width: 30%; }
        .w-40 { width: 40%; border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); color: #ffffff !important; }

        /* 3D GHAIENT VS DESIGN IN MATCH LIST */
        .match-vs-3d {
            color: #ffcc00;
            background: #111;
            padding: 2px 10px;
            border-radius: 6px;
            margin: 0 8px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 30px;
            letter-spacing: 2px;
            box-shadow: 0 4px 0 #b38f00, 0 6px 10px rgba(0,0,0,0.5);
            display: inline-block;
            transform: translateY(-2px);
        }

        .anim-wrap {
            position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease; opacity: 1;
        }

        .scroll-container { width: 100%; overflow: hidden; display: flex; align-items: center; white-space: nowrap; }
        .scroll-text {
            display: inline-block; white-space: nowrap; padding-left: 100%; 
            animation: scrollMarquee var(--scroll-duration, 30s) linear forwards; 
        }
        @keyframes scrollMarquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- 10 SECONDS RESULT WINDOW --- */
        #result-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            background: rgba(15, 15, 15, 0.95); border: 5px solid #ffcc00;
            padding: 50px 80px; border-radius: 16px; color: white; text-align: center;
            z-index: 100000; transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0; box-shadow: 0 15px 50px rgba(0,0,0,0.9);
        }
        #result-popup.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .res-title { font-size: 45px; color: #ffcc00; margin-bottom: 15px; font-weight: 900; border-bottom: 2px solid rgba(255, 204, 0, 0.4); padding-bottom: 8px; letter-spacing: 2px; }
        .res-text-pa { font-size: 55px; font-weight: 800; line-height: 1.2; color: #ffffff; margin-bottom: 10px; letter-spacing: 1.5px; }
        .res-text-en { font-size: 45px; font-weight: 800; line-height: 1.2; color: #3399ff; letter-spacing: 1.5px; }

    </style>
</head>
<body>

<div id="logo-container" class="hidden"><img id="main-logo" src="" alt="Logo"></div>
<div id="single-wm">ਐੱਮ ਲਾਈਵ</div>

<div id="result-popup">
    <div class="res-title">🏆 ਮੈਚ ਨਤੀਜਾ / MATCH RESULT</div>
    <div class="res-text-pa" id="res-msg-pa">ਵਿਨਰ ਨਾਮ</div>
    <div class="res-text-en" id="res-msg-en">WINNER NAME</div>
</div>

<div id="top-scoreboard-container">
    <div id="main-score-strip">
        <div class="score-a"><div class="unskew" id="sA">0</div></div>
        <div class="team-a-panel"><div class="unskew" id="nA">ਟੀਮ 1</div></div>
        <div class="vs-divider"><div class="unskew"></div></div>
        <div class="team-b-panel"><div class="unskew" id="nB">ਟੀਮ 2</div></div>
        <div class="score-b"><div class="unskew" id="sB">0</div></div>
    </div>
    <div id="match-details-strip" class="hidden"><div class="unskew" id="match-round"></div></div>
</div>

<div id="ticker-wrap">
    <div class="ticker-strip strip-top" id="strip-1">
        <div class="ticker-col w-30"><div id="s1-left" class="anim-wrap">📍 ਸਥਾਨ</div></div>
        <div class="ticker-col w-40"><div id="s1-mid" class="anim-wrap">ਕਬੱਡੀ ਟੂਰਨਾਮੈਂਟ</div></div>
        <div class="ticker-col w-30"><div id="s1-right" class="anim-wrap">📅 ਆਉਣ ਵਾਲੇ ਮੇਲੇ</div></div>
    </div>
    
    <div class="ticker-strip strip-bot" id="strip-2" style="display: none;">
        <div class="ticker-col w-30"><div id="s2-left" class="anim-wrap">ਪਿੰਡ</div></div>
        <div class="ticker-col w-40"><div id="s2-mid" class="anim-wrap">ਲਾਈਵ ਮੈਚ</div></div>
        <div class="ticker-col w-30"><div id="s2-right" class="anim-wrap">ਵੇਰਵਾ</div></div>
    </div>
</div>

<script>
    function autoResizeOverlay() {
        const baseWidth = 1920;
        const baseHeight = 1080;
        const scaleX = window.innerWidth / baseWidth;
        const scaleY = window.innerHeight / baseHeight;
        const scale = Math.min(scaleX, scaleY);
        document.body.style.transform = `scale(${scale})`;
        document.body.style.width = `${baseWidth}px`;
        document.body.style.height = `${baseHeight}px`;
    }
    window.addEventListener('resize', autoResizeOverlay);
    window.addEventListener('load', autoResizeOverlay);
    autoResizeOverlay();

    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('id') || 'defaultMatch';
    const db = firebase.database().ref("matchData/" + matchId);
    const userDb = firebase.database().ref("users/" + matchId);

    userDb.on("value", (snap) => {
        const user = snap.val();
        if (!user || Date.now() > new Date(user.expiryDate).getTime()) {
            document.body.innerHTML = `<div style="width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; background:black; color:white; font-size:50px; text-align:center;">🛑 ਪਲਾਨ ਖਤਮ ਹੋ ਗਿਆ ਹੈ<br>ਹੈਲਪ ਲਾਈਨ: ਮਨਪ੍ਰੀਤ ਮੁਦਕੀ<br>9115426711</div>`;
        }
    });

    const clientLogos = { "kabaddi101": "https://raw.githubusercontent.com/4kjunctionofficial-code/liveteam/main/Kabaddi%20101%20logo.png" };

    let leftItems = [];
    let centerItems = [];
    let rightItems = [];
    
    let leftIdx = 0, centerIdx = 0, rightIdx = 0;
    let isEnglish = false; 
    let hasMatches = false;
    let lastResult = ""; 

    const dict = {
        "Kabaddi": "ਕਬੱਡੀ", "Open": "ਓਪਨ", "Quarter Final": "ਕੁਆਰਟਰ ਫਾਈਨਲ",
        "Semi Final": "ਸੈਮੀ ਫਾਈਨਲ", "Final": "ਫਾਈਨਲ", "1st Round": "ਪਹਿਲਾ ਰਾਊਂਡ",
        "2nd Round": "ਦੂਜਾ ਰਾਊਂਡ", "3rd Round": "ਤੀਜਾ ਰਾਊਂਡ", "4th Round": "ਚੌਥਾ ਰਾਊਂਡ",
        "Pool A": "ਪੂਲ ਏ", "Pool B": "ਪੂਲ ਬੀ"
    };

    function translateToPunjabi(text) {
        if(!text) return "";
        let translated = text.trim();
        for (let key in dict) {
            let regex = new RegExp(key, 'gi');
            translated = translated.replace(regex, dict[key]);
        }
        translated = translated.replace(/KG/gi, "ਕਿਲੋ");
        return translated;
    }

    db.on("value", (snap) => {
        const data = snap.val() || {}; 
        window.currentData = data; 

        const logoCont = document.getElementById('logo-container');
        if (clientLogos[matchId.trim().toLowerCase()] && data.logoVisible !== false) {
            document.getElementById('main-logo').src = clientLogos[matchId.trim().toLowerCase()];
            logoCont.classList.remove('hidden');
        } else {
            logoCont.classList.add('hidden');
        }

        document.getElementById('top-scoreboard-container').classList.toggle('hidden', data.scoreVisible === false);
        document.getElementById('ticker-wrap').classList.toggle('hidden', data.tickerVisible === false);
        
        const roundText = data.round || "";
        const detailsStrip = document.getElementById('match-details-strip');
        if (roundText.trim() === "") {
            detailsStrip.classList.add('hidden');
        } else {
            detailsStrip.classList.remove('hidden');
            document.getElementById('match-round').innerText = translateToPunjabi(roundText);
        }

        document.getElementById('sA').innerText = data.scoreA ?? "0";
        document.getElementById('sB').innerText = data.scoreB ?? "0";
        document.getElementById('single-wm').innerText = data.watermarkTxt || "ਐੱਮ ਲਾਈਵ";

        if(data.resultText && data.resultText !== "No Result Yet" && data.resultText !== lastResult) {
            lastResult = data.resultText;
            showResultPopup(data.resultText);
        }
        if (!data.resultText || data.resultText === "No Result Yet") {
            lastResult = ""; 
        }

        processTickerData(data);
    });

    function showResultPopup(text) {
        const popup = document.getElementById('result-popup');
        document.getElementById('res-msg-pa').innerText = translateToPunjabi(text);
        document.getElementById('res-msg-en').innerText = text;
        popup.classList.add('show');
        setTimeout(() => { popup.classList.remove('show'); }, 10000); 
    }

    function processTickerData(data) {
        leftItems = [];
        leftItems.push({
            hintEn: "📍 LOCATION", hintPa: "📍 ਸਥਾਨ",
            detailEn: data.row1Txt || "VILLAGE NAME",
            detailPa: data.row1Txt_pa || data.row1Txt || "ਪਿੰਡ ਦਾ ਨਾਮ"
        });

        if(data.pzOp1) leftItems.push({ hintEn: "🔥 OPEN 1ST PRIZE", hintPa: "🔥 ਓਪਨ ਪਹਿਲਾ ਇਨਾਮ", detailEn: data.pzOp1, detailPa: data.pzOp1 });
        if(data.pzOp2) leftItems.push({ hintEn: "🔥 OPEN 2ND PRIZE", hintPa: "🔥 ਓਪਨ ਦੂਜਾ ਇਨਾਮ", detailEn: data.pzOp2, detailPa: data.pzOp2 });
        if(data.pzOpBest) leftItems.push({ hintEn: "🏅 OPEN BEST PLAYER", hintPa: "🏅 ਓਪਨ ਬੈਸਟ ਖਿਡਾਰੀ", detailEn: data.pzOpBest, detailPa: data.pzOpBest });

        let wKg = data.pzWtKg ? data.pzWtKg : "WEIGHT";
        let wKgPa = data.pzWtKg ? translateToPunjabi(data.pzWtKg) : "ਵਜ਼ਨੀ";

        if(data.pzWt1) leftItems.push({ hintEn: `🏋️ (${wKg}) 1ST PRIZE`, hintPa: `🏋️ (${wKgPa}) ਪਹਿਲਾ ਇਨਾਮ`, detailEn: data.pzWt1, detailPa: data.pzWt1 });
        if(data.pzWt2) leftItems.push({ hintEn: `🏋️ (${wKg}) 2ND PRIZE`, hintPa: `🏋️ (${wKgPa}) ਦੂਜਾ ਇਨਾਮ`, detailEn: data.pzWt2, detailPa: data.pzWt2 });
        if(data.pzWtBest) leftItems.push({ hintEn: `🏅 (${wKg}) BEST PLAYER`, hintPa: `🏅 (${wKgPa}) ਬੈਸਟ ਖਿਡਾਰੀ`, detailEn: data.pzWtBest, detailPa: data.pzWtBest });

        if(data.adComm) leftItems.push({ hintEn: "🎙️ COMMENTATOR", hintPa: "🎙️ ਕਮੈਂਟੇਟਰ", detailEn: data.adComm, detailPa: data.adComm });
        if(data.adSound) leftItems.push({ hintEn: "🔊 SOUND SERVICE", hintPa: "🔊 ਸਾਊਂਡ ਸਰਵਿਸ", detailEn: data.adSound, detailPa: data.adSound });
        if(data.adTent) leftItems.push({ hintEn: "⛺ TENT SERVICE", hintPa: "⛺ ਟੈਂਟ ਪੰਡਾਲ", detailEn: data.adTent, detailPa: data.adTent });
        if(data.adSec) leftItems.push({ hintEn: "🛡️ SECURITY", hintPa: "🛡️ ਸਕਿਓਰਿਟੀ", detailEn: data.adSec, detailPa: data.adSec });

        centerItems = [];
        let matchesList = data.nextMatches || [];
        hasMatches = matchesList.length > 0;
        
        let parseMatchFull = (m, index) => {
            let bracketContent = "";
            let teamPart = m;
            if(m.startsWith("(")) {
                let closeIdx = m.indexOf(")");
                if(closeIdx !== -1) {
                    bracketContent = m.substring(1, closeIdx).trim(); 
                    teamPart = m.substring(closeIdx + 1).trim();     
                }
            }

            let tms = teamPart.split(" VS ");
            let t1Full = (tms[0] || "").trim();
            let t2Full = (tms[1] || "").trim();
            let t1En = t1Full.split("=")[0].trim();
            let t1Pa = t1Full.split("=")[1]?.trim() || t1En;
            let t2En = t2Full.split("=")[0].trim();
            let t2Pa = t2Full.split("=")[1]?.trim() || t2En;

            let bracketPa = translateToPunjabi(bracketContent);
            let tagPa = bracketPa ? `(${bracketPa}) ` : "";
            let tagEn = bracketContent ? `(${bracketContent}) ` : "";
            let numTag = `${index + 1}. `;

            let vsHtmlPa = ` <span class="match-vs-3d">ਬਨਾਮ</span> `;
            let vsHtmlEn = ` <span class="match-vs-3d">VS</span> `;

            return { 
                pa: `${numTag}${tagPa}${t1Pa}${vsHtmlPa}${t2Pa}`, 
                en: `${numTag}${tagEn}${t1En}${vsHtmlEn}${t2En}` 
            };
        };

        if(hasMatches) {
            matchesList.forEach((mStr, idx) => {
                let res = parseMatchFull(mStr, idx);
                centerItems.push({ 
                    hintPa: "⚔️ ਅਗਲਾ ਮੈਚ (NEXT MATCH)", hintEn: "⚔️ NEXT MATCH",
                    tPa: res.pa, bEn: res.en,
                    isMultiple: matchesList.length > 1 
                });
            });
        } else {
            centerItems.push({ hintPa: "⚔️ ਮੈਚ ਲਿਸਟ", hintEn: "⚔️ MATCH LIST", tPa: "ਕਬੱਡੀ ਟੂਰਨਾਮੈਂਟ", bEn: "KABADDI TOURNAMENT", isMultiple: false });
        }

        rightItems = [];
        if(data.upcomingEvents && data.upcomingEvents.length > 0) {
            data.upcomingEvents.forEach(ev => {
                let d = ev.date ? ` (${ev.date})` : "";
                rightItems.push({ 
                    hintEn: "📅 UPCOMING EVENTS", hintPa: "📅 ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ",
                    detailEn: `${ev.name}${d}`, detailPa: `${ev.name_pa || ev.name}${d}` 
                });
            });
        }
        if(data.row6Txt || data.row6Txt_pa) {
            rightItems.push({ 
                hintEn: "📺 LIVE TELECAST", hintPa: "📺 ਲਾਈਵ ਪ੍ਰਸਾਰਣ",
                detailEn: data.row6Txt || "LIVE STREAMING", detailPa: data.row6Txt_pa || data.row6Txt || "ਲਾਈਵ ਪ੍ਰਸਾਰਣ" 
            });
        }
        if(rightItems.length === 0) {
            rightItems.push({ 
                hintEn: "📅 UPCOMING EVENTS", hintPa: "📅 ਆਉਣ ਵਾਲੇ ਖੇਡ ਮੇਲੇ",
                detailEn: "STAY TUNED", detailPa: "ਦੇਖਦੇ ਰਹੋ" 
            });
        }
        
        document.getElementById('strip-2').style.display = hasMatches ? 'flex' : 'none';
        renderIndependentTickers();
    }

    function runSmartTicker(elementId, textToShow, isCenter = false) {
        const el = document.getElementById(elementId);
        if (!el) return;

        if (el.dataset.currentText === textToShow) return;
        el.dataset.currentText = textToShow;

        el.style.opacity = 0;
        el.style.transform = 'translateY(-12px)';

        setTimeout(() => {
            let dummy = document.createElement("div");
            dummy.innerHTML = textToShow;
            let length = dummy.innerText.length;

            if (length > 25) {
                let duration = Math.max(32, length * 0.85); 
                el.innerHTML = `<div class="scroll-container"><span class="scroll-text" style="--scroll-duration: ${duration}s;">${textToShow}</span></div>`;
                
                let timerKey = elementId + "_timer";
                if (window[timerKey]) clearTimeout(window[timerKey]);
                
                // --- 80% SCROLL P]=='ON TIME SETTING ---
                // ਜਦੋਂ ਟਾਈਮ ਦਾ 80% ਹਿੱਸਾ ਪੂਰਾ ਹੋਵੇਗਾ, ਉਸੇ ਸਮੇਂ ਐਨੀਮੇਸ਼ਨ ਨਾਲ ਅਗਲਾ ਮੈਚ ਆ ਜਾਵੇਗਾ
                let triggerTime = (isCenter && elementId === 's2-mid') ? (duration * 1000 * 0.8) : (duration * 1000);

                window[timerKey] = setTimeout(() => {
                    if (isCenter) centerIdx++;
                    else if (elementId.includes("left")) leftIdx++;
                    else if (elementId.includes("right")) rightIdx++;
                    renderIndependentTickers();
                }, triggerTime);

            } else {
                el.innerHTML = textToShow;
                let timerKey = elementId + "_timer";
                if (window[timerKey]) clearTimeout(window[timerKey]);

                window[timerKey] = setTimeout(() => {
                    if (isCenter) centerIdx++;
                    else if (elementId.includes("left")) leftIdx++;
                    else if (elementId.includes("right")) rightIdx++;
                    renderIndependentTickers();
                }, 12000); 
            }

            el.style.transform = 'translateY(12px)';
            setTimeout(() => { el.style.opacity = 1; el.style.transform = 'translateY(0)'; }, 60);
        }, 500);
    }

    function renderIndependentTickers() {
        let L = leftItems[leftIdx % leftItems.length];
        let C = centerItems[centerIdx % centerItems.length];
        let R = rightItems[rightIdx % rightItems.length];

        if (hasMatches) {
            runSmartTicker('s1-left', isEnglish ? L.hintEn : L.hintPa, false);
            runSmartTicker('s1-right', isEnglish ? R.hintEn : R.hintPa, false);

            if (C.isMultiple) {
                runSmartTicker('s1-mid', C.tPa, true);
                runSmartTicker('s2-mid', C.bEn, true);
            } else {
                runSmartTicker('s1-mid', isEnglish ? C.hintEn : C.hintPa, true);
                runSmartTicker('s2-mid', isEnglish ? C.bEn : C.tPa, true);
            }

            runSmartTicker('s2-left', isEnglish ? L.detailEn : L.detailPa, false);
            runSmartTicker('s2-right', isEnglish ? R.detailEn : R.detailPa, false);
        } else {
            runSmartTicker('s1-left', isEnglish ? L.hintEn : L.hintPa, false);
            runSmartTicker('s1-mid', C.hintPa, true);
            runSmartTicker('s1-right', isEnglish ? R.hintEn : R.hintPa, false);

            runSmartTicker('s2-left', isEnglish ? L.detailEn : L.detailPa, false);
            runSmartTicker('s2-mid', C.bEn, true);
            runSmartTicker('s2-right', isEnglish ? R.detailEn : R.detailPa, false);
        }
    }

    setInterval(() => {
        isEnglish = !isEnglish;
        renderIndependentTickers();
    }, 16000);

    setInterval(() => {
        let d = window.currentData;
        if(d) {
            document.getElementById('nA').innerText = (!isEnglish && d.nameA_pa) ? d.nameA_pa : (d.nameA || "ਟੀਮ 1");
            document.getElementById('nB').innerText = (!isEnglish && d.nameB_pa) ? d.nameB_pa : (d.nameB || "ਟੀਮ 2");
        }
    }, 2000);

    const wm = document.getElementById('single-wm');
    let x = 200, y = 200, dx = 1.8, dy = 1.4;
    function animateWatermark() {
        const maxX = 1920 - wm.offsetWidth - 50; const maxY = 950 - wm.offsetHeight;
        x += dx; y += dy;
        if (x <= 50 || x >= maxX) dx *= -1; if (y <= 120 || y >= maxY) dy *= -1;
        wm.style.left = x + 'px'; wm.style.top = y + 'px';
        requestAnimationFrame(animateWatermark);
    }
    animateWatermark();
</script>
</body>
</html>
