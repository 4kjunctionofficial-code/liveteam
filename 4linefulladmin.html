<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<style>
    body{ font-family:'Segoe UI',sans-serif; background:#f0f2f5; margin:0; padding:8px; }
    #main-panel{ width:100%; max-width:760px; margin:auto; }
    .card{ background:white; border-radius:14px; box-shadow:0 5px 15px rgba(0,0,0,.15); overflow:hidden; margin-bottom:15px; }
    .header{ background:#1a73e8; color:white; padding:10px; text-align:center; font-size:16px; font-weight:bold; }
    .teams-container{ display:flex; gap:10px; padding:12px; align-items:center; }
    .team-box{ flex:1; }
    .vs-text{ font-size:24px; font-weight:bold; color:#999; }
    select, input, textarea{ width:100%; padding:10px; border:2px solid #ddd; border-radius:8px; font-size:18px; font-weight:bold; box-sizing:border-box; margin-bottom:8px; }
    .score-val{ text-align:center; font-size:52px; font-weight:900; margin:6px 0; }
    .btn-pm{ flex:1; border:none; color:white; padding:12px; border-radius:8px; font-size:24px; font-weight:bold; cursor:pointer; }
    .btn-plus{ background:#28a745; } .btn-minus{ background:#dc3545; }
    .controls{ padding:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
    .btn-full{ border:none; color:white; height:70px; border-radius:12px; font-size:18px; font-weight:900; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; }
    .btn-green{background:#28a745;} .btn-red{background:#ea4335;} .btn-yellow{background:#fbbc05;color:black;} .btn-dark{background:#333;} .btn-blue{background:#1a73e8;}
    .result-box{ background:#111; color:white; border-radius:10px; padding:18px; text-align:center; }
</style>
</head>
<body>

<div id="main-panel">
    <div class="card">
        <div class="header">LIVE SCORE BOARD</div>
        <div class="teams-container" id="teamWrap">
            <div class="team-box">
                <select id="teamSelectA" onchange="selectTeamA(this.value)"><option value="">Select Team A</option></select>
                <div class="team-top"><input type="text" id="nameA" placeholder="TEAM 1"><button class="set-btn" onclick="updateTeamA()">SET</button></div>
                <div class="score-val" id="dispA">0</div>
                <div class="pm-wrap" style="display:flex; gap:6px;"><button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button><button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button></div>
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <select id="teamSelectB" onchange="selectTeamB(this.value)"><option value="">Select Team B</option></select>
                <div class="team-top"><input type="text" id="nameB" placeholder="TEAM 2"><button class="set-btn" onclick="updateTeamB()">SET</button></div>
                <div class="score-val" id="dispB">0</div>
                <div class="pm-wrap" style="display:flex; gap:6px;"><button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button><button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button></div>
            </div>
        </div>
        <div class="controls">
            <button class="btn-full btn-green" onclick="showResultLayer()">RESULT</button>
            <button id="visBtn" class="btn-full btn-red" onclick="toggleVis('scoreVisible')">Hide Scoreboard</button>
            <button class="btn-full btn-yellow" onclick="swapTeams()">SWAP</button>
            <button class="btn-full btn-dark" id="camBtn" onclick="toggleCameraView()">Camera View</button>
        </div>
    </div>

    <!-- TICKER & BRANDING -->
    <div class="card">
        <div class="header">TICKER & BRANDING</div>
        <div class="settings-section" style="padding:12px;">
            <textarea id="row1Inp" rows="1" placeholder="Title Line 1"></textarea>
            <textarea id="row2Inp" rows="1" placeholder="Title Line 2"></textarea>
            <textarea id="row3Inp" rows="1" placeholder="Title Line 3"></textarea>
            <textarea id="row4Inp" rows="1" placeholder="Title Line 4"></textarea>
            <input type="text" id="watermarkInp" placeholder="Channel Name">
            <button class="btn-full btn-blue" onclick="updateTicker()">UPDATE TICKER</button>
        </div>
    </div>

    <!-- RESULT EDIT BOX -->
    <div class="card">
        <div class="header">MATCH RESULT (Edit Here)</div>
        <div class="settings-section" style="padding:12px;">
            <textarea id="resultText" rows="3" onblur="saveResultEdit()" placeholder="No Result Yet"></textarea>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL:"https://manpreetteam-a86e9-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("matchData/" + (new URLSearchParams(window.location.search).get('id') || 'defaultMatch'));

    db.on("value", (snap) => {
        const data = snap.val();
        if(data) {
            document.getElementById("dispA").innerText = data.scoreA || 0;
            document.getElementById("dispB").innerText = data.scoreB || 0;
            document.getElementById("nameA").value = data.nameA || "";
            document.getElementById("nameB").value = data.nameB || "";
            document.getElementById("row1Inp").value = data.row1Txt || "";
            document.getElementById("row2Inp").value = data.row2Txt || "";
            document.getElementById("row3Inp").value = data.row3Txt || "";
            document.getElementById("row4Inp").value = data.row4Txt || "";
            document.getElementById("resultText").value = data.resultText || "";
        }
    });

    function changeScore(team, val) {
        db.once("value", snap => {
            const data = snap.val();
            let cur = parseFloat(data[team] || 0);
            let n = val > 0 ? (cur === 0 && data.scoreA == 0 && data.scoreB == 0 ? 1.5 : cur + 1) : Math.max(0, cur === 1.5 ? 0 : cur - 1);
            db.update({ [team]: n });
        });
    }

    function showResultLayer() {
        if(confirm("ਕੀ ਤੁਸੀਂ ਰਿਜ਼ਲਟ ਸੇਵ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ? ਸਕੋਰ 0 ਹੋ ਜਾਣਗੇ।")) {
            const teamA = document.getElementById("nameA").value;
            const teamB = document.getElementById("nameB").value;
            const res = `${teamA} vs ${teamB} | Winner: ${parseFloat(document.getElementById("dispA").innerText) > parseFloat(document.getElementById("dispB").innerText) ? teamA : teamB}`;
            db.update({ resultText: res, scoreA: 0, scoreB: 0 });
        }
    }

    function saveResultEdit() {
        db.update({ resultText: document.getElementById("resultText").value });
    }

    function updateTicker() {
        db.update({
            row1Txt: document.getElementById("row1Inp").value,
            row2Txt: document.getElementById("row2Inp").value,
            row3Txt: document.getElementById("row3Inp").value,
            row4Txt: document.getElementById("row4Inp").value,
            watermarkTxt: document.getElementById("watermarkInp").value
        });
    }
</script>
</body>
</html>
