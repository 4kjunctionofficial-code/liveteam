<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; padding: 10px; }
        #main-panel { width: 100%; max-width: 500px; margin: auto; }
        .card { background: white; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); margin-bottom: 20px; overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 12px; text-align: center; font-weight: bold; text-transform: uppercase; }
        .teams-container { display: flex; padding: 15px; gap: 10px; align-items: center; }
        .team-box { flex: 1; text-align: center; }
        .score-val { font-size: 50px; font-weight: 900; }
        .btn-pm { border: none; color: white; padding: 10px; border-radius: 6px; font-size: 20px; cursor: pointer; width: 45px; }
        .btn-plus { background: #28a745; } .btn-minus { background: #dc3545; }
        textarea, input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; margin-bottom: 8px; }
        .btn-full { border: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 5px; }
        #expired-panel { display: none; text-align: center; padding: 50px; }
    </style>
</head>
<body>

<div id="main-panel">
    <div class="card">
        <div class="header">Live Score Board</div>
        <div class="teams-container">
            <div class="team-box">
                <input type="text" id="nameA" placeholder="TEAM 1" oninput="updateDB()">
                <div class="score-val" id="dispA">0</div>
                <button class="btn-pm btn-minus" onclick="changeScore('scoreA', -1)">-</button>
                <button class="btn-pm btn-plus" onclick="changeScore('scoreA', 1)">+</button>
            </div>
            <div style="font-weight:bold;">VS</div>
            <div class="team-box">
                <input type="text" id="nameB" placeholder="TEAM 2" oninput="updateDB()">
                <div class="score-val" id="dispB">0</div>
                <button class="btn-pm btn-minus" onclick="changeScore('scoreB', -1)">-</button>
                <button class="btn-pm btn-plus" onclick="changeScore('scoreB', 1)">+</button>
            </div>
        </div>
        <div style="padding: 10px;">
            <button class="btn-full" style="background:#28a745;" onclick="showResultLayer()">SAVE RESULT & RESET</button>
            <button class="btn-full" style="background:#ea4335;" onclick="toggleVis('scoreVisible')">Show/Hide Score</button>
        </div>
    </div>

    <div class="card">
        <div class="header">Ticker (4 Lines)</div>
        <div style="padding:15px;">
            <textarea id="row1Inp" rows="1" placeholder="Line 1" oninput="updateDB()"></textarea>
            <textarea id="row2Inp" rows="1" placeholder="Line 2" oninput="updateDB()"></textarea>
            <textarea id="row3Inp" rows="1" placeholder="Line 3" oninput="updateDB()"></textarea>
            <textarea id="row4Inp" rows="1" placeholder="Line 4" oninput="updateDB()"></textarea>
            <button class="btn-full" style="background:#1a73e8;" onclick="toggleVis('tickerVisible')">Show/Hide Ticker</button>
        </div>
    </div>
</div>

<div id="expired-panel">
    <div class="card" style="padding:40px;"><h2>🛑 PLAN EXPIRED</h2></div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("matchData/defaultMatch");
    const userDb = firebase.database().ref("users/defaultMatch");

    userDb.on("value", (snap) => {
        const active = !(snap.val() && snap.val().planStatus === true);
        document.getElementById('main-panel').style.display = active ? 'block' : 'none';
        document.getElementById('expired-panel').style.display = active ? 'none' : 'block';
    });

    db.on("value", (snap) => {
        const d = snap.val();
        if(!d) return;
        document.getElementById('dispA').innerText = d.scoreA || 0;
        document.getElementById('dispB').innerText = d.scoreB || 0;
        document.getElementById('nameA').value = d.nameA || "";
        document.getElementById('nameB').value = d.nameB || "";
        document.getElementById('row1Inp').value = d.row1Txt || "";
        document.getElementById('row2Inp').value = d.row2Txt || "";
        document.getElementById('row3Inp').value = d.row3Txt || "";
        document.getElementById('row4Inp').value = d.row4Txt || "";
    });

    function changeScore(team, val) {
        db.once("value", (s) => {
            let cur = parseFloat(s.val()[team] || 0);
            let n = val > 0 ? (cur === 0 && s.val().scoreA==0 && s.val().scoreB==0 ? 1.5 : cur + 1) : Math.max(0, cur === 1.5 ? 0 : cur - 1);
            db.update({ [team]: n });
        });
    }

    function updateDB() {
        db.update({
            nameA: document.getElementById('nameA').value,
            nameB: document.getElementById('nameB').value,
            row1Txt: document.getElementById('row1Inp').value,
            row2Txt: document.getElementById('row2Inp').value,
            row3Txt: document.getElementById('row3Inp').value,
            row4Txt: document.getElementById('row4Inp').value
        });
    }

    function showResultLayer() {
        if(confirm("ਰਿਜ਼ਲਟ ਸੇਵ ਕਰਨਾ ਹੈ? ਸਕੋਰ 0 ਹੋ ਜਾਣਗੇ।")) {
            db.update({ scoreA: 0, scoreB: 0 });
        }
    }

    function toggleVis(f) {
        db.child(f).once("value", s => db.update({ [f]: !s.val() }));
    }
</script>
</body>
</html>
