<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabaddi Pro Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    background:#f0f2f5;
    margin:0;
    padding:8px;
}
#main-panel{
    width:100%;
    max-width:760px;
    margin:auto;
}
.card{
    background:white;
    border-radius:14px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    overflow:hidden;
    margin-bottom:15px;
}
.header{
    background:#1a73e8;
    color:white;
    padding:10px;
    text-align:center;
    font-size:16px;
    font-weight:bold;
    text-transform:uppercase;
}
.settings-section{
    padding:12px;
}
.teams-container{
    display:flex;
    gap:10px;
    padding:12px;
    align-items:center;
}
.team-box{
    flex:1;
}
.vs-text{
    font-size:24px;
    font-weight:bold;
    color:#999;
}
select,input,textarea{
    width:100%;
    padding:10px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    box-sizing:border-box;
    margin-bottom:8px;
}
textarea{
    resize:vertical;
    overflow-y:auto;
    min-height:50px;
    max-height:200px;
}
.team-top{
    display:flex;
    gap:6px;
    align-items:stretch;
}
.team-inputs-wrap{
    display:flex;
    flex-direction:column;
    gap:5px;
    flex:1;
}
.team-input-row{
    display:flex;
    gap:5px;
}
.team-input{
    flex:1;
    margin-bottom:0!important;
}
.trans-btn{
    background:#fbbc05;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    padding:0 12px;
    font-size:16px;
    color:black;
}
.score-val{
    text-align:center;
    font-size:52px;
    font-weight:900;
    margin:6px 0;
}
.pm-wrap{
    display:flex;
    gap:6px;
}
.btn-pm{
    flex:1;
    border:none;
    color:white;
    padding:12px;
    border-radius:8px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}
.btn-plus{background:#28a745;}
.btn-minus{background:#dc3545;}
.controls{
    padding:12px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
}
.btn-full{
    border:none;
    color:white;
    height:70px;
    min-height:70px;
    padding:10px;
    border-radius:12px;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}
.btn-green{background:#28a745;}
.btn-red{background:#ea4335;}
.btn-yellow{background:#fbbc05;color:black;}
.btn-dark{background:#333;}
.btn-blue{background:#1a73e8;}
.btn-orange{background:#fd7e14;}
.btn-gray{background:#777;}

.setup-box{
    background:#f8f9fa;
    border:1px solid #ddd;
    border-radius:8px;
    padding:12px;
    margin-bottom:12px;
}
.match-item{
    background:#fff;
    border:2px solid #ddd;
    border-radius:8px;
    padding:10px;
    margin-bottom:8px;
    display:flex;
    flex-direction:column;
    gap:10px;
}
.match-title{
    font-size:16px;
    font-weight:bold;
    text-align:center;
    color:#333;
}
.match-actions{
    display:flex;
    gap:4px;
    justify-content:center;
    flex-wrap:wrap;
}
.btn-sm{
    flex:1;
    min-width:70px;
    padding:8px 4px;
    border:none;
    border-radius:6px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    font-size:12px;
    text-align:center;
}
.btn-start{background:#1a73e8;}
.btn-res{background:#28a745;}
.btn-nxt{background:#ff9800;}
.btn-walkover{background:#fd7e14;}
.btn-delete{background:#dc3545;max-width:35px;}

.category-group-header{
    font-size:15px;
    font-weight:900;
    background:#e3f2fd;
    color:#1565c0;
    padding:8px 12px;
    border-radius:6px;
    margin-top:10px;
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.winner-card{
    background:#e8f5e9;
    border:2px solid #81c784;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}
.loser-card{
    background:#ffebee;
    border:2px solid #ef9a9a;
    padding:10px;
    border-radius:8px;
    margin-bottom:10px;
}
.winner-row{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:6px;
}
</style>
</head>

<body>

<div id="main-panel">

<!-- LANGUAGE -->
<div class="card">
<div class="header" style="background:#fbbc05;color:black;">LANGUAGE TRANSLATION SETTINGS</div>
<div class="settings-section" style="display:flex;align-items:center;gap:10px;">
<span style="font-weight:bold;font-size:16px;">Translate to:</span>
<select id="targetLang" style="margin-bottom:0;border:2px solid #fbbc05;">
<option value="en">English</option>
<option value="pa" selected>Punjabi (ਪੰਜਾਬੀ)</option>
<option value="hi">Hindi (हिन्दी)</option>
<option value="ur">Urdu (اردو)</option>
</select>
</div>
</div>

<!-- SCOREBOARD -->
<div class="card">
<div class="header">LIVE SCORE BOARD</div>
<div class="teams-container" id="teamWrap">

<!-- TEAM A -->
<div class="team-box">
<select id="teamSelectA" onchange="selectTeamA(this.value)"><option value="">Select Team A</option></select>
<div class="team-top">
<div class="team-inputs-wrap">
<div class="team-input-row">
<input type="text" id="nameA" class="team-input" placeholder="Team 1 English" oninput="syncField('nameA',this.value)">
<button class="trans-btn" onclick="translateAndSync('nameA','nameA_pa')">⇄</button>
</div>
<input type="text" id="nameA_pa" class="team-input" placeholder="Team 1 Punjabi" oninput="syncField('nameA_pa',this.value)">
</div>
</div>
<div class="score-val" id="dispA">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreA',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreA',1)">+</button>
</div>
</div>

<div class="vs-text">VS</div>

<!-- TEAM B -->
<div class="team-box">
<select id="teamSelectB" onchange="selectTeamB(this.value)"><option value="">Select Team B</option></select>
<div class="team-top">
<div class="team-inputs-wrap">
<div class="team-input-row">
<input type="text" id="nameB" class="team-input" placeholder="Team 2 English" oninput="syncField('nameB',this.value)">
<button class="trans-btn" onclick="translateAndSync('nameB','nameB_pa')">⇄</button>
</div>
<input type="text" id="nameB_pa" class="team-input" placeholder="Team 2 Punjabi" oninput="syncField('nameB_pa',this.value)">
</div>
</div>
<div class="score-val" id="dispB">0</div>
<div class="pm-wrap">
<button class="btn-pm btn-minus" onclick="changeScore('scoreB',-1)">-</button>
<button class="btn-pm btn-plus" onclick="changeScore('scoreB',1)">+</button>
</div>
</div>

</div>

<div class="controls">
<button class="btn-full btn-green" onclick="showResultLayer()">🏆 RESULT</button>
<button id="visBtn" class="btn-full btn-red" onclick="toggleVisibility('scoreVisible')">Hide Scoreboard</button>
<button class="btn-full btn-yellow" onclick="swapTeams()">SWAP</button>
<button class="btn-full btn-dark" id="camBtn" onclick="toggleCameraView()">Camera View</button>
<button class="btn-full btn-gray" onclick="resetScores()">RESET SCORES</button>
</div>

<div class="settings-section">
<div class="setup-box" style="border-top:3px solid #fbbc05;">
<label style="font-size:14px;font-weight:bold;color:#b58105;">🏆 CURRENT MATCH ROUND / CATEGORY</label>
<input type="text" id="roundInp" placeholder="Quarter Final / 72 KG" oninput="syncField('round',this.value)">
</div>

<!-- NEXT MATCH SETUP -->
<div class="header" style="margin-bottom:10px;margin-top:10px;">NEXT MATCH SETUP</div>
<div class="setup-box" style="border-top:3px solid #1a73e8;">
<div style="display:flex;gap:10px;margin-bottom:8px;">
<select id="nextTeamA" style="flex:1;"><option value="">Select Team 1</option></select>
<select id="nextTeamB" style="flex:1;"><option value="">Select Team 2</option></select>
</div>
<div style="display:flex;gap:10px;margin-bottom:8px;">
<select id="matchRoundSelect" style="flex:1;">
<option value="">-- Select Round --</option>
<option value="1st Round">1st Round</option>
<option value="2nd Round">2nd Round</option>
<option value="Quarter Final">Quarter Final</option>
<option value="Semi Final">Semi Final</option>
<option value="Final">Final</option>
</select>
<input type="text" id="matchCategoryInp" placeholder="Category / 55 KG / 65 KG / Open" style="flex:1;margin-bottom:0;">
</div>
<button class="btn-full btn-green" onclick="addNewMatch()" style="height:48px;min-height:48px;font-size:15px;margin-top:5px;">+ ADD TO MATCH LIST</button>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
<div class="list-header" style="margin-bottom:0;border:none;">📋 SCHEDULED MATCHES LIST</div>
<button onclick="toggleVisibility('matchListVisible')" class="btn-sm btn-blue" style="max-width:120px;padding:6px;" id="matchListBtn">SHOW LIST</button>
</div>
<div id="nextMatchContainer"></div>

</div>
</div>

<!-- WINNER & LOSER BOXES (Notebook Style) -->
<div class="card">
<div class="header" style="background:#ff9800;">🏆 WINNER BOX & ❌ LOOS TEAM BOX</div>
<div class="settings-section">

<div class="winner-card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
<b>WINNER BOX (Qualified Teams)</b>
<button class="btn-sm btn-green" onclick="updateWinnerBox()">UPDATE</button>
</div>
<div id="winnerBoxContainer">None</div>
</div>

<div class="loser-card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
<b>LOOS TEAM BOX (Eliminated Teams)</b>
<button class="btn-sm btn-red" onclick="updateLoserBox()">UPDATE</button>
</div>
<div id="loserBoxContainer">None</div>
</div>

</div>
</div>

<!-- TEAM MANAGER -->
<div class="card">
<div class="header">TOURNAMENT TEAM MANAGER</div>
<div class="settings-section">
<label class="ticker-label">➕ Add Teams</label>
<div style="background:#f8f9fa;padding:10px;border:1px solid #ddd;border-radius:8px;margin-bottom:15px;">
<div class="team-input-row">
<input type="text" id="newTeamEn" class="team-input" placeholder="Mudki, Faridkot, Talwandi">
<button class="trans-btn" onclick="translateBatchTeams()">⇄</button>
</div>
<textarea id="newTeamPa" rows="2" placeholder="Punjabi Teams"></textarea>
<button class="btn-full btn-green" onclick="addBatchTeams()" style="height:42px;min-height:42px;font-size:14px;">ADD TEAMS TO LIST</button>
</div>
<textarea id="allTeamsInp" rows="4" placeholder="All Teams Master List" oninput="syncFieldArrayTeams(this.value)"></textarea>
</div>
</div>

<script>
const firebaseConfig={
    databaseURL: "https://my-scorebord-default-rtdb.firebaseio.com/"
};
firebase.initializeApp(firebaseConfig);

const urlParams = new URLSearchParams(window.location.search);
const matchId = urlParams.get('id') || 'defaultMatch';
const db = firebase.database().ref("matchData/"+matchId);

let curA=0, curB=0, camOpposite=false;
let allTeams=[], nextMatches=[], qualifiedTeams=[], eliminatedTeams=[];
let resultFinalized=false, lastResult=null, scoreVisible=true;

function setSafely(id,val){
    const el=document.getElementById(id);
    if(el && document.activeElement!==el){
        el.value=val===undefined||val===null?"":val;
    }
}

function syncField(key,val){
    db.update({[key]:val});
}

function syncFieldArrayTeams(val){
    let arr=val.split("\n").map(t=>t.trim()).filter(t=>t!=="");
    db.update({allTeams:arr});
}

db.on("value",(snap)=>{
    const data=snap.val();
    if(!data)return;
    curA=parseFloat(data.scoreA)||0;
    curB=parseFloat(data.scoreB)||0;
    allTeams=Array.isArray(data.allTeams)?data.allTeams:[];
    nextMatches=Array.isArray(data.nextMatches)?data.nextMatches:[];
    qualifiedTeams=Array.isArray(data.qualifiedTeams)?data.qualifiedTeams:[];
    eliminatedTeams=Array.isArray(data.eliminatedTeams)?data.eliminatedTeams:[];
    resultFinalized=data.resultFinalized===true;
    lastResult=data.lastResult||null;

    document.getElementById("dispA").innerText=curA;
    document.getElementById("dispB").innerText=curB;

    setSafely("nameA",data.nameA);
    setSafely("nameA_pa",data.nameA_pa);
    setSafely("nameB",data.nameB);
    setSafely("nameB_pa",data.nameB_pa);
    setSafely("roundInp",data.round);
    setSafely("allTeamsInp",allTeams.join("\n"));

    renderNextMatches();
    renderWinnerLoserBoxes();
    updateDropdowns();

    updateVisibilityButton("matchListVisible","matchListBtn","HIDE LIST","SHOW LIST");
    camOpposite=data.cameraOpposite||false;
    document.getElementById("teamWrap").style.flexDirection=camOpposite?"row-reverse":"row";
});

function toggleVisibility(field){
    db.child(field).once("value",snap=>{
        db.update({[field]:!(snap.val()===true)});
    });
}

function updateVisibilityButton(field, buttonId, onText, offText){
    db.child(field).once("value",snap=>{
        const value=snap.val()===true;
        const btn=document.getElementById(buttonId);
        if(!btn)return;
        btn.innerText=value?onText:offText;
        btn.style.background=value?"#dc3545":"#1a73e8";
    });
}

function addNewMatch(){
    const a=document.getElementById("nextTeamA").value;
    const b=document.getElementById("nextTeamB").value;
    const round=document.getElementById("matchRoundSelect").value;
    const cat=document.getElementById("matchCategoryInp").value.trim();
    if(a===""||b===""){ alert("Team select karo."); return; }
    
    let categoryName = cat ? cat.toUpperCase() : "GENERAL";
    if(round) categoryName += " — " + round.toUpperCase();

    let matchStr = `[${categoryName}] ${a} VS ${b}`;
    nextMatches.push(matchStr);

    document.getElementById("nextTeamA").value="";
    document.getElementById("nextTeamB").value="";
    document.getElementById("matchRoundSelect").value="";
    document.getElementById("matchCategoryInp").value="";

    syncMatchListToDB();
    db.update({matchListVisible:true});
}

function renderNextMatches(){
    const container=document.getElementById("nextMatchContainer");
    if(nextMatches.length===0){
        container.innerHTML=`<div style="text-align:center;padding:10px;color:#999;">No Scheduled Matches</div>`;
        return;
    }

    let groups = {};
    nextMatches.forEach((matchStr, index) => {
        let cat = "GENERAL";
        let cleanMatch = matchStr;
        if(matchStr.startsWith("[")){
            let parts = matchStr.split("] ");
            cat = parts[0].replace("[","");
            cleanMatch = parts[1];
        }
        if(!groups[cat]) groups[cat] = [];
        groups[cat].push({match: cleanMatch, index: index});
    });

    let html="";
    for(let cat in groups){
        html += `<div class="category-group-header"><span>${cat}</span></div>`;
        groups[cat].forEach((item, idx)=>{
            html+=`<div class="match-item">
            <div class="match-title">${idx+1}. ${formatDisplayMatch(item.match)}</div>
            <div class="match-actions">
            <button class="btn-sm btn-start" onclick="startSpecificMatch(${item.index})">START</button>
            <button class="btn-sm btn-res" onclick="quickResult(${item.index})">RESULT</button>
            <button class="btn-sm btn-nxt" onclick="sendToNextMatch(${item.index})">NEXT MATCH</button>
            <button class="btn-sm btn-walkover" onclick="walkoverMatch(${item.index})">WALKOVER</button>
            <button class="btn-sm btn-delete" onclick="deleteSpecificMatch(${item.index})">X</button>
            </div></div>`;
        });
    }
    container.innerHTML=html;
}

function formatDisplayMatch(matchStr){
    return matchStr.replace(/=/g," / ");
}

function startSpecificMatch(index){
    let rawMatchStr=nextMatches[index], category="", matchStr=rawMatchStr;
    if(rawMatchStr.startsWith("[")){
        let parts=rawMatchStr.split("] ");
        category=parts[0].replace("[","");
        matchStr=parts[1];
    }
    let teams=matchStr.split(" VS ");
    let t1Parts=(teams[0]||"").split("=");
    let t2Parts=(teams[1]||"").split("=");
    
    db.update({
        nameA:t1Parts[0].trim(),
        nameA_pa:t1Parts[1]?t1Parts[1].trim():"",
        nameB:t2Parts[0].trim(),
        nameB_pa:t2Parts[1]?t2Parts[1].trim():"",
        scoreA:0, scoreB:0, scoreVisible:true, resultVisible:false, resultFinalized:false,
        round:category
    });
}

function sendToNextMatch(index){
    let rawMatchStr=nextMatches[index];
    let teamsPart = rawMatchStr.includes("] ") ? rawMatchStr.split("] ")[1] : rawMatchStr;
    let teams = teamsPart.split(" VS ");
    
    document.getElementById("nextTeamA").value = teams[0].trim();
    document.getElementById("nextTeamB").value = teams[1].trim();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

function walkoverMatch(index){
    let rawMatchStr=nextMatches[index];
    let teamsPart = rawMatchStr.includes("] ") ? rawMatchStr.split("] ")[1] : rawMatchStr;
    let teams = teamsPart.split(" VS ");
    let t1Name=(teams[0]||"").split("=")[0].trim();
    let t2Name=(teams[1]||"").split("=")[0].trim();
    let winNum=prompt(`Walkover winner choose kro:\n1 = ${t1Name}\n2 = ${t2Name}\n1 ya 2 likho:`);
    if(winNum==="1") saveWinnerLoser(t1Name, t2Name);
    else if(winNum==="2") saveWinnerLoser(t2Name, t1Name);
}

function quickResult(index){
    startSpecificMatch(index);
    alert("Match loaded to scoreboard! Score update karke RESULT dabao.");
}

function deleteSpecificMatch(index){
    nextMatches.splice(index,1);
    syncMatchListToDB();
}

function syncMatchListToDB(){
    db.update({nextMatches:nextMatches});
}

function changeScore(team,val){
    let current=team==="scoreA"?curA:curB;
    let newVal=val>0?(curA===0&&curB===0?1.5:current+1):(current===1.5?0:current-1);
    if(newVal<0)newVal=0;
    db.update({[team]:newVal, resultFinalized:false, resultVisible:false});
}

function resetScores(){
    if(confirm("Reset Scores?")){ db.update({scoreA:0, scoreB:0, resultFinalized:false, resultVisible:false}); }
}

function swapTeams(){
    db.update({
        nameA:document.getElementById("nameB").value, nameA_pa:document.getElementById("nameB_pa").value,
        nameB:document.getElementById("nameA").value, nameB_pa:document.getElementById("nameA_pa").value,
        scoreA:curB, scoreB:curA
    });
}

function toggleCameraView(){
    db.update({cameraOpposite:!camOpposite});
}

function showResultLayer(){
    if(curA===0&&curB===0){ alert("Score 0-0 hai."); return; }
    const teamA=document.getElementById("nameA").value.trim();
    const teamB=document.getElementById("nameB").value.trim();
    let winner="", loser="";
    if(curA>curB){ winner=teamA; loser=teamB; }
    else if(curB>curA){ winner=teamB; loser=teamA; }
    else{ alert("Match Tied!"); return; }
    saveWinnerLoser(winner, loser);
}

function saveWinnerLoser(winner, loser){
    if(!qualifiedTeams.includes(winner)) qualifiedTeams.push(winner);
    if(loser && !eliminatedTeams.includes(loser)) eliminatedTeams.push(loser);
    db.update({qualifiedTeams: qualifiedTeams, eliminatedTeams: eliminatedTeams, scoreA:0, scoreB:0});
    alert(`Result Saved!\nWinner: ${winner}\nLoser: ${loser}`);
}

function updateWinnerBox(){
    renderWinnerLoserBoxes();
    alert("Winner Box Updated!");
}

function updateLoserBox(){
    renderWinnerLoserBoxes();
    alert("Loser Box Updated!");
}

function renderWinnerLoserBoxes(){
    let wContainer = document.getElementById("winnerBoxContainer");
    let lContainer = document.getElementById("loserBoxContainer");

    wContainer.innerHTML = qualifiedTeams.length ? qualifiedTeams.map((w, i)=>`
        <div class="winner-row">
            <span><b>${i+1}. ${w} WIN</b> VS</span>
            <select style="flex:1;margin-bottom:0;" id="selectWinOpp_${i}">
                <option value="">Select Team</option>
                ${allTeams.map(t=>`<option value="${t.split('=')[0]}">${t.split('=')[0]}</option>`).join('')}
            </select>
            <button class="btn-sm btn-green" onclick="addWinnerToMatch('${w}', 'selectWinOpp_${i}')">ADD TO MATCH</button>
        </div>
    `).join('') : "None";

    lContainer.innerHTML = eliminatedTeams.length ? eliminatedTeams.map((l, i)=>`
        <div class="winner-row">
            <span><b>${i+1}. ${l}</b></span>
        </div>
    `).join('') : "None";
}

function addWinnerToMatch(winnerTeam, selectId){
    let opp = document.getElementById(selectId).value;
    if(!opp){ alert("Opponent team select karo!"); return; }
    let matchStr = `[WINNER MATCH] ${winnerTeam} VS ${opp}`;
    nextMatches.push(matchStr);
    syncMatchListToDB();
    db.update({matchListVisible:true});
    alert(winnerTeam + " vs " + opp + " Match List vich add ho gaya!");
}

function addBatchTeams(){
    let enStr=document.getElementById("newTeamEn").value.trim();
    let paStr=document.getElementById("newTeamPa").value.trim();
    if(!enStr)return;
    let enArr=enStr.split(",").map(t=>t.trim()).filter(t=>t!=="");
    let paArr=paStr?paStr.split(",").map(t=>t.trim()).filter(t=>t!==""):[];
    enArr.forEach((en,i)=>{
        let pa=paArr[i]||"";
        let combined=pa?`${en}=${pa}`:en;
        if(!allTeams.includes(combined)) allTeams.push(combined);
    });
    db.update({allTeams:allTeams});
    document.getElementById("newTeamEn").value="";
    document.getElementById("newTeamPa").value="";
}

function updateDropdowns(){
    const a=document.getElementById("teamSelectA"), b=document.getElementById("teamSelectB"), na=document.getElementById("nextTeamA"), nb=document.getElementById("nextTeamB");
    a.innerHTML='<option value="">Select Team A</option>';
    b.innerHTML='<option value="">Select Team B</option>';
    na.innerHTML='<option value="">Select Team 1</option>';
    nb.innerHTML='<option value="">Select Team 2</option>';

    allTeams.forEach(teamStr=>{
        let parts=teamStr.split("=");
        let en=parts[0].trim(), pa=parts[1]?parts[1].trim():"";
        let display=pa?`${en} / ${pa}`:en;
        [a,b,na,nb].forEach(select=>{
            const opt=document.createElement("option");
            opt.value=teamStr; opt.textContent=display;
            select.appendChild(opt);
        });
    });
}

function selectTeamA(val){
    if(!val)return;
    let p=val.split("=");
    db.update({nameA:p[0].trim(), nameA_pa:p[1]?p[1].trim():"", resultFinalized:false});
}

function selectTeamB(val){
    if(!val)return;
    let p=val.split("=");
    db.update({nameB:p[0].trim(), nameB_pa:p[1]?p[1].trim():"", resultFinalized:false});
}

async function translateBatchTeams(){
    const text=document.getElementById("newTeamEn").value;
    const targetLang=document.getElementById("targetLang").value;
    if(!text)return;
    try{
        const res=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`);
        const data=await res.json();
        document.getElementById("newTeamPa").value=data[0][0][0];
    }catch(e){ alert("Translation error!"); }
}
</script>
